// VentasPage — expandida con Delete
// ════════════════════════════════════════════════════════════════
function VentasPageExt({ period }) {
  const data = useATData();
  const allVentas = data.ventas || [];
  const [search, setSearch] = useState('');
  const [del, setDel] = useState(null);
  const [edit, setEdit] = useState(null);
  const [busy, setBusy] = useState(false);
  const [tab, setTab] = useState('lista');

  const filteredPeriod = filterByPeriod(allVentas, period, 'fecha');
  const filtered = filteredPeriod.filter(v => {
    if (!search) return true;
    const q = search.toLowerCase();
    return (v.idVenta || '').toLowerCase().includes(q) || (v.canal || '').toLowerCase().includes(q);
  }).slice(0, 100);

  // ── KPIs del período ─────────────────────────────────────────
  const totalRevenue   = filteredPeriod.reduce((s, v) => s + (v.precioFacturadoTotal || 0), 0);
  const totalGanancia  = filteredPeriod.reduce((s, v) => s + (v.gananciaTotal       || 0), 0);
  const totalUds       = filteredPeriod.reduce((s, v) => s + (v.cantidadTotal       || 0), 0);
  const ticketProm     = filteredPeriod.length > 0 ? totalRevenue / filteredPeriod.length : 0;
  const udsxVenta      = filteredPeriod.length > 0 ? totalUds / filteredPeriod.length : 0;
  const ganxVenta      = filteredPeriod.length > 0 ? totalGanancia / filteredPeriod.length : 0;
  const margenProm     = totalRevenue > 0 ? (totalGanancia / totalRevenue) * 100 : 0;

  // Meses únicos cubiertos por las ventas filtradas
  const monthsSet = new Set(filteredPeriod.map(v => (v.fecha || '').slice(0, 7)).filter(Boolean));
  const nMeses = Math.max(1, monthsSet.size);
  const ventasxMes   = filteredPeriod.length / nMeses;
  const revenuexMes  = totalRevenue / nMeses;
  const gananciaxMes = totalGanancia / nMeses;
  const udsxMes      = totalUds / nMeses;

  // Día con más ventas (count) y día más rentable (revenue)
  const ventasByDate = {};
  filteredPeriod.forEach(v => {
    if (!v.fecha) return;
    if (!ventasByDate[v.fecha]) ventasByDate[v.fecha] = { count: 0, revenue: 0 };
    ventasByDate[v.fecha].count   += 1;
    ventasByDate[v.fecha].revenue += v.precioFacturadoTotal || 0;
  });
  const diasConVenta = Object.keys(ventasByDate).length;
  const bestDayCount = Object.entries(ventasByDate).sort((a, b) => b[1].count   - a[1].count  )[0];
  const bestDayRev   = Object.entries(ventasByDate).sort((a, b) => b[1].revenue - a[1].revenue)[0];

  // Top canal por revenue
  const canalStats = {};
  filteredPeriod.forEach(v => {
    const c = v.canal || 'Sin canal';
    if (!canalStats[c]) canalStats[c] = { revenue: 0, count: 0 };
    canalStats[c].revenue += v.precioFacturadoTotal || 0;
    canalStats[c].count   += 1;
  });
  const topCanal = Object.entries(canalStats).sort((a, b) => b[1].revenue - a[1].revenue)[0];

  // Helper para fmtK (RD$XK)
  const fmtKLocal = (n) => Math.abs(n) >= 1000 ? (n/1000).toFixed(n >= 100000 ? 0 : 1) + 'K' : Math.round(n).toString();

  const doDelete = async () => {
    setBusy(true);
    try {
      await window.AT_CLIENT.removeVenta(del.idVenta);
      window.toastOk('Venta eliminada', `${del.idVenta}`);
      setDel(null);
    } catch (e) {
      window.toastErr('No se pudo eliminar', e.message?.slice(0, 120));
    }
    setBusy(false);
  };

  // (Edición de venta movida a <EditVentaModal/> — encabezado + líneas/monto.)

  return (
    <>
      <div className="topbar">
        <div>
          <h1>Ventas</h1>
          <div className="sub">{allVentas.length} ventas totales · {filteredPeriod.length} en período</div>
        </div>
        {tab === 'lista' && (
          <div className="topbar-actions">
            <input className="input" style={{ width: 180 }} type="text" placeholder="Buscar..." value={search} onChange={e => setSearch(e.target.value)} />
            <span className="pill">{filtered.length} mostrando</span>
          </div>
        )}
      </div>

      <div className="tabs">
        <button className={`tab ${tab === 'lista' ? 'active' : ''}`} onClick={() => setTab('lista')}>Lista de ventas</button>
        <button className={`tab ${tab === 'nueva' ? 'active' : ''}`} onClick={() => setTab('nueva')}>+ Nueva venta</button>
      </div>

      {tab === 'nueva' && (
        <div className="section">
          <FormVenta />
        </div>
      )}

      {tab === 'lista' && (
      <>
      <div className="nav-section-label" style={{ padding: 'var(--s-3) 0 var(--s-2)', fontSize: 12 }}>RESUMEN DEL PERÍODO</div>
      <div className="kpi-row">
        <KPI label="Ventas en período" value={fmtNum(filteredPeriod.length)}
             delta={null} deltaLabel={`en ${nMeses} mes${nMeses>1?'es':''} · ${diasConVenta} días con venta`} />
        <KPI label="Revenue total" value={fmtNum(totalRevenue)} currency
             delta={margenProm} deltaLabel="margen prom" />
        <KPI label="Ganancia total" value={fmtNum(totalGanancia)} currency
             delta={null} deltaLabel={`${fmtCurrency(ganxVenta)}/venta`} />
        <KPI label="Unidades vendidas" value={fmtNum(totalUds)}
             delta={null} deltaLabel={`${udsxVenta.toFixed(1)} ud/venta`} />
      </div>

      <div className="kpi-row">
        <KPI label="Ventas / mes" value={ventasxMes.toFixed(1)}
             delta={null} deltaLabel={`promedio en ${nMeses} mes${nMeses>1?'es':''}`} />
        <KPI label="Revenue / mes" value={fmtNum(revenuexMes)} currency
             delta={null} deltaLabel={`prom · ${fmtCurrency(ticketProm)} ticket`} />
        <KPI label="Ganancia / mes" value={fmtNum(gananciaxMes)} currency
             delta={null} deltaLabel="promedio" />
        <KPI label="Unidades / mes" value={fmtNum(udsxMes)}
             delta={null} deltaLabel="promedio" />
      </div>

      <div className="grid-2" style={{ marginBottom: 'var(--s-5)' }}>
        <div className="section">
          <div className="section-head">
            <div>
              <div className="section-title">Mejor día</div>
              <div className="section-desc">Por revenue · por cantidad de ventas</div>
            </div>
          </div>
          <div className="grid-2">
            <div className="stat-card">
              <div className="stat-label">Día con más revenue</div>
              <div className="stat-value">{bestDayRev ? fmtDate(bestDayRev[0]) : '—'}</div>
              <div style={{ fontSize: 12, color: 'var(--text-3)', marginTop: 4 }}>
                {bestDayRev ? `${fmtCurrency(bestDayRev[1].revenue)} · ${bestDayRev[1].count} venta${bestDayRev[1].count > 1 ? 's' : ''}` : 'Sin datos'}
              </div>
            </div>
            <div className="stat-card">
              <div className="stat-label">Día con más ventas</div>
              <div className="stat-value">{bestDayCount ? fmtDate(bestDayCount[0]) : '—'}</div>
              <div style={{ fontSize: 12, color: 'var(--text-3)', marginTop: 4 }}>
                {bestDayCount ? `${bestDayCount[1].count} venta${bestDayCount[1].count > 1 ? 's' : ''} · ${fmtCurrency(bestDayCount[1].revenue)}` : 'Sin datos'}
              </div>
            </div>
          </div>
        </div>

        <div className="section">
          <div className="section-head">
            <div>
              <div className="section-title">Top canal</div>
              <div className="section-desc">{Object.keys(canalStats).length} canales activos</div>
            </div>
          </div>
          {topCanal ? (
            <div className="grid-2">
              <div className="stat-card">
                <div className="stat-label">Líder</div>
                <div className="stat-value">{topCanal[0]}</div>
                <div style={{ fontSize: 12, color: 'var(--text-3)', marginTop: 4 }}>
                  {topCanal[1].count} venta{topCanal[1].count > 1 ? 's' : ''} · {fmtCurrency(topCanal[1].revenue)}
                </div>
              </div>
              <div className="stat-card">
                <div className="stat-label">Share</div>
                <div className="stat-value" style={{ color: 'var(--accent)' }}>
                  {totalRevenue > 0 ? ((topCanal[1].revenue / totalRevenue) * 100).toFixed(1) : '0'}%
                </div>
                <div style={{ fontSize: 12, color: 'var(--text-3)', marginTop: 4 }}>del revenue total</div>
              </div>
            </div>
          ) : <div className="muted">Sin canales</div>}
        </div>
      </div>

      <div className="nav-section-label" style={{ padding: 'var(--s-3) 0 var(--s-2)', fontSize: 12 }}>LISTA · {filtered.length} de {filteredPeriod.length}</div>
      <div className="section">
        <table className="data">
          <thead><tr>
            <th>Producto(s)</th><th>Fecha</th><th>Canal</th>
            <th className="right">Uds</th>
            <th className="right">Costo</th>
            <th className="right">Total</th><th className="right">Ganancia</th><th className="right">Margen</th>
            <th></th>
          </tr></thead>
          <tbody>
            {(() => {
              // SKU id → nombre lookup
              const skuName = {};
              (data.skus || []).forEach(s => { skuName[s.id] = s.nm || s.id; });
              return filtered.map(v => {
                const items = v.lineas || [];
                const costoTotal = items.reduce((s, l) => s + (l.baseCost || (Number(l.costoUd || 0) * Number(l.qty || 0))), 0);
                return (
                  <tr key={v.idVenta}>
                    <td>
                      {items.length === 0 && <span className="muted">—</span>}
                      {items.map((l, i) => {
                        const sku = l.skuLinked || l.skuRef;
                        const nombre = skuName[sku] || sku || '—';
                        return (
                          <div key={i} style={{ fontSize: 12, marginBottom: i < items.length - 1 ? 2 : 0 }}>
                            {nombre} <span className="muted">× {l.qty}</span>
                            <div style={{ fontSize: 10, color: 'var(--text-3)', fontFamily: 'var(--font-mono)' }}>{sku}</div>
                          </div>
                        );
                      })}
                      <div style={{ fontSize: 9, color: 'var(--text-3)', fontFamily: 'var(--font-mono)', marginTop: 4, opacity: 0.6 }}>{v.idVenta}</div>
                    </td>
                    <td>{fmtDate(v.fecha)}</td>
                    <td className="muted">{v.canal || '—'}</td>
                    <td className="num right">{v.cantidadTotal || 0}</td>
                    <td className="num right neg">{fmtCurrency(costoTotal)}</td>
                    <td className="num right">{fmtCurrency(v.precioFacturadoTotal)}</td>
                    <td className="num right pos">{fmtCurrency(v.gananciaTotal)}</td>
                    <td className="num right muted">{(v.margenPct || 0).toFixed(1)}%</td>
                    <td style={{ whiteSpace: 'nowrap' }}>
                      <div style={{ display: 'inline-flex', gap: 4 }}>
                        <button className="icon-btn" onClick={() => setEdit(v)} title="Editar header">✎</button>
                        <button className="icon-btn danger" onClick={() => setDel(v)} title="Eliminar">×</button>
                      </div>
                    </td>
                  </tr>
                );
              });
            })()}
          </tbody>
        </table>
      </div>
      </>
      )}

      <ConfirmModal open={!!del} danger busy={busy}
        title={`¿Eliminar venta ${del?.idVenta}?`}
        body={`${del?.fecha || ''} · ${del?.canal || ''} · ${fmtCurrency(del?.precioFacturadoTotal || 0)}. Esta acción borra ${(del?.lineas || []).length} línea(s) y movimientos asociados de Supabase. No es reversible.`}
        onCancel={() => setDel(null)}
        onConfirm={doDelete} />

      <EditVentaModal open={!!edit} venta={edit}
        onCancel={() => setEdit(null)}
        onSaved={() => setEdit(null)} />
    </>
  );
}

// ════════════════════════════════════════════════════════════════
// EditVentaModal — editar encabezado + líneas (SKU/cant./precio) de una venta.
// El monto total se recalcula en vivo y los triggers de la DB recalculan
// total_facturado / total_ganancia tras guardar.
// ════════════════════════════════════════════════════════════════
function EditVentaModal({ open, venta, onCancel, onSaved }) {
  const data = useATData();
  const skus = data.skus || [];
  const [fecha, setFecha] = useState('');
  const [canal, setCanal] = useState('');
  const [envio, setEnvio] = useState(0);
  const [notas, setNotas] = useState('');
  const [lineas, setLineas] = useState([]);
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    if (open && venta) {
      setFecha(venta.fecha || '');
      setCanal(venta.canal || '');
      setEnvio(venta.envio || 0);
      setNotas(venta.notas || '');
      setLineas((venta.lineas || []).map(l => {
        const sku = l.skuLinked || l.skuRef || '';
        return {
          _airtableId: l._airtableId, sku, qty: l.qty || 0, precio: l.precio || 0,
          costoUd: l.costoUd || 0, _origSku: sku, _origQty: l.qty || 0, _origPrecio: l.precio || 0,
        };
      }));
    }
  }, [open, venta?.idVenta]);

  if (!open || !venta) return null;

  const updateLinea = (idx, patch) => setLineas(arr => arr.map((l, i) => i === idx ? { ...l, ...patch } : l));

  const subtotalItems = lineas.reduce((s, l) => s + (Number(l.precio) || 0) * (Number(l.qty) || 0), 0);
  // La DB calcula total_facturado = subtotal_items + envío − descuento (descuento=0 aquí).
  const totalFacturado = subtotalItems + (Number(envio) || 0);
  const costoTotal = lineas.reduce((s, l) => {
    const sku = skus.find(x => x.id === l.sku);
    const cu = l.sku === l._origSku ? (l.costoUd || 0) : (sku?.cpp || 0);
    return s + cu * (Number(l.qty) || 0);
  }, 0);
  // Ganancia = sólo productos (la DB no suma el envío a la ganancia).
  const ganancia = subtotalItems - costoTotal;
  const margen = subtotalItems > 0 ? (ganancia / subtotalItems) * 100 : 0;

  const doSave = async () => {
    setBusy(true);
    try {
      await window.AT_CLIENT.updateVentaHeader(venta.idVenta, {
        fecha, canal, envio: Number(envio) || 0, notas,
      });
      const changed = lineas
        .filter(l => l.sku !== l._origSku || Number(l.qty) !== Number(l._origQty) || Number(l.precio) !== Number(l._origPrecio))
        .map(l => {
          const row = { _airtableId: l._airtableId, qty: Number(l.qty), precioUnitario: Number(l.precio) };
          if (l.sku !== l._origSku) {
            row.sku = l.sku;
            const sku = skus.find(x => x.id === l.sku);
            row.cppHistorico = sku?.cpp || 0;   // re-snapshot costo al nuevo SKU
          }
          return row;
        });
      if (changed.length > 0) await window.AT_CLIENT.updateVentaLineas(venta.idVenta, changed);
      window.toastOk('Venta actualizada', `${venta.idVenta} · ${fmtCurrency(totalFacturado)}`);
      onSaved && onSaved();
    } catch (e) {
      window.toastErr('No se pudo guardar', e.message?.slice(0, 120));
    }
    setBusy(false);
  };

  return (
    <div className="modal-backdrop" onClick={onCancel}>
      <div className="modal" style={{ minWidth: 580, maxWidth: '92vw' }} onClick={e => e.stopPropagation()}>
        <div className="modal-title">Editar venta {venta.idVenta}</div>

        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 10, marginBottom: 14 }}>
          <div className="field"><div className="field-label">Fecha</div>
            <input className="input num" type="date" value={fecha} onChange={e => setFecha(e.target.value)} /></div>
          <div className="field"><div className="field-label">Canal</div>
            <input className="input" type="text" value={canal} onChange={e => setCanal(e.target.value)} /></div>
          <div className="field"><div className="field-label">Envío cobrado (RD$)</div>
            <input className="input num" type="number" value={envio} onChange={e => setEnvio(e.target.value)} /></div>
        </div>

        <div className="field-label" style={{ marginBottom: 6 }}>Productos / monto</div>
        <table className="data" style={{ marginBottom: 10 }}>
          <thead><tr>
            <th>SKU</th>
            <th className="right">Cant.</th>
            <th className="right">Precio ud. (RD$)</th>
            <th className="right">Subtotal</th>
          </tr></thead>
          <tbody>
            {lineas.map((l, idx) => (
              <tr key={l._airtableId || idx}>
                <td>
                  <select className="select" value={l.sku} onChange={e => updateLinea(idx, { sku: e.target.value })} style={{ maxWidth: 250 }}>
                    {l.sku && !skus.find(s => s.id === l.sku) && <option value={l.sku}>{l.sku}</option>}
                    {skus.map(s => <option key={s.id} value={s.id}>{s.nm || s.id}</option>)}
                  </select>
                </td>
                <td className="right"><input className="input num" type="number" style={{ width: 64 }} value={l.qty} onChange={e => updateLinea(idx, { qty: e.target.value })} /></td>
                <td className="right"><input className="input num" type="number" style={{ width: 100 }} value={l.precio} onChange={e => updateLinea(idx, { precio: e.target.value })} /></td>
                <td className="num right">{fmtCurrency((Number(l.precio) || 0) * (Number(l.qty) || 0))}</td>
              </tr>
            ))}
            {lineas.length === 0 && <tr><td colSpan={4} className="muted">Esta venta no tiene líneas registradas.</td></tr>}
          </tbody>
        </table>

        <div style={{ display: 'flex', gap: 16, justifyContent: 'flex-end', fontSize: 13, marginBottom: 12, flexWrap: 'wrap' }}>
          <span className="muted">Productos: {fmtCurrency(subtotalItems)}</span>
          {Number(envio) > 0 && <span className="muted">+ Envío: {fmtCurrency(Number(envio))}</span>}
          <span>Total facturado: <b>{fmtCurrency(totalFacturado)}</b></span>
          <span className="pos">Ganancia: {fmtCurrency(ganancia)}</span>
          <span className="muted">Margen: {margen.toFixed(1)}%</span>
        </div>

        <div className="field" style={{ marginBottom: 'var(--s-4)' }}><div className="field-label">Notas</div>
          <input className="input" type="text" value={notas} onChange={e => setNotas(e.target.value)} /></div>

        <div className="modal-actions">
          <button className="btn ghost" onClick={onCancel} disabled={busy}>Cancelar</button>
          <button className="btn" disabled={busy} onClick={doSave}>{busy ? 'Guardando…' : 'Guardar'}</button>
        </div>
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════════
// Movimientos Page — full cashflow tail con delete
// ════════════════════════════════════════════════════════════════
function MovimientosPage({ period: periodProp, onNavigate, embedded }) {
  const data = useATData();
  const all = data.cashflow || [];
  // Cuando está embebido en Finanzas (que no tiene barra de período propia),
  // usa un selector de período interno. Si no, usa el período del padre.
  const [periodLocal, setPeriodLocal] = useState('todo');
  const period = embedded ? periodLocal : periodProp;
  const [del, setDel] = useState(null);
  const [edit, setEdit] = useState(null);
  const [busy, setBusy] = useState(false);
  const [tab, setTab] = useState('lista');
  const [tipoSel, setTipoSel] = useState(new Set());      // multi-select de conceptos
  const [cuentaSel, setCuentaSel] = useState('todas');    // dropdown de cuenta
  const [naturalezaSel, setNaturalezaSel] = useState('todas'); // op/fin/all
  const [search, setSearch] = useState('');
  const [showRunning, setShowRunning] = useState(true);   // mostrar saldo corriente
  const [limit, setLimit] = useState(500);                // cuántas filas (paginación simple)

  // Aplicar todos los filtros
  const filteredAll = filterByPeriod(all, period, 'f').filter(m => {
    if (tipoSel.size > 0 && !tipoSel.has(m.c)) return false;
    if (cuentaSel !== 'todas' && m._origen !== cuentaSel) return false;
    if (naturalezaSel === 'op'  && m._naturaleza === 'FINANCIERO') return false;
    if (naturalezaSel === 'fin' && m._naturaleza !== 'FINANCIERO') return false;
    if (search) {
      const q = search.toLowerCase();
      const txt = ((m.c || '') + ' ' + (m.a || '') + ' ' + (m.notas || '') + ' ' + (m._origen || '')).toLowerCase();
      if (!txt.includes(q)) return false;
    }
    return true;
  });
  const filtered = filteredAll.slice(0, limit);

  // Totales del período filtrado
  const totalEntradas = filteredAll.reduce((s, m) => s + (m.e || 0), 0);
  const totalSalidas  = filteredAll.reduce((s, m) => s + (m.s || 0), 0);
  const neto = totalEntradas - totalSalidas;

  // Conceptos únicos + sus totales (para chips con monto)
  const conceptosStats = {};
  filterByPeriod(all, period, 'f').forEach(m => {
    const c = m.c || 'Sin tipo';
    if (!conceptosStats[c]) conceptosStats[c] = { count: 0, e: 0, s: 0 };
    conceptosStats[c].count += 1;
    conceptosStats[c].e += m.e || 0;
    conceptosStats[c].s += m.s || 0;
  });
  const conceptosOrdenados = Object.entries(conceptosStats)
    .sort((a, b) => (b[1].e + b[1].s) - (a[1].e + a[1].s));

  // Cuentas únicas
  const cuentasUnicas = [...new Set(all.map(m => m._origen).filter(Boolean))].sort();

  // Running balance: orden ASC para computar, revertir para mostrar
  const ordered = filteredAll.slice().sort((a, b) => (a.f || '').localeCompare(b.f || ''));
  let running = 0;
  const withBalance = ordered.map(m => { running += (m.e || 0) - (m.s || 0); return { ...m, _saldo: running }; });
  const rowsConBalance = withBalance.slice().reverse().slice(0, limit);

  // Export CSV
  const exportCSV = () => {
    const headers = ['Fecha', 'Tipo', 'Cuenta', 'Contraparte', 'Naturaleza', 'Debe (entrada)', 'Haber (salida)', 'Saldo corriente', 'Notas'];
    const rows = withBalance.slice().reverse().map(m => [
      m.f, m.c, m._origen || '', m.a || '', m._naturaleza || 'CASHFLOW',
      m.e || 0, m.s || 0, m._saldo || 0, (m.notas || '').replace(/[\n,;]/g, ' '),
    ]);
    const csv = [headers, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
    const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `libro-contable-${period}-${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const toggleTipo = (c) => {
    setTipoSel(prev => {
      const next = new Set(prev);
      if (next.has(c)) next.delete(c); else next.add(c);
      return next;
    });
  };
  const clearTipos = () => setTipoSel(new Set());

  // Detecta si un movimiento vino de venta, lote, o movFin. Si vino de
  // una fuente, NO se debe editar aquí (el edit no propaga al origen,
  // dejando los totales desincronizados). En vez de eso, mostrar link
  // a la página de la fuente.
  const linkedSource = (m) => {
    const c = (m.c || '').toLowerCase();
    const notas = (m.notas || '').toLowerCase();
    // venta: concepto = "Venta de mercancia" o notas mencionan V-XXX
    if (c.includes('venta de mercanc') || /\bv-\d/i.test(m.notas || '') || /vta-/i.test(m.notas || '')) {
      return { kind: 'venta', label: 'Editar en Ventas', page: 'ventas' };
    }
    // lote: compra/envío/courier con notas "Lote L-..."
    if (/lote\s*l[-\s]/i.test(m.notas || '') || (c.includes('compra de mercanc') && notas.includes('lote'))) {
      return { kind: 'lote', label: 'Editar en Inventario', page: 'inventario' };
    }
    // movFin (cuota préstamo, cargo línea, pago línea, retorno inversor, etc.)
    if (/cuota|pago línea|cargo línea|pago linea|cargo linea|retorno inversor|abono préstamo|abono prestamo|disposición línea|disposicion linea/i.test(c)) {
      return { kind: 'movfin', label: 'Editar en Finanzas', page: 'finanzas' };
    }
    return null;  // ajuste manual / aporte / otros → editable libremente
  };

  const doDelete = async () => {
    setBusy(true);
    try {
      await window.AT_CLIENT.remove('cashflow', del._airtableId);
      await window.AT_CLIENT.loadCashflow();   // refresca la tabla (el remove genérico no dispara evento)
      window.toastOk('Movimiento eliminado', del.c);
      setDel(null);
    } catch (e) {
      window.toastErr('No se pudo eliminar', e.message?.slice(0, 120));
    }
    setBusy(false);
  };

  const doSaveEdit = async (vals) => {
    setBusy(true);
    try {
      await window.AT_CLIENT.update('cashflow', edit._airtableId, {
        fecha:       vals.fecha,
        concepto:    vals.concepto,      // label amigable → enum tipo (vía TIPO_REV)
        cuentaBanco: vals.cuentaBanco,   // nombre de cuenta → cuenta_id
        auxiliar:    vals.auxiliar,
        entrada:     Number(vals.entrada) || 0,
        salida:      Number(vals.salida) || 0,
        notas:       vals.notas,
      });
      await window.AT_CLIENT.loadCashflow();   // refresca la tabla (el update genérico no dispara evento)
      window.toastOk('Movimiento actualizado', vals.concepto || '');
      setEdit(null);
    } catch (e) { window.toastErr('No se pudo guardar', e.message?.slice(0, 120)); }
    setBusy(false);
  };

  return (
    <>
      {!embedded && (
        <div className="topbar">
          <div>
            <h1>Movimientos · libro contable</h1>
            <div className="sub">{all.length} totales · {filteredAll.length} en filtros · saldo período: <strong style={{ color: neto >= 0 ? 'var(--success)' : 'var(--danger)' }}>{fmtCurrency(neto)}</strong></div>
          </div>
          <div className="topbar-actions">
            <button className="pill" onClick={exportCSV} title="Descargar libro contable como CSV">⬇ Exportar CSV</button>
          </div>
        </div>
      )}
      {embedded && (
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 'var(--s-3)', flexWrap: 'wrap', gap: 8 }}>
          <div className="section-desc">
            {all.length} movimientos totales · {filteredAll.length} en filtros · saldo período:{' '}
            <strong style={{ color: neto >= 0 ? 'var(--success)' : 'var(--danger)' }}>{fmtCurrency(neto)}</strong>
          </div>
          <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
            <PeriodFilter value={period} onChange={setPeriodLocal} />
            <button className="pill" onClick={exportCSV} title="Descargar libro contable como CSV">⬇ CSV</button>
          </div>
        </div>
      )}

      <div className="tabs">
        <button className={`tab ${tab === 'lista' ? 'active' : ''}`} onClick={() => setTab('lista')}>Libro contable</button>
        <button className={`tab ${tab === 'movfin' ? 'active' : ''}`} onClick={() => setTab('movfin')}>+ Pago a préstamo/línea/inversor</button>
        <button className={`tab ${tab === 'ajuste' ? 'active' : ''}`} onClick={() => setTab('ajuste')}>+ Gasto / ajuste / transferencia</button>
      </div>

      {tab === 'movfin' && <div className="section"><FormMovFin /></div>}
      {tab === 'ajuste' && <div className="section"><FormAjusteCF /></div>}

      {tab === 'lista' && (<>
        {/* KPIs del período filtrado */}
        <div className="kpi-row">
          <KPI label="Movimientos" value={fmtNum(filteredAll.length)} delta={null} deltaLabel={`de ${all.length} totales`} />
          <KPI label="Total Debe (entradas)" value={fmtNum(totalEntradas)} currency delta={null} deltaLabel="cobros / aportes / ingresos" />
          <KPI label="Total Haber (salidas)" value={fmtNum(totalSalidas)} currency delta={null} deltaLabel="pagos / compras / gastos" />
          <KPI label="Saldo neto del período" value={fmtNum(neto)} currency
               delta={neto >= 0 ? 1 : -1} deltaLabel={neto >= 0 ? 'superávit' : 'déficit'} />
        </div>

        {/* Filtros */}
        <div className="section" style={{ marginBottom: 'var(--s-3)' }}>
          <div className="section-head">
            <div>
              <div className="section-title">Filtros</div>
              <div className="section-desc">Combina filtros: tipo (chip) + cuenta + naturaleza + búsqueda</div>
            </div>
            {(tipoSel.size > 0 || cuentaSel !== 'todas' || naturalezaSel !== 'todas' || search) && (
              <button className="btn ghost" onClick={() => { clearTipos(); setCuentaSel('todas'); setNaturalezaSel('todas'); setSearch(''); }}>
                Limpiar filtros
              </button>
            )}
          </div>

          {/* Row 1: cuenta + naturaleza + búsqueda + toggle saldo */}
          <div style={{ display: 'flex', gap: 12, alignItems: 'end', marginBottom: 12, flexWrap: 'wrap' }}>
            <div className="field" style={{ flex: '0 0 220px' }}>
              <div className="field-label">Cuenta origen</div>
              <select className="select" value={cuentaSel} onChange={e => setCuentaSel(e.target.value)}>
                <option value="todas">Todas las cuentas</option>
                {cuentasUnicas.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
            </div>
            <div className="field" style={{ flex: '0 0 200px' }}>
              <div className="field-label">Naturaleza</div>
              <select className="select" value={naturalezaSel} onChange={e => setNaturalezaSel(e.target.value)}>
                <option value="todas">Todas</option>
                <option value="op">Solo operacional</option>
                <option value="fin">Solo financiero</option>
              </select>
            </div>
            <div className="field" style={{ flex: 1, minWidth: 200 }}>
              <div className="field-label">Búsqueda libre</div>
              <input className="input" type="text" placeholder="concepto, contraparte, cuenta, notas…" value={search} onChange={e => setSearch(e.target.value)} />
            </div>
            <div className="field" style={{ flex: '0 0 auto' }}>
              <label style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 12, color: 'var(--text-2)', cursor: 'pointer' }}>
                <input type="checkbox" checked={showRunning} onChange={e => setShowRunning(e.target.checked)} />
                Saldo corriente
              </label>
            </div>
          </div>

          {/* Row 2: chips de tipo */}
          <div>
            <div className="field-label" style={{ marginBottom: 6 }}>
              Tipo de movimiento ({tipoSel.size === 0 ? 'todos' : tipoSel.size + ' seleccionados'})
            </div>
            <div style={{ display: 'flex', gap: 4, flexWrap: 'wrap' }}>
              {conceptosOrdenados.map(([c, st]) => {
                const active = tipoSel.has(c);
                const isInflow = st.e > st.s;
                return (
                  <button key={c} className="pill" onClick={() => toggleTipo(c)} style={{
                    background: active ? (isInflow ? 'var(--success)' : 'var(--danger)') : 'var(--surface-2)',
                    color: active ? 'white' : 'var(--text-2)',
                    border: 'none', fontSize: 11,
                  }}>
                    {c} <span style={{ opacity: 0.75, marginLeft: 4 }}>({st.count})</span>
                  </button>
                );
              })}
            </div>
          </div>
        </div>

        {/* Libro contable */}
        <div className="section">
          <div className="section-head">
            <div>
              <div className="section-title">Libro contable</div>
              <div className="section-desc">
                {filtered.length} de {filteredAll.length} · ordenado desc por fecha · sticky header
              </div>
            </div>
            {filteredAll.length > limit && (
              <button className="btn ghost" onClick={() => setLimit(l => l + 500)}>
                Cargar más ({filteredAll.length - limit} restantes)
              </button>
            )}
          </div>
          <div style={{ maxHeight: 700, overflowY: 'auto' }}>
            <table className="data">
              <thead style={{ position: 'sticky', top: 0, background: 'var(--surface)', zIndex: 1 }}>
                <tr>
                  <th>Fecha</th>
                  <th>Tipo / Concepto</th>
                  <th>Cuenta</th>
                  <th>Contraparte</th>
                  <th>Nat.</th>
                  <th className="right">Debe</th>
                  <th className="right">Haber</th>
                  {showRunning && <th className="right">Saldo</th>}
                  <th></th>
                </tr>
              </thead>
              <tbody>
                {rowsConBalance.map((m, i) => {
                  const source = linkedSource(m);
                  const isFin = m._naturaleza === 'FINANCIERO';
                  return (
                    <tr key={i}>
                      <td className="num" style={{ fontSize: 11, color: 'var(--text-3)' }}>{fmtDate(m.f)}</td>
                      <td><span style={{ fontWeight: 500 }}>{m.c}</span></td>
                      <td className="muted" style={{ fontSize: 11 }}>{m._origen || '—'}</td>
                      <td className="muted" style={{ fontSize: 12 }}>{m.a || '—'}</td>
                      <td>
                        <span className="badge" style={{
                          background: isFin ? 'rgba(245,158,11,0.2)' : 'rgba(59,130,246,0.2)',
                          color: isFin ? '#f59e0b' : '#3b82f6', fontSize: 9,
                        }}>{isFin ? 'FIN' : 'OP'}</span>
                      </td>
                      <td className="num right pos">{m.e > 0 ? fmtCurrency(m.e) : ''}</td>
                      <td className="num right neg">{m.s > 0 ? fmtCurrency(m.s) : ''}</td>
                      {showRunning && (
                        <td className="num right" style={{ fontWeight: 600, color: m._saldo >= 0 ? 'var(--text)' : 'var(--danger)' }}>
                          {fmtCurrency(m._saldo)}
                        </td>
                      )}
                      <td className="row-actions">
                        <div className="row-actions-inner">
                          {source ? (
                            <button
                              onClick={() => onNavigate?.(source.page)}
                              title={`Vino de ${source.kind} · editar en su fuente`}
                              style={{
                                background: 'transparent', border: '1px solid var(--border)',
                                color: 'var(--accent)', cursor: 'pointer', fontSize: 10,
                                padding: '2px 6px', borderRadius: 4, whiteSpace: 'nowrap',
                              }}>
                              {source.kind} →
                            </button>
                          ) : (
                            <button className="icon-btn" onClick={() => setEdit(m)} title="Editar">✎</button>
                          )}
                          <button className="icon-btn danger" onClick={() => setDel(m)} title="Eliminar">×</button>
                        </div>
                      </td>
                    </tr>
                  );
                })}
                {rowsConBalance.length === 0 && (
                  <tr><td colSpan={showRunning ? 9 : 8} className="empty" style={{ padding: 'var(--s-6)' }}>
                    Sin movimientos en estos filtros
                  </td></tr>
                )}
              </tbody>
              {rowsConBalance.length > 0 && (
                <tfoot>
                  <tr style={{ background: 'var(--surface-2)', fontWeight: 600, position: 'sticky', bottom: 0 }}>
                    <td colSpan="5" className="muted">TOTALES del período filtrado</td>
                    <td className="num right pos">{fmtCurrency(totalEntradas)}</td>
                    <td className="num right neg">{fmtCurrency(totalSalidas)}</td>
                    {showRunning && <td className="num right" style={{ color: neto >= 0 ? 'var(--success)' : 'var(--danger)' }}>{fmtCurrency(neto)}</td>}
                    <td></td>
                  </tr>
                </tfoot>
              )}
            </table>
          </div>
        </div>
      </>)}

      <ConfirmModal open={!!del} danger busy={busy}
        title={`¿Eliminar movimiento?`}
        body={`${del?.f || ''} · ${del?.c || ''} · ${del?.a || ''}. ${fmtCurrency(del?.e || del?.s || 0)}. Borra de Supabase, no reversible.`}
        onCancel={() => setDel(null)}
        onConfirm={doDelete} />

      <EditModal open={!!edit} busy={busy}
        title={`Editar movimiento`}
        fields={edit ? (() => {
          const CONCEPTOS = ['Venta de mercancia','Envio cobrado','Compra de mercancia','Compra operativa','Pago Envio','Courier','Pago ADS','Pago Comision','Aportes para negocio','Fee bancario','Refund proveedor','Refund cliente','Transferencia','Ajuste','Intereses','Otro'];
          const conceptoOpts = [...new Set([edit.c, ...CONCEPTOS].filter(Boolean))];
          const cuentaOpts = [...new Set((data._cuentas || []).map(c => c.nombre).filter(Boolean))];
          if (edit._origen && !cuentaOpts.includes(edit._origen)) cuentaOpts.unshift(edit._origen);
          return [
            { name: 'fecha', label: 'Fecha', type: 'date', value: edit.f },
            { name: 'concepto', label: 'Concepto', type: 'select', value: edit.c, options: conceptoOpts },
            { name: 'cuentaBanco', label: 'Cuenta de banco', type: 'select', value: edit._origen || '', options: cuentaOpts },
            { name: 'auxiliar', label: 'Contraparte', type: 'text', value: edit.a || '' },
            { name: 'entrada', label: 'Entrada (RD$)', type: 'number', value: edit.e || 0 },
            { name: 'salida', label: 'Salida (RD$)', type: 'number', value: edit.s || 0 },
            { name: 'notas', label: 'Notas', type: 'text', value: edit.notas || '', span: 2 },
          ];
        })() : []}
        onCancel={() => setEdit(null)}
        onSave={doSaveEdit} />
    </>
  );
}

// ════════════════════════════════════════════════════════════════
// EditModal — modal genérico para edit forms
// fields: [{name, label, type, value, options?, span?}]
// ════════════════════════════════════════════════════════════════
function EditModal({ open, title, fields, onCancel, onSave, busy }) {
  const [values, setValues] = useState({});
  useEffect(() => {
    if (open && fields) {
      const init = {};
      fields.forEach(f => { init[f.name] = f.value ?? ''; });
      setValues(init);
    }
  }, [open]);
  if (!open) return null;
  return (
    <div className="modal-backdrop" onClick={onCancel}>
      <div className="modal" style={{ minWidth: 520, maxWidth: '90vw' }} onClick={e => e.stopPropagation()}>
        <div className="modal-title">{title}</div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 12, marginBottom: 'var(--s-4)' }}>
          {fields.map(f => (
            <div key={f.name} className="field" style={f.span === 2 ? { gridColumn: 'span 2' } : undefined}>
              <div className="field-label">{f.label}</div>
              {f.type === 'select' ? (
                <select className="select" value={values[f.name] ?? ''} onChange={e => setValues({ ...values, [f.name]: e.target.value })}>
                  {f.options.map(o => typeof o === 'string' ? <option key={o}>{o}</option> : <option key={o.value} value={o.value}>{o.label}</option>)}
                </select>
              ) : f.type === 'textarea' ? (
                <textarea className="textarea" rows={3} value={values[f.name] ?? ''} onChange={e => setValues({ ...values, [f.name]: e.target.value })} />
              ) : (
                <input className={'input ' + (f.type === 'number' || f.type === 'date' ? 'num' : '')}
                       type={f.type || 'text'} value={values[f.name] ?? ''}
                       onChange={e => setValues({ ...values, [f.name]: e.target.value })}
                       placeholder={f.placeholder} />
              )}
              {f.hint && <div className="field-hint">{f.hint}</div>}
            </div>
          ))}
        </div>
        <div className="modal-actions">
          <button className="btn ghost" onClick={onCancel} disabled={busy}>Cancelar</button>
          <button className="btn" disabled={busy} onClick={() => onSave(values)}>
            {busy ? 'Guardando…' : 'Guardar'}
          </button>
        </div>
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════════
// Alertas Page — critical inventory + próximas cuotas + sin movimiento
// ════════════════════════════════════════════════════════════════
function AlertasPage() {
  const data = useATData();
  const [showStock, setShowStock] = useState(false);
  const SK_ALL = window.buildSK ? window.buildSK() : (data.skus || []);
  // Excluir LEGACY-SALE — es placeholder, no inventario real.
  const SK = SK_ALL.filter(s => s.id !== 'LEGACY-SALE');
  const criticos = SK.filter(s => s.estado === 'critico');
  const atencion = SK.filter(s => s.estado === 'atencion');
  const reposicion = SK.filter(s => s.estado === 'en_reposicion');
  const sinMov = SK.filter(s => s.estado === 'sin_movimiento');

  const fin = data.financiero || [];
  const prod = data.productos || {};
  const lcs = prod['FIN-LC'] || [];
  const coopProd = (prod['FIN-P'] || [])[0];

  // ── Helpers de fecha ──
  const HOY = new Date((window.HOY || new Date().toISOString().slice(0, 10)) + 'T00:00:00');
  const hoyMid = new Date(HOY.getFullYear(), HOY.getMonth(), HOY.getDate());
  const nextDateForDay = (dia) => {
    if (!dia || dia < 1 || dia > 31) return null;
    let cand = new Date(hoyMid.getFullYear(), hoyMid.getMonth(), dia);
    if (cand < hoyMid) cand = new Date(hoyMid.getFullYear(), hoyMid.getMonth() + 1, dia);
    return cand;
  };
  const dayFromAnchor = (f) => f ? new Date(f + 'T00:00:00').getDate() : null;
  const daysUntil = (d) => d ? Math.round((d - hoyMid) / 86400000) : null;
  const fmtD = (d) => d ? `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}` : '—';
  const urgBadge = (d) => { const n = daysUntil(d); if (n == null) return 'neutral'; if (n <= 3) return 'danger'; if (n <= 7) return 'warning'; return 'neutral'; };
  const urgText = (d) => { const n = daysUntil(d); if (n == null) return '—'; if (n < 0) return `vencido ${-n}d`; if (n === 0) return 'HOY'; if (n === 1) return 'mañana'; return `en ${n}d`; };

  // ── Calendario de pagos próximos ──
  const pagos = [];
  fin.forEach(f => {
    const tl = (f.tipo || '').toLowerCase();
    if (/préstamo|prestamo/.test(tl)) {
      const d = nextDateForDay(dayFromAnchor(f.fechaPrimerPago) || f.diaVencimiento);
      if (d) pagos.push({ cat: 'Cuota préstamo', nombre: f.nombre, fecha: d, monto: coopProd?.cuota || 0, montoLabel: 'cuota', color: '#a78bfa' });
    } else if (/línea|linea/.test(tl)) {
      const lc = lcs.find(p => p._airtableId === f._airtableId);
      const d = nextDateForDay(f.diaVencimiento || dayFromAnchor(f.fechaPrimerPago));
      // lc.tasaMensual viene en PORCENTAJE (ej. 2.13), no decimal → /100.
      const estim = lc ? Math.round((lc.usado || 0) * (lc.tasaMensual || 0) / 100) : 0;
      if (d) pagos.push({ cat: 'Pago línea', nombre: f.nombre, fecha: d, monto: estim, montoLabel: 'interés est.', color: '#f59e0b' });
    } else if (/tarjeta/.test(tl)) {
      const lc = lcs.find(p => p._airtableId === f._airtableId);
      const d = nextDateForDay(f.diaVencimiento);
      if (d) pagos.push({ cat: 'Vencimiento tarjeta', nombre: f.nombre, fecha: d, monto: lc?.usado || 0, montoLabel: 'saldo', color: '#ef4444' });
    } else if (/inversor/.test(tl)) {
      const ext = (prod['FIN-I'] || []).find(p => p._airtableId === f._airtableId);
      const reglas = f.compensaciones || [];
      if (reglas.length) {
        const dias = reglas.map(c => c.diaPago || 17);
        const dia = dias.slice().sort((a, b) => dias.filter(x => x === a).length - dias.filter(x => x === b).length).pop() || 17;
        const d = nextDateForDay(dia);
        // El monto mensual depende de las reglas de compensación (se calcula en
        // la pestaña Inversores). Acá marcamos la fecha; el monto exacto va allá.
        if (d) pagos.push({ cat: 'Pago inversor', nombre: f.nombre, fecha: d, monto: 0, montoLabel: 'ver Inversores', color: '#10b981' });
      }
    }
  });
  pagos.sort((a, b) => a.fecha - b.fecha);
  const pagos7d = pagos.filter(p => daysUntil(p.fecha) <= 7).length;

  // ── Deuda ──
  const deudaFinanciera = Math.round((coopProd?.saldo || 0) + lcs.reduce((s, l) => s + (l.usado || 0), 0));
  const tarjetas = lcs.filter(l => /tarjeta/i.test(l.tipoSub || ''));
  const cardsRiesgo = lcs.filter(l => l.limite > 0 && (l.usado / l.limite) > 0.8).length;

  // ── Barra de utilización ──
  const utilBar = (usado, limite) => {
    const pct = limite > 0 ? Math.min(100, (usado / limite) * 100) : 0;
    const col = pct > 80 ? 'var(--danger)' : pct > 50 ? 'var(--warning)' : 'var(--success)';
    return (
      <div className="ui-bar" style={{ background: 'var(--surface-2)', borderRadius: 4, height: 8, overflow: 'hidden', minWidth: 80 }}>
        <div style={{ width: `${pct}%`, height: '100%', background: col }} />
      </div>
    );
  };

  const totalAlertas = pagos7d + cardsRiesgo + criticos.length;

  return (
    <>
      <div className="topbar">
        <div>
          <h1>Alertas · centro de control</h1>
          <div className="sub">{totalAlertas} alerta{totalAlertas === 1 ? '' : 's'} activa{totalAlertas === 1 ? '' : 's'} · pagos, deuda, tarjetas e inventario</div>
        </div>
      </div>

      <div className="kpi-row">
        <KPI label="Pagos ≤ 7 días" value={pagos7d}
             delta={pagos7d > 0 ? -1 : null} deltaLabel="obligaciones próximas" />
        <KPI label="Deuda financiera" value={fmtNum(deudaFinanciera)} currency
             delta={null} deltaLabel="Coop + líneas + tarjetas" />
        <KPI label="Tarjetas en riesgo" value={cardsRiesgo}
             delta={cardsRiesgo > 0 ? -1 : null} deltaLabel="> 80% del límite" />
        <KPI label="Stock crítico" value={criticos.length}
             delta={criticos.length > 0 ? -1 : null} deltaLabel="pedir ahora" />
      </div>

      {/* 📅 CALENDARIO DE PAGOS */}
      <div className="section">
        <div className="section-head">
          <div>
            <div className="section-title">📅 Calendario de pagos</div>
            <div className="section-desc">Próximas cuotas, vencimientos de tarjeta y pagos a inversores · ordenado por fecha</div>
          </div>
          <span className="badge neutral">{pagos.length} próximos</span>
        </div>
        <table className="data">
          <thead><tr>
            <th>Cuándo</th><th>Fecha</th><th>Tipo</th><th>Producto</th><th className="right">Monto</th>
          </tr></thead>
          <tbody>
            {pagos.map((p, i) => (
              <tr key={i}>
                <td><span className={`badge ${urgBadge(p.fecha)}`}>{urgText(p.fecha)}</span></td>
                <td className="num">{fmtD(p.fecha)}</td>
                <td><span className="badge" style={{ background: p.color, color: 'white', fontSize: 10 }}>{p.cat}</span></td>
                <td>{p.nombre}</td>
                <td className="num right">{p.monto > 0 ? fmtCurrency(p.monto) : '—'} <span className="muted" style={{ fontSize: 10 }}>{p.montoLabel}</span></td>
              </tr>
            ))}
            {pagos.length === 0 && (
              <tr><td colSpan="5" className="empty" style={{ padding: 'var(--s-6)' }}>
                Sin pagos programados. Configura los días de vencimiento en Finanzas › Tarjetas/Préstamos (editar).
              </td></tr>
            )}
          </tbody>
        </table>
      </div>

      {/* 💳 CORTES Y VENCIMIENTOS DE TARJETA */}
      <div className="section">
        <div className="section-head">
          <div>
            <div className="section-title">💳 Cortes y vencimientos de tarjeta</div>
            <div className="section-desc">Día de corte y día de pago de cada tarjeta · configúralos en Finanzas › Tarjetas (✎)</div>
          </div>
          <span className="badge neutral">{tarjetas.length} tarjetas</span>
        </div>
        <table className="data">
          <thead><tr>
            <th>Tarjeta</th><th>Corte</th><th>Próx. corte</th><th>Vence</th><th>Próx. pago</th>
            <th className="right">Usado / Límite</th><th>Uso</th>
          </tr></thead>
          <tbody>
            {tarjetas.map(t => {
              const f = fin.find(x => x._airtableId === t._airtableId) || {};
              const corteD = nextDateForDay(f.diaCorte);
              const vencD = nextDateForDay(f.diaVencimiento);
              const pct = t.limite > 0 ? (t.usado / t.limite) * 100 : 0;
              const sinCfg = !f.diaCorte && !f.diaVencimiento;
              return (
                <tr key={t._airtableId}>
                  <td>{t.nombre} {t.moneda && t.moneda !== 'RD$' && <span className="muted" style={{ fontSize: 10 }}>{t.moneda}</span>}</td>
                  <td className="num">{f.diaCorte ? `día ${f.diaCorte}` : <span className="muted">—</span>}</td>
                  <td className="num">{corteD ? <><span className="badge neutral" style={{ fontSize: 9 }}>{urgText(corteD)}</span> {fmtD(corteD)}</> : '—'}</td>
                  <td className="num">{f.diaVencimiento ? `día ${f.diaVencimiento}` : <span className="muted">—</span>}</td>
                  <td className="num">{vencD ? <><span className={`badge ${urgBadge(vencD)}`} style={{ fontSize: 9 }}>{urgText(vencD)}</span> {fmtD(vencD)}</> : '—'}</td>
                  <td className="num right">{fmtCurrency(t.usado)} / {fmtCurrency(t.limite)}</td>
                  <td>{sinCfg ? <span className="muted" style={{ fontSize: 10 }}>sin configurar</span> : <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>{utilBar(t.usado, t.limite)}<span style={{ fontSize: 10 }}>{pct.toFixed(0)}%</span></div>}</td>
                </tr>
              );
            })}
            {tarjetas.length === 0 && (
              <tr><td colSpan="7" className="empty" style={{ padding: 'var(--s-6)' }}>Sin tarjetas registradas.</td></tr>
            )}
          </tbody>
        </table>
      </div>

      {/* ⚠️ DEUDA · UTILIZACIÓN */}
      <div className="section">
        <div className="section-head">
          <div>
            <div className="section-title">⚠️ Deuda · utilización de crédito</div>
            <div className="section-desc">Deuda financiera total {fmtCurrency(deudaFinanciera)} · semáforo por producto</div>
          </div>
        </div>
        <table className="data">
          <thead><tr>
            <th>Producto</th><th>Tipo</th><th className="right">Usado / Saldo</th><th className="right">Límite / Monto</th><th>Utilización</th>
          </tr></thead>
          <tbody>
            {coopProd && coopProd.saldo > 0 && (
              <tr>
                <td>{coopProd.nombre || 'Préstamo Coop'}</td>
                <td className="muted">Préstamo</td>
                <td className="num right neg">{fmtCurrency(coopProd.saldo)}</td>
                <td className="num right">{fmtCurrency(coopProd.monto || 0)}</td>
                <td><div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>{utilBar(coopProd.saldo, coopProd.monto)}<span style={{ fontSize: 10 }}>{coopProd.monto > 0 ? ((coopProd.saldo / coopProd.monto) * 100).toFixed(0) : 0}%</span></div></td>
              </tr>
            )}
            {lcs.map(l => {
              const pct = l.limite > 0 ? (l.usado / l.limite) * 100 : 0;
              return (
                <tr key={l._airtableId}>
                  <td>{l.nombre}</td>
                  <td className="muted">{/tarjeta/i.test(l.tipoSub || '') ? 'Tarjeta' : 'Línea'}</td>
                  <td className="num right neg">{fmtCurrency(l.usado)}</td>
                  <td className="num right">{fmtCurrency(l.limite)}</td>
                  <td><div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>{utilBar(l.usado, l.limite)}<span style={{ fontSize: 10, color: pct > 80 ? 'var(--danger)' : pct > 50 ? 'var(--warning)' : 'var(--text-2)' }}>{pct.toFixed(0)}%</span></div></td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {/* 📦 INVENTARIO (condensado/colapsable) */}
      <div className="section">
        <div className="section-head">
          <div>
            <div className="section-title">📦 Inventario</div>
            <div className="section-desc">
              {criticos.length} críticos · {atencion.length} atención · {reposicion.length} en reposición · {sinMov.length} sin movimiento
            </div>
          </div>
          <button className="btn ghost" style={{ fontSize: 12, padding: '4px 12px' }} onClick={() => setShowStock(s => !s)}>
            {showStock ? '× Ocultar detalle' : 'Ver detalle de stock'}
          </button>
        </div>

        {criticos.length > 0 && (
          <table className="data" style={{ marginBottom: 'var(--s-3)' }}>
            <thead><tr>
              <th style={{ color: 'var(--danger)' }}>Crítico · pedir ahora</th><th>Stock</th><th>Agota en</th><th>VTS/MO</th><th className="right">CPP</th>
            </tr></thead>
            <tbody>
              {criticos.map(s => (
                <tr key={s.id}>
                  <td>{s.nm} · <span className="num muted" style={{ fontSize: 11 }}>{s.id}</span></td>
                  <td className="num neg">{s.s} ud</td>
                  <td className="num">{s.diasStock != null ? `${s.diasStock}d` : 'agotado'}</td>
                  <td className="num">{s.vtasMes?.toFixed?.(1) || '0'}/mes</td>
                  <td className="num right">{fmtCurrency(s.cpp)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        )}

        {showStock && (
          <>
            {reposicion.length > 0 && (
              <table className="data" style={{ marginBottom: 'var(--s-3)' }}>
                <thead><tr>
                  <th style={{ color: 'var(--warning)' }}>En reposición</th><th>Stock</th><th>En camino</th><th>Agota en</th>
                </tr></thead>
                <tbody>
                  {reposicion.map(s => (
                    <tr key={s.id}>
                      <td>{s.nm} · <span className="num muted" style={{ fontSize: 11 }}>{s.id}</span></td>
                      <td className="num">{s.s} ud</td>
                      <td className="num" style={{ color: 'var(--warning)' }}>{s.enCamino} ud</td>
                      <td className="num">{s.diasStock != null ? `${s.diasStock}d` : '—'}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            )}
            {sinMov.length > 0 && (
              <table className="data">
                <thead><tr>
                  <th>Sin movimiento</th><th>Categoría</th><th>Stock</th><th className="right">Capital inmovilizado</th>
                </tr></thead>
                <tbody>
                  {sinMov.map(s => (
                    <tr key={s.id}>
                      <td>{s.nm} · <span className="num muted" style={{ fontSize: 11 }}>{s.id}</span></td>
                      <td className="muted">{s.cat}</td>
                      <td className="num">{s.s} ud</td>
                      <td className="num right">{fmtCurrency(s.s * s.cpp)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            )}
          </>
        )}
      </div>
    </>
  );
}

// ════════════════════════════════════════════════════════════════
// Form Nuevo SKU
// ════════════════════════════════════════════════════════════════
function FormSKU() {
  const data = useATData();
  const [cat, setCat] = useState('Mouse');
  const [customCat, setCustomCat] = useState('');
  const [showCustom, setShowCustom] = useState(false);
  const [mk, setMk] = useState('');
  const [modelo, setModelo] = useState('');
  const [color, setColor] = useState('');
  const [pv, setPv] = useState('');
  const [notas, setNotas] = useState('');
  const [busy, setBusy] = useState(false);

  // Categorías base del enum Supabase + cualquier categoría custom ya en uso
  // (derivada del prefijo del id_sku para SKUs con cat="Otro" pero prefijo
  // distinto a OTR). Así si Julio crea "Controles" mañana, mañana ya
  // aparece en el dropdown.
  const baseCats = window.AT_CLIENT?.SKU_CATEGORIAS || ['Mouse', 'Teclado', 'Headset', 'Stand', 'Mouse Pad', 'Otro'];
  const KNOWN_PREFIX = { MOU: 'Mouse', TEC: 'Teclado', HEA: 'Headset', STA: 'Stand', PAD: 'Mouse Pad', OTR: 'Otro' };
  const customCatsInUse = [...new Set((data.skus || [])
    .map(s => {
      const prefix = (s.id || '').split('-')[0];
      if (KNOWN_PREFIX[prefix]) return null;  // standard prefix → ya está en baseCats
      // Custom prefix → necesita label. Usar el primer SKU de ese prefijo
      // con un nombre legible en notas o derivar.
      return prefix ? `[${prefix}] ${s.cat || 'Otro'}` : null;
    })
    .filter(Boolean))];
  const cats = [...baseCats, ...customCatsInUse];
  const CAT_CODE = { 'Mouse': 'MOU', 'Teclado': 'TEC', 'Headset': 'HEA', 'Stand': 'STA', 'Mouse Pad': 'PAD', 'Otro': 'OTR' };

  // Derivar prefijo y nombre visible para la categoría seleccionada
  // - Si es estándar → usar CAT_CODE
  // - Si es custom (showCustom=true) → primeras 3 letras del customCat
  const effectiveCat = showCustom ? customCat.trim() : cat;
  const catCode  = showCustom
    ? (customCat || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 3) || 'OTR'
    : (CAT_CODE[cat] || 'OTR');
  const mkCode   = (mk || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 3);
  const modCode  = (modelo || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const colCode  = (color || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 3);
  const skuId = [catCode, mkCode, modCode, colCode].filter(Boolean).join('-');
  const autoNm = [mk, modelo, color].filter(Boolean).join(' ');

  const valid = mkCode && modCode && colCode;

  const onSubmit = async () => {
    setBusy(true);
    try {
      // Para categorías custom (ej "Controles") el enum Supabase no las acepta,
      // así que guardamos 'Otro' como categoría y prefijo custom en el id_sku
      // (CTR-...). El nombre se enriquece con la categoría custom para que sea
      // visible en listas.
      const catToSave = showCustom ? 'Otro' : cat;
      const nameToSave = showCustom && customCat
        ? `[${customCat}] ${autoNm}`
        : autoNm;
      const res = await window.AT_CLIENT.createSKU({
        id: skuId, nm: nameToSave, mk, modelo, color, cat: catToSave,
        pv: Number(pv) || null, notas,
      });
      window.toastOk('SKU creado', `${res.id} · ${effectiveCat}`);
      setMk(''); setModelo(''); setColor(''); setPv(''); setNotas('');
      // Mantener la categoría custom seleccionada para crear varios SKUs seguidos
    } catch (e) {
      window.toastErr('No se pudo crear', e.message?.slice(0, 120));
    }
    setBusy(false);
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 'var(--s-4)' }}>
      <div className="row-4">
        <div className="field">
          <div className="field-label" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <span>Categoría</span>
            <button type="button" style={{
              background: 'none', border: 'none', color: 'var(--accent)',
              cursor: 'pointer', fontSize: 11, padding: 0,
            }} onClick={() => { setShowCustom(s => !s); if (!showCustom) setCustomCat(''); }}>
              {showCustom ? '← usar lista' : '+ nueva categoría'}
            </button>
          </div>
          {!showCustom ? (
            <select className="select" value={cat} onChange={e => setCat(e.target.value)}>
              {cats.map(c => <option key={c}>{c}</option>)}
            </select>
          ) : (
            <input className="input" value={customCat} onChange={e => setCustomCat(e.target.value)} placeholder="ej. Controles, Webcam, Cable…" autoFocus />
          )}
        </div>
        <div className="field">
          <div className="field-label">Marca</div>
          <input className="input" value={mk} onChange={e => setMk(e.target.value)} placeholder="HXSJ" />
        </div>
        <div className="field">
          <div className="field-label">Modelo</div>
          <input className="input" value={modelo} onChange={e => setModelo(e.target.value)} placeholder="T90 Pro" />
        </div>
        <div className="field">
          <div className="field-label">Color</div>
          <input className="input" value={color} onChange={e => setColor(e.target.value)} placeholder="Negro" />
        </div>
      </div>

      <div className="row">
        <div className="field">
          <div className="field-label">Precio venta sugerido (RD$)</div>
          <input className="input num" type="number" value={pv} onChange={e => setPv(e.target.value)} placeholder="opcional" />
        </div>
        <div className="field">
          <div className="field-label">Notas</div>
          <input className="input" value={notas} onChange={e => setNotas(e.target.value)} placeholder="opcional" />
        </div>
      </div>

      {/* Buttons FIRST so position stays stable cuando aparece el preview abajo. */}
      <div style={{ display: 'flex', gap: 8 }}>
        <button className="btn" disabled={!valid || busy} onClick={onSubmit}>
          {busy ? 'Creando…' : 'Crear SKU'}
        </button>
        <button className="btn ghost" disabled={busy} onClick={() => {
          setMk(''); setModelo(''); setColor(''); setPv(''); setNotas('');
        }}>Limpiar</button>
      </div>

      {valid && (
        <div className="summary">
          <div className="summary-item"><span className="lbl">ID generado</span><span className="val num">{skuId}</span></div>
          <div className="summary-item"><span className="lbl">Nombre</span><span className="val" style={{ fontSize: 13 }}>{showCustom && customCat ? `[${customCat}] ${autoNm}` : autoNm}</span></div>
          <div className="summary-item"><span className="lbl">Categoría</span><span className="val" style={{ fontSize: 13 }}>{effectiveCat || '—'}</span></div>
          <div className="summary-item"><span className="lbl">Precio</span><span className="val">{pv ? fmtCurrency(pv) : '—'}</span></div>
        </div>
      )}
    </div>
  );
}

// App — sidebar nav + page switcher + global period filter + toasts
// ════════════════════════════════════════════════════════════════
function App() {
  const data = useATData();
  const [page, setPage] = useState('overview');
  const [period, setPeriod] = useState('todo');
  const [navCollapsed, setNavCollapsed] = useState(() => localStorage.getItem('nav-collapsed') === '1');
  useEffect(() => { localStorage.setItem('nav-collapsed', navCollapsed ? '1' : '0'); }, [navCollapsed]);

  // Badge del sidebar = SKUs en estado crítico (señal urgente).
  // Antes sumaba atención+reposición y daba un número mayor que el
  // headline "N alertas activas" de la página, confundiendo. Crítico
  // es la señal accionable y queda consistente con la página.
  const SK = window.buildSK ? window.buildSK() : (data.skus || []);
  const alertCount = SK.filter(s => s.estado === 'critico').length;

  const pages = [
    { id: 'overview',    label: 'Resumen',     icon: '◉', badge: null },
    { id: 'alertas',     label: 'Alertas',     icon: '!', badge: alertCount, badgeColor: 'var(--danger)' },
    { id: 'ventas',      label: 'Ventas',      icon: '$', badge: (data.ventas || []).length },
    { id: 'inventario',  label: 'Inventario',  icon: '▤', badge: (data.skus || []).length },
    { id: 'finanzas',    label: 'Finanzas',    icon: '∮', badge: null },
  ];

  const showPeriod = ['overview', 'ventas'].includes(page);

  return (
    <div className={`app ${navCollapsed ? 'collapsed' : ''}`}>
      <aside className="nav" style={{
        position: 'relative',
        width: navCollapsed ? 56 : 224,
        minWidth: navCollapsed ? 56 : 224,
        maxWidth: navCollapsed ? 56 : 224,
        flex: `0 0 ${navCollapsed ? 56 : 224}px`,
      }}>
        <button className="nav-toggle" title={navCollapsed ? 'Expandir' : 'Colapsar'}
                onClick={() => setNavCollapsed(c => !c)}>
          {navCollapsed ? '›' : '‹'}
        </button>
        <div className="brand">
          <div className="brand-mark" title={navCollapsed ? 'JAMC.TECH · v3' : ''}>J</div>
          <div>
            <div className="brand-text">JAMC.TECH</div>
            <div className="brand-sub">v3 · Supabase</div>
          </div>
        </div>

        <div className="nav-section-label">General</div>
        {pages.map(p => (
          <div key={p.id} className={`nav-item ${page === p.id ? 'active' : ''}`}
               style={{ position: 'relative' }}
               onClick={() => setPage(p.id)}>
            <span className="nav-item-icon" style={p.badgeColor ? { color: p.badgeColor } : undefined}>{p.icon}</span>
            <span>{p.label}</span>
            {p.badge != null && p.badge > 0 && (
              <span className="nav-item-badge" style={p.badgeColor ? {
                background: p.badgeColor + '22', color: p.badgeColor,
              } : undefined}>{p.badge}</span>
            )}
          </div>
        ))}

        <div className="nav-section-label">Sistema</div>
        <div className="nav-item" onClick={() => window.AT_CLIENT?.refreshAll?.()}>
          <span className="nav-item-icon">↻</span>
          <span>Sincronizar</span>
        </div>
        <div className="nav-item" onClick={() => window.location.href = '/index-legacy.html'}>
          <span className="nav-item-icon">▦</span>
          <span>Bloomberg legacy</span>
        </div>

        <div style={{ marginTop: 'auto', padding: 'var(--s-3)', fontSize: 11, color: 'var(--text-4)' }}>
          <div>Build v3.0</div>
          <div>{fmtDate(window.HOY || HOY)} · Supabase ✓</div>
        </div>
      </aside>

      <main className="main">
        {showPeriod ? (
          <div style={{
            display: 'flex', justifyContent: 'flex-end', alignItems: 'center',
            position: 'sticky', top: 0, zIndex: 50,
            background: 'var(--bg)', padding: '10px 0',
            marginLeft: 'calc(-1 * var(--s-6))', marginRight: 'calc(-1 * var(--s-6))',
            paddingLeft: 'var(--s-6)', paddingRight: 'var(--s-6)',
            marginBottom: 'var(--s-4)',
            borderBottom: '1px solid var(--border)',
          }}>
            <PeriodFilter value={period} onChange={setPeriod} />
          </div>
        ) : <div style={{ paddingTop: 'var(--s-5)' }} />}
        {page === 'overview'    && <OverviewPage period={period} />}
        {page === 'alertas'     && <AlertasPage />}
        {page === 'ventas'      && <VentasPageExt period={period} />}
        {page === 'inventario'  && <InventarioPage />}
        {page === 'finanzas'    && <FinanzasPage onNavigate={setPage} />}
      </main>
      <ToastStack />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
