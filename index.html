      {/* INVERSORES — separa el dueño del negocio (aportes propios) de los inversores externos.
          Heurística: notas contiene "[dueño]" o "dueño" o "aporte propio" → es el dueño.
          Botón "👤 Dueño" toggle marca/desmarca con notas. */}
      {subtab === 'inversores' && (() => {
        const allInv = fin.filter(f => /inversor/i.test(f.tipo));
        // Dueño se determina por columna es_dueno (preferida) o fallback al
        // legacy [Dueño] en notas para compat con data vieja.
        const isDueno = (i) => i.esDueno === true || /\[dueño\]|dueño|aporte propio/i.test(i.notas || i.nota || '');
        const inversoresExt = allInv.filter(i => !isDueno(i));
        const aportesDueno  = allInv.filter(i =>  isDueno(i));
        const yaHayDueno = aportesDueno.length > 0;
        const toggleDueno = async (i) => {
          const willMark = !isDueno(i);
          if (willMark && yaHayDueno) {
            window.toastErr('Solo puede haber un dueño', `Ya esta marcado: ${aportesDueno[0].nombre}`);
            return;
          }
          // Confirmacion explicita por el cambio de tipo (afecta paquete y métodos).
          const accion = willMark ? 'MARCAR como dueño' : 'DESMARCAR como dueño';
          const consecuencias = willMark
            ? `${i.nombre} pasará al Paquete Dueño (5 reglas distintas).\n\n` +
              `• Capital = equity acumulado (crece con reinversiones)\n` +
              `• Target = ∞ (no hay tope)\n` +
              `• Las reglas actuales del Paquete Inversor se eliminan.`
            : `${i.nombre} volverá al Paquete Inversor.\n\n` +
              `• Capital = aportes\n` +
              `• Target = 2× capital\n` +
              `• Las reglas actuales del Paquete Dueño se eliminan.`;
          const id = Number(i._airtableId.slice(2));
          const reglasActuales = i.compensaciones || [];  // se eliminan: el paquete del otro tipo no aplica
          // Guard reforzado contra clicks accidentales: si hay reglas que se van
          // a ELIMINAR, hay que escribir BORRAR. Si no hay reglas, basta confirmar.
          if (reglasActuales.length > 0) {
            const typed = prompt(
              `${accion} a ${i.nombre}.\n\n${consecuencias}\n\n` +
              `⚠️ Se ELIMINARÁN ${reglasActuales.length} regla(s) de compensación (la data histórica de pagos se preserva).\n\n` +
              `Para confirmar, escribe BORRAR:`);
            if ((typed || '').trim().toUpperCase() !== 'BORRAR') {
              window.toastWarn?.('Cancelado', 'No se escribió BORRAR · no se cambió nada');
              return;
            }
          } else if (!confirm(`¿${accion} a ${i.nombre}?\n\n${consecuencias}`)) {
            return;
          }
          try {
            for (const r of reglasActuales) {
              try { await window.AT_CLIENT.removeCompensacion(r.id); } catch {}
            }
            await window.AT_CLIENT.updateInversor(id, { esDueno: willMark });
            window.toastOk(willMark ? 'Marcado como dueño' : 'Desmarcado como dueño',
              `${i.nombre} · Aplicá el nuevo Paquete cuando quieras`);
          } catch (e) { window.toastErr('No se pudo marcar', e.message?.slice(0, 120)); }
        };
        // Compute pendiente real + pagado real + ETA + velocidad por inversor
        const computeMetricas = (i) => {
          const ext = (data.productos?.['FIN-I'] || []).find(p => p._airtableId === i._airtableId);
          // Pagado viene del productoExt (mismo cálculo que usa el panel Resumen)
          // Fallback: recomputar desde cashflow si no hay ext.
          let pagado = ext?.pagado || 0;
          if (!ext) {
            pagado = (data.cashflow || []).filter(m => m.c === 'Pago a Inversores')
              .reduce((s, m) => s + (m.s || 0), 0);
          }
          const tipo = ext?.tipoCompensacion || i.tipoCompensacion || 'DIVIDENDO_PREFERENTE';
          const meta = TIPO_COMPENSACION_META[tipo] || {
            label: tipo || 'Sin método',
            color: 'var(--text-3)',
            desc: 'Método legacy o desconocido',
            fields: [],
          };
          const target = tipo === 'ROYALTY' && ext?.capDevolver ? ext.capDevolver : i.balance;
          const pendiente = Math.max(0, target - pagado);
          // Velocidad: monto pagado / meses transcurridos
          let meses = 1;
          if (pagado > 0 && i.fechaInicio) {
            const fechaIni = new Date(i.fechaInicio);
            const hoy = new Date();
            meses = Math.max(1, (hoy - fechaIni) / (30.4 * 86400000));
          }
          const ritmoMensual = pagado / meses;
          const etaMeses = ritmoMensual > 0 ? Math.ceil(pendiente / ritmoMensual) : null;
          return { tipo, meta, target, pagado, pendiente, ritmoMensual, etaMeses, ext };
        };

        const renderTabla = (items, emptyMsg) => (
          <table className="data">
            <thead><tr>
              <th>Nombre</th><th>Método</th><th className="right">Capital</th>
              <th className="right">Target</th><th className="right">Pagado</th>
              <th className="right">Pendiente · ETA</th><th></th>
            </tr></thead>
            <tbody>
              {items.map(i => {
                const dueno = isDueno(i);
                const isSelected = selectedId === i._airtableId;
                const m = computeMetricas(i);
                // Equity del dueño = aportes propios (entradas linkeadas por
                // inversor_id, sin tag de regla = no son pagos de compensación)
                // + lo reinvertido (montoTotal/capital_invertido).
                const _invId = Number(String(i._airtableId).slice(2));
                const aportesPropios = dueno
                  ? (data.cashflow || []).filter(x =>
                      x._inversorId === _invId && (x.e || 0) > 0 &&
                      x.c === 'Aportes para negocio'   // solo aportes reales, NO drawdowns/financiero
                    ).reduce((s, x) => s + (x.e || 0), 0)
                  : 0;
                const capitalMostrar = dueno ? (Number(i.montoTotal) || 0) + aportesPropios : i.montoTotal;
                return (
                  <tr key={i._airtableId}
                    style={{ cursor: 'pointer', background: isSelected ? 'var(--surface-2)' : undefined }}
                    onClick={() => setSelectedId(isSelected ? null : i._airtableId)}>
                    <td>
                      {i.nombre}
                      {dueno && <span className="badge success" style={{ marginLeft: 6, fontSize: 9 }}>👤 DUEÑO</span>}
                    </td>
                    <td>
                      {dueno ? <span className="muted">—</span> : (
                        <span className="badge" style={{ background: m.meta.color, color: 'white', fontSize: 9, fontWeight: 600 }}>
                          {m.meta.label.replace(/^\d+\s·\s/, '')}
                        </span>
                      )}
                    </td>
                    <td className="num right">
                      {fmtCurrency(capitalMostrar)}
                      {dueno && <div style={{ fontSize: 9, color: 'var(--text-3)' }}>equity (aportes + reinvertido)</div>}
                    </td>
                    <td className="num right">
                      {dueno ? <span style={{ fontSize: 18, color: 'var(--text-3)' }}>∞</span> : fmtCurrency(m.target)}
                      {!dueno && <div style={{ fontSize: 9, color: 'var(--text-3)' }}>2× capital</div>}
                    </td>
                    <td className="num right pos">{fmtCurrency(m.pagado)}</td>
                    <td className="num right">
                      {dueno ? '—' : (
                        <div>
                          <div className="neg">{fmtCurrency(m.pendiente)}</div>
                          {m.etaMeses != null && m.etaMeses < 600 && (
                            <div style={{ fontSize: 10, color: 'var(--text-3)', marginTop: 2 }}>
                              ~{m.etaMeses}mo · RD${m.ritmoMensual.toFixed(0)}/mo
                            </div>
                          )}
                        </div>
                      )}
                    </td>
                    <td className="row-actions" onClick={e => e.stopPropagation()}>
                      <div className="row-actions-inner">
                        <button className="icon-btn" title={dueno ? 'Quitar marca de dueño' : 'Marcar como dueño (es aporte propio, no inversor externo)'}
                          onClick={() => toggleDueno(i)}>👤</button>
                        <button className="icon-btn" title="Editar" onClick={() => openEditInversor(i)}>✎</button>
                        <button className="icon-btn danger" title="Eliminar" onClick={() => setDel({ kind: 'inversor', id: i._airtableId.slice(2), label: i.nombre })}>×</button>
                      </div>
                    </td>
                  </tr>
                );
              })}
              {items.length === 0 && (
                <tr><td colSpan="7" className="empty" style={{ padding: 'var(--s-6)' }}>{emptyMsg}</td></tr>
              )}
            </tbody>
          </table>
        );
        return (<>
          <div className="section">
            <div className="section-head">
              <div>
                <div className="section-title">Inversores externos</div>
                <div className="section-desc">{inversoresExt.length} inversor(es) que esperan retorno</div>
              </div>
            </div>
            {renderTabla(inversoresExt, 'Sin inversores externos · click "+ Nuevo"')}
          </div>
          {aportesDueno.length > 0 && (
            <div className="section">
              <div className="section-head">
                <div>
                  <div className="section-title">Aportes del dueño</div>
                  <div className="section-desc">{aportesDueno.length} aporte(s) propio(s) · no son deudas, no se restan del capital</div>
                </div>
              </div>
              {renderTabla(aportesDueno, 'Sin aportes del dueño')}
            </div>
          )}
          {selectedId && (() => {
            const sel = allInv.find(i => i._airtableId === selectedId);
            if (!sel) return null;
            const productoExt = (data.productos?.['FIN-I'] || []).find(p => p._airtableId === sel._airtableId);
            return <DetalleInversorMovs item={sel} cashflow={data.cashflow || []} esDueno={isDueno(sel)} productoExt={productoExt} />;
          })()}
        </>);
      })()}

      {/* CUENTAS DE BANCO — solo DEBITO + EFECTIVO. Las CREDITO (tarjetas
          legacy en tabla cuentas) viven ahora en el tab Tarjetas. */}
      {subtab === 'cuentas' && (<>
        <div className="section">
          <table className="data">
            <thead><tr>
              <th>Nombre</th><th>Tipo</th><th>Moneda</th>
              <th className="right">Saldo actual</th>
              <th className="right">Límite crédito</th><th></th>
            </tr></thead>
            <tbody>
              {cuentas.filter(c => c.tipo !== 'CREDITO').map(c => {
                // Saldo actual = sum(entrada) - sum(salida) de cashflow donde _origen === c.nombre
                const movs = (data.cashflow || []).filter(m => m._origen === c.nombre);
                const saldo = movs.reduce((s, m) => s + (m.e || 0) - (m.s || 0), 0);
                const isSelected = selectedId === ('cuenta-' + c.id);
                return (
                  <tr key={c.id}
                    style={{ cursor: 'pointer', background: isSelected ? 'var(--surface-2)' : undefined }}
                    onClick={() => setSelectedId(isSelected ? null : 'cuenta-' + c.id)}>
                    <td>
                      {c.nombre} {isSelected && <span className="muted" style={{ fontSize: 10 }}>(seleccionada ↓)</span>}
                      {c.notas && <div style={{ fontSize: 11, color: 'var(--text-3)' }}>{c.notas}</div>}
                    </td>
                    <td><span className={`badge ${c.tipo === 'DEBITO' ? 'success' : c.tipo === 'CREDITO' ? 'warning' : 'neutral'}`}>{c.tipo}</span></td>
                    <td className="muted">{c.moneda}</td>
                    <td className={`num right ${saldo >= 0 ? 'pos' : 'neg'}`} style={{ fontWeight: 600 }}>{fmtMoneda(saldo, c.moneda)}</td>
                    <td className="num right">{c.limite_credito ? fmtMoneda(c.limite_credito, c.moneda) : '—'}</td>
                    <td className="row-actions" onClick={e => e.stopPropagation()}>
                      <div className="row-actions-inner">
                        <button className="icon-btn" title="Editar" onClick={() => openEditCuenta(c)}>✎</button>
                        <button className="icon-btn danger" title="Eliminar" onClick={() => setDel({ kind: 'cuenta', id: c.id, label: c.nombre })}>×</button>
                      </div>
                    </td>
                  </tr>
                );
              })}
              {cuentas.length === 0 && (
                <tr><td colSpan="6" className="empty" style={{ padding: 'var(--s-6)' }}>Sin cuentas · click "+ Nuevo"</td></tr>
              )}
            </tbody>
          </table>
        </div>
        {/* Ledger contable de la cuenta seleccionada */}
        {selectedId && selectedId.startsWith('cuenta-') && (() => {
          const cuentaId = Number(selectedId.slice('cuenta-'.length));
          const cuenta = cuentas.find(c => c.id === cuentaId);
          if (!cuenta) return null;
          return <DetalleCuentaLedger cuenta={cuenta} cashflow={data.cashflow || []} />;
        })()}
      </>)}

      {subtab === 'movimientos' && <MovimientosPage embedded onNavigate={onNavigate} />}
    </>
  );
}

// ════════════════════════════════════════════════════════════════
// Toast system (global, controlado por evento)
// ════════════════════════════════════════════════════════════════
const TOAST_LISTENERS = new Set();
function pushToast(t) {
  const id = Math.random().toString(36).slice(2);
  TOAST_LISTENERS.forEach(fn => fn({ id, ...t }));
}
window.toastOk   = (title, msg) => pushToast({ kind: 'success', title, msg });
window.toastErr  = (title, msg) => pushToast({ kind: 'error', title, msg });
window.toastWarn = (title, msg) => pushToast({ kind: 'warning', title, msg });

function ToastStack() {
  const [items, setItems] = useState([]);
  useEffect(() => {
    const onPush = (t) => {
      setItems(arr => [...arr, t]);
      setTimeout(() => setItems(arr => arr.filter(x => x.id !== t.id)), 4500);
    };
    TOAST_LISTENERS.add(onPush);
    return () => TOAST_LISTENERS.delete(onPush);
  }, []);
  return (
    <div className="toast-stack">
      {items.map(t => (
        <div key={t.id} className={`toast ${t.kind}`}>
          <div className="toast-title">{t.title}</div>
          {t.msg && <div className="toast-msg">{t.msg}</div>}
        </div>
      ))}
    </div>
  );
}

// ════════════════════════════════════════════════════════════════
// Modal "Simular paquete completo" — toma TODAS las reglas del
// inversor + últimos 12 meses de data real del negocio y proyecta
// los pagos consolidados mes a mes.
// ════════════════════════════════════════════════════════════════
function SimuladorPaqueteModal({ open, inversor, reglas, onClose }) {
  const data = useATData();
  if (!open || !inversor) return null;

  // Últimos 12 meses de data real
  const ventasReales = (data.ventas || []).filter(v => v.idVenta !== 'V-LEG-0000');
  // Agrupa por mes los ULTIMOS 12
  const mesesData = {};
  ventasReales.forEach(v => {
    const ym = (v.fecha || '').slice(0, 7);
    if (!mesesData[ym]) mesesData[ym] = { ventas: 0, revenue: 0, ganancia: 0, unidades: 0 };
    mesesData[ym].ventas += 1;
    mesesData[ym].revenue += v.precioFacturadoTotal || 0;
    mesesData[ym].ganancia += v.gananciaTotal || 0;
    mesesData[ym].unidades += v.cantidadTotal || 0;
  });
  const mesesArr = Object.keys(mesesData).sort().slice(-12);
  const last12 = mesesArr.map(ym => ({ ym, ...mesesData[ym] }));
  const totalRev = last12.reduce((s, m) => s + m.revenue, 0);
  const totalGan = last12.reduce((s, m) => s + m.ganancia, 0);
  const totalUd = last12.reduce((s, m) => s + m.unidades, 0);
  const totalVentas = last12.reduce((s, m) => s + m.ventas, 0);

  // Para cada mes, calcula el pago PER REGLA + consolidado
  const capital = Number(inversor.montoTotal) || 0;
  // Inicializa totales por regla
  const totalPorRegla = {};
  reglas.forEach(r => { totalPorRegla[r.id] = { regla: r, total: 0, esCash: r.tipoCompensacion !== 'REINVERSION' }; });

  const proyeccion = last12.map((m, idx) => {
    const porRegla = {};
    let cash = 0, equity = 0;
    let dividendoMesPagado = 0;

    // Dividendo preferente PRIMERO (orden de prelación)
    reglas.forEach(r => {
      if (r.tipoCompensacion === 'DIVIDENDO_PREFERENTE') {
        const pct = Number(r.pctAplicado || 0) / 100;
        if ((idx + 1) % 3 === 0) {
          const pago = capital * pct / 4;
          porRegla[r.id] = pago;
          cash += pago;
          dividendoMesPagado += pago;
          totalPorRegla[r.id].total += pago;
        } else { porRegla[r.id] = 0; }
      }
    });

    reglas.forEach(r => {
      if (r.tipoCompensacion === 'DIVIDENDO_PREFERENTE') return; // ya procesado
      const pct = Number(r.pctAplicado || 0) / 100;
      const cuota = Number(r.cuotaMensual || 0);
      const monto = Number(r.montoPorUnidad || 0);
      let pago = 0;
      switch (r.tipoCompensacion) {
        case 'ROYALTY_BRUTO':
        case 'RBF':                  pago = m.revenue * pct; cash += pago; break;
        case 'SALARIO_PRO_LABORE':   pago = cuota; cash += pago; break;
        case 'UTILIDADES_SUBORD':    pago = Math.max(0, m.ganancia - dividendoMesPagado) * pct; cash += pago; break;
        case 'COMISION_SKU':         pago = m.unidades * monto; cash += pago; break;
        case 'REINVERSION':          pago = m.ganancia * pct; equity += pago; break;
        case 'CASHFLOW_ANUAL':       if (idx === last12.length - 1) { pago = totalGan * pct; cash += pago; } break;
      }
      porRegla[r.id] = pago;
      totalPorRegla[r.id].total += pago;
    });

    return { ...m, cash, equity, total: cash + equity, porRegla };
  });

  const totalCash = proyeccion.reduce((s, p) => s + p.cash, 0);
  const totalEquity = proyeccion.reduce((s, p) => s + p.equity, 0);

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" style={{ maxWidth: 920 }} onClick={e => e.stopPropagation()}>
        <div className="modal-title">🧮 Simulador del Paquete · {inversor.nombre}</div>

        <div style={{ padding: 'var(--s-3)', background: 'var(--surface-2)', borderRadius: 4, marginBottom: 'var(--s-3)', fontSize: 12, color: 'var(--text-2)' }}>
          Proyección de TODAS las reglas ({reglas.length}) aplicadas a los <b>últimos {last12.length} meses</b> reales del negocio.
          <br /><span style={{ fontSize: 11, color: 'var(--text-3)' }}>{totalVentas} ventas · {totalUd} ud · revenue RD${totalRev.toLocaleString()} · ganancia RD${totalGan.toLocaleString()}</span>
        </div>

        <div className="grid-3" style={{ marginBottom: 'var(--s-3)' }}>
          <div className="stat-card">
            <div className="stat-label">💵 Total cash 12 meses</div>
            <div className="stat-value" style={{ color: 'var(--danger)' }}>{fmtCurrency(totalCash)}</div>
          </div>
          <div className="stat-card">
            <div className="stat-label">📊 Total al equity</div>
            <div className="stat-value" style={{ color: 'var(--success)' }}>+{fmtCurrency(totalEquity)}</div>
          </div>
          <div className="stat-card">
            <div className="stat-label">Promedio cash/mes</div>
            <div className="stat-value">{fmtCurrency(totalCash / Math.max(1, last12.length))}</div>
          </div>
        </div>

        {/* BREAKDOWN POR MÉTODO — qué paga cada regla específicamente */}
        <div className="field-label" style={{ marginTop: 'var(--s-3)', marginBottom: 6 }}>📋 ¿Cuánto paga cada método?</div>
        <div style={{ marginBottom: 'var(--s-3)' }}>
          {Object.values(totalPorRegla).map(({ regla, total, esCash }) => {
            const meta = TIPO_COMPENSACION_META[regla.tipoCompensacion] || { label: regla.tipoCompensacion, color: 'var(--text-3)' };
            const promMensual = total / Math.max(1, last12.length);
            return (
              <div key={regla.id} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: 'var(--s-2)', borderLeft: `4px solid ${meta.color}`, background: 'var(--surface-2)', marginBottom: 4, borderRadius: 3 }}>
                <span className="badge" style={{ background: meta.color, color: 'white', fontSize: 10, fontWeight: 600 }}>{meta.label}</span>
                <span style={{ fontSize: 11, color: 'var(--text-3)' }}>
                  {regla.pctAplicado != null && `${regla.pctAplicado}%`}
                  {regla.cuotaMensual != null && `RD$${Number(regla.cuotaMensual).toLocaleString()}/mes`}
                  {regla.montoPorUnidad != null && `RD$${Number(regla.montoPorUnidad).toLocaleString()}/u`}
                  {regla.capDevolver != null && ` · cap ${fmtCurrency(regla.capDevolver)}`}
                </span>
                <span style={{ flex: 1 }}></span>
                <span style={{ fontSize: 10, color: 'var(--text-3)' }}>
                  prom/mes: <b style={{ color: 'var(--text-2)' }}>{fmtCurrency(promMensual)}</b>
                </span>
                <span style={{ fontSize: 13, fontWeight: 600, color: esCash ? 'var(--danger)' : 'var(--success)', minWidth: 100, textAlign: 'right' }}>
                  {esCash ? '💵 ' : '📊 +'}{fmtCurrency(total)}
                </span>
              </div>
            );
          })}
        </div>

        <div className="field-label" style={{ marginBottom: 6 }}>📅 Mes a mes</div>
        <div style={{ maxHeight: 280, overflowY: 'auto', border: '1px solid var(--border)', borderRadius: 4 }}>
          <table className="data" style={{ fontSize: 11 }}>
            <thead style={{ position: 'sticky', top: 0, background: 'var(--surface)' }}>
              <tr>
                <th>Mes</th>
                <th className="right">Ventas</th>
                <th className="right">Revenue</th>
                <th className="right">Ganancia</th>
                <th className="right">💵 Cash</th>
                <th className="right">📊 Equity</th>
                <th className="right">Total</th>
              </tr>
            </thead>
            <tbody>
              {proyeccion.map(p => (
                <tr key={p.ym}>
                  <td>{p.ym}</td>
                  <td className="num right">{p.ventas}</td>
                  <td className="num right">{fmtCurrency(p.revenue)}</td>
                  <td className="num right">{fmtCurrency(p.ganancia)}</td>
                  <td className="num right" style={{ color: 'var(--danger)' }}>{fmtCurrency(p.cash)}</td>
                  <td className="num right" style={{ color: 'var(--success)' }}>+{fmtCurrency(p.equity)}</td>
                  <td className="num right"><b>{fmtCurrency(p.total)}</b></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>

        <div className="modal-actions" style={{ marginTop: 'var(--s-3)' }}>
          <button className="btn ghost" onClick={onClose}>Cerrar</button>
        </div>
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════════
// Modal "Registrar pago del mes" — un solo flujo por inversor que
// procesa TODAS las reglas activas (Salario + Comisión + Utilidades…).
// Para REINVERSION incrementa capital del dueño en vez de cash out.
// Para los demás crea un movimiento PAGO_INVERSOR / APORTE_DUENO.
// ════════════════════════════════════════════════════════════════
function PagoMensualModal({ open, inversor, esDueno, reglas, computeDevengado, onClose }) {
  const data = useATData();
  // Cuentas reales de donde puede salir el pago (débito/efectivo).
  const cuentasBanco = (data._cuentas || []).filter(c => c.tipo === 'DEBITO' || c.tipo === 'EFECTIVO');
  // Calcula fecha del próximo pago: día más común entre reglas, o 17 default.
  const diaPagoComun = (() => {
    const dias = reglas.map(r => r.diaPago || 17);
    if (dias.length === 0) return 17;
    // Toma el más frecuente
    const counts = {};
    dias.forEach(d => { counts[d] = (counts[d] || 0) + 1; });
    return parseInt(Object.entries(counts).sort((a, b) => b[1] - a[1])[0][0]);
  })();
  const proximoPago = (() => {
    const hoy = new Date(window.HOY || new Date().toISOString().slice(0, 10));
    const fecha = new Date(hoy.getFullYear(), hoy.getMonth(), diaPagoComun);
    // Si ya pasó este mes, próximo mes
    if (fecha < hoy) fecha.setMonth(fecha.getMonth() + 1);
    return fecha.toISOString().slice(0, 10);
  })();
  // Monto editable por regla, pre-llenado con el devengado.
  const [montos, setMontos] = useState({});
  const [fechaPago, setFechaPago] = useState(proximoPago);
  const [cuenta, setCuenta] = useState('');
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    if (open) {
      const init = {};
      reglas.forEach(r => {
        const dev = computeDevengado(r);
        init[r.id] = dev.generado.toFixed(2);
      });
      setMontos(init);
      // Default de cuenta = la cuenta real (con su acento), priorizando BHD.
      if (!cuenta && cuentasBanco.length) {
        setCuenta((cuentasBanco.find(c => /bhd/i.test(c.nombre)) || cuentasBanco[0]).nombre);
      }
    }
  }, [open, reglas, cuentasBanco.length]);

  if (!open || !inversor) return null;

  const total = reglas.reduce((s, r) => s + (Number(montos[r.id]) || 0), 0);
  const totalCash = reglas.filter(r => r.tipoCompensacion !== 'REINVERSION')
    .reduce((s, r) => s + (Number(montos[r.id]) || 0), 0);
  const totalEquity = reglas.filter(r => r.tipoCompensacion === 'REINVERSION')
    .reduce((s, r) => s + (Number(montos[r.id]) || 0), 0);

  const handlePagar = async () => {
    if (totalCash <= 0 && totalEquity <= 0) {
      window.toastErr('Sin montos a pagar', 'Todos los montos están en 0');
      return;
    }
    setBusy(true);
    try {
      const inversorId = Number(inversor._airtableId.slice(2));
      let cashRegistrados = 0;
      let equityIncrementado = 0;

      for (const r of reglas) {
        const monto = Number(montos[r.id]) || 0;
        if (monto <= 0) continue;
        const m = TIPO_COMPENSACION_META[r.tipoCompensacion] || {};

        if (r.tipoCompensacion === 'REINVERSION') {
          // Incrementa capital_invertido del dueño (no afecta cash)
          equityIncrementado += monto;
        } else {
          // Movimiento cash normal
          const conceptoMap = {
            DIVIDENDO_PREFERENTE: 'Dividendo Preferente',
            ROYALTY_BRUTO:        'Royalty Inversor',
            RBF:                  'Revenue-Based Financing',
            SALARIO_PRO_LABORE:   'Salario Dueño',
            UTILIDADES_SUBORD:    'Reparto Utilidades',
            COMISION_SKU:         'Comisión SKU',
            CASHFLOW_ANUAL:       'Bonus Cashflow Anual',
          };
          const conceptoEspecifico = conceptoMap[r.tipoCompensacion] || m.label;
          const tipo = esDueno ? 'APORTE_DUENO' : 'PAGO_INVERSOR';
          // El concepto base coincide con lo que filtra DetalleInversorMovs
          // ('Aportes para negocio' para dueño, 'Pago a Inversores' para inversor).
          // El método específico va en notas como tag para resolverlo después.
          await window.AT_CLIENT.create('cashflow', {
            fecha: fechaPago,
            cuenta,
            concepto: esDueno ? 'Aportes para negocio' : 'Pago a Inversores',
            tipo,
            auxiliar: inversor.nombre,
            entrada: esDueno ? monto : 0,
            salida:  esDueno ? 0 : monto,
            notas: `${conceptoEspecifico} · regla #${r.id}`,
          });
          cashRegistrados += monto;
        }
      }

      // Incrementar capital del dueño si hubo reinversión
      if (equityIncrementado > 0) {
        const nuevoCapital = (Number(inversor.montoTotal) || 0) + equityIncrementado;
        await window.AT_CLIENT.updateInversor(inversorId, {
          capitalInvertido: nuevoCapital,
        });
      }

      // Re-fetch para que los movimientos recién creados (con su tag "regla #ID"
      // en notas) entren al cache local y computePagado/historial los reflejen
      // sin tener que refrescar a mano.
      await window.AT_CLIENT.loadCashflow?.();
      await window.AT_CLIENT.loadFinanciero?.();

      const msg = [];
      if (cashRegistrados > 0) msg.push(`Cash RD$${cashRegistrados.toLocaleString()}`);
      if (equityIncrementado > 0) msg.push(`Equity +RD$${equityIncrementado.toLocaleString()}`);
      window.toastOk('Pago registrado', `${inversor.nombre} · ${msg.join(' · ')}`);
      onClose?.();
    } catch (e) { window.toastErr('Error al pagar', e.message?.slice(0, 120)); }
    setBusy(false);
  };

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" style={{ maxWidth: 720 }} onClick={e => e.stopPropagation()}>
        <div className="modal-title">💸 Registrar pago del mes · {inversor.nombre}</div>

        <div style={{ padding: 'var(--s-3)', background: 'var(--surface-2)', borderRadius: 4, marginBottom: 'var(--s-3)', fontSize: 12, color: 'var(--text-2)' }}>
          Cada monto está pre-llenado con lo <b>devengado a hoy</b>. Editás si querés pagar menos/más.
          Las reglas de tipo <b>Reinversión</b> no salen del banco — se suman al capital del dueño.
        </div>

        <div className="row-2" style={{ marginBottom: 'var(--s-3)' }}>
          <div className="field">
            <div className="field-label">Fecha del pago</div>
            <input className="input num" type="date" value={fechaPago} onChange={e => setFechaPago(e.target.value)} />
            <div className="field-hint">Sugerido: día {diaPagoComun} (configurable por regla con ✎)</div>
          </div>
          <div className="field">
            <div className="field-label">Cuenta origen</div>
            <select className="select" value={cuenta} onChange={e => setCuenta(e.target.value)}>
              {cuentasBanco.length === 0 && <option value="">(sin cuentas)</option>}
              {cuentasBanco.map(c => <option key={c.id} value={c.nombre}>{c.nombre} ({c.tipo})</option>)}
            </select>
          </div>
        </div>

        <div className="field-label" style={{ marginBottom: 8 }}>Reglas a pagar ({reglas.length})</div>
        {reglas.map(r => {
          const m = TIPO_COMPENSACION_META[r.tipoCompensacion] || {};
          const dev = computeDevengado(r);
          const esReinv = r.tipoCompensacion === 'REINVERSION';
          return (
            <div key={r.id} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: 'var(--s-2)', borderLeft: `3px solid ${m.color}`, background: 'var(--surface-2)', marginBottom: 4, borderRadius: 3 }}>
              <div style={{ flex: 1 }}>
                <span className="badge" style={{ background: m.color, color: 'white', fontSize: 10, marginRight: 6 }}>{m.label}</span>
                <span style={{ fontSize: 11, color: 'var(--text-3)' }}>{dev.detalle}</span>
              </div>
              {esReinv && <span className="badge" style={{ background: 'var(--warning)', color: 'var(--bg)', fontSize: 9 }}>→ capital</span>}
              <input className="input num" type="number" style={{ width: 120 }}
                value={montos[r.id] ?? ''} onChange={e => setMontos({ ...montos, [r.id]: e.target.value })} />
            </div>
          );
        })}

        <div style={{ marginTop: 'var(--s-3)', padding: 'var(--s-3)', background: 'var(--surface-2)', borderRadius: 4 }}>
          <div className="grid-3" style={{ fontSize: 12 }}>
            <div><span className="muted">💵 A salir del banco:</span> <b style={{ color: 'var(--danger)' }}>{fmtCurrency(totalCash)}</b></div>
            <div><span className="muted">📊 Al capital dueño:</span> <b style={{ color: 'var(--success)' }}>+{fmtCurrency(totalEquity)}</b></div>
            <div><span className="muted">Total devengado:</span> <b>{fmtCurrency(total)}</b></div>
          </div>
        </div>

        <div className="modal-actions" style={{ marginTop: 'var(--s-3)' }}>
          <button className="btn ghost" disabled={busy} onClick={onClose}>Cancelar</button>
          <button className="btn" disabled={busy} onClick={handlePagar}>{busy ? 'Procesando…' : `Confirmar pago · ${fmtCurrency(total)}`}</button>
        </div>
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════════
// Lista de reglas de compensación por inversor (multi-comp)
// ════════════════════════════════════════════════════════════════
// Permite ver/agregar/borrar reglas. Filtra ownerOnly segun esDueno.
function ReglasCompensacionList({ inversor, esDueno }) {
  const data = useATData();
  const reglas = inversor.compensaciones || [];
  const [busy, setBusy] = useState(false);
  const [simReglaId, setSimReglaId] = useState(null);
  const [editReglaId, setEditReglaId] = useState(null);
  const [pagoOpen, setPagoOpen] = useState(false);
  const [simPaqueteOpen, setSimPaqueteOpen] = useState(false);

  const handleRemove = async (reglaId) => {
    if (!confirm(`¿Borrar esta regla de compensación? La data histórica de pagos no se pierde.`)) return;
    try {
      await window.AT_CLIENT.removeCompensacion(reglaId);
      window.toastOk('Regla eliminada', '');
    } catch (e) { window.toastErr('No se pudo borrar', e.message?.slice(0, 120)); }
  };

  // Aplicar Paquete completo: crea las 3 reglas Inversor o 5 reglas Dueño de una.
  const handleApplyPaquete = async () => {
    const paquete = esDueno ? 'Dueño' : 'Inversor';
    const preset = PAQUETES_PRESETS[paquete];
    const capital = Number(inversor.montoTotal) || 50000;
    if (!confirm(`¿Aplicar Paquete ${paquete} a ${inversor.nombre}?\n\nCrea ${preset.length} reglas activas en paralelo. Puedes editar los % después.`)) return;
    setBusy(true);
    try {
      const inversorId = Number(inversor._airtableId.slice(2));
      for (const rule of preset) {
        // Inyectar cap default según tipo
        const rcopy = { ...rule };
        if (rule.tipoCompensacion === 'ROYALTY_BRUTO' && rcopy.capDevolver == null) rcopy.capDevolver = capital * 0.5;
        if (rule.tipoCompensacion === 'RBF' && rcopy.capDevolver == null) rcopy.capDevolver = capital * 2;
        await window.AT_CLIENT.createCompensacion(inversorId, rcopy);
      }
      window.toastOk(`Paquete ${paquete} aplicado`, `${preset.length} reglas creadas a ${inversor.nombre}`);
    } catch (e) { window.toastErr('No se pudo aplicar paquete', e.message?.slice(0, 120)); }
    setBusy(false);
  };

  // Capital del inversor (para reglas que lo usan, ej. DIVIDENDO_PREFERENTE)
  const capital = Number(inversor.montoTotal) || 0;
  const HOY_REAL = new Date(window.HOY || new Date().toISOString().slice(0, 10));

  // ─── Fecha de corte configurable ───────────────────────────────────────
  // El devengado/pagable se calcula hasta el ÚLTIMO corte que ya pasó (no hasta
  // hoy). Así las ventas posteriores al corte NO mueven el monto a pagar: el
  // número queda "congelado" hasta el próximo corte. Día global, en localStorage.
  const [diasAntesCorte, setDiasAntesCorte] = useState(() => {
    const stored = localStorage.getItem('comp-dias-antes-corte');
    if (stored == null || stored === '') return 5;   // default: corte 5 días antes del pago
    const v = Number(stored);
    return v >= 0 && v <= 28 ? v : 5;
  });
  const setDiasAntesCorteSafe = (v) => {
    const n = Math.max(0, Math.min(28, Number(v) || 0));
    setDiasAntesCorte(n); localStorage.setItem('comp-dias-antes-corte', String(n));
  };
  // Corte de una regla = (su día de pago − N días), el más reciente que ya pasó.
  // Así el monto se "congela" N días antes de pagar; las ventas de esos últimos
  // días cuentan para el próximo ciclo.
  const corteDeRegla = (regla) => {
    const diaPago = (regla && regla.diaPago) || 17;
    const diaC = Math.max(1, diaPago - diasAntesCorte);
    const clampDia = (yy, mm) => Math.min(diaC, new Date(yy, mm + 1, 0).getDate());
    const y = HOY_REAL.getFullYear(), mo = HOY_REAL.getMonth(), d = HOY_REAL.getDate();
    if (d >= clampDia(y, mo)) return new Date(y, mo, clampDia(y, mo));
    const py = mo === 0 ? y - 1 : y, pm = mo === 0 ? 11 : mo - 1;
    return new Date(py, pm, clampDia(py, pm));
  };

  // ─── Excedente real de un mes (YYYY-MM): ganancia bruta − gastos operativos
  // (ads, comisión, courier, fees, compra operativa) − servicio de deuda.
  // NO resta COGS (compra mercancía / envío de lote ya están en la ganancia)
  // ni movimientos de capital (aportes, transferencias). `hasta` opcional cap
  // las fechas al corte (para el mes parcial del corte).
  const _esGastoOp = (c) => /Pago ADS|Pago Comision|Courier|Compra operativa|Fee bancario|Ajuste/i.test(c || '');
  const computeExcedenteMes = (ym, hasta, desde) => {
    const hastaStr = hasta ? hasta.toISOString().slice(0, 10) : null;
    const desdeStr = desde ? desde.toISOString().slice(0, 10) : null;
    const okFecha = (f) => typeof f === 'string' && f.slice(0, 7) === ym
      && (!hastaStr || f <= hastaStr) && (!desdeStr || f >= desdeStr);
    const ganancia = (data.ventas || []).filter(v => okFecha(v.fecha))
      .reduce((s, v) => s + (v.gananciaTotal || 0), 0);
    const cfMes = (data.cashflow || []).filter(m => okFecha(m.f));
    const gastosOp = cfMes.filter(m => (m.s || 0) > 0 && m._naturaleza === 'CASHFLOW'
        && _esGastoOp(m.c) && !(typeof m.notas === 'string' && /regla #/.test(m.notas)))
      .reduce((s, m) => s + (m.s || 0), 0);
    const deuda = cfMes.filter(m => (m.s || 0) > 0 && m._naturaleza === 'FINANCIERO')
      .reduce((s, m) => s + (m.s || 0), 0);
    return ganancia - gastosOp - deuda;
  };

  // ─── Computa "monto pagado a fecha" por regla (filtra cashflow por notas) ──
  // Cuando PagoMensualModal crea movimientos, mete "regla #ID" en las notas.
  // Eso es nuestro tag para asociar movimientos a su regla origen.
  const computePagado = (regla) => {
    const movs = (data.cashflow || []).filter(m =>
      typeof m.notas === 'string' && m.notas.includes(`regla #${regla.id}`)
    );
    const cashOut = movs.reduce((s, m) => s + (m.s || 0), 0); // pagos inversor
    const cashIn  = movs.reduce((s, m) => s + (m.e || 0), 0); // aportes dueño
    return { pagado: cashOut + cashIn, count: movs.length };
  };

  // ─── Computa "monto generado a fecha" automatico por regla ───
  const computeDevengado = (regla) => {
    const corteFecha = corteDeRegla(regla);
    const tipo = regla.tipoCompensacion;
    const pct = Number(regla.pctAplicado || 0) / 100;
    const cuota = Number(regla.cuotaMensual || 0);
    const cap = Number(regla.capDevolver || regla.montoPactado || 0);
    const montoPorUnidad = Number(regla.montoPorUnidad || 0);
    const inicio = regla.fechaInicio ? new Date(regla.fechaInicio) : (inversor.fechaInicio ? new Date(inversor.fechaInicio) : null);
    if (!inicio) return { generado: 0, detalle: 'Sin fecha de inicio' };
    // Calcula HASTA el corte (no hasta hoy) → monto a pagar estable.
    const ms = corteFecha - inicio;
    const dias = Math.max(0, ms / 86400000);
    const meses = Math.max(0, dias / 30.4);
    const trimestres = Math.floor(meses / 3);
    const años = meses / 12;

    // Ventas dentro del periodo de la regla (inicio → corte)
    const ventas = (data.ventas || []).filter(v => {
      const f = v.fecha ? new Date(v.fecha) : null;
      return f && f >= inicio && f <= corteFecha;
    });
    const revenueDesdeInicio = ventas.reduce((s, v) => s + (v.precioFacturadoTotal || 0), 0);
    const gananciaDesdeInicio = ventas.reduce((s, v) => s + (v.gananciaTotal || 0), 0);
    const unidadesDesdeInicio = ventas.reduce((s, v) => s + (v.cantidadTotal || 0), 0);

    let generado = 0, detalle = '';
    switch (tipo) {
      case 'DIVIDENDO_PREFERENTE':
        generado = capital * pct * (trimestres / 4);
        detalle = `${trimestres} trim × (${capital.toFixed(0)} × ${(pct*100).toFixed(1)}% / 4)`;
        break;
      case 'ROYALTY_BRUTO':
      case 'RBF':
        generado = Math.min(cap || Infinity, revenueDesdeInicio * pct);
        detalle = `${(pct*100).toFixed(1)}% × RD$${revenueDesdeInicio.toFixed(0)} revenue${cap ? ` (cap RD$${cap.toFixed(0)})` : ''}`;
        break;
      case 'SALARIO_PRO_LABORE':
        generado = cuota * meses;
        detalle = `RD$${cuota}/mes × ${meses.toFixed(1)} meses`;
        break;
      case 'UTILIDADES_SUBORD':
        generado = Math.max(0, gananciaDesdeInicio) * pct;
        detalle = `${(pct*100).toFixed(1)}% × RD$${gananciaDesdeInicio.toFixed(0)} utilidad`;
        break;
      case 'COMISION_SKU':
        generado = unidadesDesdeInicio * montoPorUnidad;
        detalle = `${unidadesDesdeInicio} ud × RD$${montoPorUnidad}/u`;
        break;
      case 'REINVERSION':
        generado = gananciaDesdeInicio * pct;
        detalle = `${(pct*100).toFixed(1)}% × RD$${gananciaDesdeInicio.toFixed(0)} (al patrimonio)`;
        break;
      case 'CASHFLOW_ANUAL': {
        // Cuenta años desde fecha_inicio del inversor (Opción C: aniversario).
        // Por cada año completo, suma la ganancia REAL de ese año (no promedio)
        // × pct. Los años parciales no cuentan hasta cierre.
        const yearsCompleted = Math.floor(años);
        let acumulado = 0;
        for (let k = 0; k < yearsCompleted; k++) {
          const desde = new Date(inicio); desde.setFullYear(desde.getFullYear() + k);
          const hasta = new Date(inicio); hasta.setFullYear(hasta.getFullYear() + k + 1);
          const ventasAño = (data.ventas || []).filter(v => {
            const f = v.fecha ? new Date(v.fecha) : null;
            return f && f >= desde && f < hasta;
          });
          const gananciaAño = ventasAño.reduce((s, v) => s + (v.gananciaTotal || 0), 0);
          acumulado += Math.max(0, gananciaAño) * pct;
        }
        generado = acumulado;
        // Próximo cierre fiscal = aniversario siguiente del inicio
        const nextCierre = new Date(inicio);
        nextCierre.setFullYear(nextCierre.getFullYear() + yearsCompleted + 1);
        const nextStr = nextCierre.toISOString().slice(0, 10);
        const diasFaltantes = Math.ceil((nextCierre - HOY_REAL) / 86400000);
        detalle = yearsCompleted > 0
          ? `${yearsCompleted} año(s) cerrados · próximo cierre ${nextStr} (en ${diasFaltantes}d)`
          : `Próximo cierre fiscal: ${nextStr} (en ${diasFaltantes}d) · ${(pct*100).toFixed(0)}% del cashflow`;
        break;
      }
      case 'EXCEDENTE_REAL': {
        // Suma del excedente real de cada mes POSITIVO, desde inicio hasta corte, × pct.
        let acum = 0, mesesPos = 0;
        const cur = new Date(inicio.getFullYear(), inicio.getMonth(), 1);
        while (cur <= corteFecha) {
          const ym = `${cur.getFullYear()}-${String(cur.getMonth() + 1).padStart(2, '0')}`;
          const exc = computeExcedenteMes(ym, corteFecha, inicio);
          if (exc > 0) { acum += exc * pct; mesesPos++; }
          cur.setMonth(cur.getMonth() + 1);
        }
        generado = acum;
        detalle = `${(pct * 100).toFixed(0)}% del excedente (ganancia − gastos − deuda) · ${mesesPos} mes(es) positivo(s)`;
        break;
      }
      default: detalle = '—';
    }
    const esInfoOnly = tipo === 'REINVERSION';
    return { generado, detalle, esInfoOnly };
  };

  // ─── Computa lo generado SOLO en el mes calendario actual (dinámico) ───
  const computeDevengadoMes = (regla) => {
    const corteFecha = corteDeRegla(regla);
    const tipo = regla.tipoCompensacion;
    const pct = Number(regla.pctAplicado || 0) / 100;
    const cuota = Number(regla.cuotaMensual || 0);
    const montoPorUnidad = Number(regla.montoPorUnidad || 0);
    const capitalInv = Number(inversor.montoTotal) || 0;
    // Respeta la fecha de inicio de la regla: si todavía no arranca, no genera nada.
    const inicioRegla = regla.fechaInicio ? new Date(regla.fechaInicio) : (inversor.fechaInicio ? new Date(inversor.fechaInicio) : null);
    if (inicioRegla && inicioRegla > corteFecha) return 0;
    // Ventas desde el 1ro del mes del corte (o desde el arranque de la regla si
    // es más tarde) → fecha de corte.
    const inicioMesRaw = new Date(corteFecha.getFullYear(), corteFecha.getMonth(), 1);
    const inicioMes = (inicioRegla && inicioRegla > inicioMesRaw) ? inicioRegla : inicioMesRaw;
    const vsMes = (data.ventas || []).filter(v => {
      const f = v.fecha ? new Date(v.fecha) : null;
      return f && f >= inicioMes && f <= corteFecha;
    });
    const revMes = vsMes.reduce((s, v) => s + (v.precioFacturadoTotal || 0), 0);
    const ganMes = vsMes.reduce((s, v) => s + (v.gananciaTotal || 0), 0);
    const udMes  = vsMes.reduce((s, v) => s + (v.cantidadTotal || 0), 0);
    switch (tipo) {
      case 'SALARIO_PRO_LABORE':   return cuota;                       // fijo
      case 'UTILIDADES_SUBORD':    return Math.max(0, ganMes) * pct;
      case 'REINVERSION':          return Math.max(0, ganMes) * pct;
      case 'COMISION_SKU':         return udMes * montoPorUnidad;
      case 'ROYALTY_BRUTO':
      case 'RBF':                  return revMes * pct;
      case 'CASHFLOW_ANUAL':       return Math.max(0, ganMes) * pct;   // acumula hacia el cierre
      case 'DIVIDENDO_PREFERENTE': return capitalInv * pct / 12;       // prorrateo mensual del anual
      case 'EXCEDENTE_REAL': {                                          // excedente del mes del corte
        const ym = `${corteFecha.getFullYear()}-${String(corteFecha.getMonth() + 1).padStart(2, '0')}`;
        return Math.max(0, computeExcedenteMes(ym, corteFecha, inicioRegla)) * pct;
      }
      default: return 0;
    }
  };

  // ─── Edit modal state + handler ───
  const editRegla = reglas.find(r => r.id === editReglaId);
  const handleSaveEdit = async (values) => {
    setBusy(true);
    try {
      await window.AT_CLIENT.updateCompensacion(editReglaId, {
        pctAplicado:    values.pctAplicado    === '' ? null : values.pctAplicado,
        cuotaMensual:   values.cuotaMensual   === '' ? null : values.cuotaMensual,
        montoPorUnidad: values.montoPorUnidad === '' ? null : values.montoPorUnidad,
        bonusThreshold: values.bonusThreshold === '' ? null : values.bonusThreshold,
        capDevolver:    values.capDevolver    === '' ? null : values.capDevolver,
        montoPactado:   values.montoPactado   === '' ? null : values.montoPactado,
        diaPago:        values.diaPago        === '' ? 17   : values.diaPago,
      });
      window.toastOk('Regla actualizada', '');
      setEditReglaId(null);
    } catch (e) { window.toastErr('No se pudo actualizar', e.message?.slice(0, 120)); }
    setBusy(false);
  };

  return (
    <div style={{ marginBottom: 'var(--s-3)', padding: 'var(--s-3)', border: '1px solid var(--border)', borderRadius: 4, background: 'var(--surface)' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 'var(--s-2)' }}>
        <div>
          <div className="section-title" style={{ fontSize: 14 }}>📋 Reglas de compensación activas</div>
          <div className="section-desc" style={{ fontSize: 11 }}>
            Paquete {esDueno ? 'Dueño' : 'Inversor'} · {reglas.length} regla(s) · corte{' '}
            <b style={{ color: 'var(--accent)' }}>{diasAntesCorte} días antes del pago</b>{' '}
            <span style={{ color: 'var(--text-4)' }}>(ventas posteriores no afectan)</span>
          </div>
        </div>
        <div style={{ display: 'flex', gap: 8 }}>
          {reglas.length === 0 && (
            <button className="btn" style={{ fontSize: 12, padding: '4px 12px', background: esDueno ? '#7c5cff' : '#0ea5e9' }}
              disabled={busy} onClick={handleApplyPaquete}>
              ✨ Aplicar Paquete {esDueno ? 'Dueño' : 'Inversor'}
            </button>
          )}
          {reglas.length > 0 && (
            <>
              <label title="Días antes del día de pago en que se 'congela' el monto. Las ventas de esos últimos días cuentan para el próximo ciclo."
                style={{ fontSize: 11, color: 'var(--text-3)', display: 'flex', alignItems: 'center', gap: 4 }}>
                ✂️ Corte:
                <input className="input num" type="number" min="0" max="28" value={diasAntesCorte}
                  onChange={e => setDiasAntesCorteSafe(e.target.value)}
                  style={{ width: 48, padding: '2px 6px', fontSize: 12 }} />
                días antes del pago
              </label>
              <button className="btn ghost" style={{ fontSize: 12, padding: '4px 12px' }}
                onClick={() => setSimPaqueteOpen(true)}>
                🧮 Simular paquete
              </button>
              <button className="btn" style={{ fontSize: 12, padding: '4px 12px', background: 'var(--success)' }}
                onClick={() => setPagoOpen(true)}>
                💸 Registrar pago del mes
              </button>
            </>
          )}
        </div>
      </div>

      {reglas.length === 0 && (
        <div className="empty" style={{ padding: 'var(--s-4)' }}>
          Sin reglas configuradas · click "✨ Aplicar Paquete {esDueno ? 'Dueño' : 'Inversor'}"
        </div>
      )}

      {reglas.map(r => {
        const m = TIPO_COMPENSACION_META[r.tipoCompensacion] || { label: r.tipoCompensacion, color: 'var(--text-3)' };
        const dev = computeDevengado(r);
        const pag = computePagado(r);
        const esteMes = computeDevengadoMes(r);
        const pendiente = Math.max(0, dev.generado - pag.pagado);
        const diaPago = r.diaPago || 17;
        // Resumen de parámetros principales (sin truncar descripción)
        const params = [];
        if (r.pctAplicado != null) params.push(`${r.pctAplicado}%`);
        if (r.cuotaMensual != null) params.push(`RD$${Number(r.cuotaMensual).toLocaleString()}/mes`);
        if (r.montoPorUnidad != null) params.push(`RD$${Number(r.montoPorUnidad).toLocaleString()}/u`);
        if (r.bonusThreshold != null) params.push(`Umbral RD$${Number(r.bonusThreshold).toLocaleString()}`);
        if (r.capDevolver != null) params.push(`Cap ${fmtCurrency(r.capDevolver)}`);
        return (
          <div key={r.id} style={{ padding: 'var(--s-3)', borderLeft: `4px solid ${m.color}`, background: 'var(--surface-2)', marginBottom: 8, borderRadius: 4 }}>
            {/* HEADER: badge + parámetros + día pago + acciones */}
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 6 }}>
              <span className="badge" style={{ background: m.color, color: 'white', fontSize: 11, fontWeight: 600, padding: '3px 10px' }}>{m.label}</span>
              <span style={{ fontSize: 12, color: 'var(--text)', fontWeight: 500 }}>{params.join(' · ')}</span>
              <span style={{ flex: 1 }}></span>
              <span style={{ fontSize: 10, color: 'var(--text-3)', display: 'flex', alignItems: 'center', gap: 4 }}>
                📅 paga día <b style={{ color: 'var(--text-2)' }}>{diaPago}</b>
              </span>
              <button className="icon-btn" title="Editar valores" onClick={() => setEditReglaId(r.id)}>✎</button>
              <button className="icon-btn" title="Simular pagos" onClick={() => setSimReglaId(r.id)}>🧮</button>
              <button className="icon-btn danger" title="Eliminar regla" onClick={() => handleRemove(r.id)}>×</button>
            </div>
            {/* DESCRIPTION completa, no truncada */}
            <div style={{ fontSize: 11, color: 'var(--text-3)', marginBottom: 6, lineHeight: 1.4 }}>
              {m.desc}
            </div>
            {/* STATS: Cálculo / Este mes / Devengado / Pagado / Pendiente lado a lado */}
            <div style={{ display: 'grid', gridTemplateColumns: '1.6fr 1fr 1fr 1fr 1fr', gap: 8, padding: 'var(--s-2)', background: 'var(--surface)', borderRadius: 3 }}>
              <div>
                <div style={{ fontSize: 9, textTransform: 'uppercase', color: 'var(--text-3)', letterSpacing: '0.05em' }}>Cálculo al corte</div>
                <div style={{ fontSize: 11, color: 'var(--text-2)', marginTop: 2 }}>{dev.detalle}</div>
              </div>
              <div>
                <div style={{ fontSize: 9, textTransform: 'uppercase', color: 'var(--text-3)', letterSpacing: '0.05em' }}>📈 Este mes</div>
                <div style={{ fontSize: 14, color: 'var(--text)', fontWeight: 600, marginTop: 2 }}>{fmtCurrency(esteMes)}</div>
              </div>
              <div>
                <div style={{ fontSize: 9, textTransform: 'uppercase', color: 'var(--text-3)', letterSpacing: '0.05em' }}>
                  {dev.esInfoOnly ? '📊 Acumulado' : '💰 Devengado'}
                </div>
                <div style={{ fontSize: 14, color: m.color, fontWeight: 600, marginTop: 2 }}>{fmtCurrency(dev.generado)}</div>
              </div>
              <div>
                <div style={{ fontSize: 9, textTransform: 'uppercase', color: 'var(--text-3)', letterSpacing: '0.05em' }}>
                  {dev.esInfoOnly ? '🔄 Reinvertido' : '✓ Pagado'}{pag.count > 0 && ` (${pag.count})`}
                </div>
                <div style={{ fontSize: 14, color: 'var(--success)', fontWeight: 600, marginTop: 2 }}>{fmtCurrency(pag.pagado)}</div>
              </div>
              <div>
                <div style={{ fontSize: 9, textTransform: 'uppercase', color: 'var(--text-3)', letterSpacing: '0.05em' }}>
                  {dev.esInfoOnly ? 'Capital sumado' : '⏳ Pendiente'}
                </div>
                <div style={{ fontSize: 14, color: pendiente > 0 ? 'var(--warning)' : 'var(--text-3)', fontWeight: 600, marginTop: 2 }}>
                  {dev.esInfoOnly ? fmtCurrency(pag.pagado) : fmtCurrency(pendiente)}
                </div>
              </div>
            </div>
          </div>
        );
      })}

      {/* Modal de edicion para una regla */}
      {editRegla && (() => {
        const m = TIPO_COMPENSACION_META[editRegla.tipoCompensacion] || {};
        const editFields = [];
        if ((m.fields || []).includes('pct')) editFields.push({ name: 'pctAplicado', label: '% aplicado', type: 'number', value: editRegla.pctAplicado ?? '' });
        if ((m.fields || []).includes('cuotaMensual')) editFields.push({ name: 'cuotaMensual', label: 'Cuota mensual (RD$)', type: 'number', value: editRegla.cuotaMensual ?? '' });
        if ((m.fields || []).includes('montoPorUnidad')) editFields.push({ name: 'montoPorUnidad', label: 'Monto por unidad (RD$)', type: 'number', value: editRegla.montoPorUnidad ?? '' });
        if ((m.fields || []).includes('cap')) editFields.push({ name: 'capDevolver', label: 'Cap máximo (RD$)', type: 'number', value: editRegla.capDevolver ?? '' });
        if ((m.fields || []).includes('bonusThreshold')) editFields.push({ name: 'bonusThreshold', label: 'Umbral bonus (RD$)', type: 'number', value: editRegla.bonusThreshold ?? '' });
        if ((m.fields || []).includes('retorno')) editFields.push({ name: 'montoPactado', label: 'Monto target (RD$)', type: 'number', value: editRegla.montoPactado ?? '' });
        // Día de pago: 1-28 (todos los meses tienen esos días)
        editFields.push({ name: 'diaPago', label: 'Día del mes (1-28)', type: 'number', value: editRegla.diaPago ?? 17 });
        if (editFields.length === 1) editFields.unshift({ name: '_info', label: 'Sin parámetros numéricos', value: 'Esta regla solo permite editar el día de pago.' });
        return <EditModal open={true} title={`Editar regla · ${m.label}`}
          fields={editFields} busy={busy}
          onCancel={() => setEditReglaId(null)} onSave={handleSaveEdit} />;
      })()}

      {simReglaId && (() => {
        const r = reglas.find(x => x.id === simReglaId);
        if (!r) return null;
        return <SimuladorModal open={true} tipo={r.tipoCompensacion}
          params={{ pct: r.pctAplicado, cuotaMensual: r.cuotaMensual, bonusThreshold: r.bonusThreshold, cap: r.capDevolver, montoPorUnidad: r.montoPorUnidad, retorno: r.montoPactado, montoPactado: r.montoPactado, capital: capital }}
          onClose={() => setSimReglaId(null)} />;
      })()}

      <PagoMensualModal open={pagoOpen} inversor={inversor} esDueno={esDueno}
        reglas={reglas} computeDevengado={computeDevengado}
        onClose={() => setPagoOpen(false)} />

      <SimuladorPaqueteModal open={simPaqueteOpen} inversor={inversor}
        reglas={reglas} onClose={() => setSimPaqueteOpen(false)} />
    </div>
  );
}

// ════════════════════════════════════════════════════════════════
// Simulador de compensación · proyecta pagos según método + escenario
// ════════════════════════════════════════════════════════════════
// Toma un tipo de compensación + parámetros + escenario de ventas
// y devuelve una proyección mes a mes hasta cerrar el cap (o 36 meses
// si no hay cap). Pura lógica + UI inline, sin DB.
function simularPagos(tipo, params, escenario) {
  const capital     = Number(escenario.capital || params.capital || 0);
  const cap         = Number(escenario.cap || params.cap || params.montoPactado || 0);
  const ventasMes   = Number(escenario.ventasMes  || 0);
  const ticketProm  = Number(escenario.ticketProm || 0);
  const margen      = Number(escenario.margen     || 0) / 100;
  const revenueMes  = ventasMes * ticketProm;
  const gananciaMes = revenueMes * margen;
  const pct         = Number(params.pct || 0) / 100;
  const cuotaFija   = Number(params.cuotaMensual || 0);
  // Dividendo preferente pagado este mes (para subordinacion del dueño)
  const dividendoMes = Number(escenario.dividendoPrefMes || 0);

  // Calcula pago para mes N (1-indexed) y meta (descripcion del calculo)
  const pagoMes = (mes) => {
    switch (tipo) {
      // ──── PAQUETE INVERSOR ────
      case 'DIVIDENDO_PREFERENTE': {
        // Trimestral: paga en meses 3,6,9,12... = capital × pct/4
        const esTrimestre = mes % 3 === 0;
        return esTrimestre ? capital * pct / 4 : 0;
      }
      case 'ROYALTY_BRUTO':         return revenueMes * pct;  // hasta cap (porcion del capital)
      case 'RBF':                   return revenueMes * pct;  // hasta cap (default 2x capital)

      // ──── PAQUETE DUEÑO ────
      case 'SALARIO_PRO_LABORE':    return cuotaFija;
      case 'UTILIDADES_SUBORD':     return Math.max(0, gananciaMes - dividendoMes) * pct;
      case 'COMISION_SKU':          return ventasMes * Number(params.montoPorUnidad || 0);
      case 'REINVERSION':           return 0; // va al equity, no cash al dueño
      case 'CASHFLOW_ANUAL': {
        // Una vez al año en mes 12: % del cashflow positivo acumulado
        if (mes !== 12) return 0;
        const cashflowAnual = gananciaMes * 12; // proxy del cashflow operativo
        return Math.max(0, cashflowAnual) * pct;
      }
      default: return 0;
    }
  };

  // ¿Esta regla tiene cap (termina al alcanzarlo)?
  const tieneCap = ['ROYALTY_BRUTO', 'RBF'].includes(tipo) && cap > 0;
  // Frecuencia de visualizacion
  const esAnual = tipo === 'CASHFLOW_ANUAL';
  const maxMeses = tieneCap ? 120 : (esAnual ? 36 : 24);

  const rows = [];
  let acumulado = 0;
  let mesesAlCierre = null;
  for (let m = 1; m <= maxMeses; m++) {
    let pago = pagoMes(m);
    if (tieneCap && acumulado + pago > cap) pago = Math.max(0, cap - acumulado);
    acumulado += pago;
    rows.push({ mes: m, pago, acumulado });
    if (tieneCap && acumulado >= cap && mesesAlCierre == null) {
      mesesAlCierre = m;
      break;
    }
  }

  // Para REINVERSION el "valor" agregado al patrimonio por mes
  const reinversionMes = tipo === 'REINVERSION' ? gananciaMes * pct : 0;

  return {
    rows,
    cap,
    capital,
    mesesAlCierre,
    pagoMesPromedio: rows.length > 0 ? acumulado / rows.length : 0,
    pagoMes1: rows.find(r => r.pago > 0)?.pago || rows[0]?.pago || 0,
    pagoMes12: rows.slice(0, 12).reduce((s, r) => s + r.pago, 0),
    totalProyectado: acumulado,
    sinCap: !tieneCap,
    esAnual,
    esInfoOnly: tipo === 'REINVERSION',
    reinversionMes,
  };
}

function SimuladorModal({ open, tipo, params, onClose }) {
  const data = useATData();
  const meta = TIPO_COMPENSACION_META[tipo];
  const example = meta?.simExample || {};

  // Calcula defaults REALES desde la data del negocio (no del ejemplo).
  // Ventas/mes promedio = ventas totales / # meses con ventas.
  // Ticket promedio = revenue total / # ventas.
  // Margen promedio = ganancia / revenue × 100.
  const realDefaults = useMemo(() => {
    const ventas = data.ventas || [];
    const ventasReales = ventas.filter(v => v.idVenta !== 'V-LEG-0000');
    if (ventasReales.length === 0) return null;
    const revenue   = ventasReales.reduce((s, v) => s + (v.precioFacturadoTotal || 0), 0);
    const ganancia  = ventasReales.reduce((s, v) => s + (v.gananciaTotal || 0), 0);
    const mesesUnicos = new Set(ventasReales.map(v => (v.fecha || '').slice(0, 7))).size;
    const nMeses = Math.max(1, mesesUnicos);
    // Drawdown promedio: salidas APORTE_DUENO si las hay (raro), o fallback
    // Gasto promedio: salidas operativas mensuales / nMeses
    const cf = data.cashflow || [];
    const gastosOp = cf.filter(m => m.s > 0 && /pago|gasto|compra|envio|courier/i.test(m.c || ''));
    const gastoPromMensual = gastosOp.length > 0
      ? gastosOp.reduce((s, m) => s + (m.s || 0), 0) / nMeses
      : 0;
    return {
      ventasMes:   ventasReales.length / nMeses,
      ticketProm:  revenue / ventasReales.length,
      margen:      revenue > 0 ? (ganancia / revenue) * 100 : 0,
      drawdownProm: gastoPromMensual / 5,   // estimación conservadora

const PERIOD_PRESETS = [
  { id: 'todo',  l: 'TODO' },
  { id: 'd:7',   l: '7D'   },
  { id: 'd:30',  l: '30D'  },
  { id: 'd:90',  l: '90D'  },
  { id: 'd:180', l: '6M'   },
  { id: 'd:365', l: '1A'   },
];
// Genera lista de meses con data: recorre todas las fechas conocidas
// (ventas + cashflow) y produce ['2026-05', '2026-04', ...] del más
// reciente al más antiguo.
function _availableMonths() {
  const set = new Set();
  const add = (d) => { if (d && typeof d === 'string' && d.length >= 7) set.add(d.slice(0, 7)); };
  (window.__AIRTABLE_DATA__?.ventas   || []).forEach(v => add(v.fecha));
  (window.__AIRTABLE_DATA__?.cashflow || []).forEach(m => add(m.f));
  // Asegurar que el mes actual aparezca aunque no haya transacciones todavía.
  const today = window.HOY || new Date().toISOString().slice(0, 10);
  add(today);
  return [...set].sort().reverse();
}
const MES_NAMES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
function _fmtMonth(ym) {
  const [y, m] = ym.split('-');
  return `${MES_NAMES[parseInt(m, 10) - 1]} ${y.slice(2)}`;
}
function PeriodFilter({ value, onChange }) {
  const [showPicker, setShowPicker] = useState(false);
  const [showMonths, setShowMonths] = useState(false);
  const isCustom = typeof value === 'string' && value.startsWith('custom');
  const isMonth  = typeof value === 'string' && value.startsWith('mes:');
  const customParts = isCustom ? value.split(':') : [];
  const [from, setFrom] = useState(customParts[1] || (window.HOY || new Date().toISOString().slice(0,10)));
  const [to,   setTo]   = useState(customParts[2] || (window.HOY || new Date().toISOString().slice(0,10)));

  // Recomputar cuando cambien data: usar el hook reactivo de tablas como trigger.
  const dataVentas = useATData().ventas || [];
  const dataCF     = useATData().cashflow || [];
  const months = useMemo(() => _availableMonths(), [dataVentas.length, dataCF.length, value]);

  const apply = () => {
    if (from && to && from <= to) {
      onChange(`custom:${from}:${to}`);
      setShowPicker(false);
    }
  };

  return (
    <div style={{ position: 'relative' }}>
      <div className="period-bar">
        {PERIOD_PRESETS.map(p => (
          <button key={p.id} className={value === p.id ? 'active' : ''}

        <button className={isMonth ? 'active' : ''} onClick={() => { setShowMonths(s => !s); setShowPicker(false); }}>
          {isMonth ? _fmtMonth(value.slice(4)).toUpperCase() : 'MES ▾'}
        </button>
        <button className={isCustom ? 'active' : ''} onClick={() => { setShowPicker(s => !s); setShowMonths(false); }}>

        </button>
      </div>

      {showMonths && (

        }}>
          {months.length === 0 && <div className="muted" style={{ padding: 8, fontSize: 12 }}>Sin datos</div>}
          {months.map(ym => (

              style={{

                fontWeight: value === `mes:${ym}` ? 600 : 500,
                cursor: 'pointer', fontSize: 12, borderRadius: 4,
              }}

              onMouseLeave={e => e.currentTarget.style.background = 'transparent'}
              onClick={() => { onChange(`mes:${ym}`); setShowMonths(false); }}>
              {_fmtMonth(ym)}
            </button>
          ))}
        </div>
      )}

      {showPicker && (
        <div style={{
          position: 'absolute', top: '100%', right: 0, marginTop: 6, zIndex: 60,
          background: 'var(--surface)', border: '1px solid var(--border)',
          borderRadius: 'var(--r-md)', padding: 'var(--s-3)',
          boxShadow: '0 4px 16px rgba(0,0,0,.15)',
          display: 'flex', gap: 8, alignItems: 'flex-end',
        }}>
          <div className="field">
            <div className="field-label">Desde</div>
            <input className="input num" type="date" value={from} onChange={e => setFrom(e.target.value)} />
          </div>
          <div className="field">
            <div className="field-label">Hasta</div>
            <input className="input num" type="date" value={to} onChange={e => setTo(e.target.value)} />
          </div>
          <button className="btn" disabled={!(from && to && from <= to)} onClick={apply}>Aplicar</button>
          <button className="btn ghost" onClick={() => setShowPicker(false)}>×</button>
        </div>
      )}
    </div>
  );
}
function periodToRange(p) {
  if (!p || p === 'todo') return null;
  const todayReal = window.HOY || new Date().toISOString().slice(0, 10);

  // d:N → últimos N días incluyendo hoy
  if (p.startsWith('d:')) {
    const dias = parseInt(p.slice(2));
    const desde = new Date(todayReal);
    desde.setDate(desde.getDate() - (dias - 1));
    return { from: desde.toISOString().slice(0, 10), to: todayReal };
  }

  // mes:YYYY-MM → primer al último día del mes calendario indicado
  if (p.startsWith('mes:')) {
    const [y, m] = p.slice(4).split('-').map(Number);
    if (!y || !m) return null;
    const first = new Date(y, m - 1, 1);
    const last  = new Date(y, m, 0); // día 0 del mes siguiente = último del actual
    return {
      from: first.toISOString().slice(0, 10),
      to:   last.toISOString().slice(0, 10),
    };
  }

  // custom:YYYY-MM-DD:YYYY-MM-DD
  if (p.startsWith('custom:')) {
    const [, from, to] = p.split(':');
    if (from && to) return { from, to };
  }

  return null;
}
function filterByPeriod(arr, period, dateKey = 'f') {
  const range = periodToRange(period);
  if (!range) return arr;
  return arr.filter(r => r[dateKey] >= range.from && r[dateKey] <= range.to);
}
