<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>JAMC's Tech · v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
  /* ════════════════════════════════════════════════════════════════
     Design tokens — Modern data dashboard (inspired by Linear/Stripe)
     Mantiene oscuro pero con grises más sofisticados, menos contraste
     duro, tipografía Inter (system) + mono solo para números/IDs.
     ════════════════════════════════════════════════════════════════ */
  :root {
    /* Surfaces — niveles de elevación sutiles */
    --bg:        #0a0a0c;          /* page background */
    --surface:   #111114;          /* card background */
    --surface-2: #15151a;          /* hover / nested */
    --surface-3: #1c1c22;          /* dropdown / popover */
    --border:    #1f1f25;          /* subtle borders */
    --border-2:  #2a2a32;          /* stronger borders */

    /* Text */
    --text:      #ededf0;          /* primary */
    --text-2:    #a8a8b3;          /* secondary */
    --text-3:    #6b6b78;          /* tertiary / labels */
    --text-4:    #3f3f4a;          /* disabled / placeholder */

    /* Brand & semantic */
    --accent:    #7c9aff;          /* primary action (cool blue, calm) */
    --accent-2:  #5e7fea;
    --success:   #5fce8d;          /* positive, gains */
    --warning:   #f0b658;          /* warnings, attention */
    --danger:    #ef6b7e;          /* losses, critical */
    --muted-pos: #4a8b6c;          /* desaturated positive */
    --muted-neg: #8b4a5a;

    /* Typography */
    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;

    /* Spacing scale (4pt system) */
    --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px;
    --s-5: 24px; --s-6: 32px; --s-7: 48px; --s-8: 64px;

    /* Radius */
    --r-sm: 6px; --r-md: 8px; --r-lg: 12px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow-x: hidden; }
  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    font-feature-settings: 'tnum', 'cv11';
    font-size: 14px;
    line-height: 1.5;
  }

  /* Number formatting — tabular figures */
  .num { font-family: var(--font-mono); font-feature-settings: 'tnum'; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 6px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-4); }

  /* ────────── Layout shell ────────── */
  .app { display: flex; height: 100vh; overflow: hidden; }
  .app > aside.nav { transition: width 220ms ease, flex-basis 220ms ease; box-sizing: border-box; height: 100vh; overflow: visible; }
  .app > main { flex: 1 1 auto; min-width: 0; height: 100vh; overflow-y: auto; overflow-x: hidden; }
  .app.collapsed .brand > div:not(.brand-mark) { display: none; }
  .app.collapsed .nav-section-label { opacity: 0; height: 0; padding: 0; overflow: hidden; }
  .app.collapsed .nav-item > span:not(.nav-item-icon) { display: none; }
  .app.collapsed .nav-item-badge { position: absolute; top: 2px; right: 2px; padding: 0 4px; font-size: 9px; }
  .app.collapsed .nav-item { justify-content: center; padding: 8px 4px; position: relative; }
  .app.collapsed .nav { padding: var(--s-3) var(--s-2); }
  .app.collapsed .brand { justify-content: center; padding: 0 0 var(--s-3) 0; }
  .app.collapsed aside > div[style*="margin-top: auto"] { display: none; }
  .nav-toggle {
    position: absolute; right: -10px; top: 22px; z-index: 10;
    width: 20px; height: 20px; border-radius: 50%; background: var(--surface);
    border: 1px solid var(--border); display: grid; place-items: center;
    cursor: pointer; font-size: 11px; color: var(--text-2);
    transition: all 120ms ease;
  }
  .nav-toggle:hover { background: var(--surface-2); color: var(--text); border-color: var(--accent); }

  /* Sidebar */
  .nav {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: var(--s-5) var(--s-3);
    display: flex; flex-direction: column; gap: var(--s-1);
    position: sticky; top: 0; height: 100vh;
  }
  .brand {
    display: flex; align-items: center; gap: var(--s-3);
    padding: 0 var(--s-3) var(--s-4) var(--s-3);
    margin-bottom: var(--s-4);
    border-bottom: 1px solid var(--border);
  }
  .brand-mark {
    width: 28px; height: 28px; border-radius: var(--r-sm);
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center;
    font-weight: 700; color: white; font-size: 13px;
  }
  .brand-text { font-weight: 600; font-size: 13px; letter-spacing: -0.01em; }
  .brand-sub { font-size: 11px; color: var(--text-3); margin-top: -2px; }

  .nav-section-label {
    font-size: 10px; color: var(--text-3); text-transform: uppercase;
    letter-spacing: 0.08em; padding: var(--s-4) var(--s-3) var(--s-2);
  }
  .nav-item {
    display: flex; align-items: center; gap: var(--s-3);
    padding: 8px var(--s-3); border-radius: var(--r-sm);
    color: var(--text-2); cursor: pointer; user-select: none;
    font-size: 13px; font-weight: 500;
    transition: background 120ms ease, color 120ms ease;
  }
  .nav-item:hover { background: var(--surface-2); color: var(--text); }
  .nav-item.active { background: var(--surface-2); color: var(--text); }
  .nav-item.active::before {
    content: ''; position: absolute; left: 0; width: 3px; height: 18px;
    background: var(--accent); border-radius: 0 2px 2px 0;
  }
  .nav-item-icon { font-size: 14px; opacity: 0.7; width: 16px; text-align: center; }
  .nav-item-badge {
    margin-left: auto; font-size: 10px;
    background: var(--surface-3); color: var(--text-3);
    padding: 1px 6px; border-radius: 4px;
    font-family: var(--font-mono);
  }

  /* Main content */
  .main { padding: 0 var(--s-6) var(--s-5); width: 100%; }
  /* Asegurar que tablas y secciones ocupen el ancho disponible */
  .section table.data { width: 100%; }
  .section { width: 100%; }
  /* SVG charts responsivos: max-width 100% para que escalen al contenedor */
  .section svg { max-width: 100%; height: auto; display: block; }
  /* Tablas con scroll horizontal si exceden — evita columnas cortadas */
  .section { overflow-x: auto; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: var(--s-6);
  }
  .topbar h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
  .topbar .sub { font-size: 13px; color: var(--text-3); margin-top: 2px; }
  .topbar-actions { display: flex; align-items: center; gap: var(--s-2); }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface); border: 1px solid var(--border);
    padding: 6px 10px; border-radius: var(--r-sm);
    font-size: 12px; color: var(--text-2); cursor: pointer;
    transition: all 120ms ease;
  }
  .pill:hover { background: var(--surface-2); border-color: var(--border-2); }
  .pill-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); }

  /* ────────── KPI hero row ────────── */
  .kpi-row {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s-4);
    margin-bottom: var(--s-6);
  }
  .kpi {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r-md); padding: var(--s-4) var(--s-5);
    position: relative;
  }
  .kpi-label {
    font-size: 11px; color: var(--text-3); text-transform: uppercase;
    letter-spacing: 0.06em; font-weight: 500;
  }
  .kpi-value {
    font-family: var(--font-mono); font-size: 26px; font-weight: 600;
    letter-spacing: -0.02em; line-height: 1.1; margin-top: var(--s-2);
    color: var(--text);
  }
  .kpi-value .currency { font-size: 0.55em; opacity: 0.5; vertical-align: 0.3em; margin-right: 2px; }
  .kpi-delta {
    font-size: 12px; margin-top: var(--s-2); display: flex; align-items: center; gap: 4px;
    font-weight: 500;
  }
  .kpi-delta.pos { color: var(--success); }
  .kpi-delta.neg { color: var(--danger); }
  .kpi-delta.neutral { color: var(--text-3); }

  /* ────────── Section cards ────────── */
  .section {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r-md); padding: var(--s-5);
    margin-bottom: var(--s-5);
  }
  .section-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: var(--s-4);
  }
  .section-title { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
  .section-desc { font-size: 12px; color: var(--text-3); margin-top: 2px; }

  /* Two-column grid for content */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-5); }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--s-4); }

  /* ────────── Table ────────── */
  table.data {
    width: 100%; border-collapse: collapse; font-size: 13px;
  }
  table.data th {
    text-align: left; padding: 10px 12px; color: var(--text-3);
    font-size: 11px; text-transform: uppercase; font-weight: 500; letter-spacing: 0.04em;
    border-bottom: 1px solid var(--border);
  }
  table.data td {
    padding: 12px 12px; border-bottom: 1px solid var(--border);
    color: var(--text-2);
  }
  table.data tr:hover td { background: var(--surface-2); }
  table.data td.num { font-family: var(--font-mono); color: var(--text); }
  table.data td.right, table.data th.right { text-align: right; }
  table.data td.pos { color: var(--success); }
  table.data td.neg { color: var(--danger); }
  table.data td.muted { color: var(--text-3); }
  /* fix: th de columnas numéricas también deben right-align con el td */
  table.data th.num { font-family: var(--font-mono); }

  /* Inline badge inside table */
  .badge {
    display: inline-block; padding: 2px 8px; font-size: 10px; font-weight: 500;
    border-radius: 4px; letter-spacing: 0.02em;
  }
  .badge.success { background: rgba(95, 206, 141, 0.12); color: var(--success); }
  .badge.warning { background: rgba(240, 182, 88, 0.12); color: var(--warning); }
  .badge.danger  { background: rgba(239, 107, 126, 0.12); color: var(--danger); }
  .badge.neutral { background: var(--surface-3); color: var(--text-2); }

  /* Status indicators */
  .stat-card {
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--r-sm); padding: var(--s-4);
    display: flex; flex-direction: column; gap: 4px;
  }
  .stat-value { font-family: var(--font-mono); font-size: 20px; font-weight: 600; overflow-wrap: anywhere; word-break: break-word; }
  .stat-label { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.05em; }
  /* Permitir que grid-3 wrap si no caben las 3 columnas */
  .section .grid-3 { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }

  /* Charts */
  .chart-wrap { padding: var(--s-2); }

  /* Loader / empty */
  .empty {
    padding: var(--s-7); text-align: center; color: var(--text-3); font-size: 13px;
  }
  .loader {
    display: inline-block; width: 12px; height: 12px; border-radius: 50%;
    border: 2px solid var(--border-2); border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Button */
  .btn {
    background: var(--accent); color: white; border: none;
    padding: 8px 14px; border-radius: var(--r-sm); cursor: pointer;
    font-family: inherit; font-size: 13px; font-weight: 500;
    transition: background 120ms ease;
  }
  .btn:hover { background: var(--accent-2); }
  .btn:disabled { background: var(--surface-3); color: var(--text-3); cursor: not-allowed; }
  .btn.ghost {
    background: transparent; border: 1px solid var(--border-2); color: var(--text-2);
  }
  .btn.ghost:hover { background: var(--surface-2); }

  /* ────────── Forms ────────── */
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field-label {
    font-size: 11px; color: var(--text-3); text-transform: uppercase;
    letter-spacing: 0.06em; font-weight: 500;
  }
  .field-hint { font-size: 11px; color: var(--text-4); margin-top: 2px; }
  .input, .select, .textarea {
    background: var(--surface-2); border: 1px solid var(--border);
    color: var(--text); font-family: inherit; font-size: 13px;
    padding: 8px 10px; border-radius: var(--r-sm); outline: none;
    transition: border-color 120ms ease;
    width: 100%;
  }
  .input:focus, .select:focus, .textarea:focus { border-color: var(--accent); }
  .input.num, .select.num { font-family: var(--font-mono); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-3); }
  .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--s-3); }
  .row-4 { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: var(--s-3); }

  /* SKU line item in form */
  .line-row {
    display: grid; grid-template-columns: 2fr 80px 100px 100px 40px;
    gap: var(--s-2); align-items: center; padding: 8px 0;
    border-bottom: 1px solid var(--border);
  }
  .icon-btn {
    background: transparent; border: 1px solid var(--border); color: var(--text-3);
    cursor: pointer; padding: 4px 8px; border-radius: var(--r-sm);
    font-size: 14px; line-height: 1; transition: all 120ms ease;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); border-color: var(--border-2); }
  .icon-btn.danger:hover { color: var(--danger); border-color: var(--danger); }

  /* ────────── Modal ────────── */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    display: grid; place-items: center; z-index: 100;
    animation: fadeIn 150ms ease;
  }
  .modal {
    background: var(--surface); border: 1px solid var(--border-2);
    border-radius: var(--r-lg); padding: var(--s-5);
    min-width: 360px; max-width: 90vw; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    animation: slideUp 180ms ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .modal-title { font-size: 16px; font-weight: 600; margin-bottom: var(--s-2); }
  .modal-body { font-size: 13px; color: var(--text-2); margin-bottom: var(--s-4); line-height: 1.5; }
  .modal-actions { display: flex; justify-content: flex-end; gap: var(--s-2); }

  /* ────────── Toast ────────── */
  .toast-stack {
    position: fixed; bottom: var(--s-4); right: var(--s-4); z-index: 200;
    display: flex; flex-direction: column; gap: var(--s-2); pointer-events: none;
  }
  .toast {
    background: var(--surface); border: 1px solid var(--border-2);
    border-left: 3px solid var(--accent);
    border-radius: var(--r-sm); padding: 10px 14px;
    min-width: 260px; max-width: 400px; pointer-events: auto;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    animation: slideInRight 200ms ease;
  }
  .toast.success { border-left-color: var(--success); }
  .toast.error   { border-left-color: var(--danger); }
  .toast.warning { border-left-color: var(--warning); }
  .toast-title { font-size: 12px; font-weight: 600; margin-bottom: 2px; }
  .toast-msg { font-size: 12px; color: var(--text-2); line-height: 1.4; }
  @keyframes slideInRight { from { transform: translateX(20px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* ────────── Tabs (inline) ────────── */
  .tabs {
    display: flex; border-bottom: 1px solid var(--border);
    margin-bottom: var(--s-4); gap: 2px;
  }
  .tab {
    background: transparent; border: none; color: var(--text-3);
    padding: 10px 16px; cursor: pointer; font-family: inherit;
    font-size: 13px; font-weight: 500;
    border-bottom: 2px solid transparent;
    transition: all 120ms ease;
  }
  .tab:hover { color: var(--text-2); }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }

  /* Period filter */
  .period-bar {
    display: flex; align-items: center; gap: var(--s-2);
    background: var(--surface); border: 1px solid var(--border);
    padding: 4px; border-radius: var(--r-sm);
  }
  .period-bar button {
    background: transparent; border: none; color: var(--text-3);
    padding: 4px 10px; font-family: inherit; font-size: 11px;
    font-weight: 500; cursor: pointer; border-radius: 4px;
    transition: all 120ms ease;
  }
  .period-bar button:hover { color: var(--text); }
  .period-bar button.active { background: var(--accent); color: white; }

  /* Summary panel inside forms */
  .summary {
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--r-sm); padding: var(--s-3) var(--s-4);
    display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s-3);
    margin-top: var(--s-3);
  }
  .summary-item { display: flex; flex-direction: column; }
  .summary-item .lbl { font-size: 10px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; }
  .summary-item .val { font-family: var(--font-mono); font-size: 16px; font-weight: 600; margin-top: 2px; }

  /* Responsive — basic */
  @media (max-width: 1024px) {
    .kpi-row { grid-template-columns: repeat(2, 1fr); }
    .grid-2 { grid-template-columns: 1fr; }
    .row, .row-3, .row-4 { grid-template-columns: 1fr; }
  }
  @media (max-width: 768px) {
    .nav { display: none; }
    .main { padding: var(--s-4); }
    .kpi-row { grid-template-columns: 1fr 1fr; gap: var(--s-3); }
    .topbar h1 { font-size: 18px; }
    .line-row { grid-template-columns: 1fr; gap: 6px; }
    .summary { grid-template-columns: 1fr 1fr; }
  }
</style>

<div id="root"></div>

<script type="text/babel" data-presets="react">
// ════════════════════════════════════════════════════════════════
// Dashboard v3 — Modern data dashboard, mantiene funcionalidades
// del sistema (supabase-client.js + AT_CLIENT writers). Layout
// inspirado en Linear/Stripe: sidebar navegación, KPI hero row,
// cards modulares con jerarquía clara. Diseño basado en guidelines
// del skill ui-ux-pro-max (Minimalism, whitespace-balance, etc.)
// ════════════════════════════════════════════════════════════════

const { useState, useEffect, useMemo } = React;

// ─── Format helpers ─────────────────────────────────────────────
const fmtCurrency = (n, opts = {}) => {
  if (n == null || isNaN(n)) return '—';
  const abs = Math.abs(n);
  const formatted = abs.toLocaleString('es-DO', { maximumFractionDigits: 0 });
  return (n < 0 ? '-' : '') + 'RD$' + formatted;
};
const fmtNum = (n, dec = 0) => {
  if (n == null || isNaN(n)) return '—';
  return Number(n).toLocaleString('es-DO', { minimumFractionDigits: dec, maximumFractionDigits: dec });
};
const fmtPct = (n) => (n == null || isNaN(n)) ? '—' : (n >= 0 ? '+' : '') + n.toFixed(1) + '%';
const fmtDate = (s) => {
  if (!s) return '—';
  const [y, m, d] = s.split('-');
  return `${d}/${m}/${y.slice(2)}`;
};

// Hook: re-render cuando supabase actualiza una tabla
function useATData() {
  const [tick, setTick] = useState(0);
  useEffect(() => {
    const onLoad = () => setTick((t) => t + 1);
    window.addEventListener('airtable-loaded', onLoad);
    return () => window.removeEventListener('airtable-loaded', onLoad);
  }, []);
  return window.__AIRTABLE_DATA__ || {};
}

// ─── KPI card ───────────────────────────────────────────────────
function KPI({ label, value, delta, deltaLabel, currency }) {
  const cls = delta == null ? 'neutral' : (delta > 0 ? 'pos' : delta < 0 ? 'neg' : 'neutral');
  const arrow = delta == null ? '' : (delta > 0 ? '↗' : delta < 0 ? '↘' : '→');
  // Siempre renderear la fila inferior (delta / deltaLabel) para mantener
  // altura uniforme entre KPIs. Si no hay nada que mostrar, usa &nbsp;
  // para reservar el espacio.
  const hasContent = delta != null || (deltaLabel && deltaLabel.length > 0);
  return (
    <div className="kpi">
      <div className="kpi-label">{label}</div>
      <div className="kpi-value">
        {currency && <span className="currency">RD$</span>}
        {value}
      </div>
      <div className={`kpi-delta ${cls}`} style={{ minHeight: 18 }}>
        {delta != null && (
          <>
            <span>{arrow}</span>
            <span>{fmtPct(delta)}</span>
          </>
        )}
        {deltaLabel && <span style={{ color: 'var(--text-3)', marginLeft: delta != null ? 2 : 0 }}>{deltaLabel}</span>}
        {!hasContent && <span>&nbsp;</span>}
      </div>
    </div>
  );
}

// ─── Mini bar chart inline ──────────────────────────────────────
function MiniBars({ values, w = 80, h = 28, color = 'var(--accent)' }) {
  if (!values || values.length === 0) return null;
  const max = Math.max(...values, 1);
  const bw = w / values.length;
  return (
    <svg width={w} height={h}>
      {values.map((v, i) => {
        const bh = (v / max) * h;
        return <rect key={i} x={i * bw + 0.5} y={h - bh} width={bw - 1} height={bh} fill={color} opacity={0.7} />;
      })}
    </svg>
  );
}

// ─── Sparkline ──────────────────────────────────────────────────
function Sparkline({ values, w = 200, h = 50, color = 'var(--accent)' }) {
  if (!values || values.length < 2) return null;
  const max = Math.max(...values);
  const min = Math.min(...values);
  const range = max - min || 1;
  const points = values.map((v, i) => {
    const x = (i / (values.length - 1)) * w;
    const y = h - ((v - min) / range) * (h - 6) - 3;
    return `${x},${y}`;
  }).join(' ');
  const areaPoints = `0,${h} ${points} ${w},${h}`;
  return (
    <svg width={w} height={h}>
      <polygon points={areaPoints} fill={color} opacity={0.1} />
      <polyline points={points} fill="none" stroke={color} strokeWidth={1.5} />
    </svg>
  );
}

// Helper: medir ancho del container y re-render cuando cambie.
function useContainerWidth() {
  const ref = React.useRef(null);
  const [w, setW] = React.useState(800);
  React.useLayoutEffect(() => {
    if (!ref.current) return;
    const measure = () => { if (ref.current) setW(ref.current.offsetWidth); };
    measure();
    const ro = new ResizeObserver(measure);
    ro.observe(ref.current);
    return () => ro.disconnect();
  }, []);
  return [ref, w];
}

// LineChart responsivo: ocupa todo el ancho del container, usa viewBox para escalar.
// Si labels son muchos (>15), se muestran salteados (cada N) para que no se amontonen.
function LineChart({ values, labels = [], h = 200, color = 'var(--accent)', fmt = (n) => n.toLocaleString('en-US'), title = '', yTicks = 4 }) {
  const [ref, containerW] = useContainerWidth();
  if (!values || values.length < 2) return <div ref={ref} className="muted" style={{ fontSize: 12, padding: 16 }}>Sin datos suficientes</div>;
  const w = Math.max(320, containerW);
  const PAD_L = 64, PAD_R = 16, PAD_T = 10, PAD_B = 28;
  const cw = w - PAD_L - PAD_R, ch = h - PAD_T - PAD_B;
  const max = Math.max(...values);
  const min = Math.min(0, Math.min(...values));
  const range = (max - min) || 1;
  const x = (i) => PAD_L + (i / Math.max(1, values.length - 1)) * cw;
  const y = (v) => PAD_T + ch - ((v - min) / range) * ch;
  const points = values.map((v, i) => `${x(i)},${y(v)}`).join(' ');
  const areaPoints = `${PAD_L},${PAD_T + ch} ${points} ${PAD_L + cw},${PAD_T + ch}`;
  const ticks = Array.from({ length: yTicks + 1 }, (_, i) => min + (range * i / yTicks));
  // Si hay muchos labels, mostrar cada Nth para evitar overlap
  const labelEvery = Math.max(1, Math.ceil(values.length / Math.floor(cw / 60)));
  return (
    <div ref={ref} style={{ width: '100%', position: 'relative' }}>
      {title && <div style={{ fontSize: 11, color: 'var(--text-3)', marginBottom: 4, letterSpacing: '0.04em', textTransform: 'uppercase' }}>{title}</div>}
      <svg width="100%" height={h} viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none" style={{ display: 'block' }}>
        {ticks.map((t, i) => (
          <g key={i}>
            <line x1={PAD_L} y1={y(t)} x2={PAD_L + cw} y2={y(t)} stroke="var(--border)" strokeDasharray="2 4" strokeWidth={0.5} />
            <text x={PAD_L - 8} y={y(t) + 3} fontSize={10} fill="var(--text-3)" textAnchor="end" fontFamily="var(--font-mono)">{fmt(t)}</text>
          </g>
        ))}
        <polygon points={areaPoints} fill={color} opacity={0.12} />
        <polyline points={points} fill="none" stroke={color} strokeWidth={1.8} />
        {values.map((v, i) => (
          <circle key={i} cx={x(i)} cy={y(v)} r={3} fill={color}>
            <title>{(labels[i] || `#${i+1}`) + ': ' + fmt(v)}</title>
          </circle>
        ))}
        {labels.map((l, i) => (i % labelEvery === 0 || i === labels.length - 1) && (
          <text key={i} x={x(i)} y={h - 8} fontSize={10} fill="var(--text-3)" textAnchor="middle" fontFamily="var(--font-mono)">{l}</text>
        ))}
      </svg>
    </div>
  );
}

// BarChart responsivo: barras horizontales. Trunca labels largos con ellipsis CSS
// y reserva ancho proporcional al texto del label más largo.
function BarChart({ data, h = 180, color = 'var(--accent)', fmt = (n) => n.toLocaleString('en-US'), title = '' }) {
  const [ref, containerW] = useContainerWidth();
  if (!data || data.length === 0) return <div ref={ref} className="muted" style={{ fontSize: 12, padding: 16 }}>Sin datos</div>;
  const w = Math.max(320, containerW);
  // Reserva ancho para label = min(35% del ancho, 160px); resto para barras.
  const PAD_L = Math.min(180, Math.max(80, w * 0.28));
  const PAD_R = 72, PAD_T = 4, PAD_B = 4;
  const max = Math.max(...data.map(d => d.value));
  const barH = 22;
  const cw = w - PAD_L - PAD_R;
  const svgH = (barH + 8) * data.length + PAD_T + PAD_B;
  return (
    <div ref={ref} style={{ width: '100%' }}>
      {title && <div style={{ fontSize: 11, color: 'var(--text-3)', marginBottom: 6, letterSpacing: '0.04em', textTransform: 'uppercase' }}>{title}</div>}
      <svg width="100%" height={svgH} viewBox={`0 0 ${w} ${svgH}`} preserveAspectRatio="xMinYMin meet" style={{ display: 'block' }}>
        {data.map((d, i) => {
          const yPos = i * (barH + 8) + PAD_T;
          const bw = max > 0 ? (Math.abs(d.value) / max) * cw : 0;
          // Trunca label si es muy largo (~18 chars)
          const maxChars = Math.max(8, Math.floor(PAD_L / 7));
          const lblShort = d.label.length > maxChars ? d.label.slice(0, maxChars - 1) + '…' : d.label;
          return (
            <g key={i}>
              <text x={PAD_L - 8} y={yPos + barH/2 + 4} fontSize={11} fill="var(--text-2)" textAnchor="end">
                {lblShort}
                <title>{d.label}</title>
              </text>
              <rect x={PAD_L} y={yPos} width={bw} height={barH} fill={d.color || color} opacity={0.85} rx={2} />
              <text x={PAD_L + bw + 6} y={yPos + barH/2 + 4} fontSize={11} fill="var(--text)" fontFamily="var(--font-mono)">{fmt(d.value)}</text>
            </g>
          );
        })}
      </svg>
    </div>
  );
}

// Donut chart pequeño con leyenda — ideal para mix categórico (estados SKU, métodos pago, etc).
function DonutChart({ data, size = 180, strokeW = 26, fmt = (n, p) => `${n.toLocaleString('en-US')} (${p.toFixed(1)}%)`, title = '' }) {
  if (!data || data.length === 0) return null;
  const total = data.reduce((s, d) => s + d.value, 0) || 1;
  const cx = size / 2, cy = size / 2, r = size / 2 - strokeW / 2;
  const circumference = 2 * Math.PI * r;
  let offset = 0;
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 24, width: '100%' }}>
      <svg width={size} height={size} style={{ flexShrink: 0 }}>
        <circle cx={cx} cy={cy} r={r} fill="none" stroke="var(--border)" strokeWidth={strokeW} />
        {data.map((d, i) => {
          const len = (d.value / total) * circumference;
          const seg = (
            <circle key={i} cx={cx} cy={cy} r={r} fill="none"
              stroke={d.color} strokeWidth={strokeW}
              strokeDasharray={`${len} ${circumference - len}`}
              strokeDashoffset={-offset}
              transform={`rotate(-90 ${cx} ${cy})`} />
          );
          offset += len;
          return seg;
        })}
        <text x={cx} y={cy - 2} textAnchor="middle" fontSize={16} fontWeight={600} fontFamily="var(--font-mono)" fill="var(--text)">{total.toLocaleString('en-US')}</text>
        <text x={cx} y={cy + 16} textAnchor="middle" fontSize={9} fill="var(--text-3)" textTransform="uppercase" letterSpacing={0.6}>{title || 'TOTAL'}</text>
      </svg>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 10, fontSize: 13, flex: 1, minWidth: 0 }}>
        {data.map((d, i) => (
          <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '4px 8px', borderRadius: 4, background: 'var(--surface-2)' }}>
            <span style={{ width: 12, height: 12, background: d.color, borderRadius: 3, flexShrink: 0 }} />
            <span style={{ color: 'var(--text-2)', fontWeight: 500 }}>{d.label}</span>
            <span style={{ color: 'var(--text-3)', marginLeft: 'auto', fontFamily: 'var(--font-mono)', fontSize: 12 }}>{fmt(d.value, (d.value / total) * 100)}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── Pages ───────────────────────────────────────────────────────
function OverviewPage({ period }) {
  const data = useATData();
  const allVentas = data.ventas || [];
  const allCf = data.cashflow || [];
  const SK = data.skus || [];
  const [topMetric, setTopMetric] = useState('revenue'); // revenue | ganancia | uds

  // ── Filtrado por período ──────────────────────────────────────
  const ventas = filterByPeriod(allVentas, period, 'fecha');
  const cf = filterByPeriod(allCf, period, 'f');

  // KPIs principales (sobre período)
  const totalVentas   = ventas.reduce((s, v) => s + (v.precioFacturadoTotal || 0), 0);
  const totalGanancia = ventas.reduce((s, v) => s + (v.gananciaTotal || 0), 0);
  const margenPct     = totalVentas > 0 ? (totalGanancia / totalVentas) * 100 : 0;

  // Balance acumulado del PERÍODO + capital actual (todo histórico)
  const balancePeriodo = cf.reduce((s, m) => s + (m.e || 0) - (m.s || 0), 0);
  const balanceActual  = allCf.reduce((s, m) => s + (m.e || 0) - (m.s || 0), 0);

  // Deuda total = COOP saldo + ANDREA pendiente + BHD usado
  const deudaTotal = (window.COOP?.saldo || 0) + (window.ANDREA?.pendiente || 0) + (window.BHD?.usado || 0);

  // Crecimiento mes a mes (histórico siempre)
  const MES = window.MES || [];
  const lastMo = MES[MES.length - 1];
  const prevMo = MES[MES.length - 2];
  const growthMoM = (lastMo && prevMo && prevMo.v) ? ((lastMo.v - prevMo.v) / prevMo.v) * 100 : null;

  // Series para sparklines
  const ventasSeries = MES.map(m => m.v);

  // SKU criticos
  const SKbuilt = window.buildSK ? window.buildSK() : SK;
  const criticos = SKbuilt.filter(s => s.estado === 'critico').length;
  const atencion = SKbuilt.filter(s => s.estado === 'atencion').length;

  // Movimientos recientes del período
  const recientes = cf.slice(0, 10);

  // ── Cash Flow breakdown — Op vs Fin ───────────────────────────
  const opCats  = ['VENTA','ENVIO_COBRADO','COMPRA_MERCANCIA','COMPRA_OPERATIVA','ENVIO_LOTE','PAGO_ADS','PAGO_COMISION','PAGO_TRANSPORTE','REFUND_PROVEEDOR','REFUND_CLIENTE','OTROS'];
  const finCats = ['APORTE_DUENO','APORTE_INVERSOR','PAGO_PRESTAMO','PAGO_LINEA_CREDITO','PAGO_TARJETA_CREDITO','PAGO_INTERESES','PAGO_INVERSOR','DRAWDOWN','FEE_BANCARIO','TRANSFERENCIA_INTERNA','AJUSTE'];
  const isFin = (m) => {
    // m.naturaleza puede venir como 'FINANCIERO' o 'CASHFLOW'.
    if (m.naturaleza) return m.naturaleza === 'FINANCIERO';
    // Fallback por categoría/concepto.
    const c = (m.c || m.concepto || '').toLowerCase();
    return /préstamo|prestamo|interés|interes|línea|linea|tarjeta|inversor|aporte|drawdown|fee|transferencia/i.test(c);
  };
  const opMovs  = cf.filter(m => !isFin(m));
  const finMovs = cf.filter(m =>  isFin(m));
  const opE  = opMovs.reduce((s, m) => s + (m.e || 0), 0);
  const opS  = opMovs.reduce((s, m) => s + (m.s || 0), 0);
  const finE = finMovs.reduce((s, m) => s + (m.e || 0), 0);
  const finS = finMovs.reduce((s, m) => s + (m.s || 0), 0);
  const ventasCF = opMovs.filter(m => /venta/i.test(m.c || '')).reduce((s, m) => s + (m.e || 0), 0);
  const comprasMerc = opMovs.filter(m => /compra de mercanc/i.test(m.c || '')).reduce((s, m) => s + (m.s || 0), 0);
  const gastosOp = opS - comprasMerc;
  const pagosPrest = finMovs.filter(m => /préstamo|prestamo/i.test(m.c || '')).reduce((s, m) => s + (m.s || 0), 0);
  const intereses  = finMovs.filter(m => /interés|interes/i.test(m.c || '')).reduce((s, m) => s + (m.s || 0), 0);
  const aportes    = finMovs.filter(m => /aporte/i.test(m.c || '')).reduce((s, m) => s + (m.e || 0), 0);

  // ── Top SKUs por revenue del período ──────────────────────────
  const skuStats = {};
  const skuLookup = {};
  (data.skus || []).forEach(s => { skuLookup[s._airtableId || s.id_sku || s.id] = s.nm || s.nombre; });
  ventas.forEach(v => {
    (v.lineas || []).forEach(li => {
      const k = li.skuLinked || li.skuRef || 'LEGACY';
      const revenue = (li.baseCost || 0) + (li.ganancia || 0);
      if (!skuStats[k]) skuStats[k] = { sku: k, nombre: skuLookup[k] || k, revenue: 0, uds: 0, ganancia: 0 };
      skuStats[k].revenue  += revenue;
      skuStats[k].uds      += li.qty || 1;
      skuStats[k].ganancia += li.ganancia || 0;
    });
  });
  const allSkuStats = Object.values(skuStats);
  const topSkusByRevenue  = [...allSkuStats].sort((a, b) => b.revenue  - a.revenue ).slice(0, 10);
  const topSkusByGanancia = [...allSkuStats].sort((a, b) => b.ganancia - a.ganancia).slice(0, 10);
  const topSkusByUds      = [...allSkuStats].sort((a, b) => b.uds      - a.uds     ).slice(0, 10);
  const topSkus = topSkusByRevenue;  // default

  // ── Series mensuales del PERÍODO filtrado ─────────────────────
  // Agrupa ventas/cf por mes YYYY-MM dentro del rango del filtro y
  // computa series para charts. Si el filtro es "todo", usa todos los meses.
  const periodRange = periodToRange(period); // null si todo
  // Build the set of YYYY-MM that fall in range (or all from data if todo)
  const monthsInRange = (() => {
    const set = new Set();
    ventas.forEach(v => v.fecha && set.add(v.fecha.slice(0, 7)));
    cf.forEach(m => m.f && set.add(m.f.slice(0, 7)));
    return [...set].sort();
  })();
  const monthLabel = (ym) => {
    const [y, m] = ym.split('-');
    return `${MES_NAMES[parseInt(m, 10) - 1]}-${y.slice(2)}`;
  };
  const mesLabelsPeriod = monthsInRange.map(monthLabel);
  // Ventas y ganancia por mes (filtrado por período)
  const ventasByMonth = {};
  const ganxMonth = {};
  ventas.forEach(v => {
    if (!v.fecha) return;
    const ym = v.fecha.slice(0, 7);
    ventasByMonth[ym] = (ventasByMonth[ym] || 0) + (v.precioFacturadoTotal || 0);
    ganxMonth[ym]    = (ganxMonth[ym]    || 0) + (v.gananciaTotal     || 0);
  });
  const ventasSeriePeriod   = monthsInRange.map(ym => ventasByMonth[ym] || 0);
  const gananciaSeriePeriod = monthsInRange.map(ym => ganxMonth[ym]    || 0);
  const margenSeriePeriod   = monthsInRange.map(ym => {
    const v = ventasByMonth[ym] || 0, g = ganxMonth[ym] || 0;
    return v > 0 ? (g / v) * 100 : 0;
  });
  // Balance acumulado en el período (suma rolling de cf filtrado)
  const cfByMonth = {};
  cf.forEach(m => {
    if (!m.f) return;
    const ym = m.f.slice(0, 7);
    if (!cfByMonth[ym]) cfByMonth[ym] = { e: 0, s: 0 };
    cfByMonth[ym].e += m.e || 0;
    cfByMonth[ym].s += m.s || 0;
  });
  // Para el balance, si el período es "todo" arrancamos desde 0;
  // si es un rango menor, arrancamos desde el saldo previo al rango (offset).
  let priorBalance = 0;
  if (periodRange) {
    priorBalance = allCf.filter(m => m.f && m.f < periodRange.from)
                       .reduce((s, m) => s + (m.e || 0) - (m.s || 0), 0);
  }
  const balSeries = [];
  const balLabels = mesLabelsPeriod;
  let accBal = priorBalance;
  monthsInRange.forEach(ym => {
    const c = cfByMonth[ym] || { e: 0, s: 0 };
    accBal += (c.e - c.s);
    balSeries.push(accBal);
  });

  // ── KPIs adicionales ──────────────────────────────────────────
  const ticketProm    = ventas.length > 0 ? totalVentas / ventas.length : 0;
  const ganxVenta     = ventas.length > 0 ? totalGanancia / ventas.length : 0;
  const totalUds      = ventas.reduce((s, v) => s + (v.cantidadTotal || 0), 0);
  const udsxVenta     = ventas.length > 0 ? totalUds / ventas.length : 0;
  const stockTotal    = SKbuilt.reduce((s, x) => s + (x.s || 0), 0);
  const enCaminoTotal = SKbuilt.reduce((s, x) => s + (x.enCamino || 0), 0);
  const capitalStock  = SKbuilt.reduce((s, x) => s + ((x.s || 0) * (x.cpp || 0)), 0);
  const skusActivos   = SKbuilt.filter(s => s.estado !== 'sin_movimiento').length;
  const numLotes      = (data.lotes || []).length;
  const lotesEnCamino = (data.lotes || []).filter(l => l.status === 'En Camino').length;

  // Si el período abarca pocos meses (1-2), agrupa por DÍA en vez de mes
  // para que los charts no se queden con 1-2 puntos. Si abarca muchos meses,
  // agrupa por mes.
  const useDaily = monthsInRange.length <= 2 && periodRange;
  let mesLabels, ventasSerie, gananciaSerie, margenSerie;
  let balLabelsLocal, balSeriesLocal;
  if (useDaily) {
    // Generar lista de días dentro del rango (inclusive)
    const days = [];
    const dFrom = new Date(periodRange.from), dTo = new Date(periodRange.to);
    for (let d = new Date(dFrom); d <= dTo; d.setDate(d.getDate() + 1)) {
      days.push(d.toISOString().slice(0, 10));
    }
    const ventasByDay = {}, ganxDay = {}, cfByDay = {};
    ventas.forEach(v => { if (!v.fecha) return; ventasByDay[v.fecha] = (ventasByDay[v.fecha] || 0) + (v.precioFacturadoTotal || 0); ganxDay[v.fecha] = (ganxDay[v.fecha] || 0) + (v.gananciaTotal || 0); });
    cf.forEach(m => { if (!m.f) return; if (!cfByDay[m.f]) cfByDay[m.f] = { e: 0, s: 0 }; cfByDay[m.f].e += m.e || 0; cfByDay[m.f].s += m.s || 0; });
    mesLabels     = days.map(d => d.slice(5));  // MM-DD
    ventasSerie   = days.map(d => ventasByDay[d] || 0);
    gananciaSerie = days.map(d => ganxDay[d]    || 0);
    margenSerie   = days.map(d => { const v = ventasByDay[d] || 0, g = ganxDay[d] || 0; return v > 0 ? (g / v) * 100 : 0; });
    let acc = priorBalance;
    balLabelsLocal = mesLabels;
    balSeriesLocal = days.map(d => { const c = cfByDay[d] || { e: 0, s: 0 }; acc += c.e - c.s; return acc; });
  } else {
    mesLabels     = mesLabelsPeriod;
    ventasSerie   = ventasSeriePeriod;
    gananciaSerie = gananciaSeriePeriod;
    margenSerie   = margenSeriePeriod;
    balLabelsLocal = balLabels;
    balSeriesLocal = balSeries;
  }
  // Reasignar balSeries/balLabels para que el JSX use los locales
  const balSeriesFinal = balSeriesLocal;
  const balLabelsFinal = balLabelsLocal;
  const grain = useDaily ? 'diario' : 'mensual';

  // Canales (top channels)
  const canalStats = {};
  ventas.forEach(v => {
    const c = v.canal || 'Sin canal';
    if (!canalStats[c]) canalStats[c] = { label: c, value: 0, ventas: 0 };
    canalStats[c].value += v.precioFacturadoTotal || 0;
    canalStats[c].ventas += 1;
  });
  const canalPalette = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4'];
  const topCanales = Object.values(canalStats).sort((a, b) => b.value - a.value).slice(0, 6)
                     .map((c, i) => ({ ...c, color: canalPalette[i % canalPalette.length] }));

  // Estados SKU para donut
  const estadoSKU = [
    { label: 'Saludable',      value: SKbuilt.filter(s => s.estado === 'ok').length,             color: '#10b981' },
    { label: 'Atención',       value: atencion,                                                   color: '#f59e0b' },
    { label: 'Crítico',        value: criticos,                                                   color: '#ef4444' },
    { label: 'Sin movimiento', value: SKbuilt.filter(s => s.estado === 'sin_movimiento').length, color: '#6b7280' },
    { label: 'En reposición',  value: SKbuilt.filter(s => s.estado === 'en_reposicion').length,  color: '#3b82f6' },
  ].filter(d => d.value > 0);

  // Categorías de gasto (period) — para BarChart.
  // Importante: NO contar como gasto los movimientos cuyo concepto es de
  // ingreso (Venta de mercancia, Envio cobrado, Aportes, etc) aunque tengan
  // un valor en `salida`. Esto pasa con ventas legacy que registraron el
  // envío del courier como salida en la misma fila del ingreso de la venta.
  // El "salida" en esos casos es un gasto disfrazado y debe atribuirse a
  // su concepto propio (Pago Envío) — pero como la data histórica no lo
  // separa, lo agrupamos bajo "Envío (de ventas)" para no contaminar el
  // concepto "Venta de mercancia".
  const CONCEPTOS_INGRESO = ['Venta de mercancia', 'Envio cobrado', 'Aportes para negocio', 'Aporte Inversor', 'Refund proveedor', 'Drawdown'];
  const gastosByConcepto = {};
  cf.forEach(m => {
    if (!m.s || m.s === 0) return;
    let k = m.c || 'Otros';
    if (CONCEPTOS_INGRESO.includes(k)) {

function LotesTab() {
  const data = useATData();
  const lotes = data.lotes || [];
  const [search, setSearch] = useState('');
  const [filterStatus, setFilterStatus] = useState('all');
  const [del, setDel] = useState(null);
  const [busy, setBusy] = useState(false);

  let filtered = lotes;
  if (filterStatus !== 'all') {
    filtered = filtered.filter(l => l.status === filterStatus);
  }
  if (search) {
    const q = search.toLowerCase();
    filtered = filtered.filter(l =>
      (l.id || '').toLowerCase().includes(q) ||
      (l.proveedor || '').toLowerCase().includes(q) ||
      (l.skus || []).some(s => (s.id || '').toLowerCase().includes(q))
    );
  }
  filtered = filtered.slice(0, 100);

  const doDelete = async () => {
    setBusy(true);
    try {
      const res = await window.AT_CLIENT.removeLote(del.id);
      window.toastOk('Lote eliminado', `${del.id} · ${res.deletedCount || 0} entradas · ${res.cfsBorrados || 0} CFs`);
      setDel(null);
    } catch (e) {
      window.toastErr('No se pudo eliminar', e.message?.slice(0, 120));
    }
    setBusy(false);
  };

  return (
    <>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 'var(--s-3)' }}>
        <input className="input" style={{ width: 200 }} type="text" placeholder="Buscar..." value={search} onChange={e => setSearch(e.target.value)} />
        {['all', 'En Camino', 'Recibido', 'Perdido'].map(s => (
          <button key={s} className="pill" style={{
            background: filterStatus === s ? 'var(--surface-3)' : 'var(--surface)',
            color: filterStatus === s ? 'var(--text)' : 'var(--text-2)',
          }} onClick={() => setFilterStatus(s)}>{s === 'all' ? 'Todos' : s}</button>
        ))}
        <span className="pill" style={{ marginLeft: 'auto' }}>{filtered.length} de {lotes.length}</span>
      </div>

      <table className="data">
        <thead><tr>
          <th>Lote</th><th>Fecha</th><th>Status</th><th>Proveedor</th>
          <th className="right">SKUs</th><th className="right">Envío</th>
          <th className="right">Courier</th><th className="right">Otros</th>
          <th></th>
        </tr></thead>
        <tbody>
          {filtered.map(l => {
            const statusCls = l.status === 'Recibido' ? 'success' : l.status === 'Perdido' ? 'danger' : 'warning';
            return (
              <tr key={l.id}>
                <td><span className="num" style={{ fontSize: 11 }}>{l.id}</span></td>
                <td>{fmtDate(l.fecha)}</td>
                <td><span className={`badge ${statusCls}`}>{l.status}</span></td>
                <td className="muted">{l.proveedor || '—'}</td>
                <td className="num right">{(l.skus || []).length}</td>
                <td className="num right">{l.envio > 0 ? fmtCurrency(l.envio) : '—'}</td>
                <td className="num right">{l.courier > 0 ? fmtCurrency(l.courier) : '—'}</td>
                <td className="num right">{l.otros > 0 ? fmtCurrency(l.otros) : '—'}</td>
                <td><button className="icon-btn danger" onClick={() => setDel(l)}>×</button></td>
              </tr>
            );
          })}
        </tbody>
      </table>

      <ConfirmModal open={!!del} danger busy={busy}
        title={`¿Eliminar lote ${del?.id}?`}
        body={`${del?.skus?.length || 0} entrada(s) · ${del?.proveedor || ''} · ${fmtDate(del?.fecha || '')}. Borra entradas, lote header y CFs satélites linkeados (envío/courier/otros) en cascada. No reversible.`}
        onCancel={() => setDel(null)}
        onConfirm={doDelete} />
    </>
  );
}

                  <td className={`num right ${s.s === 0 ? 'neg' : ''}`}>{s.s}</td>
                  <td className="num right" style={{ color: s.enCamino > 0 ? 'var(--warning)' : 'var(--text-3)' }}>{s.enCamino || '—'}</td>
                  <td className="num right">{fmtCurrency(s.cpp)}</td>
                  <td className="num right">{s.pv > 0 ? fmtCurrency(s.pv) : '—'}</td>
                  <td className="num right muted">{s.pv > 0 ? margen + '%' : '—'}</td>
                  <td><span className={`badge ${badgeCls}`}>{s.estado.replace('_', ' ')}</span></td>
                  <td><button className="icon-btn danger" onClick={() => setDel(s)}>×</button></td>
                </tr>
              );
            })}
          </tbody>
        </table>
        )}
      </div>

      <ConfirmModal open={!!del} danger busy={busy}
        title={`¿Eliminar SKU ${del?.id}?`}
        body={
          refs && (refs.ventas > 0 || refs.entradas > 0)
            ? `${del?.nm}. ATENCIÓN: este SKU tiene ${refs.ventas} venta(s) y ${refs.entradas} entrada(s) históricas referenciándolo. Borrarlo puede fallar por FK constraint. Mejor desactiva (campo activa=false) en lugar de borrar.`
            : `${del?.nm}. Stock actual: ${del?.s || 0} ud. Sin ventas/entradas históricas — borrado seguro.`
        }
        onCancel={() => setDel(null)}
        onConfirm={doDelete} />
    </>
  );
}

// ─── Form Crear Cuenta ───────────────────────────────────────────
function FormCuenta({ onDone }) {
  const [nombre, setNombre] = useState('');
  const [tipo, setTipo] = useState('DEBITO');
  const [moneda, setMoneda] = useState('RD');
  const [limite, setLimite] = useState('');
  const [notas, setNotas] = useState('');
  const [busy, setBusy] = useState(false);
  const valid = nombre.length > 1;
  const onSubmit = async () => {
    setBusy(true);
    try {
      await window.AT_CLIENT.createCuenta({ nombre, tipo, moneda, limite, notas });
      window.toastOk('Cuenta creada', `${nombre} · ${tipo} ${moneda}`);
      setNombre(''); setLimite(''); setNotas('');
      onDone?.();
    } catch (e) { window.toastErr('No se pudo crear', e.message?.slice(0, 120)); }
    setBusy(false);
  };
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 'var(--s-3)' }}>
      <div className="row-3">
        <div className="field"><div className="field-label">Nombre</div>
          <input className="input" value={nombre} onChange={e => setNombre(e.target.value)} placeholder="ej. Popular Ahorros" /></div>
        <div className="field"><div className="field-label">Tipo</div>
          <select className="select" value={tipo} onChange={e => setTipo(e.target.value)}>
            <option value="DEBITO">Débito</option>
            <option value="CREDITO">Crédito (tarjeta)</option>
            <option value="EFECTIVO">Efectivo</option>
          </select></div>
        <div className="field"><div className="field-label">Moneda</div>
          <select className="select" value={moneda} onChange={e => setMoneda(e.target.value)}>
            <option value="RD">RD$</option><option value="USD">USD</option>
          </select></div>
      </div>
      {tipo === 'CREDITO' && (
        <div className="field"><div className="field-label">Límite de crédito</div>
          <input className="input num" type="number" value={limite} onChange={e => setLimite(e.target.value)} placeholder="0" /></div>
      )}
      <div className="field"><div className="field-label">Notas</div>
        <input className="input" value={notas} onChange={e => setNotas(e.target.value)} placeholder="opcional" /></div>
      <div style={{ display: 'flex', gap: 8 }}>
        <button className="btn" disabled={!valid || busy} onClick={onSubmit}>{busy ? 'Creando…' : 'Crear cuenta'}</button>
        <button className="btn ghost" disabled={busy} onClick={() => { setNombre(''); setLimite(''); setNotas(''); }}>Limpiar</button>
      </div>
    </div>
  );
}

// ─── Form Crear Préstamo / Línea / Tarjeta ───────────────────────
function FormPrestamo({ tipoFijo, onDone }) {
  const data = useATData();
  const bancos = (data._contrapartes || []).filter(c => c.tipo === 'BANCO');
  const [nombre, setNombre] = useState('');
  const [tipo, setTipo] = useState(tipoFijo || 'PRESTAMO');
  const [monto, setMonto] = useState('');
  const [limite, setLimite] = useState('');
  const [tasa, setTasa] = useState('');
  const [seguro, setSeguro] = useState('');
  const [plazo, setPlazo] = useState('');
  const [fechaInicio, setFechaInicio] = useState('');
  const [moneda, setMoneda] = useState('RD');
  const [contraparte, setContraparte] = useState('');
  const [notas, setNotas] = useState('');
  const [busy, setBusy] = useState(false);

  const esLinea = tipo === 'LINEA_CREDITO' || tipo === 'TARJETA_CREDITO';
  const valid = nombre.length > 1 && (esLinea ? Number(limite) > 0 : Number(monto) > 0);

  const onSubmit = async () => {
    setBusy(true);
    try {
      await window.AT_CLIENT.createPrestamo({
        nombre, tipo, moneda,
        montoInicial: esLinea ? null : Number(monto),
        limiteCredito: esLinea ? Number(limite) : null,
        tasaMensual: tasa ? (Number(tasa) / 100) : null,  // user enters % → store as decimal
        seguroMensual: seguro || null,
        plazoMeses: plazo || null,
        fechaInicio: fechaInicio || null,
        contraparteId: contraparte || null,
        notas,
      });
      const labelTipo = { PRESTAMO: 'Préstamo', LINEA_CREDITO: 'Línea', TARJETA_CREDITO: 'Tarjeta' }[tipo];
      window.toastOk(`${labelTipo} creado`, `${nombre}`);
      setNombre(''); setMonto(''); setLimite(''); setTasa(''); setSeguro(''); setPlazo(''); setNotas('');
      onDone?.();
    } catch (e) { window.toastErr('No se pudo crear', e.message?.slice(0, 120)); }
    setBusy(false);
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 'var(--s-3)' }}>
      <div className="row-3">
        <div className="field"><div className="field-label">Nombre</div>
          <input className="input" value={nombre} onChange={e => setNombre(e.target.value)} placeholder="ej. BHD Línea" /></div>
        {!tipoFijo && (
          <div className="field"><div className="field-label">Tipo</div>
            <select className="select" value={tipo} onChange={e => setTipo(e.target.value)}>
              <option value="PRESTAMO">Préstamo amortizado</option>
              <option value="LINEA_CREDITO">Línea de crédito</option>
              <option value="TARJETA_CREDITO">Tarjeta de crédito</option>
            </select></div>
        )}
        <div className="field"><div className="field-label">Banco emisor</div>
          <select className="select" value={contraparte} onChange={e => setContraparte(e.target.value)}>
            <option value="">— ninguno —</option>
            {bancos.map(c => <option key={c.id} value={c.id}>{c.nombre}</option>)}
          </select></div>
      </div>
      <div className="row-4">
        {!esLinea && (
          <div className="field"><div className="field-label">Monto inicial</div>
            <input className="input num" type="number" value={monto} onChange={e => setMonto(e.target.value)} placeholder="0" /></div>
        )}
        {esLinea && (
          <div className="field"><div className="field-label">Límite</div>
            <input className="input num" type="number" value={limite} onChange={e => setLimite(e.target.value)} placeholder="0" /></div>
        )}
        <div className="field"><div className="field-label">Tasa mensual (%)</div>
          <input className="input num" type="number" step="0.01" value={tasa} onChange={e => setTasa(e.target.value)} placeholder="1.67" /></div>
        {!esLinea && (
          <div className="field"><div className="field-label">Seguro mensual</div>
            <input className="input num" type="number" value={seguro} onChange={e => setSeguro(e.target.value)} placeholder="0" /></div>
        )}
        <div className="field"><div className="field-label">Moneda</div>
          <select className="select" value={moneda} onChange={e => setMoneda(e.target.value)}>
            <option value="RD">RD$</option><option value="USD">USD</option>
          </select></div>
      </div>
      {!esLinea && (
        <div className="row">
          <div className="field"><div className="field-label">Plazo (meses)</div>
            <input className="input num" type="number" value={plazo} onChange={e => setPlazo(e.target.value)} placeholder="48" /></div>
          <div className="field"><div className="field-label">Fecha inicio</div>
            <input className="input num" type="date" value={fechaInicio} onChange={e => setFechaInicio(e.target.value)} /></div>
        </div>
      )}
