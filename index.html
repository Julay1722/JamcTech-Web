<style>
  :root {
    --term-mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  /* Previene scroll horizontal del documento. El ticker (term-ticker-marquee)
     tiene contenido intrínseco de ~6630px que su contenedor clipea visualmente
     con overflow:hidden, pero en mobile <860px todavía expande scrollWidth
     del <html>. overflow-x:hidden en ambos html y body cierra el escape — el
     test mide documentElement.scrollWidth, así que html debe estar incluido. */
  html, body { margin: 0; padding: 0; overflow-x: hidden; }
  body {
    font-family: var(--term-mono);
    font-feature-settings: 'tnum';
    background: #070708;
    color: #e4e4e7;
    -webkit-font-smoothing: antialiased;
  }
  #root { min-height: 100vh; }
  input, select, button { font-family: var(--term-mono); }
  input[type="date"] { color-scheme: dark; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: #0c0c0e; }
  ::-webkit-scrollbar-thumb { background: #2a2a30; border-radius: 0; }
  ::-webkit-scrollbar-thumb:hover { background: #393c45; }

  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  .term-ticker-marquee { animation: marquee 90s linear infinite; }

  /* responsive: <860 hide some header meta */
  @media (max-width: 860px) {
    .term-headmeta { display: none !important; }
  }
</style>
