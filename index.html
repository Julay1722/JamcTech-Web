// ─── Form Nueva Venta ────────────────────────────────────────────
function FormVenta() {
  const data = useATData();
  const skus = data.skus || [];
  const [fecha, setFecha] = useState(window.HOY || HOY);
  const [canal, setCanal] = useState('Facebook');
  const [envio, setEnvio] = useState(0);
  const [precio, setPrecio] = useState('');
  const [notas, setNotas] = useState('');
  const [lineas, setLineas] = useState([{ id: 1, skuId: '', qty: 1 }]);
  const [busy, setBusy] = useState(false);
  // Gasto asociado a la venta (ej. envío pagado a un courier por el dueño).
  // Se registra como MOVIMIENTO SEPARADO (Pago Envio) — NO como salida en la
  // fila de la venta. Así Resumen no mezcla ingreso con gasto.
  const [gastoEnvio, setGastoEnvio] = useState(0);
  const [gastoConcepto, setGastoConcepto] = useState('Pago Envio');

  const addLinea = () => setLineas(arr => [...arr, { id: Date.now(), skuId: '', qty: 1 }]);
  const removeLinea = (id) => setLineas(arr => arr.filter(l => l.id !== id));
  const updateLinea = (id, patch) => setLineas(arr => arr.map(l => l.id === id ? { ...l, ...patch } : l));

  // Compute totals
  const lineasValidas = lineas.filter(l => l.skuId && Number(l.qty) > 0);
  const costoTotal = lineasValidas.reduce((s, l) => {
    const sku = skus.find(x => x.id === l.skuId);
    return s + (sku?.cpp || 0) * Number(l.qty);
  }, 0);
  const ganancia = (Number(precio) || 0) - costoTotal;
  const margen = Number(precio) > 0 ? (ganancia / Number(precio)) * 100 : 0;

  const valid = lineasValidas.length > 0 && Number(precio) > 0;

  const onSubmit = async () => {
    setBusy(true);
    try {
      const res = await window.AT_CLIENT.createVenta({
        fecha, canal,
        envio: Number(envio) || 0,
        precioFacturadoTotal: Number(precio),
        lineas: lineasValidas.map(l => ({ skuId: l.skuId, qty: Number(l.qty) })),
        nota: notas,
      });
      window.toastOk('Venta registrada', `${res.idVenta} · ${fmtCurrency(precio)} · ${lineasValidas.length} línea(s)`);
      // Si hay gasto asociado, registrarlo como movimiento separado de cashflow
      // (no como salida en la fila de la venta).
      if (Number(gastoEnvio) > 0) {
        try {
          const TIPO_MAP = { 'Pago Envio': 'PAGO_TRANSPORTE', 'Pago Comision': 'PAGO_COMISION', 'Otro': 'OTROS' };
          await window.AT_CLIENT.create('cashflow', {
            fecha, cuenta: 'BHD Debito',
            auxiliar: canal,
            concepto: gastoConcepto,
            tipo: TIPO_MAP[gastoConcepto] || 'OTROS',
            entrada: 0,
            salida: Number(gastoEnvio),
            notas: `Asociado a venta ${res.idVenta}`,
          });
          window.toastOk('Gasto asociado registrado', `${gastoConcepto} · ${fmtCurrency(gastoEnvio)}`);
        } catch (e) {
          window.toastWarn?.('Gasto asociado falló', e.message?.slice(0, 100));
        }
      }
      // Reset
      setPrecio(''); setEnvio(0); setNotas(''); setGastoEnvio(0);
      setLineas([{ id: 1, skuId: '', qty: 1 }]);
    } catch (e) {
      window.toastErr('No se pudo registrar', e.message?.slice(0, 120));
    }
    setBusy(false);
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 'var(--s-4)' }}>
      <div className="row-3">
        <div className="field">
          <div className="field-label">Fecha</div>
          <input className="input num" type="date" value={fecha} onChange={e => setFecha(e.target.value)} />
        </div>
        <div className="field">
          <div className="field-label">Canal</div>
          <select className="select" value={canal} onChange={e => setCanal(e.target.value)}>
            <option value="Facebook">Facebook</option>
            <option value="Cliente Generico">Cliente Genérico</option>
            <option value="Alexander">Alexander</option>
            <option value="Ramon">Ramon</option>
            <option value="Braulio">Braulio</option>
          </select>
        </div>
        <div className="field">
          <div className="field-label">Envío cobrado (RD$)</div>
          <input className="input num" type="number" value={envio} onChange={e => setEnvio(e.target.value)} />
        </div>
      </div>

      <div>
        <div className="field-label" style={{ marginBottom: 8 }}>SKUs vendidos · {lineasValidas.length} líneas</div>
        {lineas.map((l, i) => {
          const sku = skus.find(s => s.id === l.skuId);
          const subtotal = (sku?.cpp || 0) * Number(l.qty);
          return (
            <div key={l.id} className="line-row">
              <select className="select" value={l.skuId} onChange={e => updateLinea(l.id, { skuId: e.target.value })}>
                <option value="">— selecciona SKU —</option>
                {skus.filter(s => s.id !== 'LEGACY-SALE').map(s => (
                  <option key={s.id} value={s.id}>{s.nm} · {s.id}</option>
                ))}
              </select>
              <input className="input num" type="number" min="1" value={l.qty}
                onChange={e => updateLinea(l.id, { qty: e.target.value })} placeholder="Cant." />
              <span className="num" style={{ fontSize: 12, color: 'var(--text-3)', textAlign: 'right' }}>
                {sku ? fmtCurrency(sku.cpp) : '—'}
              </span>
              <span className="num" style={{ fontSize: 12, textAlign: 'right' }}>
                {subtotal > 0 ? fmtCurrency(subtotal) : '—'}
              </span>
              <button className="icon-btn danger" onClick={() => removeLinea(l.id)} disabled={lineas.length === 1}>×</button>
            </div>
          );
        })}
        <button className="btn ghost" style={{ marginTop: 8 }} onClick={addLinea}>+ Añadir SKU</button>
      </div>

      <div className="row">
        <div className="field">
          <div className="field-label">Precio facturado total (RD$)</div>
          <input className="input num" type="number" value={precio} onChange={e => setPrecio(e.target.value)} placeholder="0" />
          <div className="field-hint">Lo que efectivamente cobraste · ganancia se prorratea ponderado por costo</div>
        </div>
        <div className="field">
          <div className="field-label">Notas</div>
          <input className="input" type="text" value={notas} onChange={e => setNotas(e.target.value)} placeholder="cliente, referencia, etc." />
        </div>
      </div>

      <div className="row-3">
        <div className="field">
          <div className="field-label">Gasto asociado · concepto</div>
          <select className="select" value={gastoConcepto} onChange={e => setGastoConcepto(e.target.value)}>
            <option value="Pago Envio">Pago Envío (courier)</option>
            <option value="Pago Comision">Pago Comisión</option>
            <option value="Otro">Otro gasto</option>
          </select>
        </div>
        <div className="field">
          <div className="field-label">Gasto asociado · monto (RD$)</div>
          <input className="input num" type="number" value={gastoEnvio} onChange={e => setGastoEnvio(e.target.value)} placeholder="0" />
          <div className="field-hint">Se registra como movimiento SEPARADO (no se resta de la venta)</div>
        </div>
        <div className="field" style={{ opacity: 0.6 }}>
          <div className="field-label">Resultado</div>
          <div style={{ fontSize: 12, color: 'var(--text-3)', paddingTop: 4 }}>
            {Number(gastoEnvio) > 0 ? `Venta ${fmtCurrency(precio || 0)} → BHD · Gasto ${fmtCurrency(gastoEnvio)} ← BHD (2 mov)` : 'Solo venta (1 mov)'}
          </div>
        </div>
      </div>

      {(precio || lineasValidas.length > 0) && (
        <div className="summary">
          <div className="summary-item"><span className="lbl">Facturado</span><span className="val">{fmtCurrency(Number(precio) || 0)}</span></div>
          <div className="summary-item"><span className="lbl">Costo</span><span className="val">{fmtCurrency(costoTotal)}</span></div>
          <div className="summary-item"><span className="lbl">Ganancia</span><span className="val" style={{ color: ganancia > 0 ? 'var(--success)' : 'var(--text)' }}>{fmtCurrency(ganancia)}</span></div>
          <div className="summary-item"><span className="lbl">Margen</span><span className="val">{margen.toFixed(1)}%</span></div>
        </div>
      )}

      <div style={{ display: 'flex', gap: 8, marginTop: 8 }}>
        <button className="btn" disabled={!valid || busy} onClick={onSubmit}>
          {busy ? 'Registrando…' : 'Registrar venta'}
        </button>
        <button className="btn ghost" disabled={busy} onClick={() => {
          setPrecio(''); setEnvio(0); setNotas('');
          setLineas([{ id: 1, skuId: '', qty: 1 }]);
        }}>Limpiar</button>
      </div>
    </div>
  );
}

// ─── Form Nuevo Lote ─────────────────────────────────────────────
function FormLote() {
  const data = useATData();
  const skus = data.skus || [];
  const cuentas = data._cuentas || [];
  const [fecha, setFecha] = useState(window.HOY || HOY);
  const [status, setStatus] = useState('En Camino');
  const [proveedor, setProveedor] = useState('Alibaba');
  const [envio, setEnvio] = useState(0);
  const [courier, setCourier] = useState(0);
  const [otros, setOtros] = useState(0);
  const [notas, setNotas] = useState('');
  // Cuenta de origen por cada tipo de costo. Default todos a BHD Debito;
  // el usuario puede cambiar cada uno individualmente si pagaron con
  // distintas cuentas/tarjetas (ej. mercancía en débito, envío en tarjeta).
  const [cuentaMercancia, setCuentaMercancia] = useState('BHD Debito');
  const [cuentaEnvio,     setCuentaEnvio]     = useState('BHD Debito');
  const [cuentaCourier,   setCuentaCourier]   = useState('BHD Debito');
  const [cuentaOtros,     setCuentaOtros]     = useState('BHD Debito');
  // Tasa de cambio editable, persiste en localStorage para que la próxima
  // vez ya esté llena con el último valor que usó Julio (típicamente cambia
  // poco entre lotes y se quiere reusar).
  const [tasaCambio, setTasaCambio] = useState(() => {
    const saved = localStorage.getItem('tasa-cambio-usd');
    return saved ? Number(saved) : 60;
  });
  useEffect(() => {
    if (Number(tasaCambio) > 0) localStorage.setItem('tasa-cambio-usd', String(tasaCambio));
  }, [tasaCambio]);

  // Helper: cuenta es USD? (busca en cuentas reales primero, fallback name)
  const isUSDCuenta = (name) => {
    const c = cuentas.find(x => x.nombre === name);
    if (c) return c.moneda === 'USD';
    return /usd/i.test(name);
  };
  const [lineas, setLineas] = useState([{ id: 1, skuId: '', qty: 1, costoUd: 0 }]);
  const [busy, setBusy] = useState(false);

  const addLinea = () => setLineas(arr => [...arr, { id: Date.now(), skuId: '', qty: 1, costoUd: 0 }]);
  const removeLinea = (id) => setLineas(arr => arr.filter(l => l.id !== id));
  const updateLinea = (id, patch) => setLineas(arr => arr.map(l => l.id === id ? { ...l, ...patch } : l));

  const lineasValidas = lineas.filter(l => l.skuId && Number(l.qty) > 0);
  const costoBase = lineasValidas.reduce((s, l) => s + Number(l.qty) * Number(l.costoUd || 0), 0);
  const shared = Number(envio || 0) + Number(courier || 0) + Number(otros || 0);
  const total = costoBase + shared;

  const valid = lineasValidas.length > 0;

  const onSubmit = async () => {
    setBusy(true);
    try {
      const res = await window.AT_CLIENT.createLote({
        fecha, status, proveedor,
        envio: Number(envio) || 0,
        courier: Number(courier) || 0,
        otros: Number(otros) || 0,
        lineas: lineasValidas.map(l => ({ skuId: l.skuId, qty: Number(l.qty), costoUd: Number(l.costoUd) })),
        nota: notas,
      });
      // Crear movimientos de cashflow correspondientes a este lote, todos
      // saliendo de la cuenta seleccionada. Así el balance de la cuenta refleja
      // el outflow real del lote. Los CFs creados con loteId se linkean al lote
      // vía movimientos.lote_id (gracias a _recordLote), así removeLote los
      // borra en cascada.
      // Cada costo sale de su propia cuenta. Si la cuenta es USD, el monto
      // que el usuario tipea se interpreta como USD y se convierte a RD$ al
      // guardar (multiplicando por la tasa de cambio). Se anota el USD
      // original en el campo notas para trazabilidad.
      const buildCfArgs = (cuenta, montoTipeado, concepto, tipo, auxiliar, notaSufijo) => {
        const usd = isUSDCuenta(cuenta);
        const tasa = Number(tasaCambio) || 60;
        const salidaRD = usd ? (Number(montoTipeado) || 0) * tasa : (Number(montoTipeado) || 0);
        return {
          fecha, cuenta, auxiliar,
          concepto, tipo,
          entrada: 0, salida: salidaRD,
          montoUsd: usd ? Number(montoTipeado) : undefined,
          tasaCambio: usd ? tasa : undefined,
          notas: `Lote ${res.loteId} · ${notaSufijo}`,
        };
      };
      const cfPromises = [];
      if (costoBase > 0) {
        cfPromises.push(window.AT_CLIENT.create('cashflow',
          buildCfArgs(cuentaMercancia, costoBase, 'Compra de mercancia', 'COMPRA_MERCANCIA', proveedor, 'costo base')
        ).catch(e => console.warn('CF compra falló:', e.message)));
      }
      if (Number(envio) > 0) {
        cfPromises.push(window.AT_CLIENT.create('cashflow',
          buildCfArgs(cuentaEnvio, envio, 'Pago Envio', 'ENVIO_LOTE', proveedor, 'envío China→USA')
        ).catch(e => console.warn('CF envío falló:', e.message)));
      }
      if (Number(courier) > 0) {
        cfPromises.push(window.AT_CLIENT.create('cashflow',
          buildCfArgs(cuentaCourier, courier, 'Pago Envio', 'ENVIO_LOTE', 'Courier', 'courier USA→DR')
        ).catch(e => console.warn('CF courier falló:', e.message)));
      }
      if (Number(otros) > 0) {
        cfPromises.push(window.AT_CLIENT.create('cashflow',
          buildCfArgs(cuentaOtros, otros, 'Otro', 'OTROS', 'Aduana', 'otros (aduana/comisión)')
        ).catch(e => console.warn('CF otros falló:', e.message)));
      }
      await Promise.all(cfPromises);
      // Resumen del desglose de cuentas usado en el toast
      const cuentasUsadas = [...new Set([
        costoBase > 0 ? cuentaMercancia : null,
        Number(envio)   > 0 ? cuentaEnvio   : null,
        Number(courier) > 0 ? cuentaCourier : null,
        Number(otros)   > 0 ? cuentaOtros   : null,
      ].filter(Boolean))];
      window.toastOk('Lote registrado', `${res.loteId} · ${lineasValidas.length} SKU(s) · ${fmtCurrency(total)} desde ${cuentasUsadas.join(', ')}`);
      setEnvio(0); setCourier(0); setOtros(0); setNotas('');
      setLineas([{ id: 1, skuId: '', qty: 1, costoUd: 0 }]);
    } catch (e) {
      window.toastErr('No se pudo registrar', e.message?.slice(0, 120));
    }
    setBusy(false);
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 'var(--s-4)' }}>
      <div className="row-4">
        <div className="field">
          <div className="field-label">Fecha de compra</div>
          <input className="input num" type="date" value={fecha} onChange={e => setFecha(e.target.value)} />
        </div>
        <div className="field">
          <div className="field-label">Estado</div>
          <select className="select" value={status} onChange={e => setStatus(e.target.value)}>
            <option>En Camino</option><option>Recibido</option><option>Perdido</option>
          </select>
        </div>
        <div className="field">
          <div className="field-label">Proveedor</div>
          <select className="select" value={proveedor} onChange={e => setProveedor(e.target.value)}>
            <option>Alibaba</option><option>Temu</option><option>Amazon</option>
          </select>
        </div>
        <div className="field">
          <div className="field-label">Notas</div>
          <input className="input" type="text" value={notas} onChange={e => setNotas(e.target.value)} placeholder="opcional" />
        </div>
      </div>

      <div>
        <div className="field-label" style={{ marginBottom: 8 }}>SKUs del lote</div>
        {/* Header de columnas alineado con la grid line-row (2fr 80px 100px 100px 40px) */}
        <div className="line-row" style={{ borderBottom: '1px solid var(--border)', paddingBottom: 6, marginBottom: 4 }}>
          <span style={{ fontSize: 10, color: 'var(--text-3)', textTransform: 'uppercase', letterSpacing: '0.05em' }}>SKU</span>
          <span style={{ fontSize: 10, color: 'var(--text-3)', textTransform: 'uppercase', letterSpacing: '0.05em', textAlign: 'right' }}>Cantidad</span>
          <span style={{ fontSize: 10, color: 'var(--text-3)', textTransform: 'uppercase', letterSpacing: '0.05em', textAlign: 'right' }}>Costo/ud</span>
          <span style={{ fontSize: 10, color: 'var(--text-3)', textTransform: 'uppercase', letterSpacing: '0.05em', textAlign: 'right' }}>Subtotal</span>
          <span></span>
        </div>
        {lineas.map(l => {
          const subtotal = Number(l.qty) * Number(l.costoUd || 0);
          return (
            <div key={l.id} className="line-row">
              <select className="select" value={l.skuId} onChange={e => updateLinea(l.id, { skuId: e.target.value })}>
                <option value="">— selecciona SKU —</option>
                {skus.filter(s => s.id !== 'LEGACY-SALE').map(s => (
                  <option key={s.id} value={s.id}>{s.nm} · {s.id}</option>
                ))}
              </select>
              <input className="input num" type="number" min="1" value={l.qty}
                onChange={e => updateLinea(l.id, { qty: e.target.value })} placeholder="0" />
              <input className="input num" type="number" value={l.costoUd}
                onChange={e => updateLinea(l.id, { costoUd: e.target.value })} placeholder="0" />
              <span className="num" style={{ fontSize: 12, textAlign: 'right' }}>
                {subtotal > 0 ? fmtCurrency(subtotal) : '—'}
              </span>
              <button className="icon-btn danger" onClick={() => removeLinea(l.id)} disabled={lineas.length === 1}>×</button>
            </div>
          );
        })}
        <button className="btn ghost" style={{ marginTop: 8 }} onClick={addLinea}>+ Añadir SKU</button>
      </div>

      {/* Tasa de cambio · siempre visible para que se pueda ajustar antes
          de tocar cualquier costo en USD. Persiste en localStorage. */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, padding: 'var(--s-3)', background: 'var(--surface-2)', borderRadius: 4, marginTop: 4 }}>
        <div style={{ fontSize: 11, color: 'var(--accent)', textTransform: 'uppercase', letterSpacing: '0.05em', fontWeight: 600 }}>Tasa de cambio</div>
        <div style={{ flex: 1, fontSize: 12, color: 'var(--text-3)' }}>
          Cuántos RD$ pagaste por 1 USD$ al comprar los dólares. Se aplica a cualquier costo pagado con cuenta USD.
        </div>
        <input className="input num" type="number" step="0.01" value={tasaCambio}
          onChange={e => setTasaCambio(e.target.value)}
          style={{ width: 100 }} />
        <span style={{ fontSize: 12, color: 'var(--text-3)' }}>RD$/USD</span>
      </div>

      {/* Costos del lote — cada costo con su propia cuenta de origen.
          Útil cuando pagas mercancía con débito y envío con tarjeta de crédito,
          o courier en efectivo, etc. */}
      <div>
        <div className="field-label" style={{ marginBottom: 8 }}>Costos del lote · ¿de dónde salió cada uno?</div>
        {(() => {
          const cuentasOpts = cuentas.length > 0
            ? cuentas.map(c => ({ value: c.nombre, label: `${c.nombre} (${c.tipo})` }))
            : [
                { value: 'BHD Debito',  label: 'BHD Debito (DEBITO)' },
                { value: 'Efectivo',    label: 'Efectivo' },
                { value: 'Scotia RD',   label: 'Scotia RD (CREDITO)' },
                { value: 'Scotia USD',  label: 'Scotia USD (CREDITO)' },
                { value: 'Qik',         label: 'Qik (CREDITO)' },
              ];
          const renderCostRow = (label, hint, value, setValue, cuenta, setCuenta, readonly) => {
            const usd = isUSDCuenta(cuenta);
            const tasa = Number(tasaCambio) || 60;
            const equivRD = usd && Number(value) ? (Number(value) * tasa) : null;
            return (
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 160px 1.4fr', gap: 'var(--s-3)', alignItems: 'end', marginBottom: 8 }}>
                <div className="field">
                  <div className="field-label">{label}</div>
                  {hint && <div className="field-hint">{hint}</div>}
                </div>
                <div className="field">
                  <div className="field-label" style={{ color: usd ? 'var(--accent)' : undefined }}>
                    {usd ? 'Monto (USD$)' : 'Monto (RD$)'}
                  </div>
                  {readonly ? (
                    <div className="input num" style={{ display: 'flex', alignItems: 'center', color: 'var(--text-3)', fontFamily: 'var(--font-mono)' }}>
                      {fmtCurrency(value)}
                    </div>
                  ) : (
                    <input className="input num" type="number" value={value} onChange={e => setValue(e.target.value)} placeholder="0" />
                  )}
                  {equivRD != null && <div className="field-hint" style={{ color: 'var(--accent)' }}>≈ RD${fmtNum(equivRD)} a tasa {tasa}</div>}
                </div>
                <div className="field">
                  <div className="field-label">Cuenta origen</div>
                  <select className="select" value={cuenta} onChange={e => setCuenta(e.target.value)} disabled={!Number(value)}>
                    {cuentasOpts.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
                  </select>
                </div>
              </div>
            );
          };
          return (
            <>
              {renderCostRow('Mercancía (costo base)',     'Auto-calculado desde los SKUs arriba',                  costoBase, null,        cuentaMercancia, setCuentaMercancia, true)}
              {renderCostRow('Envío China → USA',          'Shipping de la mercancía al hub en USA',                envio,     setEnvio,    cuentaEnvio,    setCuentaEnvio)}
              {renderCostRow('Courier USA → DR',           'Lo que paga el courier desde USA a DR',                 courier,   setCourier,  cuentaCourier,  setCuentaCourier)}
              {renderCostRow('Otros (aduana, comisión)',   'Aduana, fee bancario, comisión de proveedor, etc.',     otros,     setOtros,    cuentaOtros,    setCuentaOtros)}
            </>
          );
        })()}
      </div>

      <div className="summary">
        <div className="summary-item"><span className="lbl">Costo base</span><span className="val">{fmtCurrency(costoBase)}</span></div>
        <div className="summary-item"><span className="lbl">Compartidos</span><span className="val">{fmtCurrency(shared)}</span></div>
        <div className="summary-item"><span className="lbl">Total lote</span><span className="val">{fmtCurrency(total)}</span></div>
        <div className="summary-item"><span className="lbl">SKUs</span><span className="val">{lineasValidas.length}</span></div>
      </div>

      <div style={{ display: 'flex', gap: 8 }}>
        <button className="btn" disabled={!valid || busy} onClick={onSubmit}>
          {busy ? 'Registrando…' : 'Registrar lote'}
        </button>
        <button className="btn ghost" disabled={busy} onClick={() => {
          setEnvio(0); setCourier(0); setOtros(0); setNotas('');
          setLineas([{ id: 1, skuId: '', qty: 1, costoUd: 0 }]);
        }}>Limpiar</button>
      </div>
    </div>
  );
}

// Para excepciones: descuadres, hallazgos, comisiones automáticas

  ];

  const valid = (Number(entrada) > 0 || Number(salida) > 0);

// ─── Form Movimiento Financiero ──────────────────────────────────
function FormMovFin() {
  const data = useATData();
  const productos = data.financiero || [];
  const [tipo, setTipo] = useState('Cuota Préstamo');
  const [fecha, setFecha] = useState(window.HOY || HOY);
  const [productoId, setProductoId] = useState('');
  const [monto, setMonto] = useState('');
  const [capital, setCapital] = useState('');
  const [interes, setInteres] = useState('');
  const [seguro, setSeguro] = useState('');
  const [cuentaBanco, setCuentaBanco] = useState('BHD Debito');
  const [notas, setNotas] = useState('');
  const [busy, setBusy] = useState(false);

  const MOVFIN_TIPOS = window.AT_CLIENT?.MOVFIN_TIPOS || ['Cuota Préstamo', 'Abono Préstamo', 'Disposición Línea', 'Pago Línea', 'Cargo Línea', 'Depósito Inversor', 'Retorno Inversor', 'Otro'];

  // Cuando es Cuota Préstamo, el monto se calcula desde capital + interés + seguro
  useEffect(() => {
    if (tipo === 'Cuota Préstamo' && (capital || interes || seguro)) {
      setMonto((Number(capital || 0) + Number(interes || 0) + Number(seguro || 0)).toString());
    }
  }, [tipo, capital, interes, seguro]);

  const valid = tipo && productoId && Number(monto) > 0;

  const onSubmit = async () => {
    setBusy(true);
    try {
      const prod = productos.find(p => p._airtableId === productoId);
      const res = await window.AT_CLIENT.createMovFin({
        tipo, fecha,
        monto: Number(monto),
        productoFinAirtableId: productoId,
        productoFinId: prod?.idFin,
        cuentaBanco,
        capital: Number(capital) || 0,
        interes: Number(interes) || 0,
        seguro:  Number(seguro)  || 0,
        notas,
      });
      window.toastOk('Movimiento registrado', `${tipo} · ${fmtCurrency(monto)} · ${prod?.nombre || ''}`);
      setMonto(''); setCapital(''); setInteres(''); setSeguro(''); setNotas('');
    } catch (e) {
      window.toastErr('No se pudo registrar', e.message?.slice(0, 120));
    }
    setBusy(false);
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 'var(--s-4)' }}>
      <div className="row-3">
        <div className="field">
          <div className="field-label">Tipo</div>
          <select className="select" value={tipo} onChange={e => setTipo(e.target.value)}>
            {MOVFIN_TIPOS.map(t => <option key={t}>{t}</option>)}
          </select>
        </div>
        <div className="field">
          <div className="field-label">Fecha</div>
          <input className="input num" type="date" value={fecha} onChange={e => setFecha(e.target.value)} />
        </div>
        <div className="field">
          <div className="field-label">Cuenta origen</div>
          <select className="select" value={cuentaBanco} onChange={e => setCuentaBanco(e.target.value)}>
            <option>BHD Debito</option><option>Scotia RD</option><option>Scotia USD</option><option>Qik</option><option>Efectivo</option>
          </select>
        </div>
      </div>

      <div className="field">
        <div className="field-label">Producto financiero</div>
        <select className="select" value={productoId} onChange={e => setProductoId(e.target.value)}>
          <option value="">— selecciona producto —</option>
          {productos.map(p => (
            <option key={p._airtableId} value={p._airtableId}>{p.nombre} · {p.tipo}</option>
          ))}
        </select>
      </div>

      {tipo === 'Cuota Préstamo' ? (
        <div className="row-3">
          <div className="field">
            <div className="field-label">Capital (RD$)</div>
            <input className="input num" type="number" value={capital} onChange={e => setCapital(e.target.value)} placeholder="0" />
          </div>
          <div className="field">
            <div className="field-label">Interés (RD$)</div>
            <input className="input num" type="number" value={interes} onChange={e => setInteres(e.target.value)} placeholder="0" />
          </div>
          <div className="field">
            <div className="field-label">Seguro (RD$)</div>
            <input className="input num" type="number" value={seguro} onChange={e => setSeguro(e.target.value)} placeholder="0" />
          </div>
        </div>
      ) : null}

      <div className="row">
        <div className="field">
          <div className="field-label">Monto total (RD$)</div>
          <input className="input num" type="number" value={monto} onChange={e => setMonto(e.target.value)}
            placeholder="0" readOnly={tipo === 'Cuota Préstamo'} />
          {tipo === 'Cuota Préstamo' && <div className="field-hint">Calculado de capital + interés + seguro</div>}
        </div>
        <div className="field">
          <div className="field-label">Notas</div>
          <input className="input" type="text" value={notas} onChange={e => setNotas(e.target.value)} placeholder="opcional" />
        </div>
      </div>

      <div style={{ display: 'flex', gap: 8 }}>
        <button className="btn" disabled={!valid || busy} onClick={onSubmit}>
          {busy ? 'Registrando…' : 'Registrar movimiento'}
        </button>
        <button className="btn ghost" disabled={busy} onClick={() => {
          setMonto(''); setCapital(''); setInteres(''); setSeguro(''); setNotas('');
        }}>Limpiar</button>
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════════
// VentasPage — expandida con Delete
// ════════════════════════════════════════════════════════════════
function VentasPageExt({ period }) {
  const data = useATData();
  const allVentas = data.ventas || [];
  const [search, setSearch] = useState('');
  const [del, setDel] = useState(null);
  const [edit, setEdit] = useState(null);
  const [busy, setBusy] = useState(false);
  const [tab, setTab] = useState('lista');

  const filteredPeriod = filterByPeriod(allVentas, period, 'fecha');
  const filtered = filteredPeriod.filter(v => {
    if (!search) return true;
    const q = search.toLowerCase();
    return (v.idVenta || '').toLowerCase().includes(q) || (v.canal || '').toLowerCase().includes(q);
  }).slice(0, 100);

  // ── KPIs del período ─────────────────────────────────────────
  const totalRevenue   = filteredPeriod.reduce((s, v) => s + (v.precioFacturadoTotal || 0), 0);
  const totalGanancia  = filteredPeriod.reduce((s, v) => s + (v.gananciaTotal       || 0), 0);
  const totalUds       = filteredPeriod.reduce((s, v) => s + (v.cantidadTotal       || 0), 0);
  const ticketProm     = filteredPeriod.length > 0 ? totalRevenue / filteredPeriod.length : 0;
  const udsxVenta      = filteredPeriod.length > 0 ? totalUds / filteredPeriod.length : 0;
  const ganxVenta      = filteredPeriod.length > 0 ? totalGanancia / filteredPeriod.length : 0;
  const margenProm     = totalRevenue > 0 ? (totalGanancia / totalRevenue) * 100 : 0;

  // Meses únicos cubiertos por las ventas filtradas
  const monthsSet = new Set(filteredPeriod.map(v => (v.fecha || '').slice(0, 7)).filter(Boolean));
  const nMeses = Math.max(1, monthsSet.size);
  const ventasxMes   = filteredPeriod.length / nMeses;
  const revenuexMes  = totalRevenue / nMeses;
  const gananciaxMes = totalGanancia / nMeses;
  const udsxMes      = totalUds / nMeses;

  // Día con más ventas (count) y día más rentable (revenue)
  const ventasByDate = {};
  filteredPeriod.forEach(v => {
    if (!v.fecha) return;
    if (!ventasByDate[v.fecha]) ventasByDate[v.fecha] = { count: 0, revenue: 0 };
    ventasByDate[v.fecha].count   += 1;
    ventasByDate[v.fecha].revenue += v.precioFacturadoTotal || 0;
  });
  const diasConVenta = Object.keys(ventasByDate).length;
  const bestDayCount = Object.entries(ventasByDate).sort((a, b) => b[1].count   - a[1].count  )[0];
  const bestDayRev   = Object.entries(ventasByDate).sort((a, b) => b[1].revenue - a[1].revenue)[0];

  // Top canal por revenue
  const canalStats = {};
  filteredPeriod.forEach(v => {
    const c = v.canal || 'Sin canal';
    if (!canalStats[c]) canalStats[c] = { revenue: 0, count: 0 };
    canalStats[c].revenue += v.precioFacturadoTotal || 0;
    canalStats[c].count   += 1;
  });
  const topCanal = Object.entries(canalStats).sort((a, b) => b[1].revenue - a[1].revenue)[0];

  // Helper para fmtK (RD$XK)
  const fmtKLocal = (n) => Math.abs(n) >= 1000 ? (n/1000).toFixed(n >= 100000 ? 0 : 1) + 'K' : Math.round(n).toString();

  const doDelete = async () => {
    setBusy(true);
    try {
      await window.AT_CLIENT.removeVenta(del.idVenta);
      window.toastOk('Venta eliminada', `${del.idVenta}`);
      setDel(null);
    } catch (e) {
      window.toastErr('No se pudo eliminar', e.message?.slice(0, 120));
    }
    setBusy(false);
  };

  const doSave = async (vals) => {
    setBusy(true);
    try {
      await window.AT_CLIENT.updateVentaHeader(edit.idVenta, {
        fecha: vals.fecha, canal: vals.canal,
        envio: Number(vals.envio) || 0, notas: vals.notas,
      });
      window.toastOk('Venta actualizada', `${edit.idVenta}`);
      setEdit(null);
    } catch (e) { window.toastErr('No se pudo guardar', e.message?.slice(0, 120)); }
    setBusy(false);
  };

  return (
    <>
      <div className="topbar">
        <div>
          <h1>Ventas</h1>
          <div className="sub">{allVentas.length} ventas totales · {filteredPeriod.length} en período</div>
        </div>
        {tab === 'lista' && (
          <div className="topbar-actions">
            <input className="input" style={{ width: 180 }} type="text" placeholder="Buscar..." value={search} onChange={e => setSearch(e.target.value)} />
            <span className="pill">{filtered.length} mostrando</span>
          </div>
        )}
      </div>

      <div className="tabs">
        <button className={`tab ${tab === 'lista' ? 'active' : ''}`} onClick={() => setTab('lista')}>Lista de ventas</button>
        <button className={`tab ${tab === 'nueva' ? 'active' : ''}`} onClick={() => setTab('nueva')}>+ Nueva venta</button>
      </div>

      {tab === 'nueva' && (
        <div className="section">
          <FormVenta />
        </div>
      )}

      {tab === 'lista' && (
      <>
      <div className="nav-section-label" style={{ padding: 'var(--s-3) 0 var(--s-2)', fontSize: 12 }}>RESUMEN DEL PERÍODO</div>
      <div className="kpi-row">
        <KPI label="Ventas en período" value={fmtNum(filteredPeriod.length)}
             delta={null} deltaLabel={`en ${nMeses} mes${nMeses>1?'es':''} · ${diasConVenta} días con venta`} />
        <KPI label="Revenue total" value={fmtNum(totalRevenue)} currency
             delta={margenProm} deltaLabel="margen prom" />
        <KPI label="Ganancia total" value={fmtNum(totalGanancia)} currency
             delta={null} deltaLabel={`${fmtCurrency(ganxVenta)}/venta`} />
        <KPI label="Unidades vendidas" value={fmtNum(totalUds)}
             delta={null} deltaLabel={`${udsxVenta.toFixed(1)} ud/venta`} />
      </div>

      <div className="kpi-row">
        <KPI label="Ventas / mes" value={ventasxMes.toFixed(1)}
             delta={null} deltaLabel={`promedio en ${nMeses} mes${nMeses>1?'es':''}`} />
        <KPI label="Revenue / mes" value={fmtNum(revenuexMes)} currency
             delta={null} deltaLabel={`prom · ${fmtCurrency(ticketProm)} ticket`} />
        <KPI label="Ganancia / mes" value={fmtNum(gananciaxMes)} currency
             delta={null} deltaLabel="promedio" />
        <KPI label="Unidades / mes" value={fmtNum(udsxMes)}
             delta={null} deltaLabel="promedio" />
      </div>

      <div className="grid-2" style={{ marginBottom: 'var(--s-5)' }}>
        <div className="section">
          <div className="section-head">
            <div>
              <div className="section-title">Mejor día</div>
              <div className="section-desc">Por revenue · por cantidad de ventas</div>
            </div>
          </div>
          <div className="grid-2">
            <div className="stat-card">
              <div className="stat-label">Día con más revenue</div>
              <div className="stat-value">{bestDayRev ? fmtDate(bestDayRev[0]) : '—'}</div>
              <div style={{ fontSize: 12, color: 'var(--text-3)', marginTop: 4 }}>
                {bestDayRev ? `${fmtCurrency(bestDayRev[1].revenue)} · ${bestDayRev[1].count} venta${bestDayRev[1].count > 1 ? 's' : ''}` : 'Sin datos'}
              </div>
            </div>
            <div className="stat-card">
              <div className="stat-label">Día con más ventas</div>
              <div className="stat-value">{bestDayCount ? fmtDate(bestDayCount[0]) : '—'}</div>
              <div style={{ fontSize: 12, color: 'var(--text-3)', marginTop: 4 }}>
                {bestDayCount ? `${bestDayCount[1].count} venta${bestDayCount[1].count > 1 ? 's' : ''} · ${fmtCurrency(bestDayCount[1].revenue)}` : 'Sin datos'}
              </div>
            </div>
          </div>
        </div>

        <div className="section">
          <div className="section-head">
            <div>
              <div className="section-title">Top canal</div>
              <div className="section-desc">{Object.keys(canalStats).length} canales activos</div>
            </div>
          </div>
          {topCanal ? (
            <div className="grid-2">
              <div className="stat-card">
                <div className="stat-label">Líder</div>
                <div className="stat-value">{topCanal[0]}</div>
                <div style={{ fontSize: 12, color: 'var(--text-3)', marginTop: 4 }}>
                  {topCanal[1].count} venta{topCanal[1].count > 1 ? 's' : ''} · {fmtCurrency(topCanal[1].revenue)}
                </div>
              </div>
              <div className="stat-card">
                <div className="stat-label">Share</div>
                <div className="stat-value" style={{ color: 'var(--accent)' }}>
                  {totalRevenue > 0 ? ((topCanal[1].revenue / totalRevenue) * 100).toFixed(1) : '0'}%
                </div>
                <div style={{ fontSize: 12, color: 'var(--text-3)', marginTop: 4 }}>del revenue total</div>
              </div>
            </div>
          ) : <div className="muted">Sin canales</div>}
        </div>
      </div>

      <div className="nav-section-label" style={{ padding: 'var(--s-3) 0 var(--s-2)', fontSize: 12 }}>LISTA · {filtered.length} de {filteredPeriod.length}</div>
      <div className="section">
        <table className="data">
          <thead><tr>
            <th>Producto(s)</th><th>Fecha</th><th>Canal</th>
            <th className="right">Uds</th>
            <th className="right">Costo</th>
            <th className="right">Total</th><th className="right">Ganancia</th><th className="right">Margen</th>
            <th></th>
          </tr></thead>
          <tbody>
            {(() => {
              // SKU id → nombre lookup
              const skuName = {};
              (data.skus || []).forEach(s => { skuName[s.id] = s.nm || s.id; });
              return filtered.map(v => {
                const items = v.lineas || [];
                const costoTotal = items.reduce((s, l) => s + (l.baseCost || (Number(l.costoUd || 0) * Number(l.qty || 0))), 0);
                return (
                  <tr key={v.idVenta}>
                    <td>
                      {items.length === 0 && <span className="muted">—</span>}
                      {items.map((l, i) => {
                        const sku = l.skuLinked || l.skuRef;
                        const nombre = skuName[sku] || sku || '—';
                        return (
                          <div key={i} style={{ fontSize: 12, marginBottom: i < items.length - 1 ? 2 : 0 }}>
                            {nombre} <span className="muted">× {l.qty}</span>
                            <div style={{ fontSize: 10, color: 'var(--text-3)', fontFamily: 'var(--font-mono)' }}>{sku}</div>
                          </div>
                        );
                      })}
                      <div style={{ fontSize: 9, color: 'var(--text-3)', fontFamily: 'var(--font-mono)', marginTop: 4, opacity: 0.6 }}>{v.idVenta}</div>
                    </td>
                    <td>{fmtDate(v.fecha)}</td>
                    <td className="muted">{v.canal || '—'}</td>
                    <td className="num right">{v.cantidadTotal || 0}</td>
                    <td className="num right neg">{fmtCurrency(costoTotal)}</td>
                    <td className="num right">{fmtCurrency(v.precioFacturadoTotal)}</td>
                    <td className="num right pos">{fmtCurrency(v.gananciaTotal)}</td>
                    <td className="num right muted">{(v.margenPct || 0).toFixed(1)}%</td>
                    <td style={{ whiteSpace: 'nowrap' }}>
                      <div style={{ display: 'inline-flex', gap: 4 }}>
                        <button className="icon-btn" onClick={() => setEdit(v)} title="Editar header">✎</button>
                        <button className="icon-btn danger" onClick={() => setDel(v)} title="Eliminar">×</button>
                      </div>
                    </td>
                  </tr>
                );
              });
            })()}
          </tbody>
        </table>
      </div>
      </>
      )}

      <ConfirmModal open={!!del} danger busy={busy}
        title={`¿Eliminar venta ${del?.idVenta}?`}
        body={`${del?.fecha || ''} · ${del?.canal || ''} · ${fmtCurrency(del?.precioFacturadoTotal || 0)}. Esta acción borra ${(del?.lineas || []).length} línea(s) y movimientos asociados de Supabase. No es reversible.`}
        onCancel={() => setDel(null)}
        onConfirm={doDelete} />

      <EditModal open={!!edit} busy={busy}
        title={`Editar venta ${edit?.idVenta}`}
        fields={edit ? [
          { name: 'fecha', label: 'Fecha', type: 'date', value: edit.fecha },
          { name: 'canal', label: 'Canal', type: 'text', value: edit.canal },
          { name: 'envio', label: 'Envío cobrado (RD$)', type: 'number', value: edit.envio || 0 },
          { name: 'notas', label: 'Notas', type: 'text', value: edit.notas || '', span: 2 },
        ] : []}
        onCancel={() => setEdit(null)}
        onSave={doSave} />
    </>
  );
}

// ════════════════════════════════════════════════════════════════
// Movimientos Page — full cashflow tail con delete
// ════════════════════════════════════════════════════════════════
function MovimientosPage({ period, onNavigate }) {
  const data = useATData();
  const all = data.cashflow || [];
  const filtered = filterByPeriod(all, period, 'f').slice(0, 100);
  const [del, setDel] = useState(null);
  const [edit, setEdit] = useState(null);
  const [busy, setBusy] = useState(false);
  const [tab, setTab] = useState('lista');

  // Detecta si un movimiento vino de venta, lote, o movFin. Si vino de
  // una fuente, NO se debe editar aquí (el edit no propaga al origen,
  // dejando los totales desincronizados). En vez de eso, mostrar link
  // a la página de la fuente.
  const linkedSource = (m) => {
    const c = (m.c || '').toLowerCase();
    const notas = (m.notas || '').toLowerCase();
    // venta: concepto = "Venta de mercancia" o notas mencionan V-XXX
    if (c.includes('venta de mercanc') || /\bv-\d/i.test(m.notas || '') || /vta-/i.test(m.notas || '')) {
      return { kind: 'venta', label: 'Editar en Ventas', page: 'ventas' };
    }
    // lote: compra/envío/courier con notas "Lote L-..."
    if (/lote\s*l[-\s]/i.test(m.notas || '') || (c.includes('compra de mercanc') && notas.includes('lote'))) {
      return { kind: 'lote', label: 'Editar en Inventario', page: 'inventario' };
    }
    // movFin (cuota préstamo, cargo línea, pago línea, retorno inversor, etc.)
    if (/cuota|pago línea|cargo línea|pago linea|cargo linea|retorno inversor|abono préstamo|abono prestamo|disposición línea|disposicion linea/i.test(c)) {
      return { kind: 'movfin', label: 'Editar en Finanzas', page: 'finanzas' };
    }
    return null;  // ajuste manual / aporte / otros → editable libremente
  };

  const doDelete = async () => {
    setBusy(true);
    try {
      await window.AT_CLIENT.remove('cashflow', del._airtableId);
      window.toastOk('Movimiento eliminado', del.c);
      setDel(null);
    } catch (e) {
      window.toastErr('No se pudo eliminar', e.message?.slice(0, 120));
    }
    setBusy(false);
  };

  const doSaveEdit = async (vals) => {
    setBusy(true);
    try {
      const F = window.AT?.fields?.cashflow || { fecha: 'fecha', cuenta: 'cuenta', auxiliar: 'auxiliar', entrada: 'entrada', salida: 'salida', notas: 'notas' };
      await window.AT_CLIENT.update('cashflow', edit._airtableId, {
        [F.fecha]: vals.fecha,
        [F.cuenta]: vals.cuenta,
        [F.auxiliar]: vals.auxiliar,
        [F.entrada]: Number(vals.entrada) || 0,
        [F.salida]: Number(vals.salida) || 0,
        [F.notas]: vals.notas,
      });
      window.toastOk('Movimiento actualizado', vals.cuenta);
      setEdit(null);
    } catch (e) { window.toastErr('No se pudo guardar', e.message?.slice(0, 120)); }
    setBusy(false);
  };

  return (
    <>
      <div className="topbar">
        <div>
          <h1>Movimientos</h1>
          <div className="sub">{all.length} totales · {filtered.length} mostrando</div>
        </div>
      </div>

      <div className="tabs">
        <button className={`tab ${tab === 'lista' ? 'active' : ''}`} onClick={() => setTab('lista')}>Lista</button>
        <button className={`tab ${tab === 'movfin' ? 'active' : ''}`} onClick={() => setTab('movfin')}>+ Movimiento financiero</button>
        <button className={`tab ${tab === 'ajuste' ? 'active' : ''}`} onClick={() => setTab('ajuste')}>+ Ajuste CF</button>
      </div>

      {tab === 'movfin' && <div className="section"><FormMovFin /></div>}
      {tab === 'ajuste' && <div className="section"><FormAjusteCF /></div>}

      {tab === 'lista' && (
      <div className="section">
        <table className="data">
          <thead><tr>
            <th>Fecha</th><th>Tipo</th><th>Contraparte</th>
            <th className="right">Entrada</th><th className="right">Salida</th><th className="right">Neto</th>
            <th></th>
          </tr></thead>
          <tbody>
            {filtered.map((m, i) => {
              const neto = (m.e || 0) - (m.s || 0);
              const source = linkedSource(m);
              return (
                <tr key={i}>
                  <td>{fmtDate(m.f)}</td>
                  <td>{m.c}</td>
                  <td className="muted">{m.a || '—'}</td>
                  <td className="num right pos">{m.e > 0 ? fmtCurrency(m.e) : '—'}</td>
                  <td className="num right neg">{m.s > 0 ? '-' + fmtCurrency(m.s) : '—'}</td>
                  <td className={`num right ${neto > 0 ? 'pos' : neto < 0 ? 'neg' : 'muted'}`}>
                    {neto > 0 ? '+' : ''}{fmtCurrency(neto)}
                  </td>
                  <td className="row-actions">
                    <div className="row-actions-inner">
                      {source ? (
                        <button
                          onClick={() => onNavigate?.(source.page)}
                          title={`Este movimiento vino de ${source.kind}. Edítalo allá para que se recalculen ganancia/totales.`}
                          style={{
                            background: 'transparent', border: '1px solid var(--border)',
                            color: 'var(--accent)', cursor: 'pointer', fontSize: 11,
                            padding: '4px 8px', borderRadius: 4, whiteSpace: 'nowrap',
                          }}>
                          {source.label} →
                        </button>
                      ) : (
                        <button className="icon-btn" onClick={() => setEdit(m)} title="Editar (movimiento manual)">✎</button>
                      )}
                      <button className="icon-btn danger" onClick={() => setDel(m)} title="Eliminar">×</button>
                    </div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      )}

      <ConfirmModal open={!!del} danger busy={busy}
        title={`¿Eliminar movimiento?`}
        body={`${del?.f || ''} · ${del?.c || ''} · ${del?.a || ''}. ${fmtCurrency(del?.e || del?.s || 0)}. Borra de Supabase, no reversible.`}
        onCancel={() => setDel(null)}
        onConfirm={doDelete} />

      <EditModal open={!!edit} busy={busy}
        title={`Editar movimiento`}
        fields={edit ? [
          { name: 'fecha', label: 'Fecha', type: 'date', value: edit.f },
          { name: 'cuenta', label: 'Tipo (categoría)', type: 'text', value: edit.c },
          { name: 'auxiliar', label: 'Contraparte', type: 'text', value: edit.a || '' },
          { name: 'entrada', label: 'Entrada (RD$)', type: 'number', value: edit.e || 0 },
          { name: 'salida', label: 'Salida (RD$)', type: 'number', value: edit.s || 0 },
          { name: 'notas', label: 'Notas', type: 'text', value: '', span: 2 },
        ] : []}
        onCancel={() => setEdit(null)}
        onSave={doSaveEdit} />
    </>
  );
}

// EditModal — modal genérico para edit forms
// fields: [{name, label, type, value, options?, span?}]
// ════════════════════════════════════════════════════════════════
function EditModal({ open, title, fields, onCancel, onSave, busy }) {
  const [values, setValues] = useState({});
  useEffect(() => {
    if (open && fields) {
      const init = {};
      fields.forEach(f => { init[f.name] = f.value ?? ''; });
      setValues(init);
    }
  }, [open]);
  if (!open) return null;
  return (
    <div className="modal-backdrop" onClick={onCancel}>
      <div className="modal" style={{ minWidth: 520, maxWidth: '90vw' }} onClick={e => e.stopPropagation()}>
        <div className="modal-title">{title}</div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 12, marginBottom: 'var(--s-4)' }}>
          {fields.map(f => (
            <div key={f.name} className="field" style={f.span === 2 ? { gridColumn: 'span 2' } : undefined}>
              <div className="field-label">{f.label}</div>
              {f.type === 'select' ? (
                <select className="select" value={values[f.name] ?? ''} onChange={e => setValues({ ...values, [f.name]: e.target.value })}>
                  {f.options.map(o => typeof o === 'string' ? <option key={o}>{o}</option> : <option key={o.value} value={o.value}>{o.label}</option>)}
                </select>
              ) : f.type === 'textarea' ? (
                <textarea className="textarea" rows={3} value={values[f.name] ?? ''} onChange={e => setValues({ ...values, [f.name]: e.target.value })} />
              ) : (
                <input className={'input ' + (f.type === 'number' || f.type === 'date' ? 'num' : '')}
                       type={f.type || 'text'} value={values[f.name] ?? ''}
                       onChange={e => setValues({ ...values, [f.name]: e.target.value })}
                       placeholder={f.placeholder} />
              )}
              {f.hint && <div className="field-hint">{f.hint}</div>}
            </div>
          ))}
        </div>
        <div className="modal-actions">
          <button className="btn ghost" onClick={onCancel} disabled={busy}>Cancelar</button>
          <button className="btn" disabled={busy} onClick={() => onSave(values)}>
            {busy ? 'Guardando…' : 'Guardar'}
          </button>
        </div>
      </div>
    </div>
  );
}

// Form Nuevo SKU
// ════════════════════════════════════════════════════════════════
function FormSKU() {
  const data = useATData();
  const [cat, setCat] = useState('Mouse');
  const [customCat, setCustomCat] = useState('');
  const [showCustom, setShowCustom] = useState(false);
  const [mk, setMk] = useState('');
  const [modelo, setModelo] = useState('');
  const [color, setColor] = useState('');
  const [pv, setPv] = useState('');
  const [notas, setNotas] = useState('');
  const [busy, setBusy] = useState(false);

  // Categorías base del enum Supabase + cualquier categoría custom ya en uso
  // (derivada del prefijo del id_sku para SKUs con cat="Otro" pero prefijo
  // distinto a OTR). Así si Julio crea "Controles" mañana, mañana ya
  // aparece en el dropdown.
  const baseCats = window.AT_CLIENT?.SKU_CATEGORIAS || ['Mouse', 'Teclado', 'Headset', 'Stand', 'Mouse Pad', 'Otro'];
  const KNOWN_PREFIX = { MOU: 'Mouse', TEC: 'Teclado', HEA: 'Headset', STA: 'Stand', PAD: 'Mouse Pad', OTR: 'Otro' };
  const customCatsInUse = [...new Set((data.skus || [])
    .map(s => {
      const prefix = (s.id || '').split('-')[0];
      if (KNOWN_PREFIX[prefix]) return null;  // standard prefix → ya está en baseCats
      // Custom prefix → necesita label. Usar el primer SKU de ese prefijo
      // con un nombre legible en notas o derivar.
      return prefix ? `[${prefix}] ${s.cat || 'Otro'}` : null;
    })
    .filter(Boolean))];
  const cats = [...baseCats, ...customCatsInUse];
  const CAT_CODE = { 'Mouse': 'MOU', 'Teclado': 'TEC', 'Headset': 'HEA', 'Stand': 'STA', 'Mouse Pad': 'PAD', 'Otro': 'OTR' };

  // Derivar prefijo y nombre visible para la categoría seleccionada
  // - Si es estándar → usar CAT_CODE
  // - Si es custom (showCustom=true) → primeras 3 letras del customCat
  const effectiveCat = showCustom ? customCat.trim() : cat;
  const catCode  = showCustom
    ? (customCat || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 3) || 'OTR'
    : (CAT_CODE[cat] || 'OTR');
  const mkCode   = (mk || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 3);
  const modCode  = (modelo || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const colCode  = (color || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 3);
  const skuId = [catCode, mkCode, modCode, colCode].filter(Boolean).join('-');
  const autoNm = [mk, modelo, color].filter(Boolean).join(' ');

  const valid = mkCode && modCode && colCode;

  const onSubmit = async () => {
    setBusy(true);
    try {
      // Para categorías custom (ej "Controles") el enum Supabase no las acepta,
      // así que guardamos 'Otro' como categoría y prefijo custom en el id_sku
      // (CTR-...). El nombre se enriquece con la categoría custom para que sea
      // visible en listas.
      const catToSave = showCustom ? 'Otro' : cat;
      const nameToSave = showCustom && customCat
        ? `[${customCat}] ${autoNm}`
        : autoNm;
      const res = await window.AT_CLIENT.createSKU({
        id: skuId, nm: nameToSave, mk, modelo, color, cat: catToSave,
        pv: Number(pv) || null, notas,
      });
      window.toastOk('SKU creado', `${res.id} · ${effectiveCat}`);
      setMk(''); setModelo(''); setColor(''); setPv(''); setNotas('');
      // Mantener la categoría custom seleccionada para crear varios SKUs seguidos
    } catch (e) {
      window.toastErr('No se pudo crear', e.message?.slice(0, 120));
    }
    setBusy(false);
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 'var(--s-4)' }}>
      <div className="row-4">
        <div className="field">
          <div className="field-label" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <span>Categoría</span>
            <button type="button" style={{
              background: 'none', border: 'none', color: 'var(--accent)',
              cursor: 'pointer', fontSize: 11, padding: 0,
            }} onClick={() => { setShowCustom(s => !s); if (!showCustom) setCustomCat(''); }}>
              {showCustom ? '← usar lista' : '+ nueva categoría'}
            </button>
          </div>
          {!showCustom ? (
            <select className="select" value={cat} onChange={e => setCat(e.target.value)}>
              {cats.map(c => <option key={c}>{c}</option>)}
            </select>
          ) : (
            <input className="input" value={customCat} onChange={e => setCustomCat(e.target.value)} placeholder="ej. Controles, Webcam, Cable…" autoFocus />
          )}
        </div>
        <div className="field">
          <div className="field-label">Marca</div>
          <input className="input" value={mk} onChange={e => setMk(e.target.value)} placeholder="HXSJ" />
        </div>
        <div className="field">
          <div className="field-label">Modelo</div>
          <input className="input" value={modelo} onChange={e => setModelo(e.target.value)} placeholder="T90 Pro" />
        </div>
        <div className="field">
          <div className="field-label">Color</div>
          <input className="input" value={color} onChange={e => setColor(e.target.value)} placeholder="Negro" />
        </div>
      </div>

      <div className="row">
        <div className="field">
          <div className="field-label">Precio venta sugerido (RD$)</div>
          <input className="input num" type="number" value={pv} onChange={e => setPv(e.target.value)} placeholder="opcional" />
        </div>
        <div className="field">
          <div className="field-label">Notas</div>
          <input className="input" value={notas} onChange={e => setNotas(e.target.value)} placeholder="opcional" />
        </div>
      </div>

      {valid && (
        <div className="summary">
          <div className="summary-item"><span className="lbl">ID generado</span><span className="val num">{skuId}</span></div>
          <div className="summary-item"><span className="lbl">Nombre</span><span className="val" style={{ fontSize: 13 }}>{showCustom && customCat ? `[${customCat}] ${autoNm}` : autoNm}</span></div>
          <div className="summary-item"><span className="lbl">Categoría</span><span className="val" style={{ fontSize: 13 }}>{effectiveCat || '—'}</span></div>
          <div className="summary-item"><span className="lbl">Precio</span><span className="val">{pv ? fmtCurrency(pv) : '—'}</span></div>
        </div>
      )}

      <div style={{ display: 'flex', gap: 8 }}>
        <button className="btn" disabled={!valid || busy} onClick={onSubmit}>
          {busy ? 'Creando…' : 'Crear SKU'}
        </button>
        <button className="btn ghost" disabled={busy} onClick={() => {
          setMk(''); setModelo(''); setColor(''); setPv(''); setNotas('');
        }}>Limpiar</button>
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════════
// App — sidebar nav + page switcher + global period filter + toasts
// ════════════════════════════════════════════════════════════════
function App() {
  const data = useATData();
  const [page, setPage] = useState('overview');
  const [period, setPeriod] = useState('todo');
  const [navCollapsed, setNavCollapsed] = useState(() => localStorage.getItem('nav-collapsed') === '1');
  useEffect(() => { localStorage.setItem('nav-collapsed', navCollapsed ? '1' : '0'); }, [navCollapsed]);

  // Computa # alertas para badge del sidebar
  const SK = window.buildSK ? window.buildSK() : (data.skus || []);
  const alertCount = SK.filter(s => s.estado === 'critico').length
                   + SK.filter(s => s.estado === 'atencion').length
                   + SK.filter(s => s.estado === 'en_reposicion').length;

  const pages = [
    { id: 'overview',    label: 'Resumen',     icon: '◉', badge: null },
    { id: 'alertas',     label: 'Alertas',     icon: '!', badge: alertCount, badgeColor: 'var(--danger)' },
    { id: 'ventas',      label: 'Ventas',      icon: '$', badge: (data.ventas || []).length },
    { id: 'inventario',  label: 'Inventario',  icon: '▤', badge: (data.skus || []).length },
    { id: 'movimientos', label: 'Movimientos', icon: '⇆', badge: (data.cashflow || []).length },
    { id: 'finanzas',    label: 'Finanzas',    icon: '∮', badge: null },
  ];

  const showPeriod = ['overview', 'ventas', 'movimientos'].includes(page);

  return (
    <div className={`app ${navCollapsed ? 'collapsed' : ''}`}>
      <aside className="nav" style={{
        position: 'relative',
        width: navCollapsed ? 56 : 224,
        minWidth: navCollapsed ? 56 : 224,
        maxWidth: navCollapsed ? 56 : 224,
        flex: `0 0 ${navCollapsed ? 56 : 224}px`,
      }}>
        <button className="nav-toggle" title={navCollapsed ? 'Expandir' : 'Colapsar'}
                onClick={() => setNavCollapsed(c => !c)}>
          {navCollapsed ? '›' : '‹'}
        </button>
        <div className="brand">
          <div className="brand-mark" title={navCollapsed ? 'JAMC.TECH · v3' : ''}>J</div>
          <div>
            <div className="brand-text">JAMC.TECH</div>
            <div className="brand-sub">v3 · Supabase</div>
          </div>
        </div>

        <div className="nav-section-label">General</div>
        {pages.map(p => (
          <div key={p.id} className={`nav-item ${page === p.id ? 'active' : ''}`}
               style={{ position: 'relative' }}
               onClick={() => setPage(p.id)}>
            <span className="nav-item-icon" style={p.badgeColor ? { color: p.badgeColor } : undefined}>{p.icon}</span>
            <span>{p.label}</span>
            {p.badge != null && p.badge > 0 && (
              <span className="nav-item-badge" style={p.badgeColor ? {
                background: p.badgeColor + '22', color: p.badgeColor,
              } : undefined}>{p.badge}</span>
            )}
          </div>
        ))}

        <div className="nav-section-label">Sistema</div>
        <div className="nav-item" onClick={() => window.AT_CLIENT?.refreshAll?.()}>
          <span className="nav-item-icon">↻</span>
          <span>Sincronizar</span>
        </div>
        <div className="nav-item" onClick={() => window.location.href = '/index-legacy.html'}>
          <span className="nav-item-icon">▦</span>
          <span>Bloomberg legacy</span>
        </div>

        <div style={{ marginTop: 'auto', padding: 'var(--s-3)', fontSize: 11, color: 'var(--text-4)' }}>
          <div>Build v3.0</div>
          <div>{fmtDate(window.HOY || HOY)} · Supabase ✓</div>
        </div>
      </aside>

      <main className="main">
        {showPeriod ? (
          <div style={{
            display: 'flex', justifyContent: 'flex-end', alignItems: 'center',
            position: 'sticky', top: 0, zIndex: 50,
            background: 'var(--bg)', padding: '10px 0',
            marginLeft: 'calc(-1 * var(--s-6))', marginRight: 'calc(-1 * var(--s-6))',
            paddingLeft: 'var(--s-6)', paddingRight: 'var(--s-6)',
            marginBottom: 'var(--s-4)',
            borderBottom: '1px solid var(--border)',
          }}>
            <PeriodFilter value={period} onChange={setPeriod} />
          </div>
        ) : <div style={{ paddingTop: 'var(--s-5)' }} />}
        {page === 'overview'    && <OverviewPage period={period} />}
        {page === 'alertas'     && <AlertasPage />}
        {page === 'ventas'      && <VentasPageExt period={period} />}
        {page === 'inventario'  && <InventarioPage />}
        {page === 'movimientos' && <MovimientosPage period={period} onNavigate={setPage} />}
        {page === 'finanzas'    && <FinanzasPage />}
      </main>
      <ToastStack />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
