<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>JAMC's Tech · v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
  /* ════════════════════════════════════════════════════════════════
     Design tokens — Modern data dashboard (inspired by Linear/Stripe)
     Mantiene oscuro pero con grises más sofisticados, menos contraste
     duro, tipografía Inter (system) + mono solo para números/IDs.
     ════════════════════════════════════════════════════════════════ */
  :root {
    /* ═══ Amber Terminal — dark cálido, fósforo ámbar (Bloomberg vibe) ═══ */
    /* Surfaces — base cálida (warm charcoal), no azulada */
    --bg:        #15130d;          /* page background (warm near-black) */
    --surface:   #1d1a12;          /* card background */
    --surface-2: #252016;          /* hover / nested */
    --surface-3: #2f291c;          /* dropdown / popover */
    --border:    #322c1d;          /* subtle borders */
    --border-2:  #453d29;          /* stronger borders */

    /* Text — tinte marfil cálido */
    --text:      #f1ead8;          /* primary */
    --text-2:    #bcb39c;          /* secondary */
    --text-3:    #847b64;          /* tertiary / labels */
    --text-4:    #564d3b;          /* disabled / placeholder */

    /* Brand & semantic */
    --accent:    #f2b53e;          /* primary — ámbar/oro (fósforo) */
    --accent-2:  #d89a1f;          /* amber hover/gradient */
    --accent-ink:#1a160c;          /* texto sobre fondo ámbar (alto contraste) */
    --accent-soft: rgba(242,181,62,0.12); /* tinte para hero/realces */
    --success:   #6fd08a;          /* positive, gains (verde) */
    --warning:   #ef9a3d;          /* warnings (naranja, distinto del ámbar) */
    --danger:    #f0726e;          /* losses, critical (rojo cálido) */
    --info:      #5fd0ff;          /* cyan para acentos de datos */
    --muted-pos: #5a9b6f;          /* desaturated positive */
    --muted-neg: #9b5a5a;

    /* Typography */
    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;

    /* Spacing scale (4pt system) */
    --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px;
    --s-5: 24px; --s-6: 32px; --s-7: 48px; --s-8: 64px;

    /* Radius */
    --r-sm: 6px; --r-md: 8px; --r-lg: 12px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow-x: hidden; }
  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    font-feature-settings: 'tnum', 'cv11';
    font-size: 14px;
    line-height: 1.5;
  }

  /* Number formatting — tabular figures */
  .num { font-family: var(--font-mono); font-feature-settings: 'tnum'; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 6px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-4); }

  /* ────────── Layout shell ────────── */
  .app { display: flex; height: 100vh; overflow: hidden; }
  .app > aside.nav { transition: width 220ms ease, flex-basis 220ms ease; box-sizing: border-box; height: 100vh; overflow: visible; }
  .app > main { flex: 1 1 auto; min-width: 0; height: 100vh; overflow-y: auto; overflow-x: hidden; }
  .app.collapsed .brand > div:not(.brand-mark) { display: none; }
  .app.collapsed .nav-section-label { opacity: 0; height: 0; padding: 0; overflow: hidden; }
  .app.collapsed .nav-item > span:not(.nav-item-icon) { display: none; }
  .app.collapsed .nav-item-badge { position: absolute; top: 2px; right: 2px; padding: 0 4px; font-size: 9px; }
  .app.collapsed .nav-item { justify-content: center; padding: 8px 4px; position: relative; }
  .app.collapsed .nav { padding: var(--s-3) var(--s-2); }
  .app.collapsed .brand { justify-content: center; padding: 0 0 var(--s-3) 0; }
  .app.collapsed aside > div[style*="margin-top: auto"] { display: none; }
  .nav-toggle {
    position: absolute; right: -14px; top: 20px; z-index: 10;
    width: 28px; height: 28px; border-radius: 50%; background: var(--surface);
    border: 1px solid var(--border); display: grid; place-items: center;
    cursor: pointer; font-size: 16px; font-weight: 600; color: var(--text-2);
    transition: all 120ms ease;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }
  .nav-toggle:hover { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); transform: scale(1.1); }

  /* Sidebar */
  .nav {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: var(--s-5) var(--s-3);
    display: flex; flex-direction: column; gap: var(--s-1);
    position: sticky; top: 0; height: 100vh;
  }
  .brand {
    display: flex; align-items: center; gap: var(--s-3);
    padding: 0 var(--s-3) var(--s-4) var(--s-3);
    margin-bottom: var(--s-4);
    border-bottom: 1px solid var(--border);
  }
  .brand-mark {
    width: 28px; height: 28px; border-radius: var(--r-sm);
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center;
    font-weight: 800; color: var(--accent-ink); font-size: 13px;
  }
  .brand-text { font-weight: 600; font-size: 13px; letter-spacing: -0.01em; }
  .brand-sub { font-size: 11px; color: var(--text-3); margin-top: -2px; }

  .nav-section-label {
    font-size: 10px; color: var(--text-3); text-transform: uppercase;
    letter-spacing: 0.08em; padding: var(--s-4) var(--s-3) var(--s-2);
  }
  .nav-item {
    display: flex; align-items: center; gap: var(--s-3);
    padding: 8px var(--s-3); border-radius: var(--r-sm);
    color: var(--text-2); cursor: pointer; user-select: none;
    font-size: 13px; font-weight: 500;
    transition: background 120ms ease, color 120ms ease;
  }
  .nav-item:hover { background: var(--surface-2); color: var(--text); }
  .nav-item.active { background: var(--surface-2); color: var(--text); }
  .nav-item.active::before {
    content: ''; position: absolute; left: 0; width: 3px; height: 18px;
    background: var(--accent); border-radius: 0 2px 2px 0;
  }
  .nav-item-icon { font-size: 14px; opacity: 0.7; width: 16px; text-align: center; }
  .nav-item-badge {
    margin-left: auto; font-size: 10px;
    background: var(--surface-3); color: var(--text-3);
    padding: 1px 6px; border-radius: 4px;
    font-family: var(--font-mono);
  }

  /* Main content */
  .main { padding: 0 var(--s-6) var(--s-5); width: 100%; }
  /* Asegurar que tablas y secciones ocupen el ancho disponible */
  .section table.data { width: 100%; }
  .section { width: 100%; }
  /* SVG charts responsivos: max-width 100% para que escalen al contenedor */
  .section svg { max-width: 100%; height: auto; display: block; }
  /* Tablas con scroll horizontal si exceden — evita columnas cortadas */
  .section { overflow-x: auto; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: var(--s-5);
  }
  .topbar h1 { margin: 0; font-size: 21px; font-weight: 600; letter-spacing: -0.02em; }
  .topbar .sub { font-size: 13px; color: var(--text-3); margin-top: 2px; }
  .topbar-actions { display: flex; align-items: center; gap: var(--s-2); }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface); border: 1px solid var(--border);
    padding: 6px 10px; border-radius: var(--r-sm);
    font-size: 12px; color: var(--text-2); cursor: pointer;
    transition: all 120ms ease;
  }
  .pill:hover { background: var(--surface-2); border-color: var(--border-2); }
  .pill-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); }

  /* ────────── KPI hero row ────────── */
  .kpi-row {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s-3);
    margin-bottom: var(--s-5);
  }
  .kpi {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r-md); padding: var(--s-3) var(--s-4);
    position: relative;
    transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
  }
  .kpi:hover {
    transform: translateY(-2px); border-color: var(--border-2);
    box-shadow: 0 6px 16px rgba(0,0,0,0.28);
  }
  .kpi-label {
    font-size: 11px; color: var(--text-3); text-transform: uppercase;
    letter-spacing: 0.06em; font-weight: 500;
  }
  .kpi-value {
    font-family: var(--font-mono); font-size: 23px; font-weight: 600;
    letter-spacing: -0.02em; line-height: 1.1; margin-top: 6px;
    color: var(--text);
  }
  .kpi-value .currency { font-size: 0.55em; opacity: 0.5; vertical-align: 0.3em; margin-right: 2px; }
  .kpi-delta {
    font-size: 12px; margin-top: var(--s-2); display: flex; align-items: center; gap: 4px;
    font-weight: 500;
  }
  .kpi-delta.pos { color: var(--success); }
  .kpi-delta.neg { color: var(--danger); }
  .kpi-delta.neutral { color: var(--text-3); }

  /* ────────── Section cards ────────── */
  .section {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r-md); padding: var(--s-4) var(--s-5);
    margin-bottom: var(--s-4);
  }
  .section-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: var(--s-3);
  }
  .section-title { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
  .section-desc { font-size: 12px; color: var(--text-3); margin-top: 2px; }

  /* Two-column grid for content */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-5); }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--s-4); }

  /* ────────── Table ────────── */
  table.data {
    width: 100%; border-collapse: collapse; font-size: 13px;
  }
  table.data th {
    text-align: left; padding: 7px 12px; color: var(--text-3);
    font-size: 11px; text-transform: uppercase; font-weight: 500; letter-spacing: 0.04em;
    border-bottom: 1px solid var(--border);
  }
  table.data td {
    padding: 8px 12px; border-bottom: 1px solid var(--border);
    color: var(--text-2);
  }
  table.data tbody tr { transition: background 130ms ease; }
  table.data tr:hover td { background: var(--surface-2); }
  /* Filas clicables: cursor + acento sutil al pasar el mouse */
  table.data tr[style*="cursor: pointer"]:hover td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
  table.data td.num { font-family: var(--font-mono); color: var(--text); }
  table.data td.right, table.data th.right { text-align: right; }
  table.data td.pos { color: var(--success); }
  table.data td.neg { color: var(--danger); }
  table.data td.muted { color: var(--text-3); }
  /* fix: th de columnas numéricas también deben right-align con el td */
  table.data th.num { font-family: var(--font-mono); }

  /* Inline badge inside table */
  .badge {
    display: inline-block; padding: 2px 8px; font-size: 10px; font-weight: 500;
    border-radius: 4px; letter-spacing: 0.02em;
  }
  .badge.success { background: rgba(95, 206, 141, 0.12); color: var(--success); }
  .badge.warning { background: rgba(240, 182, 88, 0.12); color: var(--warning); }
  .badge.danger  { background: rgba(239, 107, 126, 0.12); color: var(--danger); }
  .badge.neutral { background: var(--surface-3); color: var(--text-2); }

  /* Status indicators */
  .stat-card {
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--r-sm); padding: var(--s-4);
    display: flex; flex-direction: column; gap: 4px;
  }
  .stat-value { font-family: var(--font-mono); font-size: 20px; font-weight: 600; overflow-wrap: anywhere; word-break: break-word; }
  .stat-label { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.05em; }
  /* Permitir que grid-3 wrap si no caben las 3 columnas */
  .section .grid-3 { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }

  /* Charts */
  .chart-wrap { padding: var(--s-2); }

  /* Loader / empty */
  .empty {
    padding: var(--s-7); text-align: center; color: var(--text-3); font-size: 13px;
  }
  .loader {
    display: inline-block; width: 12px; height: 12px; border-radius: 50%;
    border: 2px solid var(--border-2); border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Button */
  .btn {
    background: var(--accent); color: var(--accent-ink); border: none;
    padding: 8px 14px; border-radius: var(--r-sm); cursor: pointer;
    font-family: inherit; font-size: 13px; font-weight: 600;
    transition: background 120ms ease;
  }
  .btn:hover { background: var(--accent-2); }
  .btn:disabled { background: var(--surface-3); color: var(--text-3); cursor: not-allowed; }
  .btn.ghost {
    background: transparent; border: 1px solid var(--border-2); color: var(--text-2);
  }
  .btn.ghost:hover { background: var(--surface-2); }

  /* ────────── Forms ────────── */
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field-label {
    font-size: 11px; color: var(--text-3); text-transform: uppercase;
    letter-spacing: 0.06em; font-weight: 500;
  }
  .field-hint { font-size: 11px; color: var(--text-4); margin-top: 2px; }
  .input, .select, .textarea {
    background: var(--surface-2); border: 1px solid var(--border);
    color: var(--text); font-family: inherit; font-size: 13px;
    padding: 8px 10px; border-radius: var(--r-sm); outline: none;
    transition: border-color 120ms ease;
    width: 100%;
  }
  .input:focus, .select:focus, .textarea:focus { border-color: var(--accent); }
  .input.num, .select.num { font-family: var(--font-mono); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-3); }
  .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--s-3); }
  .row-4 { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: var(--s-3); }

  /* SKU line item in form */
  .line-row {
    display: grid; grid-template-columns: 2fr 80px 100px 100px 40px;
    gap: var(--s-2); align-items: center; padding: 8px 0;
    border-bottom: 1px solid var(--border);
  }
  .icon-btn {
    background: transparent; border: 1px solid var(--border); color: var(--text-3);
    cursor: pointer; padding: 4px 8px; border-radius: var(--r-sm);
    font-size: 14px; line-height: 1; transition: all 120ms ease;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); border-color: var(--border-2); }
  .icon-btn.danger:hover { color: var(--danger); border-color: var(--danger); }
  /* Action cell helper: contiene los botones ✎/× sin romper la grid del td.
     Antes usábamos `td style={{display:'flex'}}` lo cual rompe display:table-cell
     y descuadra columnas. Esta clase lo hace seguro. */
  .row-actions { white-space: nowrap; }
  .row-actions-inner { display: inline-flex; gap: 4px; align-items: center; }

  /* ────────── Modal ────────── */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    display: grid; place-items: center; z-index: 100;
    animation: fadeIn 150ms ease;
  }
  .modal {
    background: var(--surface); border: 1px solid var(--border-2);
    border-radius: var(--r-lg); padding: var(--s-5);
    min-width: 360px; max-width: 90vw; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    animation: slideUp 180ms ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .modal-title { font-size: 16px; font-weight: 600; margin-bottom: var(--s-2); }
  .modal-body { font-size: 13px; color: var(--text-2); margin-bottom: var(--s-4); line-height: 1.5; }
  .modal-actions { display: flex; justify-content: flex-end; gap: var(--s-2); }

  /* ────────── Toast ────────── */
  .toast-stack {
    position: fixed; bottom: var(--s-4); right: var(--s-4); z-index: 200;
    display: flex; flex-direction: column; gap: var(--s-2); pointer-events: none;
  }
  .toast {
    background: var(--surface); border: 1px solid var(--border-2);
    border-left: 3px solid var(--accent);
    border-radius: var(--r-sm); padding: 10px 14px;
    min-width: 260px; max-width: 400px; pointer-events: auto;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    animation: slideInRight 200ms ease;
  }
  .toast.success { border-left-color: var(--success); }
  .toast.error   { border-left-color: var(--danger); }
  .toast.warning { border-left-color: var(--warning); }
  .toast-title { font-size: 12px; font-weight: 600; margin-bottom: 2px; }
  .toast-msg { font-size: 12px; color: var(--text-2); line-height: 1.4; }
  @keyframes slideInRight { from { transform: translateX(20px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* ────────── Tabs (inline) ────────── */
  .tabs {
    display: flex; border-bottom: 1px solid var(--border);
    margin-bottom: var(--s-4); gap: 2px;
  }
  .tab {
    background: transparent; border: none; color: var(--text-3);
    padding: 10px 16px; cursor: pointer; font-family: inherit;
    font-size: 13px; font-weight: 500;
    border-bottom: 2px solid transparent;
    transition: all 120ms ease;
  }
  .tab:hover { color: var(--text-2); }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }

  /* Period filter */
  .period-bar {
    display: flex; align-items: center; gap: var(--s-2);
    background: var(--surface); border: 1px solid var(--border);
    padding: 4px; border-radius: var(--r-sm);
  }
  .period-bar button {
    background: transparent; border: none; color: var(--text-3);
    padding: 4px 10px; font-family: inherit; font-size: 11px;
    font-weight: 500; cursor: pointer; border-radius: 4px;
    transition: all 120ms ease;
  }
  .period-bar button:hover { color: var(--text); }
  .period-bar button.active { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

  /* Summary panel inside forms */
  .summary {
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--r-sm); padding: var(--s-3) var(--s-4);
    display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s-3);
    margin-top: var(--s-3);
  }
  .summary-item { display: flex; flex-direction: column; }
  .summary-item .lbl { font-size: 10px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; }
  .summary-item .val { font-family: var(--font-mono); font-size: 16px; font-weight: 600; margin-top: 2px; }

  /* Responsive — basic */
  @media (max-width: 1024px) {
    .kpi-row { grid-template-columns: repeat(2, 1fr); }
    .grid-2 { grid-template-columns: 1fr; }
    .row, .row-3, .row-4 { grid-template-columns: 1fr; }
  }
  @media (max-width: 768px) {
    .nav { display: none; }
    .main { padding: var(--s-4); }
    .kpi-row { grid-template-columns: 1fr 1fr; gap: var(--s-3); }
    .topbar h1 { font-size: 18px; }
    .line-row { grid-template-columns: 1fr; gap: 6px; }
    .summary { grid-template-columns: 1fr 1fr; }
  }

  /* ────────── Micro-interacciones (más dinámico) ────────── */
  /* Feedback de pulsación: el control "se hunde" levemente al presionar */
  .btn:active:not(:disabled), .pill:active, .tab:active,
  .period-bar button:active, .nav-item:active { transform: scale(0.97); }
  .icon-btn:active { transform: scale(0.9); }
  .btn, .pill, .tab, .period-bar button, .icon-btn { transition: all 130ms ease; }
  /* Indicador animado de la pestaña activa */
  .tab { position: relative; }
  .tab.active::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: -1px;
    height: 2px; background: var(--accent); border-radius: 2px;
    animation: tabIn 200ms ease;
  }
  @keyframes tabIn { from { transform: scaleX(0.4); opacity: 0; } to { transform: none; opacity: 1; } }
  /* Barras de progreso/utilización animadas */
  .ui-bar > div { transition: width 450ms cubic-bezier(0.22,1,0.36,1); }

  /* ────────── Entrada escalonada (stagger) ────────── */
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .section { animation: rise 260ms ease both; }
  .kpi { animation: rise 240ms ease both; }
  .kpi-row .kpi:nth-child(2) { animation-delay: 45ms; }
  .kpi-row .kpi:nth-child(3) { animation-delay: 90ms; }
  .kpi-row .kpi:nth-child(4) { animation-delay: 135ms; }

  /* ────────── Accesibilidad: foco visible por teclado ────────── */
  a:focus-visible, button:focus-visible, .btn:focus-visible, .pill:focus-visible,
  .tab:focus-visible, .nav-item:focus-visible, .icon-btn:focus-visible,
  .period-bar button:focus-visible, input:focus-visible, select:focus-visible,
  textarea:focus-visible, [role="button"]:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px;
  }
  .nav-item:focus-visible, .tab:focus-visible { outline-offset: -2px; }

<body>

<div id="root"></div>

<script type="text/babel" data-presets="react">
// ════════════════════════════════════════════════════════════════
// Dashboard v3 — Modern data dashboard, mantiene funcionalidades
// del sistema (supabase-client.js + AT_CLIENT writers). Layout
// inspirado en Linear/Stripe: sidebar navegación, KPI hero row,
// cards modulares con jerarquía clara. Diseño basado en guidelines
// del skill ui-ux-pro-max (Minimalism, whitespace-balance, etc.)
// ════════════════════════════════════════════════════════════════

const { useState, useEffect, useMemo } = React;

// ─── Format helpers ─────────────────────────────────────────────
const fmtCurrency = (n, opts = {}) => {
  if (n == null || isNaN(n)) return '—';
  const abs = Math.abs(n);
  const formatted = abs.toLocaleString('es-DO', { maximumFractionDigits: 0 });
  return (n < 0 ? '-' : '') + 'RD$' + formatted;
};
// ─── Moneda: tasa USD→RD$ configurable (Julio la elige) + helpers ───
const getTasaUSD = () => { const v = Number(localStorage.getItem('tasa-cambio-usd')); return v > 0 ? v : 60; };
const setTasaUSD = (v) => { const n = Number(v); if (n > 0) localStorage.setItem('tasa-cambio-usd', String(n)); };
const esUSD = (moneda) => /usd|us\$/i.test(String(moneda || ''));
// Muestra el monto en SU moneda nativa: US$ para USD, RD$ para el resto.
const fmtMoneda = (n, moneda) => {
  if (n == null || isNaN(n)) return '—';
  const formatted = Math.abs(n).toLocaleString('es-DO', { maximumFractionDigits: 0 });
  return (n < 0 ? '-' : '') + (esUSD(moneda) ? 'US$' : 'RD$') + formatted;
};
// Convierte a RD$ (USD × tasa) para consolidar en totales.
const toRD = (n, moneda) => esUSD(moneda) ? (Number(n) || 0) * getTasaUSD() : (Number(n) || 0);
const fmtNum = (n, dec = 0) => {
  if (n == null || isNaN(n)) return '—';
  return Number(n).toLocaleString('es-DO', { minimumFractionDigits: dec, maximumFractionDigits: dec });
};
const fmtPct = (n) => (n == null || isNaN(n)) ? '—' : (n >= 0 ? '+' : '') + n.toFixed(1) + '%';
const fmtDate = (s) => {
  if (!s) return '—';
  const [y, m, d] = s.split('-');
  return `${d}/${m}/${y.slice(2)}`;
};

// Hook: re-render cuando supabase actualiza una tabla
function useATData() {
  const [tick, setTick] = useState(0);
  useEffect(() => {
    const onLoad = () => setTick((t) => t + 1);
    window.addEventListener('airtable-loaded', onLoad);
    // Fuerza una re-evaluación tras montar para capturar datos que pudieron
    // haberse cargado ANTES de que este componente montara (race condition:
    // el loader emite 'airtable-loaded' antes de que el listener esté
    // attached, así que sin este tick inicial el componente queda con la
    // vista vacía hasta el próximo evento).
    setTick((t) => t + 1);
    return () => window.removeEventListener('airtable-loaded', onLoad);
  }, []);
  return window.__AIRTABLE_DATA__ || {};
}

// ─── KPI card ───────────────────────────────────────────────────
function KPI({ label, value, delta, deltaLabel, currency }) {
  const cls = delta == null ? 'neutral' : (delta > 0 ? 'pos' : delta < 0 ? 'neg' : 'neutral');
  const arrow = delta == null ? '' : (delta > 0 ? '↗' : delta < 0 ? '↘' : '→');
  // Siempre renderear la fila inferior (delta / deltaLabel) para mantener
  // altura uniforme entre KPIs. Si no hay nada que mostrar, usa &nbsp;
  // para reservar el espacio.
  const hasContent = delta != null || (deltaLabel && deltaLabel.length > 0);
  return (
    <div className="kpi">
      <div className="kpi-label">{label}</div>
      <div className="kpi-value">
        {currency && <span className="currency">RD$</span>}
        {value}
      </div>
      <div className={`kpi-delta ${cls}`} style={{ minHeight: 18 }}>
        {delta != null && (
          <>
            <span>{arrow}</span>
            <span>{fmtPct(delta)}</span>
          </>
        )}
        {deltaLabel && <span style={{ color: 'var(--text-3)', marginLeft: delta != null ? 2 : 0 }}>{deltaLabel}</span>}
        {!hasContent && <span>&nbsp;</span>}
      </div>
    </div>
  );
}

// ─── Mini bar chart inline ──────────────────────────────────────
function MiniBars({ values, w = 80, h = 28, color = 'var(--accent)' }) {
  if (!values || values.length === 0) return null;
  const max = Math.max(...values, 1);
  const bw = w / values.length;
  return (
    <svg width={w} height={h}>
      {values.map((v, i) => {
        const bh = (v / max) * h;
        return <rect key={i} x={i * bw + 0.5} y={h - bh} width={bw - 1} height={bh} fill={color} opacity={0.7} />;
      })}
    </svg>
  );
}

// ─── Sparkline ──────────────────────────────────────────────────
function Sparkline({ values, w = 200, h = 50, color = 'var(--accent)' }) {
  if (!values || values.length < 2) return null;
  const max = Math.max(...values);
  const min = Math.min(...values);
  const range = max - min || 1;
  const points = values.map((v, i) => {
    const x = (i / (values.length - 1)) * w;
    const y = h - ((v - min) / range) * (h - 6) - 3;
    return `${x},${y}`;
  }).join(' ');
  const areaPoints = `0,${h} ${points} ${w},${h}`;
  return (
    <svg width={w} height={h}>
      <polygon points={areaPoints} fill={color} opacity={0.1} />
      <polyline points={points} fill="none" stroke={color} strokeWidth={1.5} />
    </svg>
  );
}

// Helper: medir ancho del container y re-render cuando cambie.
function useContainerWidth() {
  const ref = React.useRef(null);
  const [w, setW] = React.useState(800);
  React.useLayoutEffect(() => {
    if (!ref.current) return;
    const measure = () => { if (ref.current) setW(ref.current.offsetWidth); };
    measure();
    const ro = new ResizeObserver(measure);
    ro.observe(ref.current);
    return () => ro.disconnect();
  }, []);
  return [ref, w];
}

// LineChart responsivo: ocupa todo el ancho del container, usa viewBox para escalar.
// Si labels son muchos (>15), se muestran salteados (cada N) para que no se amontonen.
function LineChart({ values, labels = [], h = 200, color = 'var(--accent)', fmt = (n) => n.toLocaleString('en-US'), title = '', yTicks = 4 }) {
  const [ref, containerW] = useContainerWidth();
  if (!values || values.length < 2) return <div ref={ref} className="muted" style={{ fontSize: 12, padding: 16 }}>Sin datos suficientes</div>;
  const w = Math.max(320, containerW);
  const PAD_L = 64, PAD_R = 16, PAD_T = 10, PAD_B = 28;
  const cw = w - PAD_L - PAD_R, ch = h - PAD_T - PAD_B;
  const max = Math.max(...values);
  const min = Math.min(0, Math.min(...values));
  const range = (max - min) || 1;
  const x = (i) => PAD_L + (i / Math.max(1, values.length - 1)) * cw;
  const y = (v) => PAD_T + ch - ((v - min) / range) * ch;
  const points = values.map((v, i) => `${x(i)},${y(v)}`).join(' ');
  const areaPoints = `${PAD_L},${PAD_T + ch} ${points} ${PAD_L + cw},${PAD_T + ch}`;
  const ticks = Array.from({ length: yTicks + 1 }, (_, i) => min + (range * i / yTicks));
  // Si hay muchos labels, mostrar cada Nth para evitar overlap
  const labelEvery = Math.max(1, Math.ceil(values.length / Math.floor(cw / 60)));
  return (
    <div ref={ref} style={{ width: '100%', position: 'relative' }}>
      {title && <div style={{ fontSize: 11, color: 'var(--text-3)', marginBottom: 4, letterSpacing: '0.04em', textTransform: 'uppercase' }}>{title}</div>}
      <svg width="100%" height={h} viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none" style={{ display: 'block' }}>
        {ticks.map((t, i) => (
          <g key={i}>
            <line x1={PAD_L} y1={y(t)} x2={PAD_L + cw} y2={y(t)} stroke="var(--border)" strokeDasharray="2 4" strokeWidth={0.5} />
            <text x={PAD_L - 8} y={y(t) + 3} fontSize={10} fill="var(--text-3)" textAnchor="end" fontFamily="var(--font-mono)">{fmt(t)}</text>
          </g>
        ))}
        <polygon points={areaPoints} fill={color} opacity={0.12} />
        <polyline points={points} fill="none" stroke={color} strokeWidth={1.8} />
        {values.map((v, i) => (
          <circle key={i} cx={x(i)} cy={y(v)} r={3} fill={color}>
            <title>{(labels[i] || `#${i+1}`) + ': ' + fmt(v)}</title>
          </circle>
        ))}
        {labels.map((l, i) => (i % labelEvery === 0 || i === labels.length - 1) && (
          <text key={i} x={x(i)} y={h - 8} fontSize={10} fill="var(--text-3)" textAnchor="middle" fontFamily="var(--font-mono)">{l}</text>
        ))}
      </svg>
    </div>
  );
}

// BarChart responsivo: barras horizontales. Trunca labels largos con ellipsis CSS
// y reserva ancho proporcional al texto del label más largo.
function BarChart({ data, h = 180, color = 'var(--accent)', fmt = (n) => n.toLocaleString('en-US'), title = '' }) {
  const [ref, containerW] = useContainerWidth();
  if (!data || data.length === 0) return <div ref={ref} className="muted" style={{ fontSize: 12, padding: 16 }}>Sin datos</div>;
  const w = Math.max(320, containerW);
  // Reserva ancho para label = min(35% del ancho, 160px); resto para barras.
  const PAD_L = Math.min(180, Math.max(80, w * 0.28));
  const PAD_R = 72, PAD_T = 4, PAD_B = 4;
  const max = Math.max(...data.map(d => d.value));
  const barH = 22;
  const cw = w - PAD_L - PAD_R;
  const svgH = (barH + 8) * data.length + PAD_T + PAD_B;
  return (
    <div ref={ref} style={{ width: '100%' }}>
      {title && <div style={{ fontSize: 11, color: 'var(--text-3)', marginBottom: 6, letterSpacing: '0.04em', textTransform: 'uppercase' }}>{title}</div>}
      <svg width="100%" height={svgH} viewBox={`0 0 ${w} ${svgH}`} preserveAspectRatio="xMinYMin meet" style={{ display: 'block' }}>
        {data.map((d, i) => {
          const yPos = i * (barH + 8) + PAD_T;
          const bw = max > 0 ? (Math.abs(d.value) / max) * cw : 0;
          // Trunca label si es muy largo (~18 chars)
          const maxChars = Math.max(8, Math.floor(PAD_L / 7));
          const lblShort = d.label.length > maxChars ? d.label.slice(0, maxChars - 1) + '…' : d.label;
          return (
            <g key={i}>
              <text x={PAD_L - 8} y={yPos + barH/2 + 4} fontSize={11} fill="var(--text-2)" textAnchor="end">
                {lblShort}
                <title>{d.label}</title>
              </text>
              <rect x={PAD_L} y={yPos} width={bw} height={barH} fill={d.color || color} opacity={0.85} rx={2} />
              <text x={PAD_L + bw + 6} y={yPos + barH/2 + 4} fontSize={11} fill="var(--text)" fontFamily="var(--font-mono)">{fmt(d.value)}</text>
            </g>
          );
        })}
      </svg>
    </div>
  );
}

// Donut chart pequeño con leyenda — ideal para mix categórico (estados SKU, métodos pago, etc).
function DonutChart({ data, size = 180, strokeW = 26, fmt = (n, p) => `${n.toLocaleString('en-US')} (${p.toFixed(1)}%)`, title = '' }) {
  if (!data || data.length === 0) return null;
  const total = data.reduce((s, d) => s + d.value, 0) || 1;
  const cx = size / 2, cy = size / 2, r = size / 2 - strokeW / 2;
  const circumference = 2 * Math.PI * r;
  let offset = 0;
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 24, width: '100%' }}>
      <svg width={size} height={size} style={{ flexShrink: 0 }}>
        <circle cx={cx} cy={cy} r={r} fill="none" stroke="var(--border)" strokeWidth={strokeW} />
        {data.map((d, i) => {
          const len = (d.value / total) * circumference;
          const seg = (
            <circle key={i} cx={cx} cy={cy} r={r} fill="none"
              stroke={d.color} strokeWidth={strokeW}
              strokeDasharray={`${len} ${circumference - len}`}
              strokeDashoffset={-offset}
              transform={`rotate(-90 ${cx} ${cy})`} />
          );
          offset += len;
          return seg;
        })}
        <text x={cx} y={cy - 2} textAnchor="middle" fontSize={16} fontWeight={600} fontFamily="var(--font-mono)" fill="var(--text)">{total.toLocaleString('en-US')}</text>
        <text x={cx} y={cy + 16} textAnchor="middle" fontSize={9} fill="var(--text-3)" style={{ textTransform: 'uppercase' }} letterSpacing={0.6}>{title || 'TOTAL'}</text>
      </svg>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 10, fontSize: 13, flex: 1, minWidth: 0 }}>
        {data.map((d, i) => (
          <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '4px 8px', borderRadius: 4, background: 'var(--surface-2)' }}>
            <span style={{ width: 12, height: 12, background: d.color, borderRadius: 3, flexShrink: 0 }} />
            <span style={{ color: 'var(--text-2)', fontWeight: 500 }}>{d.label}</span>
            <span style={{ color: 'var(--text-3)', marginLeft: 'auto', fontFamily: 'var(--font-mono)', fontSize: 12 }}>{fmt(d.value, (d.value / total) * 100)}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── Pages ───────────────────────────────────────────────────────
function OverviewPage({ period }) {
  const data = useATData();
  const allVentas = data.ventas || [];
  const allCf = data.cashflow || [];
  const SK = data.skus || [];
  const [topMetric, setTopMetric] = useState('revenue'); // revenue | ganancia | uds

  // ── Filtrado por período ──────────────────────────────────────
  const ventas = filterByPeriod(allVentas, period, 'fecha');
  const cf = filterByPeriod(allCf, period, 'f');

  // KPIs principales (sobre período)
  const totalVentas   = ventas.reduce((s, v) => s + (v.precioFacturadoTotal || 0), 0);
  const totalGanancia = ventas.reduce((s, v) => s + (v.gananciaTotal || 0), 0);
  const margenPct     = totalVentas > 0 ? (totalGanancia / totalVentas) * 100 : 0;

  // Balance acumulado del PERÍODO + capital actual (todo histórico)
  const balancePeriodo = cf.reduce((s, m) => s + (m.e || 0) - (m.s || 0), 0);
  const cashFlowNeto   = allCf.reduce((s, m) => s + (m.e || 0) - (m.s || 0), 0);
  // "Capital actual" = saldos vivos de cuentas DEBITO + EFECTIVO (lo que tienes
  // disponible). Excluye CREDITO porque son deudas, no capital propio.
  // Si no hay cuentas reales aun, fallback al cash flow neto.
  let capitalActual = cashFlowNeto;
  let cuentasLiquidasCount = 0;
  try {
    const cuentasArr = Array.isArray(data._cuentas) ? data._cuentas : [];
    const cuentasLiquidas = cuentasArr.filter(c =>
      c && (c.tipo === 'DEBITO' || c.tipo === 'EFECTIVO')
    );
    cuentasLiquidasCount = cuentasLiquidas.length;
    if (cuentasLiquidas.length > 0 && Array.isArray(window.BANCOS_SEED)) {
      const RATE = Number(localStorage.getItem('tasa-cambio-usd')) || 60;
      capitalActual = window.BANCOS_SEED
        .filter(b => b && cuentasLiquidas.some(c => c.id === b._cuentaId))
        .reduce((s, b) => {
          const saldo = Number(b.saldo) || 0;
          // Cuentas en USD se convierten a RD$ a la tasa (b.moneda viene 'USD' o 'DOP').
          const enRD = (b.moneda === 'USD' || b.moneda === 'USD$') ? saldo * RATE : saldo;
          return s + enRD;
        }, 0);
    }
  } catch (e) { /* fallback al cashFlowNeto */ }

  // Deuda total = COOP saldo + ANDREA pendiente + BHD usado
  const deudaTotal = (window.COOP?.saldo || 0) + (window.ANDREA?.pendiente || 0) + (window.BHD?.usado || 0);

  // Crecimiento mes a mes — sobre meses COMPLETOS. El mes en curso es parcial
  // (pocos días) y daría un MoM falso muy negativo; lo excluimos.
  const MES = window.MES || [];
  const _curYM = String(window.HOY || '').slice(0, 7);
  const _mesCompletos = _curYM ? MES.filter(x => (x.f || '').slice(0, 7) < _curYM) : MES;
  const _mesBase = _mesCompletos.length >= 2 ? _mesCompletos : MES;
  const lastMo = _mesBase[_mesBase.length - 1];
  const prevMo = _mesBase[_mesBase.length - 2];
  const growthMoM = (lastMo && prevMo && prevMo.v) ? ((lastMo.v - prevMo.v) / prevMo.v) * 100 : null;

  // Series para sparklines
  const ventasSeries = MES.map(m => m.v);

  // SKU criticos
  const SKbuilt = window.buildSK ? window.buildSK() : SK;
  const criticos = SKbuilt.filter(s => s.estado === 'critico').length;
  const atencion = SKbuilt.filter(s => s.estado === 'atencion').length;

  // Movimientos recientes del período
  const recientes = cf.slice(0, 10);

  // ── Cash Flow breakdown — Op vs Fin ───────────────────────────
  const opCats  = ['VENTA','ENVIO_COBRADO','COMPRA_MERCANCIA','COMPRA_OPERATIVA','ENVIO_LOTE','PAGO_ADS','PAGO_COMISION','PAGO_TRANSPORTE','REFUND_PROVEEDOR','REFUND_CLIENTE','OTROS'];
  const finCats = ['APORTE_DUENO','APORTE_INVERSOR','PAGO_PRESTAMO','PAGO_LINEA_CREDITO','PAGO_TARJETA_CREDITO','PAGO_INTERESES','PAGO_INVERSOR','DRAWDOWN','FEE_BANCARIO','TRANSFERENCIA_INTERNA','AJUSTE'];
  const isFin = (m) => {
    // m.naturaleza puede venir como 'FINANCIERO' o 'CASHFLOW'.
    if (m.naturaleza) return m.naturaleza === 'FINANCIERO';
    // Fallback por categoría/concepto.
    const c = (m.c || m.concepto || '').toLowerCase();
    return /préstamo|prestamo|interés|interes|línea|linea|tarjeta|inversor|aporte|drawdown|fee|transferencia/i.test(c);
  };
  const opMovs  = cf.filter(m => !isFin(m));
  const finMovs = cf.filter(m =>  isFin(m));
  const opE  = opMovs.reduce((s, m) => s + (m.e || 0), 0);
  const opS  = opMovs.reduce((s, m) => s + (m.s || 0), 0);
  const finE = finMovs.reduce((s, m) => s + (m.e || 0), 0);
  const finS = finMovs.reduce((s, m) => s + (m.s || 0), 0);
  const ventasCF = opMovs.filter(m => /venta/i.test(m.c || '')).reduce((s, m) => s + (m.e || 0), 0);
  const comprasMerc = opMovs.filter(m => /compra de mercanc/i.test(m.c || '')).reduce((s, m) => s + (m.s || 0), 0);
  const gastosOp = opS - comprasMerc;
  const pagosPrest = finMovs.filter(m => /préstamo|prestamo/i.test(m.c || '')).reduce((s, m) => s + (m.s || 0), 0);
  const intereses  = finMovs.filter(m => /interés|interes/i.test(m.c || '')).reduce((s, m) => s + (m.s || 0), 0);
  const aportes    = finMovs.filter(m => /aporte/i.test(m.c || '')).reduce((s, m) => s + (m.e || 0), 0);

  // ── Top SKUs por revenue del período ──────────────────────────
  const skuStats = {};
  const skuLookup = {};
  (data.skus || []).forEach(s => { skuLookup[s._airtableId || s.id_sku || s.id] = s.nm || s.nombre; });
  ventas.forEach(v => {
    (v.lineas || []).forEach(li => {
      const k = li.skuLinked || li.skuRef || 'LEGACY';
      const revenue = (li.baseCost || 0) + (li.ganancia || 0);
      if (!skuStats[k]) skuStats[k] = { sku: k, nombre: skuLookup[k] || k, revenue: 0, uds: 0, ganancia: 0 };
      skuStats[k].revenue  += revenue;
      skuStats[k].uds      += li.qty || 1;
      skuStats[k].ganancia += li.ganancia || 0;
    });
  });
  const allSkuStats = Object.values(skuStats).filter(s => s.sku !== 'LEGACY-SALE' && s.sku !== 'LEGACY' && !/^legacy/i.test(s.nombre || ''));
  const topSkusByRevenue  = [...allSkuStats].sort((a, b) => b.revenue  - a.revenue ).slice(0, 10);
  const topSkusByGanancia = [...allSkuStats].sort((a, b) => b.ganancia - a.ganancia).slice(0, 10);
  const topSkusByUds      = [...allSkuStats].sort((a, b) => b.uds      - a.uds     ).slice(0, 10);
  const topSkus = topSkusByRevenue;  // default

  // ── Series mensuales del PERÍODO filtrado ─────────────────────
  // Agrupa ventas/cf por mes YYYY-MM dentro del rango del filtro y
  // computa series para charts. Si el filtro es "todo", usa todos los meses.
  const periodRange = periodToRange(period); // null si todo
  // Build the set of YYYY-MM that fall in range (or all from data if todo)
  const monthsInRange = (() => {
    const set = new Set();
    ventas.forEach(v => v.fecha && set.add(v.fecha.slice(0, 7)));
    cf.forEach(m => m.f && set.add(m.f.slice(0, 7)));
    return [...set].sort();
  })();
  const monthLabel = (ym) => {
    const [y, m] = ym.split('-');
    return `${MES_NAMES[parseInt(m, 10) - 1]}-${y.slice(2)}`;
  };
  const mesLabelsPeriod = monthsInRange.map(monthLabel);
  // Ventas y ganancia por mes (filtrado por período)
  const ventasByMonth = {};
  const ganxMonth = {};
  ventas.forEach(v => {
    if (!v.fecha) return;
    const ym = v.fecha.slice(0, 7);
    ventasByMonth[ym] = (ventasByMonth[ym] || 0) + (v.precioFacturadoTotal || 0);
    ganxMonth[ym]    = (ganxMonth[ym]    || 0) + (v.gananciaTotal     || 0);
  });
  const ventasSeriePeriod   = monthsInRange.map(ym => ventasByMonth[ym] || 0);
  const gananciaSeriePeriod = monthsInRange.map(ym => ganxMonth[ym]    || 0);
  const margenSeriePeriod   = monthsInRange.map(ym => {
    const v = ventasByMonth[ym] || 0, g = ganxMonth[ym] || 0;
    return v > 0 ? (g / v) * 100 : 0;
  });
  // Balance acumulado en el período (suma rolling de cf filtrado)
  const cfByMonth = {};
  cf.forEach(m => {
    if (!m.f) return;
    const ym = m.f.slice(0, 7);
    if (!cfByMonth[ym]) cfByMonth[ym] = { e: 0, s: 0 };
    cfByMonth[ym].e += m.e || 0;
    cfByMonth[ym].s += m.s || 0;
  });
  // Para el balance, si el período es "todo" arrancamos desde 0;
  // si es un rango menor, arrancamos desde el saldo previo al rango (offset).
  let priorBalance = 0;
  if (periodRange) {
    priorBalance = allCf.filter(m => m.f && m.f < periodRange.from)
                       .reduce((s, m) => s + (m.e || 0) - (m.s || 0), 0);
  }
  const balSeries = [];
  const balLabels = mesLabelsPeriod;
  let accBal = priorBalance;
  monthsInRange.forEach(ym => {
    const c = cfByMonth[ym] || { e: 0, s: 0 };
    accBal += (c.e - c.s);
    balSeries.push(accBal);
  });

  // ── KPIs adicionales ──────────────────────────────────────────
  const ticketProm    = ventas.length > 0 ? totalVentas / ventas.length : 0;
  const ganxVenta     = ventas.length > 0 ? totalGanancia / ventas.length : 0;
  const totalUds      = ventas.reduce((s, v) => s + (v.cantidadTotal || 0), 0);
  const udsxVenta     = ventas.length > 0 ? totalUds / ventas.length : 0;
  const stockTotal    = SKbuilt.reduce((s, x) => s + (x.s || 0), 0);
  const enCaminoTotal = SKbuilt.reduce((s, x) => s + (x.enCamino || 0), 0);
  const capitalStock  = SKbuilt.reduce((s, x) => s + ((x.s || 0) * (x.cpp || 0)), 0);
  const skusActivos   = SKbuilt.filter(s => s.estado !== 'sin_movimiento').length;
  const numLotes      = (data.lotes || []).length;
  const lotesEnCamino = (data.lotes || []).filter(l => l.status === 'En Camino').length;

  // Si el período abarca pocos meses (1-2), agrupa por DÍA en vez de mes
  // para que los charts no se queden con 1-2 puntos. Si abarca muchos meses,
  // agrupa por mes.
  const useDaily = monthsInRange.length <= 2 && periodRange;
  let mesLabels, ventasSerie, gananciaSerie, margenSerie;
  let balLabelsLocal, balSeriesLocal;
  if (useDaily) {
    // Generar lista de días dentro del rango (inclusive)
    const days = [];
    const dFrom = new Date(periodRange.from), dTo = new Date(periodRange.to);
    for (let d = new Date(dFrom); d <= dTo; d.setDate(d.getDate() + 1)) {
      days.push(d.toISOString().slice(0, 10));
    }
    const ventasByDay = {}, ganxDay = {}, cfByDay = {};
    ventas.forEach(v => { if (!v.fecha) return; ventasByDay[v.fecha] = (ventasByDay[v.fecha] || 0) + (v.precioFacturadoTotal || 0); ganxDay[v.fecha] = (ganxDay[v.fecha] || 0) + (v.gananciaTotal || 0); });
    cf.forEach(m => { if (!m.f) return; if (!cfByDay[m.f]) cfByDay[m.f] = { e: 0, s: 0 }; cfByDay[m.f].e += m.e || 0; cfByDay[m.f].s += m.s || 0; });
    mesLabels     = days.map(d => d.slice(5));  // MM-DD
    ventasSerie   = days.map(d => ventasByDay[d] || 0);
    gananciaSerie = days.map(d => ganxDay[d]    || 0);
    margenSerie   = days.map(d => { const v = ventasByDay[d] || 0, g = ganxDay[d] || 0; return v > 0 ? (g / v) * 100 : 0; });
    let acc = priorBalance;
    balLabelsLocal = mesLabels;
    balSeriesLocal = days.map(d => { const c = cfByDay[d] || { e: 0, s: 0 }; acc += c.e - c.s; return acc; });
  } else {
    mesLabels     = mesLabelsPeriod;
    ventasSerie   = ventasSeriePeriod;
    gananciaSerie = gananciaSeriePeriod;
    margenSerie   = margenSeriePeriod;
    balLabelsLocal = balLabels;
    balSeriesLocal = balSeries;
  }
  // Reasignar balSeries/balLabels para que el JSX use los locales
  const balSeriesFinal = balSeriesLocal;
  const balLabelsFinal = balLabelsLocal;
  const grain = useDaily ? 'diario' : 'mensual';

  // Canales (top channels)
  const canalStats = {};
  ventas.forEach(v => {
    const c = v.canal || 'Sin canal';
    if (!canalStats[c]) canalStats[c] = { label: c, value: 0, ventas: 0 };
    canalStats[c].value += v.precioFacturadoTotal || 0;
    canalStats[c].ventas += 1;
  });
  const canalPalette = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4'];
  const topCanales = Object.values(canalStats).sort((a, b) => b.value - a.value).slice(0, 6)
                     .map((c, i) => ({ ...c, color: canalPalette[i % canalPalette.length] }));

  // Estados SKU para donut
  const estadoSKU = [
    { label: 'Saludable',      value: SKbuilt.filter(s => s.estado === 'ok').length,             color: '#10b981' },
    { label: 'Atención',       value: atencion,                                                   color: '#f59e0b' },
    { label: 'Crítico',        value: criticos,                                                   color: '#ef4444' },
    { label: 'Sin movimiento', value: SKbuilt.filter(s => s.estado === 'sin_movimiento').length, color: '#6b7280' },
    { label: 'En reposición',  value: SKbuilt.filter(s => s.estado === 'en_reposicion').length,  color: '#3b82f6' },
  ].filter(d => d.value > 0);

  // Categorías de gasto (period) — para BarChart.
  // Importante: NO contar como gasto los movimientos cuyo concepto es de
  // ingreso (Venta de mercancia, Envio cobrado, Aportes, etc) aunque tengan
  // un valor en `salida`. Esto pasa con ventas legacy que registraron el
  // envío del courier como salida en la misma fila del ingreso de la venta.
  // El "salida" en esos casos es un gasto disfrazado y debe atribuirse a
  // su concepto propio (Pago Envío) — pero como la data histórica no lo
  // separa, lo agrupamos bajo "Envío (de ventas)" para no contaminar el
  // concepto "Venta de mercancia".
  const CONCEPTOS_INGRESO = ['Venta de mercancia', 'Envio cobrado', 'Aportes para negocio', 'Aporte Inversor', 'Refund proveedor', 'Drawdown'];
  const gastosByConcepto = {};
  cf.forEach(m => {
    if (!m.s || m.s === 0) return;
    let k = m.c || 'Otros';
    if (CONCEPTOS_INGRESO.includes(k)) {
      // Salida en una fila de ingreso = envío/comisión del cliente.
      // Reasignar a un bucket dedicado para que no aparezca como "Venta de mercancia".
      k = 'Envío de ventas (legacy)';
    }
    gastosByConcepto[k] = (gastosByConcepto[k] || 0) + m.s;
  });
  const topGastos = Object.entries(gastosByConcepto)
                          .sort((a, b) => b[1] - a[1]).slice(0, 8)
                          .map(([label, value]) => ({ label, value }));

  // Format helpers
  const fmtK = (n) => Math.abs(n) >= 1000 ? (n/1000).toFixed(n >= 100000 ? 0 : 1) + 'K' : Math.round(n).toString();

  return (
    <>
      <div className="topbar">
        <div>
          <h1>Resumen</h1>
          <div className="sub">{ventas.length} ventas · {SK.length} SKUs · {cf.length} movimientos · {fmtDate(window.HOY || HOY)}</div>
        </div>
        <div className="topbar-actions">
          <span className="pill"><span className="pill-dot" /> Live · Supabase</span>
          <button className="pill" onClick={() => window.AT_CLIENT?.refreshAll?.()}>↻ Refrescar</button>
        </div>
      </div>

      <div className="kpi-row">
        <KPI label={period === 'todo' ? 'Ventas histórico' : 'Ventas en período'} value={fmtNum(totalVentas)} currency
             delta={period === 'todo' ? growthMoM : null} deltaLabel={period === 'todo' ? 'MoM' : `${ventas.length} ventas`} />
        <KPI label="Ganancia bruta" value={fmtNum(totalGanancia)} currency
             delta={margenPct} deltaLabel="margen" />
        <KPI label="Capital actual" value={fmtNum(capitalActual)} currency
             delta={null} deltaLabel={cuentasLiquidasCount > 0 ? `${cuentasLiquidasCount} cuenta(s) líquida(s)` : 'cash flow neto'} />
        <KPI label="Deuda total" value={fmtNum(deudaTotal)} currency
             delta={null} deltaLabel="COOP + Andrea + BHD" />
      </div>

      {/* ═══════════════════ APARTADO: COMERCIAL ═══════════════════ */}
      <div className="nav-section-label" style={{ padding: 'var(--s-4) 0 var(--s-2)', fontSize: 12 }}>COMERCIAL · VENTAS · MARGEN</div>

      <div className="kpi-row">
        <KPI label="Ticket promedio" value={fmtNum(ticketProm)} currency
             delta={null} deltaLabel={`${ventas.length} ventas · ${period}`} />
        <KPI label="Ganancia x venta" value={fmtNum(ganxVenta)} currency
             delta={margenPct} deltaLabel="margen %" />
        <KPI label="Unidades vendidas" value={fmtNum(totalUds)}
             delta={null} deltaLabel={`${udsxVenta.toFixed(1)} ud/venta`} />
        <KPI label="SKUs vendidos" value={fmtNum(Object.keys(skuStats).length)}
             delta={null} deltaLabel={`${skusActivos}/${SK.length} activos`} />
      </div>

      <div className="grid-2">
        <div className="section">
          <div className="section-head">
            <div>
              <div className="section-title">Ventas {grain === 'diario' ? 'diarias' : 'mensuales'} (RD$)</div>
              <div className="section-desc">Tendencia · {ventasSerie.length} {grain === 'diario' ? 'días' : 'meses'} · prom RD${fmtNum(ventasSerie.length > 0 ? ventasSerie.reduce((a,b)=>a+b,0) / ventasSerie.length : 0)}</div>
            </div>
          </div>
          <LineChart values={ventasSerie} labels={mesLabels} h={200} color="var(--accent)"
            fmt={(n) => 'RD$' + fmtK(n)} title={`REVENUE ${grain.toUpperCase()} · RD$`} />
        </div>
        <div className="section">
          <div className="section-head">
            <div>
              <div className="section-title">Ganancia {grain === 'diario' ? 'diaria' : 'mensual'} (RD$)</div>
              <div className="section-desc">Margen prom período {margenPct.toFixed(1)}%</div>
            </div>
          </div>
          <LineChart values={gananciaSerie} labels={mesLabels} h={200} color="var(--success)"
            fmt={(n) => 'RD$' + fmtK(n)} title={`GANANCIA ${grain.toUpperCase()} · RD$`} />
        </div>
      </div>

      <div className="grid-2">
        <div className="section">
          <div className="section-head">
            <div>
              <div className="section-title">Margen % mensual</div>
              <div className="section-desc">Ganancia ÷ Revenue por mes</div>
            </div>
          </div>
          <LineChart values={margenSerie} labels={mesLabels} h={180} color="var(--warning)"
            fmt={(n) => n.toFixed(1) + '%'} title="MARGEN %" />
        </div>
        <div className="section">
          <div className="section-head">
            <div>
              <div className="section-title">Top canales por revenue</div>
              <div className="section-desc">{topCanales.length} canales · {period === 'todo' ? 'histórico' : period}</div>
            </div>
          </div>
          {topCanales.length > 0 ? (
            <BarChart data={topCanales} fmt={(n) => 'RD$' + fmtK(n)} title="REVENUE POR CANAL · RD$" />
          ) : <div className="muted" style={{ fontSize: 12, padding: 16 }}>Sin datos en el período</div>}
        </div>
      </div>

      {/* ═══════════════════ APARTADO: FINANZAS · CAPITAL ═══════════════════ */}
      <div className="nav-section-label" style={{ padding: 'var(--s-4) 0 var(--s-2)', fontSize: 12 }}>FINANZAS · CAPITAL · DEUDA</div>

      <div className="kpi-row">
        <KPI label="Saldo Coop" value={fmtNum(window.COOP?.saldo || 0)} currency
             delta={null} deltaLabel={`pagado ${fmtCurrency(window.COOP?.pagado || 0)}`} />
        <KPI label="Pendiente Andrea" value={fmtNum(window.ANDREA?.pendiente || 0)} currency
             delta={null} deltaLabel={`pagado ${fmtCurrency(window.ANDREA?.pagado || 0)}`} />
        <KPI label="BHD Línea usada" value={fmtNum(window.BHD?.usado || 0)} currency
             delta={window.BHD?.limite > 0 ? (window.BHD.usado / window.BHD.limite) * 100 : null} deltaLabel="% uso" />
        <KPI label="Próxima cuota Coop" value={fmtNum(window.COOP?.cuota || 0)} currency
             delta={null} deltaLabel={(window.COOP?.pagos || []).length + ' cuotas restantes'} />
      </div>

      <div className="section">
        <div className="section-head">
          <div>
            <div className="section-title">Balance acumulado de cuentas (RD$)</div>
            <div className="section-desc">Capital total {grain === 'diario' ? 'día a día' : 'mes a mes'} · suma rolling · {period === 'todo' ? 'histórico completo' : `período ${period}`}</div>
          </div>
          <span className="badge neutral">Actual: {fmtCurrency(capitalActual)}</span>
        </div>
        <LineChart values={balSeriesFinal} labels={balLabelsFinal} h={210} color="var(--success)"
          fmt={(n) => 'RD$' + fmtK(n)} title={`CAPITAL ACUMULADO (${grain}) · RD$`} yTicks={5} />
      </div>

      {/* Cash Flow breakdown — Op vs Fin ─────────────────────────── */}
      <div className="grid-2">
        <div className="section">
          <div className="section-head">
            <div>
              <div className="section-title">Cash Flow operacional</div>
              <div className="section-desc">{opMovs.length} movimientos · {period === 'todo' ? 'histórico' : period}</div>
            </div>
            <span className={`badge ${(opE - opS) >= 0 ? 'success' : 'danger'}`}>
              Neto {fmtCurrency(opE - opS)}
            </span>
          </div>
          <div className="grid-3">
            <div className="stat-card">
              <div className="stat-label">Ventas</div>
              <div className="stat-value" style={{ color: 'var(--success)' }}>{fmtCurrency(ventasCF)}</div>
            </div>
            <div className="stat-card">
              <div className="stat-label">Compras mercancía</div>
              <div className="stat-value" style={{ color: 'var(--danger)' }}>{fmtCurrency(comprasMerc)}</div>
            </div>
            <div className="stat-card">
              <div className="stat-label">Otros gastos op</div>
              <div className="stat-value" style={{ color: 'var(--danger)' }}>{fmtCurrency(gastosOp)}</div>
            </div>
          </div>
        </div>

        <div className="section">
          <div className="section-head">
            <div>
              <div className="section-title">Cash Flow financiero</div>
              <div className="section-desc">{finMovs.length} movimientos · préstamos, líneas, inversores</div>
            </div>
            <span className={`badge ${(finE - finS) >= 0 ? 'success' : 'danger'}`}>
              Neto {fmtCurrency(finE - finS)}
            </span>
          </div>
          <div className="grid-3">
            <div className="stat-card">
              <div className="stat-label">Aportes</div>
              <div className="stat-value" style={{ color: 'var(--success)' }}>{fmtCurrency(aportes)}</div>
            </div>
            <div className="stat-card">
              <div className="stat-label">Pagos préstamo</div>
              <div className="stat-value" style={{ color: 'var(--danger)' }}>{fmtCurrency(pagosPrest)}</div>
            </div>
            <div className="stat-card">
              <div className="stat-label">Intereses</div>
              <div className="stat-value" style={{ color: 'var(--warning)' }}>{fmtCurrency(intereses)}</div>
            </div>
          </div>
        </div>
      </div>

      {/* Gastos por concepto ─────────────────────────────────────── */}
      {topGastos.length > 0 && (
        <div className="section">
          <div className="section-head">
            <div>
              <div className="section-title">Gastos por concepto (RD$)</div>
              <div className="section-desc">{topGastos.length} categorías · {period === 'todo' ? 'histórico' : period} · total {fmtCurrency(topGastos.reduce((s, g) => s + g.value, 0))}</div>
            </div>
          </div>
          <BarChart data={topGastos} fmt={(n) => 'RD$' + fmtK(n)} color="var(--danger)" title="GASTO ACUMULADO · RD$" />
        </div>
      )}

      {/* ═══════════════════ APARTADO: INVENTARIO · STOCK ═══════════════════ */}
      <div className="nav-section-label" style={{ padding: 'var(--s-4) 0 var(--s-2)', fontSize: 12 }}>INVENTARIO · STOCK · LOTES</div>

      <div className="kpi-row">
        <KPI label="Stock total" value={fmtNum(stockTotal)} deltaLabel="unidades" delta={null} />
        <KPI label="En camino" value={fmtNum(enCaminoTotal)} deltaLabel={`${lotesEnCamino}/${numLotes} lotes`} delta={null} />
        <KPI label="Capital en stock" value={fmtNum(capitalStock)} currency
             delta={null} deltaLabel="cpp × stock" />
        <KPI label="SKUs críticos" value={fmtNum(criticos)}
             delta={null} deltaLabel={`${atencion} en atención`} />
      </div>

      <div className="grid-2">
        <div className="section">
          <div className="section-head">
            <div>
              <div className="section-title">Estado de SKUs</div>
              <div className="section-desc">Distribución por nivel de stock</div>
            </div>
          </div>
          {estadoSKU.length > 0 ? (
            <DonutChart data={estadoSKU} size={160} fmt={(n, p) => `${n} (${p.toFixed(0)}%)`} title="SKUS" />
          ) : <div className="muted">Sin datos</div>}
        </div>

        <div className="section">
          <div className="section-head">
            <div>
              <div className="section-title">Top 10 SKUs</div>
              <div className="section-desc">{period === 'todo' ? 'Histórico' : period} · ordenado por {topMetric === 'revenue' ? 'revenue' : topMetric === 'ganancia' ? 'ganancia' : 'unidades vendidas'}</div>
            </div>
            <div style={{ display: 'flex', gap: 4 }}>
              {[{k:'revenue',l:'Revenue'},{k:'ganancia',l:'Ganancia'},{k:'uds',l:'Uds'}].map(o => (
                <button key={o.k} className="pill" style={{
                  background: topMetric === o.k ? 'var(--accent)' : 'var(--surface-2)',
                  color:      topMetric === o.k ? '#fff'         : 'var(--text-2)',
                  border: 'none', cursor: 'pointer',
                }} onClick={() => setTopMetric(o.k)}>{o.l}</button>
              ))}
            </div>
          </div>
          {(() => {
            const list = topMetric === 'ganancia' ? topSkusByGanancia : topMetric === 'uds' ? topSkusByUds : topSkusByRevenue;
            const fmt = topMetric === 'uds' ? ((n) => n + ' ud') : ((n) => 'RD$' + fmtK(n));
            const title = topMetric === 'uds' ? 'UNIDADES VENDIDAS' : `${topMetric.toUpperCase()} · RD$`;
            return list.length > 0 ? (
              <BarChart data={list.map((s, i) => ({ label: s.nombre, value: s[topMetric], color: canalPalette[i % canalPalette.length] }))} fmt={fmt} title={title} />
            ) : <div className="muted" style={{ fontSize: 12, padding: 16 }}>Sin ventas en el período</div>;
          })()}
        </div>
      </div>

      {topSkus.length > 0 && (
        <div className="section">
          <div className="section-head">
            <div>
              <div className="section-title">Detalle Top 10 SKUs</div>
              <div className="section-desc">Ordenado por {topMetric === 'revenue' ? 'revenue' : topMetric === 'ganancia' ? 'ganancia' : 'unidades'}</div>
            </div>
          </div>
          <table className="data">
            <thead><tr>
              <th>SKU</th><th>Nombre</th>
              <th className="right">Uds</th><th className="right">Revenue</th>
              <th className="right">Ganancia</th><th className="right">Margen</th>
            </tr></thead>
            <tbody>
              {(topMetric === 'ganancia' ? topSkusByGanancia : topMetric === 'uds' ? topSkusByUds : topSkusByRevenue).map(s => {
                const mg = s.revenue > 0 ? (s.ganancia / s.revenue) * 100 : 0;
                return (
                  <tr key={s.sku}>
                    <td><span className="num" style={{ fontSize: 11 }}>{s.sku}</span></td>
                    <td className="muted">{s.nombre}</td>
                    <td className="num right">{s.uds}</td>
                    <td className="num right">{fmtCurrency(s.revenue)}</td>
                    <td className="num right pos">{fmtCurrency(s.ganancia)}</td>
                    <td className="num right muted">{mg.toFixed(1)}%</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}

      {/* ═══════════════════ APARTADO: TRANSACCIONES RECIENTES ═══════════════════ */}
      <div className="nav-section-label" style={{ padding: 'var(--s-4) 0 var(--s-2)', fontSize: 12 }}>ACTIVIDAD · TRANSACCIONES RECIENTES</div>

      <div className="section">
        <div className="section-head">
          <div>
            <div className="section-title">Movimientos recientes</div>
            <div className="section-desc">Últimos {recientes.length} de {cf.length} en {period === 'todo' ? 'histórico' : period}</div>
          </div>
          <button className="btn ghost" onClick={() => window.AT_CLIENT?.refreshAll?.()}>Ver todos →</button>
        </div>
        <table className="data">
          <thead><tr>
            <th>Fecha</th><th>Tipo</th><th>Contraparte</th>
            <th className="right">Entrada</th><th className="right">Salida</th><th className="right">Neto</th>
          </tr></thead>
          <tbody>
            {recientes.map((m, i) => {
              const neto = (m.e || 0) - (m.s || 0);
              return (
                <tr key={i}>
                  <td>{fmtDate(m.f)}</td>
                  <td>{m.c}</td>
                  <td className="muted">{m.a || '—'}</td>
                  <td className="num right pos">{m.e > 0 ? fmtCurrency(m.e) : '—'}</td>
                  <td className="num right neg">{m.s > 0 ? '-' + fmtCurrency(m.s) : '—'}</td>
                  <td className={`num right ${neto > 0 ? 'pos' : neto < 0 ? 'neg' : 'muted'}`}>
                    {neto > 0 ? '+' : ''}{fmtCurrency(neto)}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </>
  );
}

// ═════════════════════════ Re-Stock Tab ═════════════════════════
// Herramienta de planificación de reposición. Para cada SKU calcula:
//   - días de stock restante (con velocidad de venta histórica)
//   - cobertura vs lead time (52 días Alibaba→DR por default)
//   - cantidad recomendada para cubrir (lead time + buffer de seguridad)
//   - costo estimado de la reposición usando CPP actual
// Muestra una lista priorizada (críticos primero) con checkboxes para
// generar un resumen de orden total estimada.
function RestockTab({ skus }) {
  const [bufferDias, setBufferDias] = useState(() => {
    const saved = localStorage.getItem('restock-buffer');
    return saved ? Number(saved) : 30;  // 30 días extra por defecto
  });
  useEffect(() => { if (Number(bufferDias) > 0) localStorage.setItem('restock-buffer', String(bufferDias)); }, [bufferDias]);

  const [leadOverride, setLeadOverride] = useState(() => {
    const saved = localStorage.getItem('restock-lead');
    return saved ? Number(saved) : 52;
  });
  useEffect(() => { if (Number(leadOverride) > 0) localStorage.setItem('restock-lead', String(leadOverride)); }, [leadOverride]);

  const [selected, setSelected] = useState({});
  const [filterEstado, setFilterEstado] = useState('todos-pedir');
  const [expandedModels, setExpandedModels] = useState({});

  // Computar info de reposición para cada SKU
  const items = (skus || []).map(s => {
    const lead = leadOverride;
    const buffer = Number(bufferDias) || 0;
    const diasObjetivo = lead + buffer;  // queremos stock para todo este período
    const stockActual = s.s || 0;
    const enCamino = s.enCamino || 0;
    const velocidad = s.velocidad || 0;  // uds/día
    // Cuántas unidades necesito para cubrir diasObjetivo desde ahora,
    // restando lo que ya tengo (stock actual + en camino).
    const necesidadTotal = Math.round(velocidad * diasObjetivo);
    const cubierto = stockActual + enCamino;
    const aPedir = Math.max(0, necesidadTotal - cubierto);
    const costoEstimado = aPedir * (s.cpp || 0);
    return {
      ...s,
      aPedir, costoEstimado, necesidadTotal, cubierto,
      diasObjetivo, lead, buffer,
    };
  });

  // SOLO SKUs que realmente necesitan reorden. Lo demás es ruido.
  // Un SKU puede estar en estado "critico" pero NO necesitar pedido si
  // ya tiene suficiente "en camino" para cubrir la necesidad — esos
  // quedan fuera. Filtros adicionales solo subdividen este set.
  const itemsAPedir = items.filter(s => s.aPedir > 0);
  const filtered = itemsAPedir.filter(s => {
    if (filterEstado === 'criticos-pedir') return s.estado === 'critico';
    if (filterEstado === 'atencion-pedir') return s.estado === 'atencion';
    return true;  // 'todos-pedir'
  }).sort((a, b) => {
    const orderEstado = { critico: 0, atencion: 1, en_reposicion: 2, ok: 3, sin_movimiento: 4 };
    const ea = orderEstado[a.estado] ?? 9, eb = orderEstado[b.estado] ?? 9;
    if (ea !== eb) return ea - eb;
    return (a.diasStock ?? 9999) - (b.diasStock ?? 9999);
  });

  // Toggle selección de un SKU para la orden
  const toggleSku = (id) => setSelected(s => ({ ...s, [id]: !s[id] }));
  const toggleAll = (val) => {
    const next = {};
    filtered.forEach(s => { next[s.id] = val; });
    setSelected(next);
  };

  // Resumen de orden seleccionada
  const seleccionados = filtered.filter(s => selected[s.id]);
  const totalUds = seleccionados.reduce((sum, s) => sum + s.aPedir, 0);
  const totalCosto = seleccionados.reduce((sum, s) => sum + s.costoEstimado, 0);
  const numSkus = seleccionados.length;

  // Stats — TODAS sobre items que necesitan reorden (no sobre todo el catálogo)
  const criticosAPedir = itemsAPedir.filter(s => s.estado === 'critico').length;
  const totalAPedirGlobal = itemsAPedir.reduce((s, x) => s + x.costoEstimado, 0);
  // Info contextual: críticos totales (incluyendo los ya cubiertos por enCamino)
  const criticosTotal = items.filter(s => s.estado === 'critico').length;
  const criticosYaCubiertos = criticosTotal - criticosAPedir;

  return (
    <>
      {/* Configuración */}
      <div style={{ display: 'flex', alignItems: 'end', gap: 16, padding: 'var(--s-3)', background: 'var(--surface-2)', borderRadius: 4, marginBottom: 'var(--s-4)' }}>
        <div className="field" style={{ flex: '0 0 140px' }}>
          <div className="field-label">Lead time (días)</div>
          <input className="input num" type="number" min="1" value={leadOverride} onChange={e => setLeadOverride(e.target.value)} />
          <div className="field-hint">Cuánto tarda en llegar un pedido</div>
        </div>
        <div className="field" style={{ flex: '0 0 140px' }}>
          <div className="field-label">Buffer seguridad (días)</div>
          <input className="input num" type="number" min="0" value={bufferDias} onChange={e => setBufferDias(e.target.value)} />
          <div className="field-hint">Stock extra para imprevistos</div>
        </div>
        <div className="field" style={{ flex: 1 }}>
          <div className="field-label">Filtrar (solo SKUs que necesitan pedido)</div>
          <div style={{ display: 'flex', gap: 4 }}>
            {[
              { id: 'todos-pedir', l: `Todos a pedir (${itemsAPedir.length})` },
              { id: 'criticos-pedir', l: `🔴 Solo críticos (${criticosAPedir})` },
              { id: 'atencion-pedir', l: '🟡 Solo atención' },
            ].map(f => (
              <button key={f.id} className="pill" style={{
                background: filterEstado === f.id ? 'var(--accent)' : 'var(--surface)',
                color: filterEstado === f.id ? '#fff' : 'var(--text-2)',
              }} onClick={() => setFilterEstado(f.id)}>{f.l}</button>
            ))}
          </div>
        </div>
      </div>

      {/* KPIs — todas las métricas son sobre SKUs que necesitan reorden */}
      <div className="kpi-row">
        <KPI label="SKUs a pedir" value={fmtNum(itemsAPedir.length)}
             delta={null} deltaLabel={`para cubrir ${leadOverride}+${bufferDias}d`} />
        <KPI label="Críticos a pedir" value={fmtNum(criticosAPedir)}
             delta={null}
             deltaLabel={criticosYaCubiertos > 0 ? `${criticosYaCubiertos} ya cubiertos en camino` : 'todos los críticos sin pedido'} />
        <KPI label="Costo total recomendado" value={fmtNum(totalAPedirGlobal)} currency
             delta={null} deltaLabel={`${itemsAPedir.length} SKUs · sumar todo`} />
        <KPI label="Orden seleccionada" value={fmtNum(totalCosto)} currency
             delta={numSkus || null} deltaLabel={`${numSkus} SKUs · ${totalUds} uds marcadas`} />
      </div>

      {/* Tabla de SKUs */}
      <div className="section">
        <div className="section-head">
          <div>
            <div className="section-title">SKUs que necesitan reorden</div>
            <div className="section-desc">
              {filtered.length} mostrando · ordenados por urgencia (críticos primero)
              {criticosYaCubiertos > 0 && (
                <span style={{ marginLeft: 8, color: 'var(--text-3)' }}>
                  · {criticosYaCubiertos} SKU{criticosYaCubiertos > 1 ? 's' : ''} crítico{criticosYaCubiertos > 1 ? 's' : ''} ya cubierto{criticosYaCubiertos > 1 ? 's' : ''} por reposición en camino (no aparece aquí)
                </span>
              )}
            </div>
          </div>
          <div style={{ display: 'flex', gap: 4 }}>
            <button className="btn ghost" onClick={() => toggleAll(true)}>Sel. todos</button>
            <button className="btn ghost" onClick={() => toggleAll(false)}>Limpiar</button>
          </div>
        </div>
        <div style={{ maxHeight: 600, overflowY: 'auto' }}>
          <table className="data">
            <thead style={{ position: 'sticky', top: 0, background: 'var(--surface)', zIndex: 1 }}>
              <tr>
                <th style={{ width: 28 }}></th>
                <th style={{ width: 28 }}></th>
                <th>Marca · Modelo</th><th>Estado</th>
                <th className="right">Stock</th><th className="right">Vel/mes</th>
                <th className="right">Días</th><th className="right">Cobertura</th>
                <th className="right">En camino</th><th className="right">A pedir</th>
                <th className="right">Costo est.</th>
              </tr>
            </thead>
            <tbody>
              {(() => {
                // Agrupar por marca+modelo. Cada grupo = un row colapsable.
                const naturalCmp = (a, b) => (a || '').localeCompare(b || '', 'es', { numeric: true, sensitivity: 'base' });
                const byModel = {};
                filtered.forEach(s => {
                  const key = `${s.mk || '—'}|${s.modelo || s.nm || ''}`;
                  (byModel[key] ||= { mk: s.mk || '—', modelo: s.modelo || s.nm || '', items: [] }).items.push(s);
                });
                const groups = Object.values(byModel).sort((a, b) => {
                  // Críticos primero: si algún item del grupo es crítico, va arriba
                  const aCrit = a.items.some(x => x.estado === 'critico');
                  const bCrit = b.items.some(x => x.estado === 'critico');
                  if (aCrit !== bCrit) return aCrit ? -1 : 1;
                  return naturalCmp(a.mk, b.mk) || naturalCmp(a.modelo, b.modelo);
                });
                const ESTADO_RANK = { critico: 4, atencion: 3, en_reposicion: 2, ok: 1, sin_movimiento: 0 };
                const estadoPeor = (items) => items.reduce((peor, s) =>
                  (ESTADO_RANK[s.estado] || 0) > (ESTADO_RANK[peor] || 0) ? s.estado : peor, 'ok');

                return groups.map(g => {
                  const key = `${g.mk}|${g.modelo}`;
                  const expanded = !!expandedModels[key];
                  const totS = g.items.reduce((s, x) => s + (x.s || 0), 0);
                  const totEC = g.items.reduce((s, x) => s + (x.enCamino || 0), 0);
                  const totAPedir = g.items.reduce((s, x) => s + (x.aPedir || 0), 0);
                  const totCosto = g.items.reduce((s, x) => s + (x.costoEstimado || 0), 0);
                  const velProm = g.items.length > 0 ? g.items.reduce((s, x) => s + (x.vtasMes || 0), 0) : 0;
                  const diasMin = Math.min(...g.items.map(x => x.diasStock ?? Infinity).filter(d => isFinite(d)));
                  const ratioMin = Math.min(...g.items.map(x => x.ratioCobertura ?? Infinity).filter(d => isFinite(d)));
                  const est = estadoPeor(g.items);
                  const cls = est === 'critico' ? 'danger' : est === 'atencion' ? 'warning' : est === 'ok' ? 'success' : 'neutral';
                  // Selección a nivel modelo = todos sus items
                  const allSelected = g.items.every(s => selected[s.id]);
                  const someSelected = g.items.some(s => selected[s.id]);
                  const toggleGroup = (val) => {
                    const next = { ...selected };
                    g.items.forEach(s => { next[s.id] = val; });
                    setSelected(next);
                  };
                  return (
                    <React.Fragment key={key}>
                      <tr style={{ cursor: g.items.length > 1 ? 'pointer' : 'default' }}
                          onClick={() => g.items.length > 1 && setExpandedModels(m => ({ ...m, [key]: !m[key] }))}>
                        <td onClick={e => e.stopPropagation()}>
                          <input type="checkbox" checked={allSelected} ref={el => el && (el.indeterminate = !allSelected && someSelected)} onChange={() => toggleGroup(!allSelected)} />
                        </td>
                        <td style={{ textAlign: 'center', color: 'var(--text-3)', fontSize: 11 }}>
                          {g.items.length > 1 ? (expanded ? '▼' : '▶') : ''}
                        </td>
                        <td>
                          <div style={{ fontWeight: 500 }}>{g.mk} {g.modelo}</div>
                          {g.items.length > 1 && !expanded && (
                            <div style={{ fontSize: 11, color: 'var(--text-3)', marginTop: 2 }}>
                              {g.items.map(s => s.color).filter(Boolean).join(' · ') || g.items.length + ' variantes'}
                            </div>
                          )}
                          {g.items.length === 1 && (
                            <div style={{ fontSize: 11, color: 'var(--text-3)', fontFamily: 'var(--font-mono)', marginTop: 2 }}>{g.items[0].id}</div>
                          )}
                        </td>
                        <td><span className={`badge ${cls}`}>{est.replace('_', ' ')}</span></td>
                        <td className={`num right ${totS === 0 ? 'neg' : ''}`}>{totS}</td>
                        <td className="num right">{velProm > 0 ? velProm.toFixed(1) : '—'}</td>
                        <td className="num right">{isFinite(diasMin) ? diasMin + 'd' : '—'}</td>
                        <td className="num right">{isFinite(ratioMin) ? ratioMin.toFixed(2) + 'x' : '—'}</td>
                        <td className="num right" style={{ color: totEC > 0 ? 'var(--warning)' : 'var(--text-3)' }}>{totEC || '—'}</td>
                        <td className="num right pos" style={{ fontWeight: 600 }}>{totAPedir}</td>
                        <td className="num right">{fmtCurrency(totCosto)}</td>
                      </tr>
                      {expanded && g.items.length > 1 && g.items.map(s => {
                        const sCls = s.estado === 'critico' ? 'danger' : s.estado === 'atencion' ? 'warning' : s.estado === 'ok' ? 'success' : 'neutral';
                        return (
                          <tr key={s.id} style={{ background: 'var(--surface)' }}>
                            <td onClick={e => e.stopPropagation()}>
                              <input type="checkbox" checked={!!selected[s.id]} onChange={() => toggleSku(s.id)} />
                            </td>
                            <td></td>
                            <td style={{ paddingLeft: 24 }}>
                              <div style={{ fontSize: 12 }}>↳ <strong>{s.color || s.id}</strong></div>
                              <div style={{ fontSize: 10, color: 'var(--text-3)', fontFamily: 'var(--font-mono)' }}>{s.id}</div>
                            </td>
                            <td><span className={`badge ${sCls}`} style={{ fontSize: 9 }}>{s.estado.replace('_', ' ')}</span></td>
                            <td className={`num right ${s.s === 0 ? 'neg' : ''}`}>{s.s}</td>
                            <td className="num right">{s.vtasMes ? s.vtasMes.toFixed(1) : '—'}</td>
                            <td className="num right">{s.diasStock != null ? s.diasStock + 'd' : '—'}</td>
                            <td className="num right">{s.ratioCobertura != null ? s.ratioCobertura.toFixed(2) + 'x' : '—'}</td>
                            <td className="num right" style={{ color: s.enCamino > 0 ? 'var(--warning)' : 'var(--text-3)' }}>{s.enCamino || '—'}</td>
                            <td className="num right pos" style={{ fontWeight: 600 }}>{s.aPedir}</td>
                            <td className="num right">{fmtCurrency(s.costoEstimado)}</td>
                          </tr>
                        );
                      })}
                    </React.Fragment>
                  );
                });
              })()}
              {filtered.length === 0 && (
                <tr><td colSpan="11" className="empty" style={{ padding: 'var(--s-6)' }}>
                  🎉 Sin SKUs que pedir en este filtro · todo el stock está cubierto
                </td></tr>
              )}
            </tbody>
          </table>
        </div>
      </div>

      {/* Resumen orden seleccionada */}
      {seleccionados.length > 0 && (
        <div className="section" style={{ borderLeft: '4px solid var(--accent)' }}>
          <div className="section-head">
            <div>
              <div className="section-title">Resumen de la orden</div>
              <div className="section-desc">{numSkus} SKUs · {totalUds} unidades · costo estimado {fmtCurrency(totalCosto)}</div>
            </div>
            <span className="badge success" style={{ fontSize: 13 }}>{fmtCurrency(totalCosto)}</span>
          </div>
          <table className="data">
            <thead><tr>
              <th>SKU</th><th>Nombre</th>
              <th className="right">Cantidad</th><th className="right">Costo/ud (CPP)</th>
              <th className="right">Subtotal</th>
            </tr></thead>
            <tbody>
              {seleccionados.map(s => (
                <tr key={s.id}>
