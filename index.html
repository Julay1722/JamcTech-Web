                en Movimientos con la cuenta = "{item.nombre}".
              </td></tr>
            )}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ═════════════════════════ Detalle inline · Movimientos de inversor ═════════════════════════
// Para inversores externos: muestra los pagos hechos a esa persona con
// running balance pendiente. Para aportes del dueño: muestra los aportes
// recibidos del dueño (que NO son deudas).
function DetalleInversorMovs({ item, cashflow, esDueno, productoExt }) {
  const cf = (cashflow || []);
  const concepto = esDueno ? 'Aportes para negocio' : 'Pago a Inversores';
  const nameTokens = (item.nombre || '').toLowerCase().split(/\s+/).filter(t => t.length > 2);
  // ID real del inversor (item._airtableId viene como 'i-<id>').
  const invId = item._airtableId && String(item._airtableId).startsWith('i-')
    ? Number(String(item._airtableId).slice(2)) : null;
  const movs = cf.filter(m => {
    if (m.c !== concepto) return false;
    // Match robusto por inversor_id; si el movimiento no lo trae (legacy),
    // caemos al match por token del nombre en notas/auxiliar.
    if (invId != null && m._inversorId != null) return m._inversorId === invId;
    const txt = ((m.a || '') + ' ' + (m.notas || '')).toLowerCase();
    return nameTokens.some(t => txt.includes(t));
  }).slice().sort((a, b) => (a.f || '').localeCompare(b.f || ''));
  // Running acumulado POR REGLA (no per-inversor): cada fila muestra cuánto se
  // lleva pagado a SU propio método de compensación. Así el historial "toma en
  // cuenta su propia data" en vez de restar todo contra un balance global.
  const acumPorRegla = {};
  const rows = movs.map(m => {
    const reglaMatch = (m.notas || '').match(/regla #(\d+)/);
    const reglaId = reglaMatch ? parseInt(reglaMatch[1]) : 0;
    const monto = (m.e || 0) + (m.s || 0);
    acumPorRegla[reglaId] = (acumPorRegla[reglaId] || 0) + monto;
    return { ...m, monto, acumMetodo: acumPorRegla[reglaId] };
  }).reverse();
  const totalPagado = movs.reduce((s, m) => s + (m.e || 0) + (m.s || 0), 0);
  return (
    <div className="section">
      <div className="section-head">
        <div>
          <div className="section-title">
            {esDueno ? 'Aportes recibidos de' : 'Pagos hechos a'} · {item.nombre}
          </div>
          <div className="section-desc">
            {movs.length} movimientos · total {esDueno ? 'aportado' : 'pagado'} {fmtCurrency(totalPagado)}
          </div>
        </div>
        {esDueno && <span className="badge success">DUEÑO · no es deuda</span>}
      </div>

      <ReglasCompensacionList inversor={item} esDueno={esDueno} />

      <div style={{ maxHeight: 400, overflowY: 'auto' }}>
        <table className="data">
          <thead style={{ position: 'sticky', top: 0, background: 'var(--surface)' }}>
            <tr>
              <th>Fecha</th><th>Método</th><th>Concepto</th><th>Contraparte</th>
              <th className="right">{esDueno ? 'Aporte' : 'Pago'}</th>
              <th className="right">Acum. al método</th>
            </tr>
          </thead>
          <tbody>
            {rows.map((r, i) => {
              // Parsea "regla #X" del notas para mostrar badge del método
              const reglaMatch = (r.notas || '').match(/regla #(\d+)/);
              const reglaId = reglaMatch ? parseInt(reglaMatch[1]) : null;
              const regla = reglaId && (item.compensaciones || []).find(c => c.id === reglaId);
              const metodoMeta = regla && TIPO_COMPENSACION_META[regla.tipoCompensacion];
              return (
                <tr key={i}>
                  <td>{fmtDate(r.f)}</td>
                  <td>
                    {metodoMeta ? (
                      <span className="badge" style={{ background: metodoMeta.color, color: 'white', fontSize: 9, fontWeight: 600 }}>
                        {metodoMeta.label.replace(/^[ID]\d+\s·\s/, '')}
                      </span>
                    ) : (
                      <span style={{ color: 'var(--text-3)', fontSize: 10 }}>—</span>
                    )}
                  </td>
                  <td className="muted">{r.c}</td>
                  <td className="muted">{r.a || '—'}</td>
                  <td className="num right pos">{fmtCurrency(r.monto)}</td>
                  <td className="num right">{fmtCurrency(r.acumMetodo)}</td>
                </tr>
              );
            })}
            {rows.length === 0 && (
              <tr><td colSpan="6" className="empty" style={{ padding: 'var(--s-6)' }}>
                Sin movimientos. Registra el {esDueno ? 'aporte propio' : 'pago al inversor'} usando "💸 Registrar pago del mes".
              </td></tr>
            )}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ═════════════════════════ Detalle inline · Ledger contable de cuenta de banco ═════════════════════════
// Estado de cuenta completo de una cuenta de banco. Muestra todos los movimientos
// que entraron y salieron, con saldo corriente. Útil para cuadrar contra el
// estado de cuenta real del banco. Incluye filtros de período y resumen mensual.
function DetalleCuentaLedger({ cuenta, cashflow }) {
  const [periodo, setPeriodo] = useState('todo');
  const [search, setSearch] = useState('');
  const [showReg, setShowReg] = useState(false);

  const movsCuenta = (cashflow || []).filter(m => m._origen === cuenta.nombre);
  const movsPeriodo = filterByPeriod(movsCuenta, periodo, 'f');
  const movsFiltered = movsPeriodo.filter(m => {
    if (!search) return true;
    const q = search.toLowerCase();
    return (m.c || '').toLowerCase().includes(q)
        || (m.a || '').toLowerCase().includes(q)
        || (m.notas || '').toLowerCase().includes(q);
  });

  // KPIs del período
  const totalEntradas = movsPeriodo.reduce((s, m) => s + (m.e || 0), 0);
  const totalSalidas  = movsPeriodo.reduce((s, m) => s + (m.s || 0), 0);
  const netoPeriodo   = totalEntradas - totalSalidas;
  const saldoActual   = movsCuenta.reduce((s, m) => s + (m.e || 0) - (m.s || 0), 0);
  // Saldo inicial del período (antes del rango filtrado)
  const range = periodToRange(periodo);
  const saldoInicial = range
    ? movsCuenta.filter(m => m.f && m.f < range.from).reduce((s, m) => s + (m.e || 0) - (m.s || 0), 0)
    : 0;

  // Ordenar ASC para computar running balance, luego revertir para mostrar
  const ordered = movsFiltered.slice().sort((a, b) => (a.f || '').localeCompare(b.f || ''));
  let running = saldoInicial;
  const rows = ordered.map(m => {
    running += (m.e || 0) - (m.s || 0);
    return { ...m, saldoDespues: running };
  }).reverse();

  // Resumen mensual (para cuadrar mes a mes contra el estado del banco)
  const buckets = {};
  movsPeriodo.forEach(m => {
    const ym = (m.f || '').slice(0, 7);
    if (!ym) return;
    if (!buckets[ym]) buckets[ym] = { entradas: 0, salidas: 0, count: 0 };
    buckets[ym].entradas += m.e || 0;
    buckets[ym].salidas  += m.s || 0;
    buckets[ym].count    += 1;
  });
  const meses = Object.keys(buckets).sort().reverse();

  return (
    <>
      {/* KPIs */}
      <div className="kpi-row" style={{ marginTop: 'var(--s-3)' }}>
        <KPI label="Saldo actual" value={fmtNum(saldoActual)} currency
             delta={null} deltaLabel={`${cuenta.nombre} · histórico`} />
        <KPI label="Entradas (período)" value={fmtNum(totalEntradas)} currency
             delta={null} deltaLabel={`${movsPeriodo.length} movimientos`} />
        <KPI label="Salidas (período)" value={fmtNum(totalSalidas)} currency
             delta={null} deltaLabel="salidas en período" />
        <KPI label="Neto del período" value={fmtNum(netoPeriodo)} currency
             delta={netoPeriodo >= 0 ? 1 : -1} deltaLabel={netoPeriodo >= 0 ? 'positivo' : 'negativo'} />
      </div>

      {/* Ledger detallado · ARRIBA (consumo primario) */}
      <div className="section">
        <div className="section-head">
          <div>
            <div className="section-title">Movimientos detallados · {cuenta.nombre}</div>
            <div className="section-desc">
              {movsFiltered.length} de {movsCuenta.length} · saldo inicial del período {fmtCurrency(saldoInicial)} · final {fmtCurrency(saldoInicial + netoPeriodo)}
            </div>
          </div>
          <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
            <button className="btn" style={{ background: 'var(--success)', fontSize: 12, padding: '4px 12px' }}
              onClick={() => setShowReg(s => !s)}>{showReg ? '× Cerrar' : '💸 Registrar movimiento'}</button>
            <input className="input" style={{ width: 180 }} placeholder="Buscar concepto/contraparte/notas..." value={search} onChange={e => setSearch(e.target.value)} />
            <PeriodFilter value={periodo} onChange={setPeriodo} />
          </div>
        </div>
        {showReg && (
          <div className="section" style={{ marginBottom: 'var(--s-3)', background: 'var(--surface-2)' }}>
            <FormAjusteCF cuentaInicial={cuenta.nombre} />
          </div>
        )}
        <div style={{ maxHeight: 500, overflowY: 'auto' }}>
          <table className="data">
            <thead style={{ position: 'sticky', top: 0, background: 'var(--surface)', zIndex: 1 }}>
              <tr>
                <th>Fecha</th><th>Concepto</th><th>Contraparte</th>
                <th className="right">Entrada</th><th className="right">Salida</th>
                <th className="right">Saldo después</th>
              </tr>
            </thead>
            <tbody>
              {rows.map((m, i) => (
                <tr key={i}>
                  <td>{fmtDate(m.f)}</td>
                  <td className="muted">{m.c || '—'}</td>
                  <td>{m.a || '—'}</td>
                  <td className="num right pos">{m.e > 0 ? fmtCurrency(m.e) : '—'}</td>
                  <td className="num right neg">{m.s > 0 ? fmtCurrency(m.s) : '—'}</td>
                  <td className="num right" style={{ fontWeight: 600 }}>{fmtCurrency(m.saldoDespues)}</td>
                </tr>
              ))}
              {rows.length === 0 && (
                <tr><td colSpan="6" className="empty" style={{ padding: 'var(--s-6)' }}>
                  Sin movimientos en esta cuenta para el período seleccionado.
                  {search && ' Ajusta el filtro de búsqueda.'}
                </td></tr>
              )}
            </tbody>
          </table>
        </div>
      </div>

      {/* Resumen mensual · ABAJO (visión agregada para cuadrar) */}
      {meses.length > 1 && (
        <div className="section">
          <div className="section-head">
            <div>
              <div className="section-title">Resumen mensual · cuadrar con banco</div>
              <div className="section-desc">{meses.length} meses · usa estos totales contra el estado de cuenta mensual</div>
            </div>
          </div>
          <table className="data">
            <thead><tr>
              <th>Mes</th><th className="right">Movimientos</th>
              <th className="right">Entradas</th><th className="right">Salidas</th>
              <th className="right">Neto del mes</th>
            </tr></thead>
            <tbody>
              {meses.map(ym => {
                const b = buckets[ym];
                const neto = b.entradas - b.salidas;
                return (
                  <tr key={ym}>
                    <td>{ym}</td>
                    <td className="num right muted">{b.count}</td>
                    <td className="num right pos">{fmtCurrency(b.entradas)}</td>
                    <td className="num right neg">{fmtCurrency(b.salidas)}</td>
                    <td className={`num right ${neto >= 0 ? 'pos' : 'neg'}`}>{fmtCurrency(neto)}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </>
  );
}

// ═════════════════════════ Análisis de Deuda · Semáforo ═════════════════════════
// Compara cash flow operacional promedio mensual contra pagos mensuales totales
// a deudas (préstamos + líneas + tarjetas + inversores). Muestra semáforo
// verde/amarillo/rojo con recomendaciones, stress test y breakdown.
function AnalisisDeudaPanel({ cashflow, prestamosUnified, tarjetasCredito, fin }) {
  const data = useATData();
  const ventas = data.ventas || [];

  // ── Cash flow OPERACIONAL promedio mensual de los últimos 6 meses ───
  // Excluye movimientos financieros (pagos de deuda, intereses, aportes)
  // para tener el flujo "limpio" del negocio.
  const FIN_CONCEPTS = /préstamo|prestamo|interés|interes|tarjeta|línea|linea|inversor|aporte|drawdown|fee/i;
  const hoyDate = new Date(window.HOY || new Date().toISOString().slice(0, 10));
  const hace6 = new Date(hoyDate); hace6.setMonth(hace6.getMonth() - 6);
  const cf6m = cashflow.filter(m => m.f && new Date(m.f) >= hace6 && !FIN_CONCEPTS.test(m.c || ''));
  const byMonth = {};
  cf6m.forEach(m => {
    const ym = m.f.slice(0, 7);
    if (!byMonth[ym]) byMonth[ym] = { e: 0, s: 0 };
    byMonth[ym].e += m.e || 0;
    byMonth[ym].s += m.s || 0;
  });
  const mesesData = Object.values(byMonth);
  const cashFlowMensualProm = mesesData.length > 0
    ? mesesData.reduce((s, b) => s + (b.e - b.s), 0) / mesesData.length
    : 0;

  // ── Ganancia contable promedio mensual (últimos 6 meses) ────────────
  // Suma de gananciaTotal de las ventas del período, dividido entre meses.
  const ventas6m = ventas.filter(v => v.fecha && new Date(v.fecha) >= hace6);
  const gananciaByMonth = {};
  ventas6m.forEach(v => {
    const ym = v.fecha.slice(0, 7);
    gananciaByMonth[ym] = (gananciaByMonth[ym] || 0) + (v.gananciaTotal || 0);
  });
  const mesesGanancia = Object.keys(gananciaByMonth).length;
  const gananciaMensualProm = mesesGanancia > 0
    ? Object.values(gananciaByMonth).reduce((s, x) => s + x, 0) / mesesGanancia
    : 0;

  // ── Pagos mensuales totales a deudas ─────────────────────────────────
  // Préstamos amortizados: usa la cuota típica (mediana de pagos previos
  //   o cálculo PMT desde monto + tasa). En prestamosUnified los _kind='prestamo'.
  // Líneas/Tarjetas: usa 5% del saldo usado como "pago mínimo" (estándar bancario).
  // Inversores externos (no dueño): retorno mensual promedio si tiene plazo.
  let pagosCuotas = 0;     // préstamos amortizados
  let pagosMinimos = 0;    // tarjetas/líneas (estimación 5% saldo)
  let pagosInversor = 0;   // retorno mensual a inversores

  const pagosBreakdown = [];

  // Convierte deuda en USD → RD$ a la tasa (mismo criterio que el capital), para
  // que el pago mínimo de una tarjeta/línea en dólares no salga como si fueran RD$.
  const RATE_USD = Number(localStorage.getItem('tasa-cambio-usd')) || 60;
  const esUSD = (nombre) => {
    const c = (data._cuentas || []).find(x => x.nombre === nombre);
    return c ? c.moneda === 'USD' : /usd/i.test(nombre || '');
  };

  prestamosUnified.forEach(p => {
    if (p._kind === 'prestamo') {
      // Cuota desde productos['FIN-P'] (mediana) o computar
      const cuota = (window.__AIRTABLE_DATA__?.productos?.['FIN-P'] || []).find(x => x._airtableId === p._airtableId)?.cuota || 0;
      const cuotaCalc = cuota || (p.tasaMensual && p.montoTotal ? p.montoTotal * p.tasaMensual / (1 - Math.pow(1 + p.tasaMensual, -48)) + (p.seguroMensual || 0) : 0);
      pagosCuotas += cuotaCalc;
      if (cuotaCalc > 0) pagosBreakdown.push({ nombre: p.nombre, tipo: 'Préstamo (cuota fija)', monto: cuotaCalc, color: '#3b82f6' });
    } else if (p._kind === 'linea') {
      // Línea de crédito: estimar 5% saldo usado como pago mínimo (convertido a RD$ si es USD)
      const minimo = (p.balance || 0) * 0.05 * (esUSD(p.nombre) ? RATE_USD : 1);
      pagosMinimos += minimo;
      if (minimo > 0) pagosBreakdown.push({ nombre: p.nombre, tipo: 'Línea (pago mín. 5%)', monto: minimo, color: '#f59e0b' });
    }
  });

  tarjetasCredito.forEach(t => {
    const minimo = (t.usado || 0) * 0.05 * (esUSD(t.nombre) ? RATE_USD : 1);
    pagosMinimos += minimo;
    if (minimo > 0) pagosBreakdown.push({ nombre: t.nombre, tipo: 'Tarjeta (pago mín. 5%)', monto: minimo, color: '#f59e0b' });
  });

  fin.filter(f => /inversor/i.test(f.tipo)).forEach(i => {
    const esDueno = /\[dueño\]|dueño|aporte propio/i.test(i.notas || '');
    if (esDueno) return;
    // Pago REAL hecho a este inversor (PAGO_INVERSOR linkeado por inversor_id).
    const invId = Number(String(i._airtableId || '').replace('i-', ''));
    const pagadoReal = (data.cashflow || []).filter(m => m._inversorId === invId && (m.s || 0) > 0)
      .reduce((s, m) => s + (m.s || 0), 0);
    const pendiente = Math.max(0, (i.balance || 0) - pagadoReal);
    // Pago mensual REALISTA: promedio de lo que YA le has pagado. Si no hay
    // historial, proyecta el pendiente a 24 meses (fallback).
    let mensual = pendiente / 24, lbl = 'Inversor (proy. 24m)';
    if (pagadoReal > 0 && i.fechaInicio) {
      const hoy = new Date(window.HOY || new Date().toISOString().slice(0, 10));
      const meses = Math.max(1, (hoy - new Date(i.fechaInicio)) / (30.4 * 86400000));
      mensual = pagadoReal / meses;
      lbl = 'Inversor (prom. real)';
    }
    pagosInversor += mensual;
    if (mensual > 0) pagosBreakdown.push({ nombre: i.nombre, tipo: lbl, monto: mensual, color: '#8b5cf6' });
  });

  const pagosMensualesTotales = pagosCuotas + pagosMinimos + pagosInversor;

  // ── Ratio de cobertura DUAL: cash flow vs ganancia ───────────────────
  // Cash flow = lo que de verdad entra a la cuenta (estándar bancario, DSCR)
  // Ganancia  = utilidad contable (revenue - costos). Útil para sanidad LP.
  const ratioGanancia = pagosMensualesTotales > 0 ? gananciaMensualProm / pagosMensualesTotales : 99;
  const ratio = pagosMensualesTotales > 0 ? cashFlowMensualProm / pagosMensualesTotales : 99;
  // Divergencia: si las dos métricas dan estados muy distintos, ALERTA.
  // Calculamos diferencia relativa entre los dos ratios.
  const divergenciaPct = Math.abs(ratio - ratioGanancia) / Math.max(0.01, ratio, ratioGanancia) * 100;
  const hayDivergencia = divergenciaPct > 30 && pagosMensualesTotales > 0;
  let divergenciaTipo = '';
  if (hayDivergencia) {
    if (ratio > ratioGanancia) {
      divergenciaTipo = 'cash_mejor';  // cash flow indica mejor que ganancia → puede ser inventario sin vender, deuda colectada por adelantado
    } else {
      divergenciaTipo = 'ganancia_mejor'; // ganancia mejor que cash → ventas a crédito sin cobrar, o inventario inflado
    }
  }
  let estado, color, label, mensaje;
  if (cashFlowMensualProm <= 0) {
    estado = 'ROJO'; color = '#ef4444'; label = '🔴 ALERTA';
    mensaje = 'Tu cash flow operacional es negativo o cero. Estás perdiendo dinero antes de pagar las deudas. PRIORIDAD: reducir gastos o aumentar ventas YA.';
  } else if (ratio < 1) {
    estado = 'ROJO'; color = '#ef4444'; label = '🔴 ROJO · NO CUBRE';
    mensaje = `Tu cash flow mensual NO cubre los pagos de deuda. Faltan ${fmtCurrency(pagosMensualesTotales - cashFlowMensualProm)} cada mes. Riesgo de incumplimiento o tener que sacar más deuda para pagar deuda.`;
  } else if (ratio < 1.5) {
    estado = 'ROJO'; color = '#f97316'; label = '🟠 ROJO LIVIANO · APRETADO';
    mensaje = `Apenas cubres los pagos. Sin margen para imprevistos. Una mala semana de ventas te pone en problemas. Considera renegociar plazos o consolidar deuda.`;
  } else if (ratio < 2) {
    estado = 'AMARILLO'; color = '#f59e0b'; label = '🟡 AMARILLO · ESTABLE';
    mensaje = `Cubres los pagos con margen pero no holgado. Te queda ${fmtCurrency(cashFlowMensualProm - pagosMensualesTotales)} para reinvertir o ahorro. Está OK, pero ojo con tomar más deuda.`;
  } else if (ratio < 3) {
    estado = 'VERDE'; color = '#10b981'; label = '🟢 VERDE · SALUDABLE';
    mensaje = `Excelente cobertura. Te queda ${fmtCurrency(cashFlowMensualProm - pagosMensualesTotales)} mensual para crecer. Puedes considerar acelerar pagos (abonos extra al capital) para reducir interés.`;
  } else {
    estado = 'VERDE'; color = '#059669'; label = '💎 VERDE PROFUNDO';
    mensaje = `Cobertura sobresaliente (${ratio.toFixed(1)}x). Tienes mucho margen — buen momento para inversiones de crecimiento o pagar deuda más rápido para ahorrar intereses.`;
  }

  // ── Deuda total ───────────────────────────────────────────────────────
  const deudaPrestamos = prestamosUnified.reduce((s, p) => s + toRD(p.balance || 0, p.moneda), 0);
  const deudaTarjetas  = tarjetasCredito.reduce((s, t) => s + toRD(t.usado || 0, t.moneda), 0);
  const deudaInversor  = fin.filter(f => /inversor/i.test(f.tipo) && !/\[dueño\]|dueño|aporte propio/i.test(f.notas || ''))
                            .reduce((s, i) => s + Math.max(0, (i.balance || 0) - (i.totalPagado || 0)), 0);
  const deudaTotal = deudaPrestamos + deudaTarjetas + deudaInversor;

  // ── Stress test: cuánto puede bajar el cash flow antes de quedar < 1x ──
  const margenColapso = cashFlowMensualProm > pagosMensualesTotales
    ? ((cashFlowMensualProm - pagosMensualesTotales) / cashFlowMensualProm) * 100
    : 0;

  return (
    <>
      {/* SEMÁFORO grande */}
      <div className="section" style={{ borderLeft: `6px solid ${color}` }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 16, marginBottom: 16 }}>
          <div style={{ fontSize: 32, fontWeight: 700, color }}>{label}</div>
          <div style={{ flex: 1, fontSize: 13, color: 'var(--text-2)', lineHeight: 1.5 }}>{mensaje}</div>
        </div>

        {/* Barra visual del ratio */}
        <div style={{ position: 'relative', height: 32, background: 'var(--surface-2)', borderRadius: 6, overflow: 'hidden', marginBottom: 8 }}>
          <div style={{ position: 'absolute', left: 0, top: 0, bottom: 0, width: Math.min(100, ratio * 33) + '%', background: color, transition: 'width 300ms ease' }} />
          <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14, fontWeight: 700, color: 'white', textShadow: '0 1px 2px rgba(0,0,0,0.5)', fontFamily: 'var(--font-mono)' }}>
            Cobertura: {ratio < 99 ? ratio.toFixed(2) : '∞'}x
          </div>
        </div>
        <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 10, color: 'var(--text-3)', textTransform: 'uppercase', letterSpacing: '0.05em' }}>
          <span>0x · rojo</span>
          <span>1x · apretado</span>
          <span>2x · estable</span>
          <span>3x+ · saludable</span>
        </div>
      </div>

      {/* Comparativa Cash flow vs Ganancia · estándar bancario vs contable */}
      <div className="section">
        <div className="section-head">
          <div>
            <div className="section-title">Cobertura: cash flow vs ganancia</div>
            <div className="section-desc">
              {hayDivergencia
                ? `⚠ Divergencia de ${divergenciaPct.toFixed(0)}% entre ambas métricas`
                : 'Ambas métricas coinciden — alta certeza'}
            </div>
          </div>
        </div>
        <div className="grid-2">
          {/* Cash flow side */}
          {(() => {
            const cls = ratio < 1 ? 'danger' : ratio < 1.5 ? 'warning' : ratio < 2 ? 'warning' : 'success';
            const lbl = ratio < 1 ? 'NO CUBRE' : ratio < 1.5 ? 'APRETADO' : ratio < 2 ? 'ESTABLE' : 'SALUDABLE';
            return (
              <div className="stat-card" style={{ borderLeft: `4px solid ${ratio < 1 ? '#ef4444' : ratio < 2 ? '#f59e0b' : '#10b981'}` }}>
                <div className="stat-label">Por cash flow operacional (DSCR · estándar bancario)</div>
                <div style={{ display: 'flex', alignItems: 'baseline', gap: 12, marginTop: 6 }}>
                  <div className="stat-value" style={{ fontSize: 24 }}>{ratio < 99 ? ratio.toFixed(2) : '∞'}x</div>
                  <span className={`badge ${cls}`}>{lbl}</span>
                </div>
                <div style={{ fontSize: 12, color: 'var(--text-3)', marginTop: 6 }}>
                  Cash flow {fmtCurrency(cashFlowMensualProm)} / Pagos {fmtCurrency(pagosMensualesTotales)}
                </div>
                <div style={{ fontSize: 11, color: 'var(--text-3)', marginTop: 4, fontStyle: 'italic' }}>
                  Dinero real que entra mensualmente. Es lo que importa para pagar las cuotas.
                </div>
              </div>
            );
          })()}
          {/* Ganancia side */}
          {(() => {
            const cls = ratioGanancia < 1 ? 'danger' : ratioGanancia < 1.5 ? 'warning' : ratioGanancia < 2 ? 'warning' : 'success';
            const lbl = ratioGanancia < 1 ? 'NO CUBRE' : ratioGanancia < 1.5 ? 'APRETADO' : ratioGanancia < 2 ? 'ESTABLE' : 'SALUDABLE';
            return (
              <div className="stat-card" style={{ borderLeft: `4px solid ${ratioGanancia < 1 ? '#ef4444' : ratioGanancia < 2 ? '#f59e0b' : '#10b981'}` }}>
                <div className="stat-label">Por ganancia contable (utilidad)</div>
                <div style={{ display: 'flex', alignItems: 'baseline', gap: 12, marginTop: 6 }}>
                  <div className="stat-value" style={{ fontSize: 24 }}>{ratioGanancia < 99 ? ratioGanancia.toFixed(2) : '∞'}x</div>
                  <span className={`badge ${cls}`}>{lbl}</span>
                </div>
                <div style={{ fontSize: 12, color: 'var(--text-3)', marginTop: 6 }}>
                  Ganancia {fmtCurrency(gananciaMensualProm)} / Pagos {fmtCurrency(pagosMensualesTotales)}
                </div>
                <div style={{ fontSize: 11, color: 'var(--text-3)', marginTop: 4, fontStyle: 'italic' }}>
                  Revenue − costos por mes. Indica sanidad del negocio a largo plazo.
                </div>
              </div>
            );
          })()}
        </div>
        {hayDivergencia && (
          <div style={{ marginTop: 12, padding: 12, background: 'var(--surface-2)', borderRadius: 4, borderLeft: '3px solid #f59e0b' }}>
            <div style={{ fontWeight: 600, fontSize: 13, color: '#f59e0b', marginBottom: 6 }}>⚠ Alerta de divergencia</div>
            <div style={{ fontSize: 12, color: 'var(--text-2)', lineHeight: 1.5 }}>
              {divergenciaTipo === 'ganancia_mejor'
                ? <>Tu <strong>ganancia se ve mejor</strong> que tu cash flow ({(ratioGanancia/ratio).toFixed(1)}x diferencia). Posibles causas: ventas a crédito que no has cobrado, inventario inflado en el balance, o gastos pagados que no impactan la ganancia. <strong>Confía en el cash flow</strong> para decidir pagos — la ganancia te puede engañar.</>
                : <>Tu <strong>cash flow se ve mejor</strong> que tu ganancia ({(ratio/ratioGanancia).toFixed(1)}x diferencia). Posibles causas: cobros adelantados que aún no se "ganaron" contablemente, o estás vendiendo bajo CPP (cash entra pero pierdes). <strong>Revisa los márgenes</strong> — quizás tu cash flow no es sostenible.</>}
            </div>
          </div>
        )}
      </div>

      {/* KPIs principales */}
      <div className="kpi-row">
        <KPI label="Cash flow mensual (prom 6m)" value={fmtNum(cashFlowMensualProm)} currency
             delta={cashFlowMensualProm >= 0 ? 1 : -1} deltaLabel="operacional (sin deudas)" />
        <KPI label="Pagos deuda mensual" value={fmtNum(pagosMensualesTotales)} currency
             delta={null} deltaLabel={`${pagosBreakdown.length} obligaciones`} />
        <KPI label="Sobra/falta mensual" value={fmtNum(cashFlowMensualProm - pagosMensualesTotales)} currency
             delta={cashFlowMensualProm - pagosMensualesTotales >= 0 ? 1 : -1} deltaLabel="después de deudas" />
        <KPI label="Margen de colapso" value={margenColapso.toFixed(0) + '%'}
             delta={margenColapso > 0 ? 1 : -1}
             deltaLabel={margenColapso > 0 ? 'puedes bajar ventas sin dejar de cubrir' : '⚠ tu cash flow YA no cubre la deuda'} />
      </div>

      {/* Deuda total */}
      <div className="grid-2">
        <div className="section">
          <div className="section-head">
            <div>
              <div className="section-title">Deuda total acumulada</div>
              <div className="section-desc">Saldo pendiente · suma de todo lo que debes</div>
            </div>
            <span className="badge danger" style={{ fontSize: 14, padding: '4px 10px' }}>{fmtCurrency(deudaTotal)}</span>
          </div>
          <div className="grid-3">
            <div className="stat-card">
              <div className="stat-label">Préstamos / Líneas</div>
              <div className="stat-value" style={{ color: 'var(--danger)' }}>{fmtCurrency(deudaPrestamos)}</div>
            </div>
            <div className="stat-card">
              <div className="stat-label">Tarjetas</div>
              <div className="stat-value" style={{ color: 'var(--danger)' }}>{fmtCurrency(deudaTarjetas)}</div>
            </div>
            <div className="stat-card">
              <div className="stat-label">Inversores</div>
              <div className="stat-value" style={{ color: 'var(--danger)' }}>{fmtCurrency(deudaInversor)}</div>
            </div>
          </div>
          {/* Composición visual + nota de conversión USD (llena el espacio) */}
          <div style={{ marginTop: 'var(--s-4)' }}>
            <div className="stat-label" style={{ marginBottom: 6 }}>Composición de la deuda</div>
            <div style={{ display: 'flex', height: 14, borderRadius: 4, overflow: 'hidden', background: 'var(--surface-2)' }}>
              {[['Préstamos', deudaPrestamos, '#ef9a3d'], ['Tarjetas', deudaTarjetas, '#f0726e'], ['Inversores', deudaInversor, '#7c5cff']].map(([lbl, val, col]) =>
                (deudaTotal > 0 && val > 0) ? <div key={lbl} title={`${lbl}: ${fmtCurrency(val)}`} style={{ width: (val / deudaTotal * 100) + '%', background: col }} /> : null)}
            </div>
            <div style={{ display: 'flex', gap: 16, marginTop: 6, fontSize: 10, color: 'var(--text-3)' }}>
              <span style={{ color: '#ef9a3d' }}>■ Préstamos {deudaTotal > 0 ? Math.round(deudaPrestamos / deudaTotal * 100) : 0}%</span>
              <span style={{ color: '#f0726e' }}>■ Tarjetas {deudaTotal > 0 ? Math.round(deudaTarjetas / deudaTotal * 100) : 0}%</span>
              <span style={{ color: '#7c5cff' }}>■ Inversores {deudaTotal > 0 ? Math.round(deudaInversor / deudaTotal * 100) : 0}%</span>
            </div>
            {tarjetasCredito.some(t => esUSD(t.moneda) && (t.usado || 0) > 0) && (
              <div style={{ fontSize: 11, color: 'var(--text-3)', marginTop: 10, lineHeight: 1.6 }}>
                💱 Incluye deuda en US$ convertida a la tasa <b>{getTasaUSD()}</b>:{' '}
                {tarjetasCredito.filter(t => esUSD(t.moneda) && (t.usado || 0) > 0).map(t =>
                  <span key={t.id} style={{ marginRight: 10 }}>{t.nombre} <b>{fmtMoneda(t.usado, t.moneda)}</b> → {fmtCurrency(toRD(t.usado, t.moneda))}</span>)}
              </div>
            )}
          </div>
        </div>

        <div className="section">
          <div className="section-head">
            <div>
              <div className="section-title">Stress test · qué pasa si baja el cash flow</div>
              <div className="section-desc">Proyección del ratio con caídas de ingresos</div>
            </div>
          </div>
          <table className="data">
            <thead><tr>
              <th>Escenario</th><th className="right">Cash flow</th>
              <th className="right">Ratio</th><th>Estado</th>
            </tr></thead>
            <tbody>
              {[0, 10, 20, 30, 40, 50].map(pct => {
                const cf = cashFlowMensualProm * (1 - pct/100);
                const r = pagosMensualesTotales > 0 ? cf / pagosMensualesTotales : 99;
                const cls = r < 1 ? 'danger' : r < 2 ? 'warning' : 'success';
                const lbl = r < 1 ? 'NO CUBRE' : r < 1.5 ? 'apretado' : r < 2 ? 'estable' : 'saludable';
                return (
                  <tr key={pct} style={{ background: pct === 0 ? 'var(--surface-2)' : undefined }}>
                    <td>{pct === 0 ? 'Actual' : `−${pct}% ventas`}</td>
                    <td className="num right">{fmtCurrency(cf)}</td>
                    <td className="num right">{r.toFixed(2)}x</td>
                    <td><span className={`badge ${cls}`}>{lbl}</span></td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>

      {/* Breakdown de pagos */}
      <div className="section">
        <div className="section-head">
          <div>
            <div className="section-title">Pagos mínimos estimados (peor caso · para el stress test)</div>
            <div className="section-desc">
              {pagosBreakdown.length} obligaciones · total {fmtCurrency(pagosMensualesTotales)}/mes.{' '}
              <b>NO es lo que pagas de verdad</b> — es el MÍNIMO si solo pagaras lo obligatorio: cuota real del préstamo · 5% mín. en tarjetas/líneas (si arrastras saldo) · inversor a su promedio real pagado. Los USD se convierten a la tasa {getTasaUSD()}.
            </div>
          </div>
        </div>
        {pagosBreakdown.length > 0 ? (
          <BarChart data={pagosBreakdown.sort((a, b) => b.monto - a.monto).map(p => ({ label: p.nombre + ' · ' + p.tipo, value: p.monto, color: p.color }))}
            fmt={(n) => 'RD$' + Math.round(n).toLocaleString('en-US') + '/mes'}
            title="PAGO MENSUAL POR OBLIGACIÓN · RD$" />
        ) : (
          <div className="muted" style={{ padding: 'var(--s-6)', textAlign: 'center' }}>
            Sin deudas registradas. Estado: <span className="badge success">VERDE PROFUNDO</span>
          </div>
        )}
      </div>
    </>
  );
}

function ProductDetailModal({ open, item, kind, onClose }) {
  const data = useATData();
  const movFin = data.movFin || [];
  const [showForm, setShowForm] = useState(false);
  const [showCfs, setShowCfs] = useState(false);  // mostrar también los CF asociados como fallback
  const [delMov, setDelMov] = useState(null);
  const [delBusy, setDelBusy] = useState(false);

  if (!open || !item) return null;

  const aid = item._airtableId;  // 'p-{id}' o 'i-{id}'
  const movs = movFin.filter(m => m.productoFinAirtableId === aid)
                     .sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));

  // CFs como respaldo (movimientos del cashflow que pueden estar linkeados sin pasar por movFin)
  const cfs = (data.cashflow || []).filter(c => {
    const txt = ((c.a || '') + ' ' + (c.c || '') + ' ' + (c.notas || '')).toLowerCase();
    return txt.includes((item.nombre || '').toLowerCase().slice(0, 8));
  }).slice(0, 20);

  const isPrestamo = kind === 'prestamo' || kind === 'linea';
  const totalMovs   = movs.reduce((s, m) => s + (m.monto || 0), 0);
  const totalCapital= movs.reduce((s, m) => s + (m.capital || 0), 0);
  const totalInt    = movs.reduce((s, m) => s + (m.interes || 0), 0);
  const totalSeg    = movs.reduce((s, m) => s + (m.seguro || 0), 0);

  const doDelMov = async () => {
    setDelBusy(true);
    try {
      await window.AT_CLIENT.removeMovFin(delMov._airtableId);
      window.toastOk('Movimiento eliminado', `${delMov.tipo} · ${fmtCurrency(delMov.monto)}`);
      setDelMov(null);
    } catch (e) { window.toastErr('No se pudo eliminar', e.message?.slice(0, 120)); }
    setDelBusy(false);
  };

  return (
    <>
      <div className="modal-backdrop" onClick={onClose}>
        <div className="modal" style={{ minWidth: 780, maxWidth: '92vw', maxHeight: '88vh', overflow: 'auto' }} onClick={e => e.stopPropagation()}>
          {/* Header */}
          <div className="modal-title" style={{ display: 'flex', alignItems: 'baseline', gap: 12 }}>
            <span>{item.nombre}</span>
            <span className="badge neutral" style={{ fontSize: 10 }}>{item.tipo || item.tipoSub || kind}</span>
          </div>

          {/* KPIs del producto */}
          <div className="grid-3" style={{ marginBottom: 'var(--s-4)' }}>
            <div className="stat-card">
              <div className="stat-label">{isPrestamo ? 'Monto/Límite' : 'Capital invertido'}</div>
              <div className="stat-value">{fmtCurrency(item.montoTotal || item.limite || 0)}</div>
            </div>
            <div className="stat-card">
              <div className="stat-label">{isPrestamo ? 'Capital pagado' : 'Pagado'}</div>
              <div className="stat-value" style={{ color: 'var(--success)' }}>{fmtCurrency(item._capitalPagado || item.totalPagado || 0)}</div>
            </div>
            <div className="stat-card">
              <div className="stat-label">{isPrestamo ? 'Saldo' : 'Pendiente'}</div>
              <div className="stat-value" style={{ color: 'var(--danger)' }}>{fmtCurrency(item.balance || 0)}</div>
            </div>
          </div>

          {/* Acciones */}
          <div style={{ display: 'flex', gap: 8, marginBottom: 'var(--s-3)' }}>
            <button className="btn" onClick={() => setShowForm(s => !s)}>
              {showForm ? '× Cerrar form' : '+ Nuevo movimiento'}
            </button>
            <button className="btn ghost" onClick={() => setShowCfs(s => !s)}>
              {showCfs ? 'Ocultar CFs' : 'Ver CFs vinculados'}
            </button>
            <span className="pill" style={{ marginLeft: 'auto' }}>{movs.length} mov · {fmtCurrency(totalMovs)}</span>
          </div>

          {/* Form inline para nuevo movimiento */}
          {showForm && (
            <div className="section" style={{ marginBottom: 'var(--s-3)' }}>
              <FormMovFinScoped item={item} kind={kind} onDone={() => setShowForm(false)} />
            </div>
          )}

          {/* Tabla movimientos (movFin) */}

            <thead><tr>
              <th>Fecha</th><th>Tipo</th>
              <th className="right">Capital</th><th className="right">Interés</th>

              <th>Cuenta</th><th></th>
            </tr></thead>
            <tbody>
              {movs.length === 0 && (

            <div className="section" style={{ marginTop: 'var(--s-3)' }}>
              <div className="section-head">
                <div className="section-title">CFs vinculados por contraparte</div>

              </div>
              <table className="data">
                <thead><tr><th>Fecha</th><th>Concepto</th><th>Contraparte</th><th className="right">Entrada</th><th className="right">Salida</th></tr></thead>
                <tbody>
                  {cfs.map((c, i) => (
                    <tr key={i}>
                      <td>{fmtDate(c.f)}</td>
                      <td className="muted">{c.c}</td>
                      <td>{c.a || '—'}</td>
                      <td className="num right pos">{c.e > 0 ? fmtCurrency(c.e) : '—'}</td>
                      <td className="num right neg">{c.s > 0 ? fmtCurrency(c.s) : '—'}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          <div className="modal-actions">
            <button className="btn ghost" onClick={onClose}>Cerrar</button>
          </div>
        </div>
      </div>

      <ConfirmModal open={!!delMov} danger busy={delBusy}
        title="¿Eliminar movimiento?"
        body={`${delMov?.tipo} · ${fmtCurrency(delMov?.monto || 0)} · ${fmtDate(delMov?.fecha || '')}. Esto también borra el cashflow vinculado.`}
        onCancel={() => setDelMov(null)}
        onConfirm={doDelMov} />
    </>
  );
}

// Versión scopeada del FormMovFin que pre-rellena producto y elige tipo razonable.
function FormMovFinScoped({ item, kind, onDone }) {
  const data = useATData();
  // Opciones de tipo según el producto — solo las que aplican.
  const TIPOS_POR_KIND = {
    prestamo: ['Cuota Préstamo', 'Abono Préstamo'],
    linea:    ['Pago Línea', 'Disposición Línea', 'Cargo Línea'],
    tarjeta:  ['Pago Tarjeta', 'Compra Tarjeta'],
    inversor: ['Retorno Inversor', 'Depósito Inversor'],
  };
  const MOVFIN_TIPOS = TIPOS_POR_KIND[kind] || ['Cuota Préstamo', 'Abono Préstamo', 'Disposición Línea', 'Pago Línea', 'Cargo Línea', 'Depósito Inversor', 'Retorno Inversor', 'Otro'];
  const tipoDefault = MOVFIN_TIPOS[0];
  const [tipo, setTipo] = useState(tipoDefault);
  const [fecha, setFecha] = useState(window.HOY || HOY);
  const [monto, setMonto] = useState('');
  const [capital, setCapital] = useState('');
  const [interes, setInteres] = useState('');
  const [seguro, setSeguro] = useState('');
  const [cuentaBanco, setCuentaBanco] = useState('BHD Debito');
  const [notas, setNotas] = useState('');
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    if (tipo === 'Cuota Préstamo' && (capital || interes || seguro)) {
      setMonto((Number(capital || 0) + Number(interes || 0) + Number(seguro || 0)).toString());
    }
  }, [tipo, capital, interes, seguro]);

  // Solo cuentas líquidas (débito/efectivo) como origen de cash. Las tarjetas
  // de crédito (CREDITO) no son origen — un cargo a tarjeta usa su cuenta espejo.
  const cuentas = (data._cuentas || []).filter(c => c.tipo === 'DEBITO' || c.tipo === 'EFECTIVO').map(c => c.nombre);
  // Un cargo/compra a tarjeta NO sale de una cuenta de banco: aumenta el usado
  // de la tarjeta. Se asienta contra su cuenta espejo (mismo nombre, tipo CREDITO)
  // para no inflar el saldo de débito.
  const esCargoTarjeta = kind === 'tarjeta' && tipo === 'Compra Tarjeta';
  // Asegura que la cuenta seleccionada exista realmente (evita el desfase
  // 'BHD Debito' sin acento vs 'BHD Débito').
  useEffect(() => { if (cuentas.length && !cuentas.includes(cuentaBanco)) setCuentaBanco(cuentas[0]); }, [cuentas.join('|')]);
  const valid = tipo && Number(monto) > 0;

  const onSubmit = async () => {
    setBusy(true);
    try {
      await window.AT_CLIENT.createMovFin({
        tipo, fecha,
        monto: Number(monto),
        productoFinAirtableId: item._airtableId,
        productoFinId: item.idFin || item.id,
        cuentaBanco: esCargoTarjeta ? item.nombre : cuentaBanco,
        capital: Number(capital) || 0,
        interes: Number(interes) || 0,
        seguro:  Number(seguro)  || 0,
        notas,
      });
      await window.AT_CLIENT.loadCashflow?.();
      await window.AT_CLIENT.loadFinanciero?.();
      window.toastOk('Movimiento registrado', `${tipo} · ${fmtCurrency(monto)} · ${item.nombre}`);
      setMonto(''); setCapital(''); setInteres(''); setSeguro(''); setNotas('');
      onDone?.();
    } catch (e) { window.toastErr('No se pudo registrar', e.message?.slice(0, 120)); }
    setBusy(false);
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 'var(--s-3)' }}>
      <div className="row-3">
        <div className="field"><div className="field-label">Tipo</div>
          <select className="select" value={tipo} onChange={e => setTipo(e.target.value)}>
            {MOVFIN_TIPOS.map(t => <option key={t}>{t}</option>)}
          </select></div>
        <div className="field"><div className="field-label">Fecha</div>
          <input className="input num" type="date" value={fecha} onChange={e => setFecha(e.target.value)} /></div>
        <div className="field"><div className="field-label">{kind === 'tarjeta' && tipo === 'Pago Tarjeta' ? 'Cuenta que paga' : 'Cuenta origen'}</div>
          {esCargoTarjeta ? (
            <input className="input" value={`Cargo a ${item.nombre}`} readOnly title="El cargo aumenta el usado de la tarjeta; no sale de una cuenta de banco." />
          ) : (
            <select className="select" value={cuentaBanco} onChange={e => setCuentaBanco(e.target.value)}>
              {cuentas.length > 0 ? cuentas.map(c => <option key={c}>{c}</option>) : <><option>BHD Debito</option><option>Efectivo</option></>}
            </select>
          )}</div>
      </div>
      {tipo === 'Cuota Préstamo' && (
        <div className="row-3">
          <div className="field"><div className="field-label">Capital</div>
            <input className="input num" type="number" value={capital} onChange={e => setCapital(e.target.value)} placeholder="0" /></div>
          <div className="field"><div className="field-label">Interés</div>
            <input className="input num" type="number" value={interes} onChange={e => setInteres(e.target.value)} placeholder="0" /></div>
          <div className="field"><div className="field-label">Seguro</div>
            <input className="input num" type="number" value={seguro} onChange={e => setSeguro(e.target.value)} placeholder="0" /></div>
        </div>
      )}
      <div className="row">
        <div className="field"><div className="field-label">Monto total</div>
          <input className="input num" type="number" value={monto} onChange={e => setMonto(e.target.value)} placeholder="0" /></div>
        <div className="field"><div className="field-label">Notas</div>
          <input className="input" value={notas} onChange={e => setNotas(e.target.value)} placeholder="opcional" /></div>
      </div>
      <div style={{ display: 'flex', gap: 8 }}>
        <button className="btn" disabled={!valid || busy} onClick={onSubmit}>{busy ? 'Guardando…' : 'Guardar movimiento'}</button>
      </div>
    </div>
  );
}

function FormInversor({ onDone }) {
  const data = useATData();
  const personas = (data._contrapartes || []).filter(c => c.tipo === 'INVERSOR' || c.tipo === 'PERSONA_OPERATIVA' || c.tipo === 'CLIENTE_FAMILIAR');
  // ¿Ya hay un dueño marcado? Si si, no permitimos crear otro.
  const yaHayDueno = (data.financiero || []).some(f => /inversor/i.test(f.tipo) && f.esDueno);
  const [nombre, setNombre] = useState('');
  const [capital, setCapital] = useState('');
  const [fechaInicio, setFechaInicio] = useState(window.HOY || new Date().toISOString().slice(0, 10));
  const [contraparte, setContraparte] = useState('');
  const [notas, setNotas] = useState('');
  const [esDueno, setEsDueno] = useState(false);
  const [busy, setBusy] = useState(false);
  // Cuando marca dueño, sugiere la fecha del PRIMER movimiento del negocio
  // (porque el dueño está desde el inicio). Para inversor externo, hoy.
  const fechaPrimerMov = (data.cashflow || [])
    .map(m => m.f).filter(Boolean).sort()[0];
  useEffect(() => {
    if (esDueno && fechaPrimerMov) {
      setFechaInicio(fechaPrimerMov);
    } else if (!esDueno) {
      setFechaInicio(window.HOY || new Date().toISOString().slice(0, 10));
    }
  }, [esDueno, fechaPrimerMov]);
  const paquete = esDueno ? 'Dueño' : 'Inversor';
  const preset = PAQUETES_PRESETS[paquete];
  const paqueteColor = esDueno ? '#7c5cff' : '#0ea5e9';
  const valid = nombre.length > 1 && (esDueno || Number(capital) > 0);

  const onSubmit = async () => {
    setBusy(true);
    try {
      if (esDueno && yaHayDueno) {
        window.toastErr('Solo un dueño', 'Ya existe un inversor marcado como dueño');
        setBusy(false);
        return;
      }
      const capNum = Number(capital) || 0;
      const ins = await window.AT_CLIENT.createInversor({
        nombre,
        capitalInvertido: capNum,
        montoPactadoDevolver: capNum * 2,
        fechaInicio: fechaInicio || null,
        contraparteId: contraparte || null,
        notas,
        esDueno: esDueno,
      });
      // Aplicar paquete completo: crear todas las reglas del preset en una
      if (ins?.id) {
        for (const rule of preset) {
          const rcopy = { ...rule, fechaInicio: fechaInicio || null };
          if (rule.tipoCompensacion === 'ROYALTY_BRUTO' && rcopy.capDevolver == null) rcopy.capDevolver = capNum * 0.5;
          if (rule.tipoCompensacion === 'RBF' && rcopy.capDevolver == null) rcopy.capDevolver = capNum * 2;
          await window.AT_CLIENT.createCompensacion(ins.id, rcopy);
        }
      }
      window.toastOk(esDueno ? 'Dueño registrado' : 'Inversor creado', `${nombre} · Paquete ${paquete} aplicado (${preset.length} reglas)`);
      setNombre(''); setCapital(''); setNotas(''); setEsDueno(false);
      onDone?.();
    } catch (e) { window.toastErr('No se pudo crear', e.message?.slice(0, 120)); }
    setBusy(false);
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 'var(--s-3)' }}>
      <div className="row">
        <div className="field"><div className="field-label">Nombre</div>
          <input className="input" value={nombre} onChange={e => setNombre(e.target.value)} placeholder="ej. Andrea Correa" /></div>
        <div className="field"><div className="field-label">Vincular a contraparte</div>
          <select className="select" value={contraparte} onChange={e => setContraparte(e.target.value)}>
            <option value="">— ninguna —</option>
            {personas.map(c => <option key={c.id} value={c.id}>{c.nombre} ({c.tipo})</option>)}
          </select></div>
      </div>

      <div style={{ padding: 'var(--s-3)', background: 'var(--surface-2)', borderRadius: 4, border: `1px solid ${paqueteColor}` }}>
        <label style={{ display: 'flex', alignItems: 'center', gap: 8, cursor: yaHayDueno && !esDueno ? 'not-allowed' : 'pointer', opacity: yaHayDueno && !esDueno ? 0.5 : 1 }}>
          <input type="checkbox" checked={esDueno} disabled={yaHayDueno && !esDueno}
            onChange={e => setEsDueno(e.target.checked)} />
          <span style={{ fontWeight: 600, color: paqueteColor }}>👤 Es el dueño del negocio</span>
        </label>
        <div className="field-hint" style={{ marginTop: 4, fontSize: 11 }}>
          {yaHayDueno && !esDueno
            ? '⚠ Ya hay un dueño marcado. Solo se permite uno.'
            : esDueno
              ? 'Recibirá el Paquete Dueño (5 reglas).'
              : 'Recibirá el Paquete Inversor (3 reglas).'}
        </div>
      </div>

      <div className="row-2">
        <div className="field"><div className="field-label">Capital invertido (RD$)</div>
          <input className="input num" type="number" value={capital} onChange={e => setCapital(e.target.value)} placeholder="50000" /></div>
        <div className="field"><div className="field-label">Fecha inicio</div>
          <input className="input num" type="date" value={fechaInicio} onChange={e => setFechaInicio(e.target.value)} /></div>
      </div>

      {/* Preview del paquete que se aplicará */}
      <div style={{ padding: 'var(--s-3)', background: 'var(--surface-2)', borderRadius: 4, border: `1px solid ${paqueteColor}` }}>
        <div style={{ fontSize: 11, color: paqueteColor, textTransform: 'uppercase', letterSpacing: '0.05em', fontWeight: 600, marginBottom: 8 }}>
          ✨ Se aplicará: Paquete {paquete} ({preset.length} reglas)
        </div>
        {preset.map((rule, i) => {
          const m = TIPO_COMPENSACION_META[rule.tipoCompensacion];
          return (
            <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '4px 0', fontSize: 12 }}>
              <span className="badge" style={{ background: m.color, color: 'white', fontSize: 9 }}>{m.label}</span>
              <span style={{ color: 'var(--text-3)' }}>
                {rule.pctAplicado != null && `${rule.pctAplicado}%`}
                {rule.cuotaMensual != null && `RD$${rule.cuotaMensual}/mes`}
              </span>
            </div>
          );
        })}
        <div className="field-hint" style={{ marginTop: 6, fontSize: 11 }}>
          💡 Editas los % y montos individualmente después con el ✎ de cada regla.
        </div>
      </div>

      <div className="field"><div className="field-label">Notas</div>
        <input className="input" value={notas} onChange={e => setNotas(e.target.value)} placeholder="opcional" /></div>

      <div style={{ display: 'flex', gap: 8 }}>
        <button className="btn" disabled={!valid || busy} onClick={onSubmit}>{busy ? 'Creando…' : `Crear + aplicar Paquete ${paquete}`}</button>
      </div>
    </div>
  );
}

// Input de tasa US$→RD$ (Julio la elige). Al cambiar, re-dispara el evento
// global para que los paneles que convierten USD recalculen.
function TasaUSDInput() {
  const [v, setV] = useState(getTasaUSD());
  return (
    <label title="Tasa US$→RD$ que usas para convertir los productos en USD a RD$ en los totales."
      style={{ fontSize: 11, color: 'var(--text-3)', display: 'flex', alignItems: 'center', gap: 4 }}>
      💱 Tasa US$
      <input className="input num" type="number" min="1" step="0.5" value={v}
        onChange={e => { setV(e.target.value); setTasaUSD(e.target.value); window.dispatchEvent(new CustomEvent('airtable-loaded', { detail: { table: 'globals' } })); }}
        style={{ width: 60, padding: '2px 6px', fontSize: 12 }} />
    </label>
  );
}

function FinanzasPage({ onNavigate }) {
  const data = useATData();
  const productos = data.productos || {};
  const coop   = (productos['FIN-P']  || [])[0];
  const andrea = (productos['FIN-I']  || [])[0];
  const lcs    = (productos['FIN-LC'] || []);
  // Split LC entries: las líneas de crédito (Línea Revolvente) van al tab Préstamos,
  // las tarjetas de crédito (Tarjeta de Crédito) van al tab Tarjetas.
  const lineasDeCredito = lcs.filter(l => /línea|linea|revolvente/i.test(l.tipoSub || ''));
  const tarjetasCredito = lcs.filter(l => /tarjeta/i.test(l.tipoSub || ''));
  const cuentas = data._cuentas || [];
  const fin = data.financiero || [];
  // Unifica préstamos amortizados + líneas de crédito en una sola lista
  // para el tab "Préstamos".
  const prestamosUnified = [
    ...fin.filter(f => /préstamo|prestamo/i.test(f.tipo)).map(p => ({ ...p, _kind: 'prestamo' })),
    ...lineasDeCredito.map(l => ({
      ...l, _kind: 'linea',
      montoTotal: l.limite,
      _capitalPagado: 0,
      balance: l.usado,
      tasaMensual: l.tasaMensual ? l.tasaMensual / 100 : 0,
    })),
  ];
  const [subtab, setSubtab] = useState('resumen');
  const [selectedId, setSelectedId] = useState(null); // _airtableId del producto expandido inline
  const [showCreate, setShowCreate] = useState(false);
  // Reset selección al cambiar de tab
  useEffect(() => { setSelectedId(null); }, [subtab]);
  const [del, setDel] = useState(null);
  const [delBusy, setDelBusy] = useState(false);
  const [edit, setEdit] = useState(null); // { kind, id, title, fields }
  const [editBusy, setEditBusy] = useState(false);
  const [detail, setDetail] = useState(null); // { item, kind }

  const doDelete = async () => {
    setDelBusy(true);
    try {
      const { kind, id, label } = del;
      if      (kind === 'cuenta')   await window.AT_CLIENT.removeCuenta(id);
      else if (kind === 'prestamo') await window.AT_CLIENT.removePrestamo(id);
      else if (kind === 'inversor') await window.AT_CLIENT.removeInversor(id);
      window.toastOk('Eliminado', label);
      setDel(null);
    } catch (e) { window.toastErr('No se pudo eliminar', e.message?.slice(0, 120)); }
    setDelBusy(false);
  };

  // ── Editar Cuenta ─────────────────────────────────
  const openEditCuenta = (c) => setEdit({
    kind: 'cuenta', id: c.id, title: `Editar cuenta · ${c.nombre}`,
    fields: [
      { name: 'nombre', label: 'Nombre', value: c.nombre, span: 2 },
      { name: 'tipo', label: 'Tipo', type: 'select', value: c.tipo,
        options: [{value:'DEBITO',label:'Débito'},{value:'CREDITO',label:'Crédito (tarjeta)'},{value:'EFECTIVO',label:'Efectivo'}] },
      { name: 'moneda', label: 'Moneda', type: 'select', value: c.moneda,
        options: [{value:'RD',label:'RD$'},{value:'USD',label:'USD'}] },
      { name: 'limite', label: 'Límite crédito', type: 'number', value: c.limite_credito ?? '' },
      { name: 'activa', label: 'Activa', type: 'select', value: String(c.activa ?? true),
        options: [{value:'true',label:'Sí'},{value:'false',label:'No'}] },
      { name: 'notas', label: 'Notas', value: c.notas || '', span: 2 },
    ],
  });

  // ── Editar Préstamo o Línea/Tarjeta ───────────────
  // Para PRESTAMO se edita monto_inicial; para LINEA/TARJETA se edita limite_credito.
  const openEditPrestamo = (p, isLinea) => {
    // p viene de `fin` (resumido) — tasaMensual en decimal, sin plazo ni fecha_primer_pago.
    const tipoEnum = isLinea ? (p.tipoSub?.toLowerCase().includes('tarjeta') ? 'TARJETA_CREDITO' : 'LINEA_CREDITO') : 'PRESTAMO';
    setEdit({
      kind: 'prestamo', id: String(p._airtableId).slice(2),
      title: `Editar ${isLinea ? 'línea/tarjeta' : 'préstamo'} · ${p.nombre}`,
      fields: [
        { name: 'nombre', label: 'Nombre', value: p.nombre, span: 2 },
        { name: 'tipo', label: 'Tipo', type: 'select', value: tipoEnum,
          options: [{value:'PRESTAMO',label:'Préstamo amortizado'},{value:'LINEA_CREDITO',label:'Línea de crédito'},{value:'TARJETA_CREDITO',label:'Tarjeta de crédito'}] },
        { name: 'moneda', label: 'Moneda', type: 'select', value: 'RD',
          options: [{value:'RD',label:'RD$'},{value:'USD',label:'USD'}] },
        isLinea
          ? { name: 'limiteCredito', label: 'Límite de crédito', type: 'number', value: p.limite ?? p.montoTotal ?? '' }
          : { name: 'montoInicial', label: 'Monto inicial', type: 'number', value: p.montoTotal ?? '' },
        { name: 'tasaMensualPct', label: 'Tasa mensual (%)', type: 'number',
          value: ((p.tasaMensual || 0) * (isLinea ? 1 : 100)).toFixed(2),
          hint: isLinea ? 'Decimal mensual (ej. 2.17)' : 'Porcentaje mensual (ej. 1.67)' },
        !isLinea && { name: 'seguroMensual', label: 'Seguro mensual', type: 'number', value: p.seguro ?? p.seguroMensual ?? '' },
        { name: 'fechaInicio', label: 'Fecha inicio', type: 'date', value: p.fechaInicio || '' },
        // Tarjetas/líneas: día de corte + día de vencimiento → alimentan el centro de Alertas.
        isLinea && { name: 'diaCorte', label: 'Día de corte (1-28)', type: 'number', value: p.diaCorte ?? '', hint: 'Día del mes que corta la tarjeta' },
        isLinea && { name: 'diaVencimiento', label: 'Día de pago/vencimiento (1-28)', type: 'number', value: p.diaVencimiento ?? '', hint: 'Día límite de pago' },
        { name: 'notas', label: 'Notas', value: p.notas || p.nota || '', span: 2 },
      ].filter(Boolean),
    });
  };

  // ── Editar Inversor ───────────────────────────────
  const openEditInversor = (i) => {
    const ext = (data.productos?.['FIN-I'] || []).find(p => p._airtableId === i._airtableId) || {};
    const tipoComp = ext.tipoCompensacion || i.tipoCompensacion || 'FLAT';
    setEdit({
      kind: 'inversor', id: String(i._airtableId).slice(2),
      title: `Editar inversor · ${i.nombre}`,
      fields: [
        { name: 'nombre', label: 'Nombre', value: i.nombre, span: 2 },
        { name: 'tipoCompensacion', label: 'Método de compensación', type: 'select', value: tipoComp,
          options: Object.entries(TIPO_COMPENSACION_META).map(([k, m]) => ({ value: k, label: m.label })) },
        { name: 'capitalInvertido', label: 'Capital invertido', type: 'number', value: i.montoTotal ?? '' },
        { name: 'montoPactadoDevolver', label: 'Monto a devolver (cap)', type: 'number', value: i.balance ?? '' },
        { name: 'fechaInicio', label: 'Fecha inicio', type: 'date', value: i.fechaInicio || '' },
        { name: 'plazoMeses', label: 'Plazo (meses)', type: 'number', value: ext.plazoMeses ?? '' },
        { name: 'pctAplicado', label: '% aplicado', type: 'number', value: ext.pctAplicado ?? '' },
        { name: 'cuotaMensual', label: 'Cuota mensual fija', type: 'number', value: ext.cuotaMensual ?? '' },
        { name: 'bonusThreshold', label: 'Target ventas/mes (bonus)', type: 'number', value: ext.bonusThreshold ?? '' },
        { name: 'capDevolver', label: 'Cap royalty', type: 'number', value: ext.capDevolver ?? '' },
        { name: 'notas', label: 'Notas', value: i.notas || i.nota || '', span: 2 },
      ],
    });
  };

  const doSaveEdit = async (values) => {
    setEditBusy(true);
    try {
      const { kind, id } = edit;
      if (kind === 'cuenta') {
        await window.AT_CLIENT.updateCuenta(Number(id), {
          nombre: values.nombre,
          tipo: values.tipo,
          moneda: values.moneda,
          limite: values.limite === '' ? null : Number(values.limite),
          notas: values.notas,
          activa: values.activa === 'true',
        });
      } else if (kind === 'prestamo') {
        // tasaMensualPct viene en %  → convertir a decimal
        const tasaDec = values.tasaMensualPct === '' || values.tasaMensualPct == null
          ? null
          : Number(values.tasaMensualPct) / 100;
        const patch = {
          nombre: values.nombre,
          tipo: values.tipo,
          moneda: values.moneda,
          tasaMensual: tasaDec,
          fechaInicio: values.fechaInicio || null,
          notas: values.notas,
        };
        if (values.montoInicial !== undefined)  patch.montoInicial = values.montoInicial === '' ? null : Number(values.montoInicial);
        if (values.limiteCredito !== undefined) patch.limiteCredito = values.limiteCredito === '' ? null : Number(values.limiteCredito);
        if (values.seguroMensual !== undefined) patch.seguroMensual = values.seguroMensual === '' ? null : Number(values.seguroMensual);
        if (values.diaCorte !== undefined)       patch.diaCorte = values.diaCorte === '' ? null : Number(values.diaCorte);
        if (values.diaVencimiento !== undefined) patch.diaVencimiento = values.diaVencimiento === '' ? null : Number(values.diaVencimiento);
        await window.AT_CLIENT.updatePrestamo(Number(id), patch);
      } else if (kind === 'inversor') {
        await window.AT_CLIENT.updateInversor(Number(id), {
          nombre: values.nombre,
          capitalInvertido: Number(values.capitalInvertido) || 0,
          montoPactadoDevolver: Number(values.montoPactadoDevolver) || 0,
          fechaInicio: values.fechaInicio || null,
          plazoMeses: values.plazoMeses === '' ? null : Number(values.plazoMeses),
          tipoCompensacion: values.tipoCompensacion || 'FLAT',
          pctAplicado: values.pctAplicado === '' ? null : values.pctAplicado,
          cuotaMensual: values.cuotaMensual === '' ? null : values.cuotaMensual,
          bonusThreshold: values.bonusThreshold === '' ? null : values.bonusThreshold,
          capDevolver: values.capDevolver === '' ? null : values.capDevolver,
          notas: values.notas,
        });
      }
      window.toastOk('Cambios guardados', edit.title.replace(/^Editar /, ''));
      setEdit(null);
    } catch (e) { window.toastErr('No se pudo guardar', e.message?.slice(0, 120)); }
    setEditBusy(false);
  };

  return (
    <>
      <div className="topbar">
        <div>
          <h1>Finanzas</h1>
          <div className="sub">Préstamos · Inversores · Líneas · Cuentas · todo CRUD</div>
        </div>
        <div className="topbar-actions">
          <TasaUSDInput />
          {['prestamos','tarjetas','inversores','cuentas'].includes(subtab) && (
            <button className="btn" onClick={() => setShowCreate(true)}>+ Nuevo</button>
          )}
        </div>
      </div>

      {/* Tabs agrupados (4): Resumen · Deudas · Inversores · Banco */}
      <div className="tabs">
        <button className={`tab ${subtab === 'resumen' ? 'active' : ''}`} onClick={() => setSubtab('resumen')}>Resumen</button>
        <button className={`tab ${['analisis','prestamos','tarjetas'].includes(subtab) ? 'active' : ''}`} onClick={() => setSubtab('analisis')}>Deudas</button>
        <button className={`tab ${subtab === 'inversores' ? 'active' : ''}`} onClick={() => setSubtab('inversores')}>Inversores</button>
        <button className={`tab ${['cuentas','movimientos'].includes(subtab) ? 'active' : ''}`} onClick={() => setSubtab('cuentas')}>Banco</button>
      </div>

      {/* Sub-selector dentro de Deudas */}
      {['analisis','prestamos','tarjetas'].includes(subtab) && (
        <div className="subtabs">
          <button className={`subtab ${subtab === 'analisis' ? 'active' : ''}`} onClick={() => setSubtab('analisis')}>Análisis</button>
          <button className={`subtab ${subtab === 'prestamos' ? 'active' : ''}`} onClick={() => setSubtab('prestamos')}>Préstamos</button>
          <button className={`subtab ${subtab === 'tarjetas' ? 'active' : ''}`} onClick={() => setSubtab('tarjetas')}>Tarjetas</button>
        </div>
      )}
      {/* Sub-selector dentro de Banco */}
      {['cuentas','movimientos'].includes(subtab) && (
        <div className="subtabs">
          <button className={`subtab ${subtab === 'cuentas' ? 'active' : ''}`} onClick={() => setSubtab('cuentas')}>Cuentas</button>
          <button className={`subtab ${subtab === 'movimientos' ? 'active' : ''}`} onClick={() => setSubtab('movimientos')}>Movimientos</button>
        </div>
      )}

      {/* CREATE MODAL */}
      {showCreate && (
        <div className="modal-backdrop" onClick={() => setShowCreate(false)}>
          <div className="modal" style={{ minWidth: 600 }} onClick={e => e.stopPropagation()}>
            <div className="modal-title">
              {subtab === 'prestamos' ? 'Nuevo préstamo o línea de crédito' :
               subtab === 'tarjetas' ? 'Nueva tarjeta de crédito' :
               subtab === 'inversores' ? 'Nuevo inversor' :
               'Nueva cuenta de banco'}
            </div>
            <div style={{ marginBottom: 'var(--s-3)' }}>
              {/* Préstamos tab: tanto Préstamos amortizados como Líneas de crédito */}
              {subtab === 'prestamos'  && <FormPrestamo onDone={() => setShowCreate(false)} />}
              {/* Tarjetas tab: solo TARJETA_CREDITO */}
              {subtab === 'tarjetas'   && <FormPrestamo tipoFijo="TARJETA_CREDITO" onDone={() => setShowCreate(false)} />}
              {subtab === 'inversores' && <FormInversor onDone={() => setShowCreate(false)} />}
              {subtab === 'cuentas'    && <FormCuenta onDone={() => setShowCreate(false)} />}
            </div>
            <div className="modal-actions">
              <button className="btn ghost" onClick={() => setShowCreate(false)}>Cerrar</button>
            </div>
          </div>
        </div>
      )}

      <ConfirmModal open={!!del} danger busy={delBusy}
        title={`¿Eliminar ${del?.kind}?`}
        body={`${del?.label}. Esta acción es permanente. Si hay movimientos linkeados, puede fallar por constraint FK.`}
        onCancel={() => setDel(null)}
        onConfirm={doDelete} />

      <EditModal open={!!edit} busy={editBusy}
        title={edit?.title}
        fields={edit?.fields || []}
        onCancel={() => setEdit(null)}
        onSave={doSaveEdit} />

      <ProductDetailModal open={!!detail} item={detail?.item} kind={detail?.kind}
        onClose={() => setDetail(null)} />

      {/* RESUMEN — vista original */}
      {subtab === 'resumen' && (<>
      <div className="kpi-row">
        <KPI label="Saldo Coop" value={fmtNum(coop?.saldo || 0)} currency
          delta={null} deltaLabel={`${coop?.tasa?.toFixed?.(2) || 0}%/mes`} />
        <KPI label="Pendiente Andrea" value={fmtNum(andrea?.pendiente || 0)} currency
          delta={null} deltaLabel={`pagado ${fmtCurrency(andrea?.pagado || 0)}`} />
        <KPI label="BHD usado" value={fmtNum(lcs.find(l => /bhd/i.test(l.nombre))?.usado || 0)} currency
          delta={null} deltaLabel={`límite ${fmtCurrency(112000)}`} />
        <KPI label="Cuenta operativa" value={fmtNum((window.BANCOS_SEED || []).filter(b => /BHD/i.test(b.nombre) && b.tipoSub === 'Corriente').reduce((s, b) => s + (b.saldo || 0), 0))} currency
          delta={null} deltaLabel="BHD Débito" />
      </div>

      <div className="grid-2">
        {/* §01 · TODOS los préstamos (no solo Coop) */}
        <div className="section">
          <div className="section-head">
            <div>
              <div className="section-title">Préstamos</div>
              <div className="section-desc">{(productos['FIN-P'] || []).length} préstamo(s) · saldo y pagos</div>
            </div>
          </div>

      </div>

      <div className="grid-2">
        <div className="section">
          <div className="section-head">
            <div>
              <div className="section-title">Líneas de crédito (revolventes)</div>

            <tbody>

            <tbody>

                return (

              {tarjetasCredito.length === 0 && <tr><td colSpan="4" className="empty">Sin tarjetas</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
      </>)}

      {/* ANÁLISIS DE DEUDA — semáforo basado en cash flow vs pagos mensuales */}
      {subtab === 'analisis' && (
        <AnalisisDeudaPanel
          cashflow={data.cashflow || []}

      {/* PRÉSTAMOS — incluye Préstamos amortizados (normales) Y Líneas de crédito (revolventes) */}
      {subtab === 'prestamos' && (<>
        <div className="section">

              <th>Nombre / Entidad</th><th>Tipo</th><th className="right">Monto inicial / Límite</th>

            <tbody>

                    <td className="muted">{p._kind === 'linea' ? 'Línea de crédito (revolvente)' : 'Préstamo amortizado (normal)'}</td>

      {/* TARJETAS DE CRÉDITO — solo TARJETA_CREDITO. Producto financiero distinto: revolventes pero con corte mensual y minimo. */}
      {subtab === 'tarjetas' && (<>
        <div className="section">
          <table className="data">
            <thead><tr>
              <th>Nombre / Entidad</th><th>Tipo</th><th className="right">Límite</th>
              <th className="right">Usado</th><th className="right">Disponible</th>

            <tbody>
              {tarjetasCredito.map(l => {

                    onClick={() => setSelectedId(isSelected ? null : l._airtableId)}>
                    <td>{l.nombre} {isSelected && <span className="muted" style={{ fontSize: 10 }}>(seleccionado ↓)</span>}</td>
                    <td className="muted">{l.tipoSub}</td>

                    <td className="num right">{fmtMoneda(l.usado, l.moneda)}</td>
                    <td className="num right pos">{fmtMoneda(l.limite - l.usado, l.moneda)}</td>

                    <td className="row-actions" onClick={e => e.stopPropagation()}>
                      <div className="row-actions-inner">
                        <button className="icon-btn" title="Editar" onClick={() => openEditPrestamo(l, true)}>✎</button>
                        <button className="icon-btn danger" title="Eliminar" onClick={() => setDel({ kind: 'prestamo', id: l._airtableId.slice(2), label: l.nombre })}>×</button>
