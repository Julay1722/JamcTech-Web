        <input className="input" value={notas} onChange={e => setNotas(e.target.value)} placeholder="opcional" /></div>
      <div style={{ display: 'flex', gap: 8 }}>
        <button className="btn" disabled={!valid || busy} onClick={onSubmit}>{busy ? 'Creando…' : 'Crear'}</button>
      </div>
    </div>
  );
}

// ─── Drilldown: detalle de un producto financiero ─────────────────
// Muestra movimientos del producto (filtrados desde movFin) + form rápido
// para registrar un nuevo movimiento scopeado a ese producto.
function ProductDetailModal({ open, item, kind, onClose }) {
  const data = useATData();
  const movFin = data.movFin || [];
  const [showForm, setShowForm] = useState(false);
  const [showCfs, setShowCfs] = useState(false);  // mostrar también los CF asociados como fallback
  const [delMov, setDelMov] = useState(null);
  const [delBusy, setDelBusy] = useState(false);

  if (!open || !item) return null;

  const aid = item._airtableId;  // 'p-{id}' o 'i-{id}'
  const movs = movFin.filter(m => m.productoFinAirtableId === aid)
                     .sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));

  // CFs como respaldo (movimientos del cashflow que pueden estar linkeados sin pasar por movFin)
  const cfs = (data.cashflow || []).filter(c => {
    const txt = ((c.a || '') + ' ' + (c.c || '') + ' ' + (c.notas || '')).toLowerCase();
    return txt.includes((item.nombre || '').toLowerCase().slice(0, 8));
  }).slice(0, 20);

  const isPrestamo = kind === 'prestamo' || kind === 'linea';
  const totalMovs   = movs.reduce((s, m) => s + (m.monto || 0), 0);
  const totalCapital= movs.reduce((s, m) => s + (m.capital || 0), 0);
  const totalInt    = movs.reduce((s, m) => s + (m.interes || 0), 0);
  const totalSeg    = movs.reduce((s, m) => s + (m.seguro || 0), 0);

  const doDelMov = async () => {
    setDelBusy(true);
    try {
      await window.AT_CLIENT.removeMovFin(delMov._airtableId);
      window.toastOk('Movimiento eliminado', `${delMov.tipo} · ${fmtCurrency(delMov.monto)}`);
      setDelMov(null);
    } catch (e) { window.toastErr('No se pudo eliminar', e.message?.slice(0, 120)); }
    setDelBusy(false);
  };

  return (
    <>
      <div className="modal-backdrop" onClick={onClose}>
        <div className="modal" style={{ minWidth: 780, maxWidth: '92vw', maxHeight: '88vh', overflow: 'auto' }} onClick={e => e.stopPropagation()}>
          {/* Header */}
          <div className="modal-title" style={{ display: 'flex', alignItems: 'baseline', gap: 12 }}>
            <span>{item.nombre}</span>
            <span className="badge neutral" style={{ fontSize: 10 }}>{item.tipo || item.tipoSub || kind}</span>
          </div>

          {/* KPIs del producto */}
          <div className="grid-3" style={{ marginBottom: 'var(--s-4)' }}>
            <div className="stat-card">
              <div className="stat-label">{isPrestamo ? 'Monto/Límite' : 'Capital invertido'}</div>
              <div className="stat-value">{fmtCurrency(item.montoTotal || item.limite || 0)}</div>
            </div>
            <div className="stat-card">
              <div className="stat-label">{isPrestamo ? 'Capital pagado' : 'Pagado'}</div>
              <div className="stat-value" style={{ color: 'var(--success)' }}>{fmtCurrency(item._capitalPagado || item.totalPagado || 0)}</div>
            </div>
            <div className="stat-card">
              <div className="stat-label">{isPrestamo ? 'Saldo' : 'Pendiente'}</div>
              <div className="stat-value" style={{ color: 'var(--danger)' }}>{fmtCurrency(item.balance || 0)}</div>
            </div>
          </div>

          {/* Acciones */}
          <div style={{ display: 'flex', gap: 8, marginBottom: 'var(--s-3)' }}>
            <button className="btn" onClick={() => setShowForm(s => !s)}>
              {showForm ? '× Cerrar form' : '+ Nuevo movimiento'}
            </button>
            <button className="btn ghost" onClick={() => setShowCfs(s => !s)}>
              {showCfs ? 'Ocultar CFs' : 'Ver CFs vinculados'}
            </button>
            <span className="pill" style={{ marginLeft: 'auto' }}>{movs.length} mov · {fmtCurrency(totalMovs)}</span>
          </div>

          {/* Form inline para nuevo movimiento */}
          {showForm && (
            <div className="section" style={{ marginBottom: 'var(--s-3)' }}>
              <FormMovFinScoped item={item} kind={kind} onDone={() => setShowForm(false)} />
            </div>
          )}

          {/* Tabla movimientos (movFin) */}
          <table className="data">
            <thead><tr>
              <th>Fecha</th><th>Tipo</th>
              <th className="right">Capital</th><th className="right">Interés</th>
              <th className="right">Seguro</th><th className="right">Monto</th>
              <th>Cuenta</th><th></th>
            </tr></thead>
            <tbody>
              {movs.length === 0 && (
                <tr><td colSpan="8" className="empty" style={{ padding: 'var(--s-6)' }}>Sin movimientos · click "+ Nuevo movimiento" para registrar uno</td></tr>
              )}
              {movs.map(m => (
                <tr key={m._airtableId}>
                  <td>{fmtDate(m.fecha)}</td>
                  <td className="muted">{m.tipo}</td>
                  <td className="num right">{m.capital > 0 ? fmtCurrency(m.capital) : '—'}</td>
                  <td className="num right">{m.interes > 0 ? fmtCurrency(m.interes) : '—'}</td>
                  <td className="num right">{m.seguro > 0 ? fmtCurrency(m.seguro) : '—'}</td>
                  <td className="num right neg">{fmtCurrency(m.monto)}</td>
                  <td className="muted" style={{ fontSize: 11 }}>{m.cuentaBanco || '—'}</td>
                  <td><button className="icon-btn danger" title="Eliminar" onClick={() => setDelMov(m)}>×</button></td>
                </tr>
              ))}
              {movs.length > 0 && (
                <tr style={{ fontWeight: 600 }}>
                  <td colSpan="2" className="muted">Totales</td>
                  <td className="num right">{fmtCurrency(totalCapital)}</td>
                  <td className="num right">{fmtCurrency(totalInt)}</td>
                  <td className="num right">{fmtCurrency(totalSeg)}</td>
                  <td className="num right">{fmtCurrency(totalMovs)}</td>
                  <td colSpan="2"></td>
                </tr>
              )}
            </tbody>
          </table>

          {/* CFs respaldo (movimientos cashflow que mencionan el nombre del producto) */}
          {showCfs && (
            <div className="section" style={{ marginTop: 'var(--s-3)' }}>
              <div className="section-head">
                <div className="section-title">CFs vinculados por contraparte</div>
                <div className="section-desc">{cfs.length} movimientos de cashflow que mencionan "{(item.nombre || '').slice(0, 20)}…"</div>
              </div>
              <table className="data">
                <thead><tr><th>Fecha</th><th>Concepto</th><th>Contraparte</th><th className="right">Entrada</th><th className="right">Salida</th></tr></thead>
                <tbody>
                  {cfs.map((c, i) => (
                    <tr key={i}>
                      <td>{fmtDate(c.f)}</td>
                      <td className="muted">{c.c}</td>
                      <td>{c.a || '—'}</td>
                      <td className="num right pos">{c.e > 0 ? fmtCurrency(c.e) : '—'}</td>
                      <td className="num right neg">{c.s > 0 ? fmtCurrency(c.s) : '—'}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          <div className="modal-actions">
            <button className="btn ghost" onClick={onClose}>Cerrar</button>
          </div>
        </div>
      </div>

      <ConfirmModal open={!!delMov} danger busy={delBusy}
        title="¿Eliminar movimiento?"
        body={`${delMov?.tipo} · ${fmtCurrency(delMov?.monto || 0)} · ${fmtDate(delMov?.fecha || '')}. Esto también borra el cashflow vinculado.`}
        onCancel={() => setDelMov(null)}
        onConfirm={doDelMov} />
    </>
  );
}

// Versión scopeada del FormMovFin que pre-rellena producto y elige tipo razonable.
function FormMovFinScoped({ item, kind, onDone }) {
  const data = useATData();
  const tipoDefault = kind === 'inversor' ? 'Retorno Inversor'
                    : kind === 'linea'    ? 'Pago Línea'
                    :                       'Cuota Préstamo';
  const [tipo, setTipo] = useState(tipoDefault);
  const [fecha, setFecha] = useState(window.HOY || HOY);
  const [monto, setMonto] = useState('');
  const [capital, setCapital] = useState('');
  const [interes, setInteres] = useState('');
  const [seguro, setSeguro] = useState('');
  const [cuentaBanco, setCuentaBanco] = useState('BHD Debito');
  const [notas, setNotas] = useState('');
  const [busy, setBusy] = useState(false);

  const MOVFIN_TIPOS = ['Cuota Préstamo', 'Abono Préstamo', 'Disposición Línea', 'Pago Línea', 'Cargo Línea', 'Depósito Inversor', 'Retorno Inversor', 'Otro'];

  useEffect(() => {
    if (tipo === 'Cuota Préstamo' && (capital || interes || seguro)) {
      setMonto((Number(capital || 0) + Number(interes || 0) + Number(seguro || 0)).toString());
    }
  }, [tipo, capital, interes, seguro]);

  const cuentas = (data._cuentas || []).map(c => c.nombre);
  const valid = tipo && Number(monto) > 0;

  const onSubmit = async () => {
    setBusy(true);
    try {
      await window.AT_CLIENT.createMovFin({
        tipo, fecha,
        monto: Number(monto),
        productoFinAirtableId: item._airtableId,
        productoFinId: item.idFin || item.id,
        cuentaBanco,
        capital: Number(capital) || 0,
        interes: Number(interes) || 0,
        seguro:  Number(seguro)  || 0,
        notas,
      });
      window.toastOk('Movimiento registrado', `${tipo} · ${fmtCurrency(monto)} · ${item.nombre}`);
      setMonto(''); setCapital(''); setInteres(''); setSeguro(''); setNotas('');
      onDone?.();
    } catch (e) { window.toastErr('No se pudo registrar', e.message?.slice(0, 120)); }
    setBusy(false);
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 'var(--s-3)' }}>
      <div className="row-3">
        <div className="field"><div className="field-label">Tipo</div>
          <select className="select" value={tipo} onChange={e => setTipo(e.target.value)}>
            {MOVFIN_TIPOS.map(t => <option key={t}>{t}</option>)}
          </select></div>
        <div className="field"><div className="field-label">Fecha</div>
          <input className="input num" type="date" value={fecha} onChange={e => setFecha(e.target.value)} /></div>
        <div className="field"><div className="field-label">Cuenta origen</div>
          <select className="select" value={cuentaBanco} onChange={e => setCuentaBanco(e.target.value)}>
            {cuentas.length > 0 ? cuentas.map(c => <option key={c}>{c}</option>) : <><option>BHD Debito</option><option>Efectivo</option></>}
          </select></div>
      </div>
      {tipo === 'Cuota Préstamo' && (
        <div className="row-3">
          <div className="field"><div className="field-label">Capital</div>
            <input className="input num" type="number" value={capital} onChange={e => setCapital(e.target.value)} placeholder="0" /></div>
          <div className="field"><div className="field-label">Interés</div>
            <input className="input num" type="number" value={interes} onChange={e => setInteres(e.target.value)} placeholder="0" /></div>
          <div className="field"><div className="field-label">Seguro</div>
            <input className="input num" type="number" value={seguro} onChange={e => setSeguro(e.target.value)} placeholder="0" /></div>
        </div>
      )}
      <div className="row">
        <div className="field"><div className="field-label">Monto total</div>
          <input className="input num" type="number" value={monto} onChange={e => setMonto(e.target.value)} placeholder="0" /></div>
        <div className="field"><div className="field-label">Notas</div>
          <input className="input" value={notas} onChange={e => setNotas(e.target.value)} placeholder="opcional" /></div>
      </div>
      <div style={{ display: 'flex', gap: 8 }}>
        <button className="btn" disabled={!valid || busy} onClick={onSubmit}>{busy ? 'Guardando…' : 'Guardar movimiento'}</button>
      </div>
    </div>
  );
}

// ─── Form Crear Inversor ─────────────────────────────────────────
function FormInversor({ onDone }) {
  const data = useATData();
  const personas = (data._contrapartes || []).filter(c => c.tipo === 'INVERSOR' || c.tipo === 'PERSONA_OPERATIVA' || c.tipo === 'CLIENTE_FAMILIAR');
  const [nombre, setNombre] = useState('');
  const [capital, setCapital] = useState('');
  const [retorno, setRetorno] = useState('');
  const [fechaInicio, setFechaInicio] = useState('');
  const [plazo, setPlazo] = useState('');
  const [contraparte, setContraparte] = useState('');
  const [notas, setNotas] = useState('');
  const [busy, setBusy] = useState(false);
  const valid = nombre.length > 1 && Number(capital) > 0;
  const onSubmit = async () => {
    setBusy(true);
    try {
      await window.AT_CLIENT.createInversor({
        nombre,
        capitalInvertido: Number(capital),
        montoPactadoDevolver: Number(retorno) || Number(capital) * 2,  // default 2× capital
        fechaInicio: fechaInicio || null,
        plazoMeses: plazo || null,
        contraparteId: contraparte || null,
        notas,
      });
      window.toastOk('Inversor creado', `${nombre} · aporte ${fmtCurrency(capital)}`);
      setNombre(''); setCapital(''); setRetorno(''); setNotas('');
      onDone?.();
    } catch (e) { window.toastErr('No se pudo crear', e.message?.slice(0, 120)); }
    setBusy(false);
  };
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 'var(--s-3)' }}>
      <div className="row">
        <div className="field"><div className="field-label">Nombre</div>
          <input className="input" value={nombre} onChange={e => setNombre(e.target.value)} placeholder="ej. Andrea Correa" /></div>
        <div className="field"><div className="field-label">Vincular a contraparte</div>
          <select className="select" value={contraparte} onChange={e => setContraparte(e.target.value)}>
            <option value="">— ninguna —</option>
            {personas.map(c => <option key={c.id} value={c.id}>{c.nombre} ({c.tipo})</option>)}
          </select></div>
      </div>
      <div className="row-3">
        <div className="field"><div className="field-label">Capital invertido</div>
          <input className="input num" type="number" value={capital} onChange={e => setCapital(e.target.value)} placeholder="50000" /></div>
        <div className="field"><div className="field-label">Monto a devolver</div>
          <input className="input num" type="number" value={retorno} onChange={e => setRetorno(e.target.value)} placeholder={capital ? (capital * 2) : '100000'} />
          <div className="field-hint">Default 2× capital si vacío</div></div>
        <div className="field"><div className="field-label">Plazo (meses)</div>
          <input className="input num" type="number" value={plazo} onChange={e => setPlazo(e.target.value)} placeholder="48" /></div>
      </div>
      <div className="row">
        <div className="field"><div className="field-label">Fecha inicio</div>
          <input className="input num" type="date" value={fechaInicio} onChange={e => setFechaInicio(e.target.value)} /></div>
        <div className="field"><div className="field-label">Notas</div>
          <input className="input" value={notas} onChange={e => setNotas(e.target.value)} placeholder="opcional" /></div>
      </div>
      <div style={{ display: 'flex', gap: 8 }}>
        <button className="btn" disabled={!valid || busy} onClick={onSubmit}>{busy ? 'Creando…' : 'Crear inversor'}</button>
      </div>
    </div>
  );
}

function FinanzasPage() {
  const data = useATData();
  const productos = data.productos || { 'FIN-P': [], 'FIN-I': [], 'FIN-LC': [] };
  const coop = productos['FIN-P'][0];
  const andrea = productos['FIN-I'][0];
  const lcs = productos['FIN-LC'] || [];
  const cuentas = data._cuentas || [];
  const fin = data.financiero || [];
  const [subtab, setSubtab] = useState('resumen');
  const [showCreate, setShowCreate] = useState(false);
  const [del, setDel] = useState(null);
  const [delBusy, setDelBusy] = useState(false);
  const [edit, setEdit] = useState(null); // { kind, id, title, fields }
  const [editBusy, setEditBusy] = useState(false);
  const [detail, setDetail] = useState(null); // { item, kind }

  const doDelete = async () => {
    setDelBusy(true);
    try {
      const { kind, id, label } = del;
      if      (kind === 'cuenta')   await window.AT_CLIENT.removeCuenta(id);
      else if (kind === 'prestamo') await window.AT_CLIENT.removePrestamo(id);
      else if (kind === 'inversor') await window.AT_CLIENT.removeInversor(id);
      window.toastOk('Eliminado', label);
      setDel(null);
    } catch (e) { window.toastErr('No se pudo eliminar', e.message?.slice(0, 120)); }
    setDelBusy(false);
  };

  // ── Editar Cuenta ─────────────────────────────────
  const openEditCuenta = (c) => setEdit({
    kind: 'cuenta', id: c.id, title: `Editar cuenta · ${c.nombre}`,
    fields: [
      { name: 'nombre', label: 'Nombre', value: c.nombre, span: 2 },
      { name: 'tipo', label: 'Tipo', type: 'select', value: c.tipo,
        options: [{value:'DEBITO',label:'Débito'},{value:'CREDITO',label:'Crédito (tarjeta)'},{value:'EFECTIVO',label:'Efectivo'}] },
      { name: 'moneda', label: 'Moneda', type: 'select', value: c.moneda,
        options: [{value:'RD',label:'RD$'},{value:'USD',label:'USD'}] },
      { name: 'limite', label: 'Límite crédito', type: 'number', value: c.limite_credito ?? '' },
      { name: 'activa', label: 'Activa', type: 'select', value: String(c.activa ?? true),
        options: [{value:'true',label:'Sí'},{value:'false',label:'No'}] },
      { name: 'notas', label: 'Notas', value: c.notas || '', span: 2 },
    ],
  });

  // ── Editar Préstamo o Línea/Tarjeta ───────────────
  // Para PRESTAMO se edita monto_inicial; para LINEA/TARJETA se edita limite_credito.
  const openEditPrestamo = (p, isLinea) => {
    // p viene de `fin` (resumido) — tasaMensual en decimal, sin plazo ni fecha_primer_pago.
    const tipoEnum = isLinea ? (p.tipoSub?.toLowerCase().includes('tarjeta') ? 'TARJETA_CREDITO' : 'LINEA_CREDITO') : 'PRESTAMO';
    setEdit({
      kind: 'prestamo', id: String(p._airtableId).slice(2),
      title: `Editar ${isLinea ? 'línea/tarjeta' : 'préstamo'} · ${p.nombre}`,
      fields: [
        { name: 'nombre', label: 'Nombre', value: p.nombre, span: 2 },
        { name: 'tipo', label: 'Tipo', type: 'select', value: tipoEnum,
          options: [{value:'PRESTAMO',label:'Préstamo amortizado'},{value:'LINEA_CREDITO',label:'Línea de crédito'},{value:'TARJETA_CREDITO',label:'Tarjeta de crédito'}] },
        { name: 'moneda', label: 'Moneda', type: 'select', value: 'RD',
          options: [{value:'RD',label:'RD$'},{value:'USD',label:'USD'}] },
        isLinea
          ? { name: 'limiteCredito', label: 'Límite de crédito', type: 'number', value: p.limite ?? p.montoTotal ?? '' }
          : { name: 'montoInicial', label: 'Monto inicial', type: 'number', value: p.montoTotal ?? '' },
        { name: 'tasaMensualPct', label: 'Tasa mensual (%)', type: 'number',
          value: ((p.tasaMensual || 0) * (isLinea ? 1 : 100)).toFixed(2),
          hint: isLinea ? 'Decimal mensual (ej. 2.17)' : 'Porcentaje mensual (ej. 1.67)' },
        !isLinea && { name: 'seguroMensual', label: 'Seguro mensual', type: 'number', value: p.seguro ?? p.seguroMensual ?? '' },
        { name: 'fechaInicio', label: 'Fecha inicio', type: 'date', value: p.fechaInicio || '' },
        { name: 'notas', label: 'Notas', value: p.notas || p.nota || '', span: 2 },
      ].filter(Boolean),
    });
  };

  // ── Editar Inversor ───────────────────────────────
  const openEditInversor = (i) => setEdit({
    kind: 'inversor', id: String(i._airtableId).slice(2),
    title: `Editar inversor · ${i.nombre}`,
    fields: [
      { name: 'nombre', label: 'Nombre', value: i.nombre, span: 2 },
      { name: 'capitalInvertido', label: 'Capital invertido', type: 'number', value: i.montoTotal ?? '' },
      { name: 'montoPactadoDevolver', label: 'Monto a devolver', type: 'number', value: i.balance ?? '' },
      { name: 'fechaInicio', label: 'Fecha inicio', type: 'date', value: i.fechaInicio || '' },
      { name: 'notas', label: 'Notas', value: i.notas || i.nota || '', span: 2 },
    ],
  });

  const doSaveEdit = async (values) => {
    setEditBusy(true);
    try {
      const { kind, id } = edit;
      if (kind === 'cuenta') {
        await window.AT_CLIENT.updateCuenta(Number(id), {
          nombre: values.nombre,
          tipo: values.tipo,
          moneda: values.moneda,
          limite: values.limite === '' ? null : Number(values.limite),
          notas: values.notas,
          activa: values.activa === 'true',
        });
      } else if (kind === 'prestamo') {
        // tasaMensualPct viene en %  → convertir a decimal
        const tasaDec = values.tasaMensualPct === '' || values.tasaMensualPct == null
          ? null
          : Number(values.tasaMensualPct) / 100;
        const patch = {
          nombre: values.nombre,
          tipo: values.tipo,
          moneda: values.moneda,
          tasaMensual: tasaDec,
          fechaInicio: values.fechaInicio || null,
          notas: values.notas,
        };
        if (values.montoInicial !== undefined)  patch.montoInicial = values.montoInicial === '' ? null : Number(values.montoInicial);
        if (values.limiteCredito !== undefined) patch.limiteCredito = values.limiteCredito === '' ? null : Number(values.limiteCredito);
        if (values.seguroMensual !== undefined) patch.seguroMensual = values.seguroMensual === '' ? null : Number(values.seguroMensual);
        await window.AT_CLIENT.updatePrestamo(Number(id), patch);
      } else if (kind === 'inversor') {
        await window.AT_CLIENT.updateInversor(Number(id), {
          nombre: values.nombre,
          capitalInvertido: Number(values.capitalInvertido) || 0,
          montoPactadoDevolver: Number(values.montoPactadoDevolver) || 0,
          fechaInicio: values.fechaInicio || null,
          notas: values.notas,
        });
      }
      window.toastOk('Cambios guardados', edit.title.replace(/^Editar /, ''));
      setEdit(null);
    } catch (e) { window.toastErr('No se pudo guardar', e.message?.slice(0, 120)); }
    setEditBusy(false);
  };

  return (
    <>
      <div className="topbar">
        <div>
          <h1>Finanzas</h1>
          <div className="sub">Préstamos · Inversores · Líneas · Cuentas · todo CRUD</div>
        </div>
        {subtab !== 'resumen' && (
          <button className="btn" onClick={() => setShowCreate(true)}>+ Nuevo</button>
        )}
      </div>

      <div className="tabs">
        <button className={`tab ${subtab === 'resumen' ? 'active' : ''}`} onClick={() => setSubtab('resumen')}>Resumen</button>
        <button className={`tab ${subtab === 'prestamos' ? 'active' : ''}`} onClick={() => setSubtab('prestamos')}>Préstamos</button>
        <button className={`tab ${subtab === 'lineas' ? 'active' : ''}`} onClick={() => setSubtab('lineas')}>Líneas / Tarjetas</button>
        <button className={`tab ${subtab === 'inversores' ? 'active' : ''}`} onClick={() => setSubtab('inversores')}>Inversores</button>
        <button className={`tab ${subtab === 'cuentas' ? 'active' : ''}`} onClick={() => setSubtab('cuentas')}>Cuentas de banco</button>
      </div>

      {/* CREATE MODAL */}
      {showCreate && (
        <div className="modal-backdrop" onClick={() => setShowCreate(false)}>
          <div className="modal" style={{ minWidth: 600 }} onClick={e => e.stopPropagation()}>
            <div className="modal-title">
              {subtab === 'prestamos' ? 'Nuevo préstamo' :
               subtab === 'lineas' ? 'Nueva línea / tarjeta' :
               subtab === 'inversores' ? 'Nuevo inversor' :
               'Nueva cuenta de banco'}
            </div>
            <div style={{ marginBottom: 'var(--s-3)' }}>
              {subtab === 'prestamos'  && <FormPrestamo tipoFijo="PRESTAMO" onDone={() => setShowCreate(false)} />}
              {subtab === 'lineas'     && <FormPrestamo onDone={() => setShowCreate(false)} />}
              {subtab === 'inversores' && <FormInversor onDone={() => setShowCreate(false)} />}
              {subtab === 'cuentas'    && <FormCuenta onDone={() => setShowCreate(false)} />}
            </div>
            <div className="modal-actions">
              <button className="btn ghost" onClick={() => setShowCreate(false)}>Cerrar</button>
            </div>
          </div>
        </div>
      )}

      <ConfirmModal open={!!del} danger busy={delBusy}
        title={`¿Eliminar ${del?.kind}?`}
        body={`${del?.label}. Esta acción es permanente. Si hay movimientos linkeados, puede fallar por constraint FK.`}
        onCancel={() => setDel(null)}
        onConfirm={doDelete} />

      <EditModal open={!!edit} busy={editBusy}
        title={edit?.title}
        fields={edit?.fields || []}
        onCancel={() => setEdit(null)}
        onSave={doSaveEdit} />

      <ProductDetailModal open={!!detail} item={detail?.item} kind={detail?.kind}
        onClose={() => setDetail(null)} />

      {/* RESUMEN — vista original */}
      {subtab === 'resumen' && (<>
      <div className="kpi-row">
        <KPI label="Saldo Coop" value={fmtNum(coop?.saldo || 0)} currency
          delta={null} deltaLabel={`${coop?.tasa?.toFixed?.(2) || 0}%/mes`} />
        <KPI label="Pendiente Andrea" value={fmtNum(andrea?.pendiente || 0)} currency
          delta={null} deltaLabel={`pagado ${fmtCurrency(andrea?.pagado || 0)}`} />
        <KPI label="BHD usado" value={fmtNum(lcs.find(l => /bhd/i.test(l.nombre))?.usado || 0)} currency
          delta={null} deltaLabel={`límite ${fmtCurrency(112000)}`} />
        <KPI label="Cuenta operativa" value={fmtNum(data._cuentas?.[0] ? cuentas.reduce((s, c) => s, 0) : 0)} currency
          delta={null} deltaLabel="BHD Débito" />
      </div>

      <div className="grid-2">
        <div className="section">
          <div className="section-head">
            <div>
              <div className="section-title">Préstamo Cooperativa</div>
              <div className="section-desc">{coop?.movimientos?.length || 0} pagos registrados</div>
            </div>
            <span className="badge neutral">{coop?.tasa?.toFixed?.(2) || 0}% / mes</span>
          </div>
          <div className="grid-3">
            <div className="stat-card">
              <div className="stat-label">Monto inicial</div>
              <div className="stat-value">{fmtCurrency(coop?.monto || 0)}</div>
            </div>
            <div className="stat-card">
              <div className="stat-label">Capital pagado</div>
              <div className="stat-value" style={{ color: 'var(--success)' }}>{fmtCurrency(coop?.pagado || 0)}</div>
            </div>
            <div className="stat-card">
              <div className="stat-label">Saldo</div>
              <div className="stat-value" style={{ color: 'var(--danger)' }}>{fmtCurrency(coop?.saldo || 0)}</div>
            </div>
          </div>
        </div>

        <div className="section">
          <div className="section-head">
            <div>
              <div className="section-title">Inversora · Andrea Correa</div>
              <div className="section-desc">Retorno 2× · {andrea?.movimientos?.length || 0} pagos</div>
            </div>
          </div>
          <div className="grid-3">
            <div className="stat-card">
              <div className="stat-label">Aporte</div>
              <div className="stat-value">{fmtCurrency(andrea?.aporte || 0)}</div>
            </div>
            <div className="stat-card">
              <div className="stat-label">Pagado</div>
              <div className="stat-value" style={{ color: 'var(--success)' }}>{fmtCurrency(andrea?.pagado || 0)}</div>
            </div>
            <div className="stat-card">
              <div className="stat-label">Pendiente</div>
              <div className="stat-value" style={{ color: 'var(--warning)' }}>{fmtCurrency(andrea?.pendiente || 0)}</div>
            </div>
          </div>
        </div>
      </div>

      <div className="section">
        <div className="section-head">
          <div>
            <div className="section-title">Líneas de crédito · Tarjetas</div>
            <div className="section-desc">{lcs.length} productos</div>
          </div>
        </div>
        <table className="data">
          <thead><tr>
            <th>Producto</th><th>Tipo</th>
            <th className="right">Límite</th><th className="right">Usado</th>
            <th className="right">Disponible</th><th className="right">% uso</th>
            <th className="right">Tasa</th>
          </tr></thead>
          <tbody>
            {lcs.map(l => {
              const usoPct = l.limite > 0 ? (l.usado / l.limite) * 100 : 0;
              const cls = usoPct > 80 ? 'danger' : usoPct > 50 ? 'warning' : 'success';
              return (
                <tr key={l.id}>
                  <td>{l.nombre}</td>
                  <td className="muted">{l.tipoSub}</td>
                  <td className="num right">{fmtCurrency(l.limite)}</td>
                  <td className="num right">{fmtCurrency(l.usado)}</td>
                  <td className="num right pos">{fmtCurrency(l.limite - l.usado)}</td>
                  <td className="num right"><span className={`badge ${cls}`}>{usoPct.toFixed(1)}%</span></td>
                  <td className="num right muted">{l.tasaAnual?.toFixed?.(1) || '—'}% anual</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      </>)}

      {/* PRÉSTAMOS — tabla CRUD */}
      {subtab === 'prestamos' && (
        <div className="section">
          <table className="data">
            <thead><tr>
              <th>Nombre</th><th>Tipo</th><th className="right">Monto inicial</th>
              <th className="right">Capital pagado</th><th className="right">Saldo</th>
              <th className="right">Tasa</th><th>Moneda</th><th></th>
            </tr></thead>
            <tbody>
              {fin.filter(f => /préstamo|prestamo/i.test(f.tipo)).map(p => (
                <tr key={p._airtableId} style={{ cursor: 'pointer' }} onClick={() => setDetail({ item: p, kind: 'prestamo' })}>
                  <td>{p.nombre}</td>
                  <td className="muted">{p.tipo}</td>
                  <td className="num right">{fmtCurrency(p.montoTotal)}</td>
                  <td className="num right pos">{fmtCurrency(p._capitalPagado || 0)}</td>
                  <td className="num right neg">{fmtCurrency(p.balance || 0)}</td>
                  <td className="num right">{((p.tasaMensual || 0) * 100).toFixed(2)}%</td>
                  <td className="muted">RD$</td>
                  <td style={{ display: 'flex', gap: 4 }} onClick={e => e.stopPropagation()}>
                    <button className="icon-btn" title="Editar" onClick={() => openEditPrestamo(p, false)}>✎</button>
                    <button className="icon-btn danger" title="Eliminar" onClick={() => setDel({ kind: 'prestamo', id: p._airtableId.slice(2), label: p.nombre })}>×</button>
                  </td>
                </tr>
              ))}
              {fin.filter(f => /préstamo|prestamo/i.test(f.tipo)).length === 0 && (
                <tr><td colSpan="8" className="empty" style={{ padding: 'var(--s-6)' }}>Sin préstamos · click "+ Nuevo" para crear uno</td></tr>
              )}
            </tbody>
          </table>
        </div>
      )}

      {/* LÍNEAS / TARJETAS — tabla CRUD */}
      {subtab === 'lineas' && (
        <div className="section">
          <table className="data">
            <thead><tr>
              <th>Nombre</th><th>Tipo</th><th className="right">Límite</th>
              <th className="right">Usado</th><th className="right">Tasa</th><th>Moneda</th><th></th>
            </tr></thead>
            <tbody>
              {lcs.map(l => (
                <tr key={l.id} style={{ cursor: 'pointer' }} onClick={() => setDetail({ item: l, kind: 'linea' })}>
                  <td>{l.nombre}</td>
                  <td className="muted">{l.tipoSub}</td>
                  <td className="num right">{fmtCurrency(l.limite)}</td>
                  <td className="num right">{fmtCurrency(l.usado)}</td>
                  <td className="num right">{l.tasaAnual?.toFixed?.(1) || '—'}% anual</td>
                  <td className="muted">{l.moneda}</td>
                  <td style={{ display: 'flex', gap: 4 }} onClick={e => e.stopPropagation()}>
                    <button className="icon-btn" title="Editar" onClick={() => openEditPrestamo(l, true)}>✎</button>
                    <button className="icon-btn danger" title="Eliminar" onClick={() => setDel({ kind: 'prestamo', id: l._airtableId.slice(2), label: l.nombre })}>×</button>
                  </td>
                </tr>
              ))}
              {lcs.length === 0 && (
                <tr><td colSpan="7" className="empty" style={{ padding: 'var(--s-6)' }}>Sin líneas o tarjetas · click "+ Nuevo"</td></tr>
              )}
            </tbody>
          </table>
        </div>
      )}

      {/* INVERSORES — tabla CRUD */}
      {subtab === 'inversores' && (
        <div className="section">
          <table className="data">
            <thead><tr>
              <th>Nombre</th><th className="right">Capital</th>
              <th className="right">A devolver</th><th className="right">Pagado</th>
              <th className="right">Pendiente</th><th></th>
            </tr></thead>
            <tbody>
              {fin.filter(f => /inversor/i.test(f.tipo)).map(i => (
                <tr key={i._airtableId} style={{ cursor: 'pointer' }} onClick={() => setDetail({ item: i, kind: 'inversor' })}>
                  <td>{i.nombre}</td>
                  <td className="num right">{fmtCurrency(i.montoTotal)}</td>
                  <td className="num right">{fmtCurrency(i.balance)}</td>
                  <td className="num right pos">{fmtCurrency(i.totalPagado)}</td>
                  <td className="num right neg">{fmtCurrency((i.balance || 0) - (i.totalPagado || 0))}</td>
                  <td style={{ display: 'flex', gap: 4 }} onClick={e => e.stopPropagation()}>
                    <button className="icon-btn" title="Editar" onClick={() => openEditInversor(i)}>✎</button>
                    <button className="icon-btn danger" title="Eliminar" onClick={() => setDel({ kind: 'inversor', id: i._airtableId.slice(2), label: i.nombre })}>×</button>
                  </td>
                </tr>
              ))}
              {fin.filter(f => /inversor/i.test(f.tipo)).length === 0 && (
                <tr><td colSpan="6" className="empty" style={{ padding: 'var(--s-6)' }}>Sin inversores · click "+ Nuevo"</td></tr>
              )}
            </tbody>
          </table>
        </div>
      )}

      {/* CUENTAS DE BANCO — tabla CRUD */}
      {subtab === 'cuentas' && (
        <div className="section">
          <table className="data">
            <thead><tr>
              <th>Nombre</th><th>Tipo</th><th>Moneda</th>
              <th className="right">Límite crédito</th><th>Notas</th><th></th>
            </tr></thead>
            <tbody>
              {cuentas.map(c => (
                <tr key={c.id}>
                  <td>{c.nombre}</td>
                  <td><span className={`badge ${c.tipo === 'DEBITO' ? 'success' : c.tipo === 'CREDITO' ? 'warning' : 'neutral'}`}>{c.tipo}</span></td>
                  <td className="muted">{c.moneda}</td>
                  <td className="num right">{c.limite_credito ? fmtCurrency(c.limite_credito) : '—'}</td>
                  <td className="muted" style={{ fontSize: 11 }}>{c.notas || '—'}</td>
                  <td style={{ display: 'flex', gap: 4 }}>
                    <button className="icon-btn" title="Editar" onClick={() => openEditCuenta(c)}>✎</button>
                    <button className="icon-btn danger" title="Eliminar" onClick={() => setDel({ kind: 'cuenta', id: c.id, label: c.nombre })}>×</button>
                  </td>
                </tr>
              ))}
              {cuentas.length === 0 && (
                <tr><td colSpan="6" className="empty" style={{ padding: 'var(--s-6)' }}>Sin cuentas · click "+ Nuevo"</td></tr>
              )}
            </tbody>
          </table>
        </div>
      )}
    </>
  );
}

// Toast system (global, controlado por evento)
// ════════════════════════════════════════════════════════════════
const TOAST_LISTENERS = new Set();
function pushToast(t) {
  const id = Math.random().toString(36).slice(2);
  TOAST_LISTENERS.forEach(fn => fn({ id, ...t }));
}
window.toastOk   = (title, msg) => pushToast({ kind: 'success', title, msg });
window.toastErr  = (title, msg) => pushToast({ kind: 'error', title, msg });
window.toastWarn = (title, msg) => pushToast({ kind: 'warning', title, msg });

function ToastStack() {
  const [items, setItems] = useState([]);
  useEffect(() => {
    const onPush = (t) => {
      setItems(arr => [...arr, t]);
      setTimeout(() => setItems(arr => arr.filter(x => x.id !== t.id)), 4500);
    };
    TOAST_LISTENERS.add(onPush);
    return () => TOAST_LISTENERS.delete(onPush);
  }, []);
  return (
    <div className="toast-stack">
      {items.map(t => (
        <div key={t.id} className={`toast ${t.kind}`}>
          <div className="toast-title">{t.title}</div>
          {t.msg && <div className="toast-msg">{t.msg}</div>}
        </div>
      ))}
    </div>
  );
}

// ════════════════════════════════════════════════════════════════
// Period filter (TOPBAR · TODO/7D/30D/90D/6M/1AÑO)
// Globally consumed via React state passed down per page.
// ════════════════════════════════════════════════════════════════
const PERIOD_PRESETS = [
  { id: 'todo',  l: 'TODO' },
  { id: 'd:7',   l: '7D'   },
  { id: 'd:30',  l: '30D'  },
  { id: 'd:90',  l: '90D'  },
  { id: 'd:180', l: '6M'   },
  { id: 'd:365', l: '1A'   },
];
// Genera lista de meses con data: recorre todas las fechas conocidas
// (ventas + cashflow) y produce ['2026-05', '2026-04', ...] del más
// reciente al más antiguo.
function _availableMonths() {
  const set = new Set();
  const add = (d) => { if (d && typeof d === 'string' && d.length >= 7) set.add(d.slice(0, 7)); };
  (window.__AIRTABLE_DATA__?.ventas   || []).forEach(v => add(v.fecha));
  (window.__AIRTABLE_DATA__?.cashflow || []).forEach(m => add(m.f));
  // Asegurar que el mes actual aparezca aunque no haya transacciones todavía.
  const today = window.HOY || new Date().toISOString().slice(0, 10);
  add(today);
  return [...set].sort().reverse();
}
const MES_NAMES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
function _fmtMonth(ym) {
  const [y, m] = ym.split('-');
  return `${MES_NAMES[parseInt(m, 10) - 1]} ${y.slice(2)}`;
}
function PeriodFilter({ value, onChange }) {
  const [showPicker, setShowPicker] = useState(false);
  const [showMonths, setShowMonths] = useState(false);
  const isCustom = typeof value === 'string' && value.startsWith('custom');
  const isMonth  = typeof value === 'string' && value.startsWith('mes:');
  const customParts = isCustom ? value.split(':') : [];
  const [from, setFrom] = useState(customParts[1] || (window.HOY || new Date().toISOString().slice(0,10)));
  const [to,   setTo]   = useState(customParts[2] || (window.HOY || new Date().toISOString().slice(0,10)));

  // Recomputar cuando cambien data: usar el hook reactivo de tablas como trigger.
  const dataVentas = useATData().ventas || [];
  const dataCF     = useATData().cashflow || [];
  const months = useMemo(() => _availableMonths(), [dataVentas.length, dataCF.length, value]);

  const apply = () => {
    if (from && to && from <= to) {
      onChange(`custom:${from}:${to}`);
      setShowPicker(false);
    }
  };

  return (
    <div style={{ position: 'relative' }}>
      <div className="period-bar">
        {PERIOD_PRESETS.map(p => (
          <button key={p.id} className={value === p.id ? 'active' : ''}
            onClick={() => { onChange(p.id); setShowPicker(false); setShowMonths(false); }}>{p.l}</button>
        ))}
        <button className={isMonth ? 'active' : ''} onClick={() => { setShowMonths(s => !s); setShowPicker(false); }}>
          {isMonth ? _fmtMonth(value.slice(4)).toUpperCase() : 'MES ▾'}
        </button>
        <button className={isCustom ? 'active' : ''} onClick={() => { setShowPicker(s => !s); setShowMonths(false); }}>
          {isCustom ? `${customParts[1]} → ${customParts[2]}` : 'RANGO…'}
        </button>
      </div>

      {showMonths && (
        <div style={{
          position: 'absolute', top: '100%', right: 0, marginTop: 6, zIndex: 60,
          background: 'var(--surface)', border: '1px solid var(--border)',
          borderRadius: 'var(--r-md)', padding: 'var(--s-2)',
          boxShadow: '0 4px 16px rgba(0,0,0,.15)',
          maxHeight: 320, overflowY: 'auto', minWidth: 160,
        }}>
          {months.length === 0 && <div className="muted" style={{ padding: 8, fontSize: 12 }}>Sin datos</div>}
          {months.map(ym => (
            <button key={ym}
              style={{
                display: 'block', width: '100%', textAlign: 'left',
                padding: '6px 10px', border: 'none', background: 'transparent',
                color: value === `mes:${ym}` ? 'var(--accent)' : 'var(--text-2)',
                fontWeight: value === `mes:${ym}` ? 600 : 500,
                cursor: 'pointer', fontSize: 12, borderRadius: 4,
              }}
              onMouseEnter={e => e.currentTarget.style.background = 'var(--surface-2)'}
              onMouseLeave={e => e.currentTarget.style.background = 'transparent'}
              onClick={() => { onChange(`mes:${ym}`); setShowMonths(false); }}>
              {_fmtMonth(ym)}
            </button>
          ))}
        </div>
      )}

      {showPicker && (
        <div style={{
          position: 'absolute', top: '100%', right: 0, marginTop: 6, zIndex: 60,
          background: 'var(--surface)', border: '1px solid var(--border)',
          borderRadius: 'var(--r-md)', padding: 'var(--s-3)',
          boxShadow: '0 4px 16px rgba(0,0,0,.15)',
          display: 'flex', gap: 8, alignItems: 'flex-end',
        }}>
          <div className="field">
            <div className="field-label">Desde</div>
            <input className="input num" type="date" value={from} onChange={e => setFrom(e.target.value)} />
          </div>
          <div className="field">
            <div className="field-label">Hasta</div>
            <input className="input num" type="date" value={to} onChange={e => setTo(e.target.value)} />
          </div>
          <button className="btn" disabled={!(from && to && from <= to)} onClick={apply}>Aplicar</button>
          <button className="btn ghost" onClick={() => setShowPicker(false)}>×</button>
        </div>
      )}
    </div>
  );
}
function periodToRange(p) {
  if (!p || p === 'todo') return null;
  const todayReal = window.HOY || new Date().toISOString().slice(0, 10);

  // d:N → últimos N días incluyendo hoy
  if (p.startsWith('d:')) {
    const dias = parseInt(p.slice(2));
    const desde = new Date(todayReal);
    desde.setDate(desde.getDate() - (dias - 1));
    return { from: desde.toISOString().slice(0, 10), to: todayReal };
  }

  // mes:YYYY-MM → primer al último día del mes calendario indicado
  if (p.startsWith('mes:')) {
    const [y, m] = p.slice(4).split('-').map(Number);
    if (!y || !m) return null;
    const first = new Date(y, m - 1, 1);
    const last  = new Date(y, m, 0); // día 0 del mes siguiente = último del actual
    return {
      from: first.toISOString().slice(0, 10),
      to:   last.toISOString().slice(0, 10),
    };
  }

  // custom:YYYY-MM-DD:YYYY-MM-DD
  if (p.startsWith('custom:')) {
    const [, from, to] = p.split(':');
    if (from && to) return { from, to };
  }

  return null;
}
function filterByPeriod(arr, period, dateKey = 'f') {
  const range = periodToRange(period);
  if (!range) return arr;
  return arr.filter(r => r[dateKey] >= range.from && r[dateKey] <= range.to);
}

// ─── Form Nueva Venta ────────────────────────────────────────────
function FormVenta() {
  const data = useATData();
  const skus = data.skus || [];
  const [fecha, setFecha] = useState(window.HOY || HOY);
  const [canal, setCanal] = useState('Facebook');
  const [envio, setEnvio] = useState(0);
  const [precio, setPrecio] = useState('');
  const [notas, setNotas] = useState('');
  const [lineas, setLineas] = useState([{ id: 1, skuId: '', qty: 1 }]);
  const [busy, setBusy] = useState(false);
  // Gasto asociado a la venta (ej. envío pagado a un courier por el dueño).
  // Se registra como MOVIMIENTO SEPARADO (Pago Envio) — NO como salida en la
  // fila de la venta. Así Resumen no mezcla ingreso con gasto.
  const [gastoEnvio, setGastoEnvio] = useState(0);
  const [gastoConcepto, setGastoConcepto] = useState('Pago Envio');

  const addLinea = () => setLineas(arr => [...arr, { id: Date.now(), skuId: '', qty: 1 }]);
  const removeLinea = (id) => setLineas(arr => arr.filter(l => l.id !== id));
  const updateLinea = (id, patch) => setLineas(arr => arr.map(l => l.id === id ? { ...l, ...patch } : l));

  // Compute totals
  const lineasValidas = lineas.filter(l => l.skuId && Number(l.qty) > 0);
  const costoTotal = lineasValidas.reduce((s, l) => {
    const sku = skus.find(x => x.id === l.skuId);
    return s + (sku?.cpp || 0) * Number(l.qty);
  }, 0);
  const ganancia = (Number(precio) || 0) - costoTotal;
  const margen = Number(precio) > 0 ? (ganancia / Number(precio)) * 100 : 0;

  const valid = lineasValidas.length > 0 && Number(precio) > 0;

  const onSubmit = async () => {
    setBusy(true);
    try {
      const res = await window.AT_CLIENT.createVenta({
        fecha, canal,
        envio: Number(envio) || 0,
        precioFacturadoTotal: Number(precio),
        lineas: lineasValidas.map(l => ({ skuId: l.skuId, qty: Number(l.qty) })),
        nota: notas,
      });
      window.toastOk('Venta registrada', `${res.idVenta} · ${fmtCurrency(precio)} · ${lineasValidas.length} línea(s)`);
      // Si hay gasto asociado, registrarlo como movimiento separado de cashflow
      // (no como salida en la fila de la venta).
      if (Number(gastoEnvio) > 0) {
        try {
          const TIPO_MAP = { 'Pago Envio': 'PAGO_TRANSPORTE', 'Pago Comision': 'PAGO_COMISION', 'Otro': 'OTROS' };
          await window.AT_CLIENT.create('cashflow', {
            fecha, cuenta: 'BHD Debito',
            auxiliar: canal,
            concepto: gastoConcepto,
            tipo: TIPO_MAP[gastoConcepto] || 'OTROS',
            entrada: 0,
            salida: Number(gastoEnvio),
            notas: `Asociado a venta ${res.idVenta}`,
          });
          window.toastOk('Gasto asociado registrado', `${gastoConcepto} · ${fmtCurrency(gastoEnvio)}`);
        } catch (e) {
          window.toastWarn?.('Gasto asociado falló', e.message?.slice(0, 100));
        }
      }
      // Reset
      setPrecio(''); setEnvio(0); setNotas(''); setGastoEnvio(0);
      setLineas([{ id: 1, skuId: '', qty: 1 }]);
    } catch (e) {
      window.toastErr('No se pudo registrar', e.message?.slice(0, 120));
    }
    setBusy(false);
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 'var(--s-4)' }}>
      <div className="row-3">
        <div className="field">
          <div className="field-label">Fecha</div>
          <input className="input num" type="date" value={fecha} onChange={e => setFecha(e.target.value)} />
        </div>
        <div className="field">
          <div className="field-label">Canal</div>
          <select className="select" value={canal} onChange={e => setCanal(e.target.value)}>
            <option value="Facebook">Facebook</option>
            <option value="Cliente Generico">Cliente Genérico</option>
            <option value="Alexander">Alexander</option>
            <option value="Ramon">Ramon</option>
            <option value="Braulio">Braulio</option>
          </select>
        </div>
        <div className="field">
          <div className="field-label">Envío cobrado (RD$)</div>
          <input className="input num" type="number" value={envio} onChange={e => setEnvio(e.target.value)} />
        </div>
      </div>

      <div>
        <div className="field-label" style={{ marginBottom: 8 }}>SKUs vendidos · {lineasValidas.length} líneas</div>
        {lineas.map((l, i) => {
          const sku = skus.find(s => s.id === l.skuId);
          const subtotal = (sku?.cpp || 0) * Number(l.qty);
          return (
            <div key={l.id} className="line-row">
              <select className="select" value={l.skuId} onChange={e => updateLinea(l.id, { skuId: e.target.value })}>
                <option value="">— selecciona SKU —</option>
                {skus.filter(s => s.id !== 'LEGACY-SALE').map(s => (
                  <option key={s.id} value={s.id}>{s.nm} · {s.id}</option>
                ))}
              </select>
              <input className="input num" type="number" min="1" value={l.qty}
                onChange={e => updateLinea(l.id, { qty: e.target.value })} placeholder="Cant." />
              <span className="num" style={{ fontSize: 12, color: 'var(--text-3)', textAlign: 'right' }}>
                {sku ? fmtCurrency(sku.cpp) : '—'}
              </span>
              <span className="num" style={{ fontSize: 12, textAlign: 'right' }}>
                {subtotal > 0 ? fmtCurrency(subtotal) : '—'}
              </span>
              <button className="icon-btn danger" onClick={() => removeLinea(l.id)} disabled={lineas.length === 1}>×</button>
            </div>
          );
        })}
        <button className="btn ghost" style={{ marginTop: 8 }} onClick={addLinea}>+ Añadir SKU</button>
      </div>

      <div className="row">
        <div className="field">
          <div className="field-label">Precio facturado total (RD$)</div>
          <input className="input num" type="number" value={precio} onChange={e => setPrecio(e.target.value)} placeholder="0" />
          <div className="field-hint">Lo que efectivamente cobraste · ganancia se prorratea ponderado por costo</div>
        </div>
        <div className="field">
          <div className="field-label">Notas</div>
          <input className="input" type="text" value={notas} onChange={e => setNotas(e.target.value)} placeholder="cliente, referencia, etc." />
        </div>
      </div>

      <div className="row-3">
        <div className="field">
          <div className="field-label">Gasto asociado · concepto</div>
          <select className="select" value={gastoConcepto} onChange={e => setGastoConcepto(e.target.value)}>
            <option value="Pago Envio">Pago Envío (courier)</option>
            <option value="Pago Comision">Pago Comisión</option>
            <option value="Otro">Otro gasto</option>
          </select>
        </div>
        <div className="field">
          <div className="field-label">Gasto asociado · monto (RD$)</div>
          <input className="input num" type="number" value={gastoEnvio} onChange={e => setGastoEnvio(e.target.value)} placeholder="0" />
          <div className="field-hint">Se registra como movimiento SEPARADO (no se resta de la venta)</div>
        </div>
        <div className="field" style={{ opacity: 0.6 }}>
          <div className="field-label">Resultado</div>
          <div style={{ fontSize: 12, color: 'var(--text-3)', paddingTop: 4 }}>
            {Number(gastoEnvio) > 0 ? `Venta ${fmtCurrency(precio || 0)} → BHD · Gasto ${fmtCurrency(gastoEnvio)} ← BHD (2 mov)` : 'Solo venta (1 mov)'}
          </div>
        </div>
      </div>

      {(precio || lineasValidas.length > 0) && (
        <div className="summary">
          <div className="summary-item"><span className="lbl">Facturado</span><span className="val">{fmtCurrency(Number(precio) || 0)}</span></div>
          <div className="summary-item"><span className="lbl">Costo</span><span className="val">{fmtCurrency(costoTotal)}</span></div>
          <div className="summary-item"><span className="lbl">Ganancia</span><span className="val" style={{ color: ganancia > 0 ? 'var(--success)' : 'var(--text)' }}>{fmtCurrency(ganancia)}</span></div>
          <div className="summary-item"><span className="lbl">Margen</span><span className="val">{margen.toFixed(1)}%</span></div>
        </div>
      )}

      <div style={{ display: 'flex', gap: 8, marginTop: 8 }}>
        <button className="btn" disabled={!valid || busy} onClick={onSubmit}>
          {busy ? 'Registrando…' : 'Registrar venta'}
        </button>
        <button className="btn ghost" disabled={busy} onClick={() => {
          setPrecio(''); setEnvio(0); setNotas('');
          setLineas([{ id: 1, skuId: '', qty: 1 }]);
        }}>Limpiar</button>
      </div>
    </div>
  );
}

            <div key={l.id} className="line-row">

              <input className="input num" type="number" value={l.costoUd}

              <span className="num" style={{ fontSize: 12, textAlign: 'right' }}>

              <button className="icon-btn danger" onClick={() => removeLinea(l.id)} disabled={lineas.length === 1}>×</button>

      <div>
        <div className="field-label" style={{ marginBottom: 8 }}>Costos compartidos (se prorratean ponderados por valor base)</div>
        <div className="row-3">

            <input className="input num" type="number" value={envio} onChange={e => setEnvio(e.target.value)} />
          </div>
          <div className="field">
            <div className="field-label">Courier USA → DR (RD$)</div>
            <input className="input num" type="number" value={courier} onChange={e => setCourier(e.target.value)} />
          </div>
          <div className="field">
            <div className="field-label">Otros (aduana, comisión) (RD$)</div>
            <input className="input num" type="number" value={otros} onChange={e => setOtros(e.target.value)} />
          </div>
        </div>
      </div>

      <div className="summary">
        <div className="summary-item"><span className="lbl">Costo base</span><span className="val">{fmtCurrency(costoBase)}</span></div>
        <div className="summary-item"><span className="lbl">Compartidos</span><span className="val">{fmtCurrency(shared)}</span></div>
        <div className="summary-item"><span className="lbl">Total lote</span><span className="val">{fmtCurrency(total)}</span></div>
        <div className="summary-item"><span className="lbl">SKUs</span><span className="val">{lineasValidas.length}</span></div>
      </div>

      <div style={{ display: 'flex', gap: 8 }}>
        <button className="btn" disabled={!valid || busy} onClick={onSubmit}>
          {busy ? 'Registrando…' : 'Registrar lote'}
        </button>
        <button className="btn ghost" disabled={busy} onClick={() => {
          setEnvio(0); setCourier(0); setOtros(0); setNotas('');
          setLineas([{ id: 1, skuId: '', qty: 1, costoUd: 0 }]);
        }}>Limpiar</button>
      </div>
    </div>
  );
}

// Para excepciones: descuadres, hallazgos, comisiones automáticas
// sin fuente, fees bancarios, etc. NO usar para registrar venta/lote
// normal (esos usan sus forms específicos).
function FormAjusteCF() {
  const data = useATData();
  const [fecha, setFecha] = useState(window.HOY || HOY);
  const [tipo, setTipo] = useState('Otro');
  const [contraparte, setContraparte] = useState('');
  const [entrada, setEntrada] = useState('');
  const [salida, setSalida] = useState('');
  const [notas, setNotas] = useState('');
  const [busy, setBusy] = useState(false);

  const CF_TIPOS = [
    'Otro', 'Fee bancario', 'Pago Comision', 'Aportes para negocio',
    'Pago ADS', 'Pago Envio', 'Cuentas por pagar',
    'Compra operativa', 'Refund',
  ];

  const valid = (Number(entrada) > 0 || Number(salida) > 0);

  const onSubmit = async () => {
    setBusy(true);
    try {
      const F = window.AT?.fields?.cashflow || { fecha: 'fecha', cuenta: 'cuenta', auxiliar: 'auxiliar', entrada: 'entrada', salida: 'salida', notas: 'notas' };
      await window.AT_CLIENT.create('cashflow', {
        [F.fecha]:    fecha,
        [F.cuenta]:   tipo,
        [F.auxiliar]: contraparte,
        [F.entrada]:  Number(entrada) || 0,
        [F.salida]:   Number(salida)  || 0,
        [F.notas]:    notas,
      });
      window.toastOk('Ajuste registrado', `${tipo} · ${entrada ? '+' + fmtCurrency(entrada) : '-' + fmtCurrency(salida)}`);
      setEntrada(''); setSalida(''); setNotas(''); setContraparte('');

      window.toastErr('No se pudo registrar', e.message?.slice(0, 120));

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 'var(--s-4)' }}>
      <div style={{
        background: 'rgba(240, 182, 88, 0.08)', border: '1px solid rgba(240, 182, 88, 0.3)',
        borderRadius: 'var(--r-sm)', padding: 'var(--s-3) var(--s-4)', fontSize: 12, color: 'var(--text-2)',
      }}>
        ⚠ <strong>Ajuste manual</strong> es solo para excepciones: descuadres, hallazgos,
        fees sin fuente. Las ventas, lotes, cuotas y disposiciones usan sus

      <div className="row-3">

// ─── Form Movimiento Financiero ──────────────────────────────────
function FormMovFin() {
  const data = useATData();
  const productos = data.financiero || [];
  const [tipo, setTipo] = useState('Cuota Préstamo');
  const [fecha, setFecha] = useState(window.HOY || HOY);
  const [productoId, setProductoId] = useState('');
  const [monto, setMonto] = useState('');
  const [capital, setCapital] = useState('');
  const [interes, setInteres] = useState('');
  const [seguro, setSeguro] = useState('');
  const [cuentaBanco, setCuentaBanco] = useState('BHD Debito');
  const [notas, setNotas] = useState('');
  const [busy, setBusy] = useState(false);

  const MOVFIN_TIPOS = window.AT_CLIENT?.MOVFIN_TIPOS || ['Cuota Préstamo', 'Abono Préstamo', 'Disposición Línea', 'Pago Línea', 'Cargo Línea', 'Depósito Inversor', 'Retorno Inversor', 'Otro'];

  // Cuando es Cuota Préstamo, el monto se calcula desde capital + interés + seguro
  useEffect(() => {
    if (tipo === 'Cuota Préstamo' && (capital || interes || seguro)) {
      setMonto((Number(capital || 0) + Number(interes || 0) + Number(seguro || 0)).toString());
    }
  }, [tipo, capital, interes, seguro]);

  const valid = tipo && productoId && Number(monto) > 0;

  const onSubmit = async () => {
    setBusy(true);
    try {
      const prod = productos.find(p => p._airtableId === productoId);
      const res = await window.AT_CLIENT.createMovFin({
        tipo, fecha,
        monto: Number(monto),
        productoFinAirtableId: productoId,
        productoFinId: prod?.idFin,
        cuentaBanco,
        capital: Number(capital) || 0,
        interes: Number(interes) || 0,
        seguro:  Number(seguro)  || 0,
        notas,
      });
      window.toastOk('Movimiento registrado', `${tipo} · ${fmtCurrency(monto)} · ${prod?.nombre || ''}`);
      setMonto(''); setCapital(''); setInteres(''); setSeguro(''); setNotas('');
    } catch (e) {
      window.toastErr('No se pudo registrar', e.message?.slice(0, 120));
    }
    setBusy(false);
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 'var(--s-4)' }}>
      <div className="row-3">
        <div className="field">
          <div className="field-label">Tipo</div>
          <select className="select" value={tipo} onChange={e => setTipo(e.target.value)}>
            {MOVFIN_TIPOS.map(t => <option key={t}>{t}</option>)}
          </select>
        </div>
        <div className="field">
          <div className="field-label">Fecha</div>
          <input className="input num" type="date" value={fecha} onChange={e => setFecha(e.target.value)} />
        </div>
        <div className="field">
          <div className="field-label">Cuenta origen</div>
          <select className="select" value={cuentaBanco} onChange={e => setCuentaBanco(e.target.value)}>
            <option>BHD Debito</option><option>Scotia RD</option><option>Scotia USD</option><option>Qik</option><option>Efectivo</option>
          </select>
        </div>
      </div>

      <div className="field">
        <div className="field-label">Producto financiero</div>
        <select className="select" value={productoId} onChange={e => setProductoId(e.target.value)}>
          <option value="">— selecciona producto —</option>
          {productos.map(p => (
            <option key={p._airtableId} value={p._airtableId}>{p.nombre} · {p.tipo}</option>
          ))}
        </select>
      </div>

      {tipo === 'Cuota Préstamo' ? (
        <div className="row-3">
          <div className="field">
            <div className="field-label">Capital (RD$)</div>
            <input className="input num" type="number" value={capital} onChange={e => setCapital(e.target.value)} placeholder="0" />
          </div>
          <div className="field">
            <div className="field-label">Interés (RD$)</div>
            <input className="input num" type="number" value={interes} onChange={e => setInteres(e.target.value)} placeholder="0" />
          </div>
          <div className="field">
            <div className="field-label">Seguro (RD$)</div>
            <input className="input num" type="number" value={seguro} onChange={e => setSeguro(e.target.value)} placeholder="0" />
          </div>
        </div>
      ) : null}

      <div className="row">
        <div className="field">
          <div className="field-label">Monto total (RD$)</div>
          <input className="input num" type="number" value={monto} onChange={e => setMonto(e.target.value)}
            placeholder="0" readOnly={tipo === 'Cuota Préstamo'} />
          {tipo === 'Cuota Préstamo' && <div className="field-hint">Calculado de capital + interés + seguro</div>}
        </div>
        <div className="field">
          <div className="field-label">Notas</div>
          <input className="input" type="text" value={notas} onChange={e => setNotas(e.target.value)} placeholder="opcional" />
        </div>
      </div>

      <div style={{ display: 'flex', gap: 8 }}>
        <button className="btn" disabled={!valid || busy} onClick={onSubmit}>
          {busy ? 'Registrando…' : 'Registrar movimiento'}
        </button>
        <button className="btn ghost" disabled={busy} onClick={() => {
          setMonto(''); setCapital(''); setInteres(''); setSeguro(''); setNotas('');
        }}>Limpiar</button>
      </div>
    </div>
  );
}

// VentasPage — expandida con Delete
// ════════════════════════════════════════════════════════════════
function VentasPageExt({ period }) {
  const data = useATData();
  const allVentas = data.ventas || [];
  const [search, setSearch] = useState('');
  const [del, setDel] = useState(null);
  const [edit, setEdit] = useState(null);
  const [busy, setBusy] = useState(false);
  const [tab, setTab] = useState('lista');

  const filteredPeriod = filterByPeriod(allVentas, period, 'fecha');
  const filtered = filteredPeriod.filter(v => {
    if (!search) return true;
    const q = search.toLowerCase();
    return (v.idVenta || '').toLowerCase().includes(q) || (v.canal || '').toLowerCase().includes(q);
  }).slice(0, 100);

  const doDelete = async () => {
    setBusy(true);
    try {
      await window.AT_CLIENT.removeVenta(del.idVenta);
      window.toastOk('Venta eliminada', `${del.idVenta}`);
      setDel(null);
    } catch (e) {
      window.toastErr('No se pudo eliminar', e.message?.slice(0, 120));
    }
    setBusy(false);
  };

  const doSave = async (vals) => {
    setBusy(true);
    try {
      await window.AT_CLIENT.updateVentaHeader(edit.idVenta, {
        fecha: vals.fecha, canal: vals.canal,
        envio: Number(vals.envio) || 0, notas: vals.notas,
      });
      window.toastOk('Venta actualizada', `${edit.idVenta}`);
      setEdit(null);
    } catch (e) { window.toastErr('No se pudo guardar', e.message?.slice(0, 120)); }
    setBusy(false);
  };

  return (
    <>
      <div className="topbar">
        <div>
          <h1>Ventas</h1>
          <div className="sub">{allVentas.length} ventas totales · {filteredPeriod.length} en período</div>
        </div>
        {tab === 'lista' && (
          <div className="topbar-actions">
            <input className="input" style={{ width: 180 }} type="text" placeholder="Buscar..." value={search} onChange={e => setSearch(e.target.value)} />
            <span className="pill">{filtered.length} mostrando</span>
          </div>
        )}
      </div>

      <div className="tabs">
        <button className={`tab ${tab === 'lista' ? 'active' : ''}`} onClick={() => setTab('lista')}>Lista de ventas</button>
        <button className={`tab ${tab === 'nueva' ? 'active' : ''}`} onClick={() => setTab('nueva')}>+ Nueva venta</button>
      </div>

      {tab === 'nueva' && (
        <div className="section">
          <FormVenta />
        </div>
      )}

      {tab === 'lista' && (
      <div className="section">
        <table className="data">
          <thead><tr>
            <th>Código</th><th>Fecha</th><th>Canal</th>
            <th className="right">SKUs</th><th className="right">Uds</th>
            <th className="right">Total</th><th className="right">Ganancia</th><th className="right">Margen</th>
            <th></th>
          </tr></thead>
          <tbody>
            {filtered.map(v => (
              <tr key={v.idVenta}>
                <td><span className="num" style={{ fontSize: 11 }}>{v.idVenta}</span></td>
                <td>{fmtDate(v.fecha)}</td>
                <td className="muted">{v.canal || '—'}</td>
                <td className="num right">{(v.lineas || []).length}</td>
                <td className="num right">{v.cantidadTotal || 0}</td>
                <td className="num right">{fmtCurrency(v.precioFacturadoTotal)}</td>
                <td className="num right pos">{fmtCurrency(v.gananciaTotal)}</td>
                <td className="num right muted">{(v.margenPct || 0).toFixed(1)}%</td>
                <td style={{ display: 'flex', gap: 4 }}>
                  <button className="icon-btn" onClick={() => setEdit(v)} title="Editar header">✎</button>
                  <button className="icon-btn danger" onClick={() => setDel(v)} title="Eliminar">×</button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      )}

      <ConfirmModal open={!!del} danger busy={busy}
        title={`¿Eliminar venta ${del?.idVenta}?`}
        body={`${del?.fecha || ''} · ${del?.canal || ''} · ${fmtCurrency(del?.precioFacturadoTotal || 0)}. Esta acción borra ${(del?.lineas || []).length} línea(s) y movimientos asociados de Supabase. No es reversible.`}
        onCancel={() => setDel(null)}
        onConfirm={doDelete} />

      <EditModal open={!!edit} busy={busy}
        title={`Editar venta ${edit?.idVenta}`}
        fields={edit ? [
          { name: 'fecha', label: 'Fecha', type: 'date', value: edit.fecha },
          { name: 'canal', label: 'Canal', type: 'text', value: edit.canal },
          { name: 'envio', label: 'Envío cobrado (RD$)', type: 'number', value: edit.envio || 0 },
          { name: 'notas', label: 'Notas', type: 'text', value: edit.notas || '', span: 2 },
        ] : []}
        onCancel={() => setEdit(null)}
        onSave={doSave} />
    </>
  );
}

        ] : []}
        onCancel={() => setEdit(null)}
        onSave={doSaveEdit} />
    </>
  );
}

// ════════════════════════════════════════════════════════════════
// EditModal — modal genérico para edit forms
// fields: [{name, label, type, value, options?, span?}]
// ════════════════════════════════════════════════════════════════
function EditModal({ open, title, fields, onCancel, onSave, busy }) {
  const [values, setValues] = useState({});
  useEffect(() => {
    if (open && fields) {
      const init = {};
      fields.forEach(f => { init[f.name] = f.value ?? ''; });
      setValues(init);
    }
  }, [open]);
  if (!open) return null;
  return (
    <div className="modal-backdrop" onClick={onCancel}>
      <div className="modal" style={{ minWidth: 520, maxWidth: '90vw' }} onClick={e => e.stopPropagation()}>
        <div className="modal-title">{title}</div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 12, marginBottom: 'var(--s-4)' }}>
          {fields.map(f => (
            <div key={f.name} className="field" style={f.span === 2 ? { gridColumn: 'span 2' } : undefined}>
              <div className="field-label">{f.label}</div>
              {f.type === 'select' ? (
                <select className="select" value={values[f.name] ?? ''} onChange={e => setValues({ ...values, [f.name]: e.target.value })}>
                  {f.options.map(o => typeof o === 'string' ? <option key={o}>{o}</option> : <option key={o.value} value={o.value}>{o.label}</option>)}
                </select>
              ) : f.type === 'textarea' ? (
                <textarea className="textarea" rows={3} value={values[f.name] ?? ''} onChange={e => setValues({ ...values, [f.name]: e.target.value })} />
              ) : (
                <input className={'input ' + (f.type === 'number' || f.type === 'date' ? 'num' : '')}
                       type={f.type || 'text'} value={values[f.name] ?? ''}
                       onChange={e => setValues({ ...values, [f.name]: e.target.value })}
                       placeholder={f.placeholder} />
              )}
              {f.hint && <div className="field-hint">{f.hint}</div>}
            </div>
          ))}
        </div>
        <div className="modal-actions">
          <button className="btn ghost" onClick={onCancel} disabled={busy}>Cancelar</button>
          <button className="btn" disabled={busy} onClick={() => onSave(values)}>
            {busy ? 'Guardando…' : 'Guardar'}
          </button>
        </div>
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════════
// Alertas Page — critical inventory + próximas cuotas + sin movimiento
// ════════════════════════════════════════════════════════════════

  const criticos = SK.filter(s => s.estado === 'critico');
  const atencion = SK.filter(s => s.estado === 'atencion');
  const reposicion = SK.filter(s => s.estado === 'en_reposicion');
  const sinMov = SK.filter(s => s.estado === 'sin_movimiento');

  // Próximas cuotas (Coop)
  const proxCuota = window.COOP?.pagos?.length || 0;
  const cuotaMensual = window.COOP?.cuota || 0;

  // BHD usage
  const bhdUso = window.BHD?.limite > 0 ? (window.BHD.usado / window.BHD.limite) * 100 : 0;

  const totalAlerts = criticos.length + atencion.length + reposicion.length + (bhdUso > 80 ? 1 : 0);

  return (
    <>
      <div className="topbar">
        <div>
          <h1>Alertas</h1>
