                  <td><span className="num" style={{ fontSize: 11 }}>{s.id}</span></td>
                  <td className="muted">{s.nm}</td>
                  <td className="num right" style={{ fontWeight: 600 }}>{s.aPedir}</td>
                  <td className="num right">{fmtCurrency(s.cpp || 0)}</td>
                  <td className="num right">{fmtCurrency(s.costoEstimado)}</td>
                </tr>
              ))}
              <tr style={{ background: 'var(--surface-2)', fontWeight: 600 }}>
                <td colSpan="2" className="muted">TOTAL</td>
                <td className="num right">{totalUds}</td>
                <td></td>
                <td className="num right pos">{fmtCurrency(totalCosto)}</td>
              </tr>
            </tbody>
          </table>
          <div className="field-hint" style={{ marginTop: 12 }}>
            Esta orden está calculada para cubrir {leadOverride} días de lead time + {bufferDias} días de buffer = <strong>{Number(leadOverride) + Number(bufferDias)} días</strong> de stock proyectado.
            Crea el lote correspondiente desde el tab "+ Nuevo lote" con estos SKUs y cantidades.
          </div>
        </div>
      )}
    </>
  );
}

function LotesTab() {
  const data = useATData();
  const lotes = data.lotes || [];
  const [search, setSearch] = useState('');
  const [filterStatus, setFilterStatus] = useState('all');
  const [del, setDel] = useState(null);
  const [edit, setEdit] = useState(null);
  const [busy, setBusy] = useState(false);

  let filtered = lotes;
  if (filterStatus !== 'all') {
    filtered = filtered.filter(l => l.status === filterStatus);
  }
  if (search) {
    const q = search.toLowerCase();
    filtered = filtered.filter(l =>
      (l.id || '').toLowerCase().includes(q) ||
      (l.proveedor || '').toLowerCase().includes(q) ||
      (l.skus || []).some(s => (s.id || '').toLowerCase().includes(q))
    );
  }
  filtered = filtered.slice(0, 100);

  const doDelete = async () => {
    setBusy(true);
    try {
      const res = await window.AT_CLIENT.removeLote(del.id);
      window.toastOk('Lote eliminado', `${del.id} · ${res.deletedCount || 0} entradas · ${res.cfsBorrados || 0} CFs`);
      setDel(null);
    } catch (e) {
      window.toastErr('No se pudo eliminar', e.message?.slice(0, 120));
    }
    setBusy(false);
  };

  const doSaveEdit = async (vals) => {
    setBusy(true);
    try {
      await window.AT_CLIENT.updateLoteHeader(edit.id, {
        fecha:     vals.fecha,
        status:    vals.status,
        proveedor: vals.proveedor,
        envio:     vals.envio     === '' ? 0 : Number(vals.envio),
        courier:   vals.courier   === '' ? 0 : Number(vals.courier),
        otros:     vals.otros     === '' ? 0 : Number(vals.otros),
        impuestos: vals.impuestos === '' ? 0 : Number(vals.impuestos),
        notas:     vals.notas,
      });
      window.toastOk('Lote actualizado', `${edit.id}`);
      setEdit(null);
    } catch (e) { window.toastErr('No se pudo guardar', e.message?.slice(0, 120)); }
    setBusy(false);
  };

  return (
    <>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 'var(--s-3)' }}>
        <input className="input" style={{ width: 200 }} type="text" placeholder="Buscar..." value={search} onChange={e => setSearch(e.target.value)} />
        {['all', 'En Camino', 'Recibido', 'Perdido'].map(s => (
          <button key={s} className="pill" style={{
            background: filterStatus === s ? 'var(--surface-3)' : 'var(--surface)',
            color: filterStatus === s ? 'var(--text)' : 'var(--text-2)',
          }} onClick={() => setFilterStatus(s)}>{s === 'all' ? 'Todos' : s}</button>
        ))}
        <span className="pill" style={{ marginLeft: 'auto' }}>{filtered.length} de {lotes.length}</span>
      </div>

      <table className="data">
        <thead><tr>
          <th>Lote</th><th>Fecha</th><th>Status</th><th>Proveedor</th>
          <th className="right">SKUs</th><th className="right">Envío</th>
          <th className="right">Courier</th><th className="right">Otros</th>
          <th></th>
        </tr></thead>
        <tbody>
          {filtered.map(l => {
            const statusCls = l.status === 'Recibido' ? 'success' : l.status === 'Perdido' ? 'danger' : 'warning';
            return (
              <tr key={l.id}>
                <td><span className="num" style={{ fontSize: 11 }}>{l.id}</span></td>
                <td>{fmtDate(l.fecha)}</td>
                <td><span className={`badge ${statusCls}`}>{l.status}</span></td>
                <td className="muted">{l.proveedor || '—'}</td>
                <td className="num right">{(l.skus || []).length}</td>
                <td className="num right">{l.envio > 0 ? fmtCurrency(l.envio) : '—'}</td>
                <td className="num right">{l.courier > 0 ? fmtCurrency(l.courier) : '—'}</td>
                <td className="num right">{l.otros > 0 ? fmtCurrency(l.otros) : '—'}</td>
                <td style={{ whiteSpace: 'nowrap' }}>
                  <div style={{ display: 'inline-flex', gap: 4 }}>
                    <button className="icon-btn" title="Editar" onClick={() => setEdit(l)}>✎</button>
                    <button className="icon-btn danger" title="Eliminar" onClick={() => setDel(l)}>×</button>
                  </div>
                </td>
              </tr>
            );
          })}
        </tbody>
      </table>

      <ConfirmModal open={!!del} danger busy={busy}
        title={`¿Eliminar lote ${del?.id}?`}
        body={`${del?.skus?.length || 0} entrada(s) · ${del?.proveedor || ''} · ${fmtDate(del?.fecha || '')}. Borra entradas, lote header y CFs satélites linkeados (envío/courier/otros) en cascada. No reversible.`}
        onCancel={() => setDel(null)}
        onConfirm={doDelete} />

      <EditLoteModal open={!!edit} lote={edit} onClose={() => setEdit(null)} />
    </>
  );
}

// ─── EditLoteModal — wizard completo para editar un lote existente ─────
// Mismo layout que FormLote (SKUs + costos por cuenta + tasa USD) pero
// opera sobre un lote ya guardado. Cada acción es un writer individual:
//   - cambiar header (fecha/status/proveedor/costos compartidos) → updateLoteHeader
//   - agregar SKU → addEntradaToLote
//   - editar SKU línea → updateEntrada
//   - borrar SKU línea → removeEntrada (¡no borra el lote!)
function EditLoteModal({ open, lote, onClose }) {
  const data = useATData();
  const skus = data.skus || [];
  const cuentas = data._cuentas || [];
  const [fecha, setFecha] = useState('');
  const [status, setStatus] = useState('En Camino');
  const [proveedor, setProveedor] = useState('');
  const [envio, setEnvio]     = useState(0);
  const [courier, setCourier] = useState(0);
  const [otros, setOtros]     = useState(0);
  const [notas, setNotas]     = useState('');
  const [cuentaMercancia, setCuentaMercancia] = useState('BHD Debito');
  const [cuentaEnvio,     setCuentaEnvio]     = useState('BHD Debito');
  const [cuentaCourier,   setCuentaCourier]   = useState('BHD Debito');
  const [cuentaOtros,     setCuentaOtros]     = useState('BHD Debito');
  const [tasaCambio, setTasaCambio] = useState(() => Number(localStorage.getItem('tasa-cambio-usd')) || 60);
  const [lineas, setLineas] = useState([]);
  const [busy, setBusy] = useState(false);

  // Init form when lote opens
  useEffect(() => {
    if (open && lote) {
      setFecha(lote.fecha || '');
      setStatus(lote.status || 'En Camino');
      setProveedor(lote.proveedor || '');
      setEnvio(lote.envio || 0);
      setCourier(lote.courier || 0);
      setOtros(lote.otros || 0);
      setNotas(lote.notas || lote.nota || '');
      // Líneas existentes: cada SKU del lote es una entrada (e-N)
      setLineas((lote.skus || []).map(s => ({
        id: s._airtableId,          // 'e-N' — existente
        airtableId: s._airtableId,
        skuId: s.id,
        qty: s.qty || 0,
        costoUd: s.costoUd || 0,
        _isNew: false,
      })));
    }
  }, [open, lote?.id]);

  const isUSDCuenta = (name) => {
    const c = cuentas.find(x => x.nombre === name);
    if (c) return c.moneda === 'USD';
    return /usd/i.test(name);
  };

  const addLinea = () => setLineas(arr => [...arr, { id: 'new-' + Date.now(), skuId: '', qty: 1, costoUd: 0, _isNew: true }]);
  const updateLinea = (id, patch) => setLineas(arr => {
    const next = arr.map(l => l.id === id ? { ...l, ...patch } : l);
    // Auto-append fila vacia si la ULTIMA fila acaba de recibir un SKU.
    // Evita tener que hacer click manual en "+ Anadir SKU" tras cada SKU.
    const last = next[next.length - 1];
    if (patch.skuId && last.id === id && last.skuId) {
      next.push({ id: 'new-' + Date.now() + '-auto', skuId: '', qty: 1, costoUd: 0, _isNew: true });
    }
    return next;
  });
  const removeLineaLocal = (id) => setLineas(arr => arr.filter(l => l.id !== id));

  const removeLineaPersistida = async (linea) => {
    if (!confirm(`¿Borrar línea ${linea.skuId}? Reduce stock en cascada.`)) return;
    setBusy(true);
    try {
      await window.AT_CLIENT.removeEntrada(linea.airtableId);
      window.toastOk('Línea eliminada', linea.skuId);
      removeLineaLocal(linea.id);
    } catch (e) { window.toastErr('No se pudo eliminar', e.message?.slice(0, 120)); }
    setBusy(false);
  };

  const costoBase = lineas.filter(l => l.skuId && Number(l.qty) > 0)
                          .reduce((s, l) => s + Number(l.qty) * Number(l.costoUd || 0), 0);

  const onSave = async () => {
    setBusy(true);
    try {
      // 1) Actualiza header (incluye costos compartidos → sync CFs)
      await window.AT_CLIENT.updateLoteHeader(lote.id, {
        fecha, status, proveedor,
        envio:   Number(envio)   || 0,
        courier: Number(courier) || 0,
        otros:   Number(otros)   || 0,
        notas,
      });
      // 2) Líneas: persistir nuevas, actualizar las modificadas
      const ops = [];
      for (const l of lineas) {
        if (!l.skuId) continue;
        if (l._isNew) {
          ops.push(window.AT_CLIENT.addEntradaToLote(lote.id, {
            skuId: l.skuId, qty: Number(l.qty), costoUd: Number(l.costoUd),
          }));
        } else {
          // Solo update si cambió respecto al original
          const orig = (lote.skus || []).find(s => s._airtableId === l.airtableId);
          if (orig && (orig.qty !== Number(l.qty) || orig.costoUd !== Number(l.costoUd) || orig.id !== l.skuId)) {
            ops.push(window.AT_CLIENT.updateEntrada(l.airtableId, {
              skuId: l.skuId, qty: Number(l.qty), costoUd: Number(l.costoUd),
            }));
          }
        }
      }
      await Promise.all(ops);
      if (Number(tasaCambio) > 0) localStorage.setItem('tasa-cambio-usd', String(tasaCambio));
      window.toastOk('Lote actualizado', `${lote.id} · ${lineas.length} línea(s)`);
      onClose();
    } catch (e) { window.toastErr('No se pudo guardar', e.message?.slice(0, 120)); }
    setBusy(false);
  };

  if (!open || !lote) return null;

  const cuentasOpts = cuentas.length > 0
    ? cuentas.map(c => ({ value: c.nombre, label: `${c.nombre} (${c.tipo})` }))
    : [
        { value: 'BHD Debito',  label: 'BHD Debito (DEBITO)' },
        { value: 'Efectivo',    label: 'Efectivo' },
        { value: 'Scotia RD',   label: 'Scotia RD (CREDITO)' },
        { value: 'Scotia USD',  label: 'Scotia USD (CREDITO)' },
        { value: 'Qik',         label: 'Qik (CREDITO)' },
      ];

  const renderCostRow = (label, hint, value, setValue, cuenta, setCuenta, readonly) => {
    const usd = isUSDCuenta(cuenta);
    const tasa = Number(tasaCambio) || 60;
    const equivRD = usd && Number(value) ? (Number(value) * tasa) : null;
    return (
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 160px 1.4fr', gap: 'var(--s-3)', alignItems: 'end', marginBottom: 8 }}>
        <div className="field">
          <div className="field-label">{label}</div>
          {hint && <div className="field-hint">{hint}</div>}
        </div>
        <div className="field">
          <div className="field-label" style={{ color: usd ? 'var(--accent)' : undefined }}>
            {usd ? 'Monto (USD$)' : 'Monto (RD$)'}
          </div>
          {readonly ? (
            <div className="input num" style={{ display: 'flex', alignItems: 'center', color: 'var(--text-3)', fontFamily: 'var(--font-mono)' }}>
              {fmtCurrency(value)}
            </div>
          ) : (
            <input className="input num" type="number" value={value} onChange={e => setValue(e.target.value)} placeholder="0" />
          )}
          {equivRD != null && <div className="field-hint" style={{ color: 'var(--accent)' }}>≈ RD${fmtNum(equivRD)} a tasa {tasa}</div>}
        </div>
        <div className="field">
          <div className="field-label">Cuenta origen</div>
          <select className="select" value={cuenta} onChange={e => setCuenta(e.target.value)} disabled={!Number(value)}>
            {cuentasOpts.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
          </select>
        </div>
      </div>
    );
  };

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" style={{ minWidth: 900, maxWidth: '95vw', maxHeight: '90vh', overflow: 'auto' }} onClick={e => e.stopPropagation()}>
        <div className="modal-title">Editar lote · {lote.id}</div>

        <div className="row-4">
          <div className="field"><div className="field-label">Fecha</div>
            <input className="input num" type="date" value={fecha} onChange={e => setFecha(e.target.value)} /></div>
          <div className="field"><div className="field-label">Status</div>
            <select className="select" value={status} onChange={e => setStatus(e.target.value)}>
              <option>En Camino</option><option>Recibido</option><option>Perdido</option>
            </select></div>
          <div className="field"><div className="field-label">Proveedor</div>
            <input className="input" value={proveedor} onChange={e => setProveedor(e.target.value)} /></div>
          <div className="field"><div className="field-label">Notas</div>
            <input className="input" value={notas} onChange={e => setNotas(e.target.value)} /></div>
        </div>

        <div style={{ marginTop: 'var(--s-4)' }}>
          <div className="field-label" style={{ marginBottom: 8 }}>SKUs del lote</div>
          <div className="line-row" style={{ borderBottom: '1px solid var(--border)', paddingBottom: 6, marginBottom: 4 }}>
            <span style={{ fontSize: 10, color: 'var(--text-3)', textTransform: 'uppercase', letterSpacing: '0.05em' }}>SKU</span>
            <span style={{ fontSize: 10, color: 'var(--text-3)', textTransform: 'uppercase', letterSpacing: '0.05em', textAlign: 'right' }}>Cantidad</span>
            <span style={{ fontSize: 10, color: 'var(--text-3)', textTransform: 'uppercase', letterSpacing: '0.05em', textAlign: 'right' }}>Costo/ud</span>
            <span style={{ fontSize: 10, color: 'var(--text-3)', textTransform: 'uppercase', letterSpacing: '0.05em', textAlign: 'right' }}>Subtotal</span>
            <span></span>
          </div>
          {lineas.map(l => {
            const subtotal = Number(l.qty) * Number(l.costoUd || 0);
            return (
              <div key={l.id} className="line-row">
                <select className="select" value={l.skuId} onChange={e => updateLinea(l.id, { skuId: e.target.value })}>
                  <option value="">— selecciona SKU —</option>
                  {skus.filter(s => s.id !== 'LEGACY-SALE').map(s => (
                    <option key={s.id} value={s.id}>{s.nm} · {s.id}</option>
                  ))}
                </select>
                <input className="input num" type="number" min="1" value={l.qty} onChange={e => updateLinea(l.id, { qty: e.target.value })} />
                <input className="input num" type="number" value={l.costoUd} onChange={e => updateLinea(l.id, { costoUd: e.target.value })} />
                <span className="num" style={{ fontSize: 12, textAlign: 'right' }}>
                  {subtotal > 0 ? fmtCurrency(subtotal) : '—'}
                  {l._isNew && <div style={{ fontSize: 10, color: 'var(--accent)' }}>NUEVO</div>}
                </span>
                <button className="icon-btn danger" onClick={() => l._isNew ? removeLineaLocal(l.id) : removeLineaPersistida(l)}>×</button>
              </div>
            );
          })}
          <button className="btn ghost" style={{ marginTop: 8 }} onClick={addLinea}>+ Añadir SKU</button>
        </div>

        <div style={{ display: 'flex', alignItems: 'center', gap: 12, padding: 'var(--s-3)', background: 'var(--surface-2)', borderRadius: 4, marginTop: 16 }}>
          <div style={{ fontSize: 11, color: 'var(--accent)', textTransform: 'uppercase', letterSpacing: '0.05em', fontWeight: 600 }}>Tasa de cambio</div>
          <div style={{ flex: 1, fontSize: 12, color: 'var(--text-3)' }}>RD$ por 1 USD$ · solo aplica a costos en cuenta USD.</div>
          <input className="input num" type="number" step="0.01" value={tasaCambio} onChange={e => setTasaCambio(e.target.value)} style={{ width: 100 }} />
          <span style={{ fontSize: 12, color: 'var(--text-3)' }}>RD$/USD</span>
        </div>

        <div style={{ marginTop: 'var(--s-4)' }}>
          <div className="field-label" style={{ marginBottom: 8 }}>Costos del lote · ¿de dónde salió cada uno?</div>
          {renderCostRow('Mercancía (costo base)',     'Auto-calculado desde los SKUs',                         costoBase, null,        cuentaMercancia, setCuentaMercancia, true)}
          {renderCostRow('Envío China → USA',          'Shipping al hub en USA',                                envio,     setEnvio,    cuentaEnvio,    setCuentaEnvio)}
          {renderCostRow('Courier USA → DR',           'Courier USA → DR',                                      courier,   setCourier,  cuentaCourier,  setCuentaCourier)}
          {renderCostRow('Otros (aduana, comisión)',   'Aduana / fee / comisión',                               otros,     setOtros,    cuentaOtros,    setCuentaOtros)}
        </div>

        <div className="modal-actions">
          <button className="btn ghost" onClick={onClose} disabled={busy}>Cancelar</button>
          <button className="btn" onClick={onSave} disabled={busy}>{busy ? 'Guardando…' : 'Guardar cambios'}</button>
        </div>
      </div>
    </div>
  );
}

function InventarioPage() {
  const [subtab, setSubtab] = useState('skus');
  const data = useATData();
  const SK = window.buildSK ? window.buildSK() : (data.skus || []);
  const [filter, setFilter] = useState('all');
  const [search, setSearch] = useState('');
  const [del, setDel] = useState(null);
  const [edit, setEdit] = useState(null);
  const [busy, setBusy] = useState(false);
  const [expandedModels, setExpandedModels] = useState({}); // key 'cat|mk|modelo' → bool

  const doSaveEdit = async (vals) => {
    setBusy(true);
    try {
      await window.AT_CLIENT.updateSKU(edit.id, {
        nm: vals.nm, mk: vals.mk, modelo: vals.modelo, color: vals.color,
        cat: vals.cat,
        pv: vals.pv === '' ? null : Number(vals.pv),
        notas: vals.notas,
        activa: vals.estadoSku !== 'Discontinuado',
      });
      window.toastOk('SKU actualizado', `${edit.id}`);
      setEdit(null);
    } catch (e) { window.toastErr('No se pudo guardar', e.message?.slice(0, 120)); }
    setBusy(false);
  };

  // Excluir SKU placeholder LEGACY-SALE de la lista de inventario para evitar
  // stock negativo y noise. Las ventas legacy se ven aparte en Ventas tab.
  // Los descontinuados van a su propio apartado (no ensucian la lista activa).
  const SK_FILT = SK.filter(s => s.id !== 'LEGACY-SALE' && s.estado !== 'descontinuado');
  const descontinuados = SK.filter(s => s.id !== 'LEGACY-SALE' && s.estado === 'descontinuado');
  let filtered = filter === 'all' ? SK_FILT : SK_FILT.filter(s => s.estado === filter);
  if (search) {
    const q = search.toLowerCase();
    filtered = filtered.filter(s =>
      (s.id || '').toLowerCase().includes(q) ||
      (s.nm || '').toLowerCase().includes(q) ||
      (s.mk || '').toLowerCase().includes(q)
    );
  }

  const refs = del ? (window.AT_CLIENT?.countSKURefs?.(del.id) || { ventas: 0, entradas: 0 }) : null;

  const doDelete = async () => {
    setBusy(true);
    try {
      await window.AT_CLIENT.removeSKU(del.id);
      window.toastOk('SKU eliminado', `${del.id} · ${del.nm}`);
      setDel(null);
    } catch (e) {
      window.toastErr('No se pudo eliminar', e.message?.slice(0, 120));
    }
    setBusy(false);
  };

  const doReactivar = async (s) => {
    try {
      await window.AT_CLIENT.updateSKU(s.id, { activa: true });
      window.toastOk('SKU reactivado', `${s.nm || s.id} vuelve a inventario activo`);
    } catch (e) {
      window.toastErr('No se pudo reactivar', e.message?.slice(0, 120));
    }
  };

  return (
    <>
      <div className="topbar">
        <div>
          <h1>Inventario</h1>
          <div className="sub">{SK_FILT.length} SKUs · {fmtNum(SK_FILT.reduce((s, x) => s + (x.s || 0), 0))} ud · {fmtCurrency(SK_FILT.reduce((s, x) => s + (x.s || 0) * (x.cpp || 0), 0))} valor stock · {(data.lotes || []).length} lotes</div>
        </div>
        <div className="topbar-actions">
          {subtab === 'skus' && (<>
            <input className="input" style={{ width: 160 }} type="text" placeholder="Buscar..." value={search} onChange={e => setSearch(e.target.value)} />
            {['all', 'critico', 'atencion', 'ok', 'sin_movimiento'].map(f => (
              <button key={f} className="pill" style={{
                background: filter === f ? 'var(--surface-3)' : 'var(--surface)',
                color: filter === f ? 'var(--text)' : 'var(--text-2)',
              }} onClick={() => setFilter(f)}>
                {f === 'all' ? 'Todos' : f === 'sin_movimiento' ? 'Sin movim' : f}
              </button>
            ))}
            <button className="btn" onClick={() => setSubtab('nuevo-sku')}>+ Nuevo SKU</button>
          </>)}
          {subtab === 'nuevo-sku'  && <button className="btn ghost" onClick={() => setSubtab('skus')}>← Volver a SKUs</button>}
          {subtab === 'lotes'      && <button className="btn" onClick={() => setSubtab('nuevo-lote')}>+ Nuevo lote</button>}
          {subtab === 'nuevo-lote' && <button className="btn ghost" onClick={() => setSubtab('lotes')}>← Volver a Lotes</button>}
        </div>
      </div>

      <div className="tabs">
        <button className={`tab ${(subtab === 'skus' || subtab === 'nuevo-sku') ? 'active' : ''}`} onClick={() => setSubtab('skus')}>SKUs ({SK_FILT.length})</button>
        <button className={`tab ${subtab === 'restock' ? 'active' : ''}`} onClick={() => setSubtab('restock')}>Re-Stock</button>
        <button className={`tab ${(subtab === 'lotes' || subtab === 'nuevo-lote') ? 'active' : ''}`} onClick={() => setSubtab('lotes')}>Lotes ({(data.lotes || []).length})</button>
        {descontinuados.length > 0 && (
          <button className={`tab ${subtab === 'descontinuados' ? 'active' : ''}`} onClick={() => setSubtab('descontinuados')}>Descontinuados ({descontinuados.length})</button>
        )}
      </div>

      <div className="section">
        {subtab === 'lotes' ? <LotesTab /> :
         subtab === 'nuevo-sku' ? <FormSKU /> :
         subtab === 'nuevo-lote' ? <FormLote /> :
         subtab === 'restock' ? <RestockTab skus={SK} /> :
         subtab === 'descontinuados' ? (
           <div>
             <div style={{ fontSize: 12, color: 'var(--text-2)', marginBottom: 'var(--s-3)' }}>
               Productos que ya no vendes. No aparecen en alertas ni en la lista activa, pero conservas su historial. Reactiva cualquiera cuando quieras.
             </div>
             <table className="data">
               <thead><tr>
                 <th>Producto</th><th>SKU</th><th className="num right">Stock</th><th className="num right">Precio</th><th></th>
               </tr></thead>
               <tbody>
                 {descontinuados.slice().sort((a, b) => (a.nm || '').localeCompare(b.nm || '')).map(s => (
                   <tr key={s.id}>
                     <td>{s.nm}</td>
                     <td className="muted" style={{ fontFamily: 'var(--font-mono)', fontSize: 11 }}>{s.id}</td>
                     <td className="num right">{s.s || 0}</td>
                     <td className="num right">{s.pv > 0 ? fmtCurrency(s.pv) : '—'}</td>
                     <td>
                       <div style={{ display: 'flex', gap: 4, justifyContent: 'flex-end', alignItems: 'center' }}>
                         <button className="btn ghost" style={{ padding: '2px 10px', fontSize: 11 }} onClick={() => doReactivar(s)}>↑ Reactivar</button>
                         <button className="icon-btn" title="Editar" style={{ padding: '2px 6px' }} onClick={() => setEdit(s)}>✎</button>
                         <button className="icon-btn danger" style={{ padding: '2px 6px' }} onClick={() => setDel(s)}>×</button>
                       </div>
                     </td>
                   </tr>
                 ))}
               </tbody>
             </table>
           </div>
         ) : (() => {
          // Agrupar SKUs por categoría. Si el SKU tiene categoría "Otro" pero
          // el id_sku empieza con un prefijo distinto a los conocidos (MOU/TEC/
          // HEA/STA/PAD/OTR), usamos ese prefijo como categoría visible.
          const KNOWN_PREFIX = { MOU: 'Mouse', TEC: 'Teclado', HEA: 'Headset', STA: 'Stand', PAD: 'Mouse Pad', OTR: 'Otro' };
          const catOf = (s) => {
            if (s.cat && s.cat !== 'Otro') return s.cat;
            const prefix = (s.id || '').split('-')[0];
            return KNOWN_PREFIX[prefix] || s.cat || 'Otro';
          };
          const grouped = {};
          filtered.forEach(s => {
            const c = catOf(s);
            (grouped[c] ||= []).push(s);
          });
          // Dentro de cada categoría: ordenar por marca → modelo → color para
          // que variantes del mismo producto queden contiguas (T90 y T90 Pro,
          // X11 y X11 Pro, etc.) Comparación natural (numérica-aware).
          const naturalCmp = (a, b) => (a || '').localeCompare(b || '', 'es', { numeric: true, sensitivity: 'base' });
          Object.keys(grouped).forEach(c => {
            grouped[c].sort((a, b) =>
              naturalCmp(a.mk, b.mk) ||
              naturalCmp(a.modelo || a.nm, b.modelo || b.nm) ||
              naturalCmp(a.color, b.color)
            );
          });
          // Orden: las categorías estándar primero, luego custom alfabético
          const orderHint = ['Mouse', 'Teclado', 'Headset', 'Mouse Pad', 'Stand', 'Otro'];
          const cats = Object.keys(grouped).sort((a, b) => {
            const ia = orderHint.indexOf(a), ib = orderHint.indexOf(b);
            if (ia === -1 && ib === -1) return a.localeCompare(b);
            if (ia === -1) return 1;
            if (ib === -1) return -1;
            return ia - ib;
          });
          // Dentro de cada categoría agrupar por marca+modelo (un row por
          // modelo; cada color es child que se despliega inline).
          const buildModelGroups = (items) => {
            const byModel = {};
            items.forEach(s => {
              const modelo = s.modelo || s.nm || '';
              const key = `${s.mk || '—'}|${modelo}`;
              (byModel[key] ||= { mk: s.mk || '—', modelo, items: [] }).items.push(s);
            });
            return Object.values(byModel).sort((a, b) =>
              naturalCmp(a.mk, b.mk) || naturalCmp(a.modelo, b.modelo)
            );
          };
          // Peor estado entre variantes de color → estado del modelo
          const ESTADO_RANK = { critico: 4, atencion: 3, en_reposicion: 2, ok: 1, sin_movimiento: 0 };
          const estadoPeor = (items) => {
            // Si TODAS las variantes están descontinuadas, el modelo es descontinuado.
            const vivos = items.filter(s => s.estado !== 'descontinuado');
            if (vivos.length === 0) return 'descontinuado';
            return vivos.reduce((peor, s) =>
              (ESTADO_RANK[s.estado] || 0) > (ESTADO_RANK[peor] || 0) ? s.estado : peor, 'ok');
          };
          return (
          <table className="data">
            <thead><tr>
              <th></th><th>Marca · Modelo</th>
              <th className="right">Variantes</th>
              <th className="right">Stock total</th><th className="right">En camino</th>
              <th className="right">CPP prom</th><th className="right">Precio</th>
              <th className="right">Margen</th><th>Estado</th>
            </tr></thead>
            <tbody>
              {cats.map(cat => {
                const items = grouped[cat];
                const totalStock = items.reduce((sum, x) => sum + (x.s || 0), 0);
                const totalCapital = items.reduce((sum, x) => sum + ((x.s || 0) * (x.cpp || 0)), 0);
                const modelos = buildModelGroups(items);
                return (
                  <React.Fragment key={cat}>
                    <tr style={{ background: 'var(--surface-2)' }}>
                      <td colSpan="9" style={{ padding: '10px 12px', fontWeight: 600, fontSize: 12, color: 'var(--text)', textTransform: 'uppercase', letterSpacing: '0.05em' }}>
                        {cat} <span style={{ marginLeft: 8, fontWeight: 400, color: 'var(--text-3)', fontSize: 11, textTransform: 'none', letterSpacing: 0 }}>
                          {modelos.length} modelo{modelos.length !== 1 ? 's' : ''} · {items.length} SKU{items.length !== 1 ? 's' : ''} · {fmtNum(totalStock)} ud · {fmtCurrency(totalCapital)} en stock
                        </span>
                      </td>
                    </tr>
                    {modelos.map(g => {
                      const key = `${cat}|${g.mk}|${g.modelo}`;
                      const expanded = !!expandedModels[key];
                      const totS = g.items.reduce((s, x) => s + (x.s || 0), 0);
                      const totEC = g.items.reduce((s, x) => s + (x.enCamino || 0), 0);
                      const cppProm = g.items.length > 0
                        ? g.items.reduce((s, x) => s + (x.cpp || 0), 0) / g.items.length : 0;
                      const pvAlguno = g.items.find(x => x.pv > 0)?.pv || 0;
                      const margen = pvAlguno > 0 ? Math.round(((pvAlguno - cppProm) / pvAlguno) * 100) : 0;
                      const est = estadoPeor(g.items);
                      const badgeCls = est === 'critico' ? 'danger' : est === 'atencion' ? 'warning' : est === 'ok' ? 'success' : 'neutral';
                      return (
                        <React.Fragment key={key}>
                          <tr style={{ cursor: g.items.length > 1 ? 'pointer' : 'default' }}
                              onClick={() => g.items.length > 1 && setExpandedModels(m => ({ ...m, [key]: !m[key] }))}>
                            <td style={{ textAlign: 'center', color: 'var(--text-3)', fontSize: 11 }}>
                              {g.items.length > 1 ? (expanded ? '▼' : '▶') : ''}
                            </td>
                            <td>
                              <div style={{ fontWeight: 500 }}>{g.mk} {g.modelo}</div>
                              {g.items.length > 1 && !expanded && (
                                <div style={{ fontSize: 11, color: 'var(--text-3)', marginTop: 2 }}>
                                  {g.items.map(s => s.color).filter(Boolean).join(' · ') || g.items.map(s => s.id).join(' · ')}
                                </div>
                              )}
                              {g.items.length === 1 && (
                                <div style={{ fontSize: 11, color: 'var(--text-3)', fontFamily: 'var(--font-mono)', marginTop: 2 }}>{g.items[0].id}</div>
                              )}
                            </td>
                            <td className="num right">{g.items.length}</td>
                            <td className={`num right ${totS === 0 ? 'neg' : ''}`}>{totS}</td>
                            <td className="num right" style={{ color: totEC > 0 ? 'var(--warning)' : 'var(--text-3)' }}>{totEC || '—'}</td>
                            <td className="num right">{fmtCurrency(cppProm)}</td>
                            <td className="num right">{pvAlguno > 0 ? fmtCurrency(pvAlguno) : '—'}</td>
                            <td className="num right muted">{pvAlguno > 0 ? margen + '%' : '—'}</td>
                            <td>
                              <div style={{ display: 'flex', gap: 4, alignItems: 'center' }}>
                                <span className={`badge ${badgeCls}`}>{est.replace('_', ' ')}</span>
                                {g.items.length === 1 && (
                                  <>
                                    <button className="icon-btn" title="Editar SKU" style={{ padding: '2px 6px' }} onClick={(e) => { e.stopPropagation(); setEdit(g.items[0]); }}>✎</button>
                                    <button className="icon-btn danger" style={{ padding: '2px 6px' }} onClick={(e) => { e.stopPropagation(); setDel(g.items[0]); }}>×</button>
                                  </>
                                )}
                              </div>
                            </td>
                          </tr>
                          {/* Children: cada color como sub-row.
                              Si el modelo tiene UNA sola variante (no expandible),
                              también mostramos sus botones de edit/del en la row del modelo. */}
                          {g.items.length === 1 && (() => {
                            // Hack: render del solo SKU debajo con sus actions
                            return null;  // las actions del SKU único se ponen en el badge cell abajo
                          })()}
                          {expanded && g.items.length > 1 && g.items.map(s => {
                            const sBadge = s.estado === 'critico' ? 'danger' : s.estado === 'atencion' ? 'warning' : s.estado === 'ok' ? 'success' : 'neutral';
                            const sMargen = s.pv > 0 ? Math.round(((s.pv - s.cpp) / s.pv) * 100) : 0;
                            return (
                              <tr key={s.id} style={{ background: 'var(--surface)' }}>
                                <td></td>
                                <td style={{ paddingLeft: 24 }}>
                                  <div style={{ fontSize: 12 }}>↳ <strong>{s.color || s.id}</strong></div>
                                  <div style={{ fontSize: 10, color: 'var(--text-3)', fontFamily: 'var(--font-mono)', marginTop: 2 }}>{s.id}</div>
                                </td>
                                <td></td>
                                <td className={`num right ${s.s === 0 ? 'neg' : ''}`}>{s.s}</td>
                                <td className="num right" style={{ color: s.enCamino > 0 ? 'var(--warning)' : 'var(--text-3)' }}>{s.enCamino || '—'}</td>
                                <td className="num right">{fmtCurrency(s.cpp)}</td>
                                <td className="num right">{s.pv > 0 ? fmtCurrency(s.pv) : '—'}</td>
                                <td className="num right muted">{s.pv > 0 ? sMargen + '%' : '—'}</td>
                                <td>
                                  <div style={{ display: 'flex', gap: 4, alignItems: 'center' }}>
                                    <span className={`badge ${sBadge}`} style={{ fontSize: 9 }}>{s.estado.replace('_', ' ')}</span>
                                    <button className="icon-btn" title="Editar" style={{ padding: '2px 6px' }} onClick={(e) => { e.stopPropagation(); setEdit(s); }}>✎</button>
                                    <button className="icon-btn danger" style={{ padding: '2px 6px' }} onClick={(e) => { e.stopPropagation(); setDel(s); }}>×</button>
                                  </div>
                                </td>
                              </tr>
                            );
                          })}
                        </React.Fragment>
                      );
                    })}
                  </React.Fragment>
                );
              })}
            </tbody>
          </table>
          );
         })()}
      </div>

      <ConfirmModal open={!!del} danger busy={busy}
        title={`¿Eliminar SKU ${del?.id}?`}
        body={
          refs && (refs.ventas > 0 || refs.entradas > 0)
            ? `${del?.nm}. ATENCIÓN: este SKU tiene ${refs.ventas} venta(s) y ${refs.entradas} entrada(s) históricas referenciándolo. Borrarlo puede fallar por FK constraint. Mejor desactiva (campo activa=false) en lugar de borrar.`
            : `${del?.nm}. Stock actual: ${del?.s || 0} ud. Sin ventas/entradas históricas — borrado seguro.`
        }
        onCancel={() => setDel(null)}
        onConfirm={doDelete} />

      <EditModal open={!!edit} busy={busy}
        title={`Editar SKU · ${edit?.id || ''}`}
        fields={edit ? [
          { name: 'nm',     label: 'Nombre',     type: 'text',   value: edit.nm || '', span: 2 },
          { name: 'mk',     label: 'Marca',      type: 'text',   value: edit.mk || '' },
          { name: 'modelo', label: 'Modelo',     type: 'text',   value: edit.modelo || '' },
          { name: 'color',  label: 'Color',      type: 'text',   value: edit.color || '' },
          { name: 'cat',    label: 'Categoría',  type: 'select', value: edit.cat || 'Mouse',
            options: ['Mouse','Teclado','Headset','Stand','Mouse Pad','Otro'] },
          { name: 'pv',     label: 'Precio venta (RD$)', type: 'number', value: edit.pv || '' },
          { name: 'estadoSku', label: 'Estado', type: 'select',
            value: edit.activa === false ? 'Discontinuado' : 'Activo',
            options: ['Activo', 'Discontinuado'] },
          { name: 'notas',  label: 'Notas',      type: 'text',   value: edit.notas || '', span: 2 },
        ] : []}
        onCancel={() => setEdit(null)}
        onSave={doSaveEdit} />
    </>
  );
}

function VentasPage() {

  const filtered = ventas.filter(v => {
    if (!search) return true;
    const q = search.toLowerCase();
    return (v.idVenta || '').toLowerCase().includes(q) || (v.canal || '').toLowerCase().includes(q);

  return (
    <>
      <div className="topbar">
        <div>
          <h1>Ventas</h1>
          <div className="sub">{ventas.length} ventas totales</div>

            style={{
              background: 'var(--surface)', border: '1px solid var(--border)', color: 'var(--text)',
              padding: '6px 10px', borderRadius: 'var(--r-sm)', fontFamily: 'inherit', fontSize: 12,
            }} />
          <span className="pill">{filtered.length} mostrando</span>
        </div>
      </div>

      <div className="section">
        <table className="data">
          <thead><tr>
            <th>Código</th><th>Fecha</th><th>Canal</th>
            <th className="right">SKUs</th><th className="right">Uds</th>
            <th className="right">Total</th><th className="right">Ganancia</th><th className="right">Margen</th>

            {filtered.map(v => (
              <tr key={v.idVenta}>
                <td><span className="num" style={{ fontSize: 11 }}>{v.idVenta}</span></td>
                <td>{fmtDate(v.fecha)}</td>

              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </>
  );
}

// ─── Form Crear Cuenta ───────────────────────────────────────────
function FormCuenta({ onDone }) {
  const [nombre, setNombre] = useState('');
  const [tipo, setTipo] = useState('DEBITO');
  const [moneda, setMoneda] = useState('RD');
  const [limite, setLimite] = useState('');
  const [saldoInicial, setSaldoInicial] = useState('');
  const [fechaApertura, setFechaApertura] = useState(window.HOY || new Date().toISOString().slice(0, 10));
  const [notas, setNotas] = useState('');
  const [busy, setBusy] = useState(false);
  const valid = nombre.length > 1;
  const saldoNum = Number(saldoInicial) || 0;
  const onSubmit = async () => {
    setBusy(true);
    try {
      await window.AT_CLIENT.createCuenta({ nombre, tipo, moneda, limite, notas });
      // Si hay saldo inicial > 0, sembrarlo con un movimiento automatico.
      // DEBITO/EFECTIVO → APORTE_DUENO (entrada). CREDITO → DRAWDOWN (deuda preexistente).
      if (saldoNum > 0) {
        const esCredito = tipo === 'CREDITO';
        await window.AT_CLIENT.create('cashflow', {
          fecha: fechaApertura,
          cuenta: nombre,
          concepto: esCredito ? 'Saldo inicial (deuda)' : 'Saldo inicial',
          tipo: esCredito ? 'DRAWDOWN' : 'APORTE_DUENO',
          entrada: esCredito ? 0 : saldoNum,
          salida:  esCredito ? saldoNum : 0,
          notas: `Saldo inicial al crear cuenta ${nombre}`,
        });
      }
      window.toastOk('Cuenta creada', `${nombre} · ${tipo} ${moneda}${saldoNum > 0 ? ` · saldo inicial ${saldoNum}` : ''}`);
      setNombre(''); setLimite(''); setNotas(''); setSaldoInicial('');
      onDone?.();
    } catch (e) { window.toastErr('No se pudo crear', e.message?.slice(0, 120)); }
    setBusy(false);
  };
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 'var(--s-3)' }}>
      <div className="row-3">
        <div className="field"><div className="field-label">Nombre</div>
          <input className="input" value={nombre} onChange={e => setNombre(e.target.value)} placeholder="ej. Popular Ahorros" /></div>
        <div className="field"><div className="field-label">Tipo</div>
          <select className="select" value={tipo} onChange={e => setTipo(e.target.value)}>
            <option value="DEBITO">Débito</option>
            <option value="CREDITO">Crédito (tarjeta)</option>
            <option value="EFECTIVO">Efectivo</option>
          </select></div>
        <div className="field"><div className="field-label">Moneda</div>
          <select className="select" value={moneda} onChange={e => setMoneda(e.target.value)}>
            <option value="RD">RD$</option><option value="USD">USD</option>
          </select></div>
      </div>
      {tipo === 'CREDITO' && (
        <div className="field"><div className="field-label">Límite de crédito</div>
          <input className="input num" type="number" value={limite} onChange={e => setLimite(e.target.value)} placeholder="0" /></div>
      )}
      <div className="row-2">
        <div className="field">
          <div className="field-label">{tipo === 'CREDITO' ? 'Saldo inicial (deuda actual)' : 'Saldo inicial'}{moneda === 'USD' ? ' (USD)' : ' (RD$)'}</div>
          <input className="input num" type="number" step="0.01" value={saldoInicial} onChange={e => setSaldoInicial(e.target.value)} placeholder="opcional · 0" />
        </div>
        <div className="field">
          <div className="field-label">Fecha apertura</div>
          <input className="input num" type="date" value={fechaApertura} onChange={e => setFechaApertura(e.target.value)} />
        </div>
      </div>
      <div className="field"><div className="field-label">Notas</div>
        <input className="input" value={notas} onChange={e => setNotas(e.target.value)} placeholder="opcional" /></div>
      {saldoNum > 0 && (
        <div style={{ fontSize: 11, color: 'var(--text-3)', padding: 'var(--s-2)', background: 'var(--surface-2)', borderRadius: 4 }}>
          Se creará automáticamente un movimiento <b>{tipo === 'CREDITO' ? 'DRAWDOWN' : 'APORTE_DUENO'}</b> de {moneda === 'USD' ? 'USD$' : 'RD$'}{saldoNum.toLocaleString()} con fecha {fechaApertura} para sembrar el saldo.
        </div>
      )}
      <div style={{ display: 'flex', gap: 8 }}>
        <button className="btn" disabled={!valid || busy} onClick={onSubmit}>{busy ? 'Creando…' : 'Crear cuenta'}</button>
        <button className="btn ghost" disabled={busy} onClick={() => { setNombre(''); setLimite(''); setNotas(''); setSaldoInicial(''); }}>Limpiar</button>
      </div>
    </div>
  );
}

// ─── Form Crear Préstamo / Línea / Tarjeta ───────────────────────
function FormPrestamo({ tipoFijo, onDone }) {
  const data = useATData();
  const bancos = (data._contrapartes || []).filter(c => c.tipo === 'BANCO');
  const [nombre, setNombre] = useState('');
  const [tipo, setTipo] = useState(tipoFijo || 'PRESTAMO');
  const [monto, setMonto] = useState('');
  const [limite, setLimite] = useState('');
  // Tasa anual — más natural para el usuario. Se convierte a mensual al guardar.
  const [tasaAnual, setTasaAnual] = useState('');
  const [seguro, setSeguro] = useState('');
  const [plazo, setPlazo] = useState('');
  const [fechaInicio, setFechaInicio] = useState('');
  const [fechaPrimerPago, setFechaPrimerPago] = useState('');
  // Tarjetas: día de corte y vencimiento
  const [diaCorte, setDiaCorte] = useState('');
  const [diaVencimiento, setDiaVencimiento] = useState('');
  const [moneda, setMoneda] = useState('RD');
  const [contraparte, setContraparte] = useState('');
  const [notas, setNotas] = useState('');
  const [busy, setBusy] = useState(false);

  const esLinea   = tipo === 'LINEA_CREDITO' || tipo === 'TARJETA_CREDITO';
  const esTarjeta = tipo === 'TARJETA_CREDITO';
  const valid = nombre.length > 1 && (esLinea ? Number(limite) > 0 : Number(monto) > 0);
  const tasaMensualCalc = tasaAnual ? (Number(tasaAnual) / 12) : null;

  const onSubmit = async () => {
    setBusy(true);
    try {
      // Concatena info de tarjeta en notas porque la columna día_corte
      // puede no existir en Supabase. La línea sí persiste si la columna existe.
      let notasFinal = notas;
      if (esTarjeta && (diaCorte || diaVencimiento)) {
        const extra = [];
        if (diaCorte) extra.push(`Corte día ${diaCorte}`);
        if (diaVencimiento) extra.push(`Pago día ${diaVencimiento}`);
        notasFinal = (notas ? notas + ' · ' : '') + extra.join(' · ');
      }
      await window.AT_CLIENT.createPrestamo({
        nombre, tipo, moneda,
        montoInicial: esLinea ? null : Number(monto),
        limiteCredito: esLinea ? Number(limite) : null,
        tasaMensual: tasaMensualCalc != null ? tasaMensualCalc / 100 : null,  // % → decimal
        seguroMensual: seguro || null,
        plazoMeses: plazo || null,
        fechaInicio: fechaInicio || null,
        fechaPrimerPago: fechaPrimerPago || null,
        diaCorte: esTarjeta && diaCorte ? Number(diaCorte) : null,
        diaVencimiento: esTarjeta && diaVencimiento ? Number(diaVencimiento) : null,
        contraparteId: contraparte || null,
        notas: notasFinal,
      });
      const labelTipo = { PRESTAMO: 'Préstamo', LINEA_CREDITO: 'Línea', TARJETA_CREDITO: 'Tarjeta' }[tipo];
      window.toastOk(`${labelTipo} creado`, `${nombre}`);
      setNombre(''); setMonto(''); setLimite(''); setTasaAnual(''); setSeguro(''); setPlazo('');
      setFechaInicio(''); setFechaPrimerPago(''); setDiaCorte(''); setDiaVencimiento(''); setNotas('');
      onDone?.();
    } catch (e) { window.toastErr('No se pudo crear', e.message?.slice(0, 120)); }
    setBusy(false);
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 'var(--s-3)' }}>
      <div className="row-3">
        <div className="field"><div className="field-label">Nombre</div>
          <input className="input" value={nombre} onChange={e => setNombre(e.target.value)} placeholder={esTarjeta ? 'ej. Scotia CC RD' : 'ej. BHD Línea'} /></div>
        {!tipoFijo && (
          <div className="field"><div className="field-label">Tipo</div>
            <select className="select" value={tipo} onChange={e => setTipo(e.target.value)}>
              <option value="PRESTAMO">Préstamo amortizado</option>
              <option value="LINEA_CREDITO">Línea de crédito</option>
              <option value="TARJETA_CREDITO">Tarjeta de crédito</option>
            </select></div>
        )}
        <div className="field"><div className="field-label">Banco emisor</div>
          <select className="select" value={contraparte} onChange={e => setContraparte(e.target.value)}>
            <option value="">— ninguno —</option>
            {bancos.map(c => <option key={c.id} value={c.id}>{c.nombre}</option>)}
          </select></div>
      </div>
      <div className="row-4">
        {!esLinea && (
          <div className="field"><div className="field-label">Monto inicial</div>
            <input className="input num" type="number" value={monto} onChange={e => setMonto(e.target.value)} placeholder="0" /></div>
        )}
        {esLinea && (
          <div className="field"><div className="field-label">Límite</div>
            <input className="input num" type="number" value={limite} onChange={e => setLimite(e.target.value)} placeholder="0" /></div>
        )}
        <div className="field">
          <div className="field-label">Tasa anual (%)</div>
          <input className="input num" type="number" step="0.01" value={tasaAnual} onChange={e => setTasaAnual(e.target.value)} placeholder="20" />
          {tasaMensualCalc != null && <div className="field-hint">≈ {tasaMensualCalc.toFixed(2)}% mensual</div>}
        </div>
        {!esLinea && (
          <div className="field"><div className="field-label">Seguro mensual</div>
            <input className="input num" type="number" value={seguro} onChange={e => setSeguro(e.target.value)} placeholder="0" /></div>
        )}
        <div className="field"><div className="field-label">Moneda</div>
          <select className="select" value={moneda} onChange={e => setMoneda(e.target.value)}>
            <option value="RD">RD$</option><option value="USD">USD$</option>
          </select></div>
      </div>
      {!esLinea && (
        <div className="row-3">
          <div className="field"><div className="field-label">Plazo (meses)</div>
            <input className="input num" type="number" value={plazo} onChange={e => setPlazo(e.target.value)} placeholder="48" /></div>
          <div className="field"><div className="field-label">Fecha desembolso</div>
            <input className="input num" type="date" value={fechaInicio} onChange={e => setFechaInicio(e.target.value)} /></div>
          <div className="field">
            <div className="field-label">Fecha primer pago</div>
            <input className="input num" type="date" value={fechaPrimerPago} onChange={e => setFechaPrimerPago(e.target.value)} />
            <div className="field-hint">Cuándo se paga la 1ª cuota (define el ciclo mensual)</div>
          </div>
        </div>
      )}
      {esTarjeta && (
        <div className="row-3">
          <div className="field">
            <div className="field-label">Día de corte</div>
            <input className="input num" type="number" min="1" max="31" value={diaCorte} onChange={e => setDiaCorte(e.target.value)} placeholder="25" />
            <div className="field-hint">Día del mes en que cierra el ciclo (corte)</div>
          </div>
          <div className="field">
            <div className="field-label">Día de pago/vencimiento</div>
            <input className="input num" type="number" min="1" max="31" value={diaVencimiento} onChange={e => setDiaVencimiento(e.target.value)} placeholder="15" />
            <div className="field-hint">Día del mes siguiente al corte para evitar intereses</div>
          </div>
          <div className="field" style={{ opacity: 0.6 }}>
            <div className="field-label">Próximo vencimiento</div>
            <div style={{ fontSize: 12, color: 'var(--text-3)', paddingTop: 4 }}>
              {diaCorte && diaVencimiento
                ? `Si compras hoy, pagas día ${diaVencimiento} del mes siguiente al corte (día ${diaCorte}).`
                : 'Llena corte + vencimiento para ver fecha.'}
            </div>
          </div>
        </div>
      )}
      <div className="field"><div className="field-label">Notas</div>
        <input className="input" value={notas} onChange={e => setNotas(e.target.value)} placeholder="opcional" /></div>
      <div style={{ display: 'flex', gap: 8 }}>
        <button className="btn" disabled={!valid || busy} onClick={onSubmit}>{busy ? 'Creando…' : 'Crear'}</button>
      </div>
    </div>
  );
}

// ─── Drilldown: detalle de un producto financiero ─────────────────
// Muestra movimientos del producto (filtrados desde movFin) + form rápido
// para registrar un nuevo movimiento scopeado a ese producto.
// ═════════════════════════ Detalle inline · Amortización ═════════════════════════
// Para préstamos amortizados (Coop, etc) — genera tabla mes a mes con
// capital/interés/saldo basado en monto inicial, tasa mensual y cuota típica.
// Marca cuotas pagadas vs proyectadas comparando contra los pagos ya hechos.
function DetalleAmortizacion({ item }) {
  const data = useATData();
  const [showReg, setShowReg] = useState(false);
  const [verProy, setVerProy] = useState(false); // false = pagos reales (default si hay)
  const monto    = Number(item.montoTotal) || 0;
  const tasa     = Number(item.tasaMensual) || 0;  // decimal mensual
  const seguro   = Number(item.seguroMensual) || 0;
  const pagado   = Number(item._capitalPagado) || 0;
  // Cuota: median del array de productos['FIN-P'][i].cuota si existe, else compute
  const finP = (data.productos?.['FIN-P'] || []).find(x => x._airtableId === item._airtableId);
  const cuotaTotal = Number(finP?.cuota) || (monto * tasa / (1 - Math.pow(1 + tasa, -48)) + seguro);  // 48-month default if no median
  // Schedule
  const schedule = [];
  let saldo = monto;
  let mes = 0;
  let pagadoAcum = 0;
  const MAX_MESES = 240; // safety cap
  while (saldo > 0.01 && mes < MAX_MESES) {
    mes++;
    const interes = saldo * tasa;
    const capital = Math.max(0, cuotaTotal - interes - seguro);
    const saldoNuevo = Math.max(0, saldo - capital);
    pagadoAcum += capital;
    schedule.push({
      mes,
      capital,
      interes,
      seguro,
      cuota: cuotaTotal,
      saldoInicio: saldo,
      saldoFin: saldoNuevo,
      pagada: pagadoAcum <= pagado + 1,  // mes pagado si el capital acumulado ≤ lo que ya se pagó
    });
    saldo = saldoNuevo;
    if (capital === 0) break;  // evita loop infinito si cuota < interes
  }
  // Encontrar la fila actual (primera no pagada)
  const idxActual = schedule.findIndex(r => !r.pagada);
  const cuotasRestantes = schedule.filter(r => !r.pagada).length;
  const interesProyectado = schedule.filter(r => !r.pagada).reduce((s, r) => s + r.interes, 0);

  // ── Pagos REALES registrados (tabla cuotas del banco) ──
  // El item viene de `financiero`; las cuotas se adjuntan a productos['FIN-P'].
  const cuotasReales = finP?.cuotas || item.cuotas || [];
  const hayReales = cuotasReales.length > 0;
  let saldoR = monto;
  const realesRows = cuotasReales.map(c => {
    const reduce = (c.capital || 0) + (c.abono || 0);
    saldoR = Math.max(0, saldoR - reduce);
    return { ...c, saldoDespues: saldoR };
  });
  const totalCapitalReal = cuotasReales.reduce((s, c) => s + (c.capital || 0) + (c.abono || 0), 0);
  const totalInteresReal = cuotasReales.reduce((s, c) => s + (c.interes || 0), 0);
  const saldoFinalReal = finP?.saldo != null ? finP.saldo : saldoR; // item viene de financiero (usa .balance), no .saldo
  // Mostrar reales por defecto si existen y el usuario no pidió la proyección.
  const mostrarReales = hayReales && !verProy;
  return (
    <div className="section">
      <div className="section-head">
        <div>
          <div className="section-title">
            {mostrarReales ? `Pagos reales · ${item.nombre}` : `Amortización proyectada · ${item.nombre}`}
          </div>
          <div className="section-desc">
            {mostrarReales
              ? `${cuotasReales.length} pagos registrados · capital ${fmtCurrency(totalCapitalReal)} · interés ${fmtCurrency(totalInteresReal)} · saldo ${fmtCurrency(saldoFinalReal)}`
              : `${schedule.length} meses totales · ${idxActual >= 0 ? idxActual : schedule.length} pagados · ${cuotasRestantes} restantes · interés proyectado ${fmtCurrency(interesProyectado)}`}
          </div>
        </div>
        <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
          <button className="btn" style={{ background: 'var(--success)', fontSize: 12, padding: '4px 12px' }}
            onClick={() => setShowReg(s => !s)}>{showReg ? '× Cerrar' : '💸 Registrar pago'}</button>
          {hayReales && (
            <button className="btn ghost" style={{ fontSize: 12, padding: '4px 12px' }}
              onClick={() => setVerProy(p => !p)}>{verProy ? 'Ver pagos reales' : 'Ver proyección'}</button>
          )}
          <span className="badge neutral">Cuota: {fmtCurrency(cuotaTotal)}</span>
        </div>
      </div>
      {showReg && (
        <div className="section" style={{ marginBottom: 'var(--s-3)', background: 'var(--surface-2)' }}>
          <FormMovFinScoped item={item} kind="prestamo" onDone={() => setShowReg(false)} />
        </div>
      )}
      <div style={{ maxHeight: 400, overflowY: 'auto' }}>
        {mostrarReales ? (
          <table className="data">
            <thead style={{ position: 'sticky', top: 0, background: 'var(--surface)' }}>
              <tr>
                <th className="right">Pago</th>
                <th>Fecha</th>
                <th className="right">Capital</th>
                <th className="right">Interés</th>
                <th className="right">Seguro</th>
                <th className="right">Total</th>
                <th className="right">Saldo después</th>
              </tr>
            </thead>
            <tbody>
              {realesRows.map((c, i) => (
                <tr key={i}>
                  <td className="num right">{c.numero}</td>
                  <td>{fmtDate(c.fecha)}</td>
                  <td className="num right pos">{fmtCurrency((c.capital || 0) + (c.abono || 0))}</td>
                  <td className="num right neg">{c.interes > 0 ? fmtCurrency(c.interes) : '—'}</td>
                  <td className="num right muted">{c.seguro > 0 ? fmtCurrency(c.seguro) : '—'}</td>
                  <td className="num right">{fmtCurrency((c.capital || 0) + (c.abono || 0) + (c.interes || 0) + (c.seguro || 0))}</td>
                  <td className="num right" style={{ fontWeight: 600 }}>{fmtCurrency(c.saldoDespues)}</td>
                </tr>
              ))}
              <tr style={{ fontWeight: 600 }}>
                <td colSpan="2" className="muted">Totales</td>
                <td className="num right pos">{fmtCurrency(totalCapitalReal)}</td>
                <td className="num right neg">{fmtCurrency(totalInteresReal)}</td>
                <td colSpan="2"></td>
                <td className="num right">{fmtCurrency(saldoFinalReal)}</td>
              </tr>
            </tbody>
          </table>
        ) : (
          <table className="data">
            <thead style={{ position: 'sticky', top: 0, background: 'var(--surface)' }}>
              <tr>
                <th className="right">Mes</th>
                <th className="right">Capital</th>
                <th className="right">Interés</th>
                <th className="right">Seguro</th>
                <th className="right">Cuota total</th>
                <th className="right">Saldo después</th>
                <th>Estado</th>
              </tr>
            </thead>
            <tbody>
              {schedule.map((r, i) => (
                <tr key={i} style={{
                  background: i === idxActual ? 'var(--surface-2)' : undefined,
                  opacity: r.pagada ? 0.55 : 1,
                }}>
                  <td className="num right">{r.mes}</td>
                  <td className="num right pos">{fmtCurrency(r.capital)}</td>
                  <td className="num right neg">{fmtCurrency(r.interes)}</td>
                  <td className="num right muted">{fmtCurrency(r.seguro)}</td>
                  <td className="num right">{fmtCurrency(r.cuota)}</td>
                  <td className="num right">{fmtCurrency(r.saldoFin)}</td>
                  <td><span className={`badge ${r.pagada ? 'success' : i === idxActual ? 'warning' : 'neutral'}`}>
                    {r.pagada ? '✓ Pagada' : i === idxActual ? '→ Próxima' : 'Pendiente'}
                  </span></td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}

// ═════════════════════════ Detalle inline · Usos de tarjeta ═════════════════════════
// Para tarjetas de crédito — lista de cargos y pagos con saldo corriente.
// Útil para ver qué se está cargando a la tarjeta y cuánto se ha pagado.
function DetalleUsosTarjeta({ item, cashflow }) {
  const [showReg, setShowReg] = useState(false);
  // Filtrar cashflow por FK a la tarjeta (prestamo_id) o, para data histórica
  // sin FK, por mención del nombre de la tarjeta en auxiliar/notas/concepto.
  const cardId = Number(String(item._airtableId).replace('p-', ''));
  const nameTokens = (item.nombre || '').toLowerCase().split(/\s+/).filter(t => t.length > 2);
  const usos = (cashflow || []).filter(m => {
    if (m._prestamoId != null) return m._prestamoId === cardId;
    const txt = ((m.a || '') + ' ' + (m.notas || '') + ' ' + (m.c || '')).toLowerCase();
    return nameTokens.some(t => txt.includes(t));
  }).slice().sort((a, b) => (a.f || '').localeCompare(b.f || ''));
  let saldo = 0;
  const rows = usos.map(m => {
    // Cargo (compra/disposición) aumenta saldo, pago lo reduce
    const isPago = m.e > 0 && m.c?.toLowerCase().includes('pago');
    const monto = m.e || m.s;
    const delta = isPago ? -monto : monto;
    saldo += delta;
    return { ...m, isPago, monto, saldoDespues: saldo };
  }).reverse();
  return (
    <div className="section">
      <div className="section-head">
        <div>
          <div className="section-title">Usos de la tarjeta · {item.nombre}</div>
          <div className="section-desc">
            {usos.length} movimientos vinculados · límite {fmtCurrency(item.limite)} ·
            {' '}usado {fmtCurrency(item.usado)} · disponible {fmtCurrency(item.limite - item.usado)}

        </div>
        <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
          <button className="btn" style={{ background: 'var(--success)', fontSize: 12, padding: '4px 12px' }}
            onClick={() => setShowReg(s => !s)}>{showReg ? '× Cerrar' : '💸 Registrar cargo / pago'}</button>
          <span className="badge neutral">Tasa {item.tasaAnual?.toFixed?.(1) || '—'}% anual</span>
        </div>
      </div>
      {showReg && (
        <div className="section" style={{ marginBottom: 'var(--s-3)', background: 'var(--surface-2)' }}>
          <FormMovFinScoped item={item} kind="tarjeta" onDone={() => setShowReg(false)} />
        </div>
      )}
      <div style={{ maxHeight: 400, overflowY: 'auto' }}>
        <table className="data">
          <thead style={{ position: 'sticky', top: 0, background: 'var(--surface)' }}>
            <tr>
              <th>Fecha</th><th>Concepto</th><th>Contraparte</th>
              <th className="right">Cargo</th><th className="right">Pago</th>
              <th className="right">Saldo</th>

          <tbody>
            {rows.map((r, i) => (
              <tr key={i}>
                <td>{fmtDate(r.f)}</td>
                <td className="muted">{r.c || '—'}</td>
                <td className="muted">{r.a || '—'}</td>
                <td className="num right neg">{!r.isPago ? fmtCurrency(r.monto) : '—'}</td>
                <td className="num right pos">{r.isPago ? fmtCurrency(r.monto) : '—'}</td>
                <td className="num right">{fmtCurrency(r.saldoDespues)}</td>
              </tr>
            ))}
            {rows.length === 0 && (
              <tr><td colSpan="6" className="empty" style={{ padding: 'var(--s-6)' }}>
