# Netlify config — JAMC's Tech Terminal v3 (Vite + React)
# Build real con Vite: genera dist/ con el JS ya compilado y cache-busting
# por hash. Solo dist/ se publica → ningún .md ni backup_*/*.json con data
# del negocio termina en el sitio (ver skill jamc-deploy).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Security headers (defensa en profundidad)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Assets con hash de Vite: cache largo e inmutable.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html siempre revalida (apunta a los assets con hash actuales).
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
