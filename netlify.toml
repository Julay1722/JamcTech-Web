# Netlify config — JAMC's Tech Terminal v2.5
# Deploy futuro: el sitio es 100% estático (Babel-standalone procesa
# los .jsx en el browser, sin build step). Apunta a Supabase
# directamente (sin Netlify Functions post-migración 2026-05-26).

[build]
  publish = "."
  command = ""

[build.environment]
  NODE_VERSION = "20"

# Security headers (defensa en profundidad)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# JS/JSX: forzar revalidación en cada request (no hay cache busting
# por URL todavía). Overhead mínimo: respuestas 304 con If-Modified-Since.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.jsx"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "text/babel; charset=utf-8"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
